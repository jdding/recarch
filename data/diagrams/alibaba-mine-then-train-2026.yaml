# Redrawn, simplified diagram. Source: Mine-Then-Train, "Native Multimodal Representation Learning for Click-Through Rate Prediction in E-Commerce Scenarios" (CIKM 2026), Fig. 5 with Sec 5.2-5.3.
alt: "Left to right: Taobao display advertising CTR logs with raw item images and titles feed a multimodal annotation model built on the frozen SCL encoder plus a learnable SID decode codebook that scores click relevance; triplets mined from the scores under similarity and margin thresholds are kept, 30 million of them, and used to fine-tune the SCL encoder with triplet margin loss plus SCL contrastive regularization; the resulting native representations serve the production CTR prediction model through SimTier and SA-TA similarity features and linear-layer fusion with ID embeddings; the long-term online A/B test reports CTR +1.5% and RPM +0.5%."
caption:
  fig: "Fig. 5"
  work: "Native Multimodal Representation Learning for Click-Through Rate Prediction in E-Commerce Scenarios, CIKM 2026"
  url: "https://doi.org/10.1145/3799682.3840096"
  note: "Simplified; the E2EM diagnosis experiments of Sections 3 and 4, the human evaluation of Section 5.2 and the annotation-score feature variant are not drawn."
