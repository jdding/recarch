# Redrawn, simplified diagram. Source: URM, "Large Language Model as Universal Retriever in Industrial-Scale Recommender System" (CIKM 2026), Fig. 2.
alt: "Left to right: serialized user features and a text retrieval objective enter an engine service that aggregates a 10-minute behavior window and triggers URM asynchronously; the inference service loads item embeddings from a distributed hashtable and runs a single vLLM prefill over the Qwen-7B backbone with learnable query tokens; probabilistic sampling walks ANN neighbors for T=4 steps to produce the retrieval results; results are stored persistently and consumed by the online retrieval stage."
caption:
  fig: "Fig. 2"
  work: "Large Language Model as Universal Retriever in Industrial-Scale Recommender System, CIKM 2026"
  url: "https://doi.org/10.1145/3799682.3840090"
  note: "Simplified; training and the online A/B evaluation are not drawn."
