# Redrawn, simplified diagram. Source: IntSR, "IntSR: A Deployed Generative System for Integrated Search and Recommendation at Amap" (CIKM 2026), Fig. 2.
alt: "Left to right: the input sequence interleaves scenario tokens, item tokens and feedback tokens with query placeholders that carry either a user search query embedded by a frozen Qwen3-0.6B LLM, a shared universal token, or target candidate items; a stack of Query-Driven Blocks on HSTU encodes the sequence with split attention for the query placeholders under a customized mask combining causal, session-wise and invalid-Q terms; a DSFNet block derives per-scenario weights and scenario-aware feature filtering from spatiotemporal context, page context, task tag and user profiles; the output covers recommendation retrieval and ranking plus search retrieval and ranking, and training restricts negative sampling to items available at the interaction timestamp."
caption:
  fig: "Fig. 2"
  work: "IntSR: A Deployed Generative System for Integrated Search and Recommendation at Amap, CIKM 2026"
  url: "https://doi.org/10.1145/3799682.3840093"
  note: "Simplified; the exact mask matrices of Figs. 8 and 9 and the two-stage KV-cache logit computation of Fig. 7 are summarized only."
