- key: caveats
  q_en: What should I keep in mind when reading the results of Airbnb Listing & User-Type Embeddings for Search Ranking?
  a_en: The carousel booking-discovery metric counts guests who found an eventual booking in the carousel. The separate search-ranking booking lift has no published magnitude.
  q_zh: 读 Airbnb Listing & User-Type Embeddings for Search Ranking 的结果时要注意什么？
  a_zh: 轮播的预订发现指标统计通过轮播找到最终预订房源的客人。另一项搜索排序试验未披露预订提升幅度。
  fields:
