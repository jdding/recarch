- key: results
  q_en: What results does Airbnb Listing & User-Type Embeddings for Search Ranking report?
  a_en: The Similar Listings A/B test raised carousel CTR by 21% overall, by 23% on pages with dates, and by 20% on dateless pages. The number of guests who found the listing they went on to book in the carousel rose 4.9%. A separate search-ranking test found a statistically significant booking gain and did not give its size.
  q_zh: Airbnb Listing & User-Type Embeddings for Search Ranking 报告了哪些结果？
  a_zh: 相似房源 A/B 中，轮播 CTR 总体提升 21%，有日期页面提升 23%，无日期页面提升 20%。通过轮播找到最终预订房源的客人数提升 4.9%。另一项搜索排序 A/B 发现预订显著增加，未披露幅度。
  fields:
  - results_reported
