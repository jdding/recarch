- key: what
  q_en: What is Airbnb Listing & User-Type Embeddings for Search Ranking, in one sentence?
  a_en: Airbnb uses click-trained listing embeddings for related listings and as search-ranking features. The Similar Listings carousel CTR rose 21% overall in its A/B test.
  q_zh: Airbnb Listing & User-Type Embeddings for Search Ranking 一句话是什么？
  a_zh: Airbnb 将从点击会话训练的房源向量用于相似房源推荐和搜索排序。A/B 中，相似房源轮播的整体点击率提升 21%。
