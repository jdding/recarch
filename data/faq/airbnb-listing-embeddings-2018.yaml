- key: stage
  q_en: Which stages of the pipeline does Airbnb Listing & User-Type Embeddings for Search Ranking cover?
  a_en: 'Ranking: Embedding-similarity features (to recently clicked/skipped/booked listings) fed into the search ranker. Retrieval: Similar Listings via embedding nearest neighbours.'
  q_zh: Airbnb Listing & User-Type Embeddings for Search Ranking 覆盖链路的哪些阶段？
  a_zh: 精排：embedding 相似度特征，针对最近点击、跳过和预订过的房源，输入搜索排序模型。 召回：相似房源，基于 embedding 的最近邻。
  fields:
  - stages.0
  - stages.1
- key: scale
  q_en: What scale does Airbnb Listing & User-Type Embeddings for Search Ranking report?
  a_en: 'Training sessions: more than 800 million search click sessions. Embedding dimension: 32. Share of bookings from the two channels: 99% (Search Ranking and Similar Listings).'
