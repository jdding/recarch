- key: what
  q_en: What is Learning to Rank for Maps, in one sentence?
  a_en: Airbnb finds the order of top map pins doesn't matter, so it drops rank-based attention and a Bookability Filter shows fewer pins; alpha 1.0 gave +1.7% uncanceled bookings.
  q_zh: Learning to Rank for Maps 一句话是什么？
  a_zh: Airbnb 发现排在前面的地图标记点顺序并不重要，于是去掉基于排名的注意力，并用 Bookability Filter 显示更少的标记点；alpha 为 1.0 时未取消预订 +1.7%。
  fields:
  - tldr
