- key: core
  q_en: What is the core idea of Learning to Rank for Maps?
  a_en: Show only listings close to the best one as map pins, instead of a fixed 18.
  q_zh: Learning to Rank for Maps 的核心思路是什么？
  a_zh: 只把与最优房源接近的房源显示为地图标记点，不再固定显示 18 个。
  fields:
  - core_idea
- key: results
  q_en: What results does Learning to Rank for Maps report?
  a_en: 'Randomization of top map results on mobile showed no booking difference, while the same randomization on search-box queries costs about 8% bookings and up to 5% NDCG. Bookability Filter, offline vs 18-pin baseline per Table 1: alpha 1.0/2.0/4.0/8.0 gives -39%/-25%/-9%/-1% pins. Online per Table 2: alpha 1.0 gives +1.7% uncanceled bookings, +1.6% 5-star trips, -14% avg impressions to discovery, -5.7% avg clicks to discovery. Final larger run at alpha 1.0: +1.9% uncanceled bookings, +2% 5-star trips, -16% results seen before the booked listing, -6.8% results clicked. Robust anchor (second-highest listing): pins +6%, searcher-to-listing-viewer conversion +0.15%; anchor as function of listing count adds another +2.6% pins. Focus vs urgency: randomly choosing 14 of 18 pins gave -1.5% bookings, so urgency is not the cause. Desktop two-tier pins (Table 3, alpha 1.0): +0.7% uncanceled bookings, +0.5% 5-star trips, -21% impressions to discovery, -1.7% clicks to discovery. Map-center feature: +0.27% bookings, +2% pin CTR. Algorithm 2 vs Algorithm 1: +0.39% bookings for new guests (p = 0.006).'
  q_zh: Learning to Rank for Maps 报告了哪些结果？
  a_zh: 在移动端对排在前面的地图结果做随机化，预订没有差异；而对搜索框查询做同样的随机化，会损失约 8% 的预订和最多 5% 的 NDCG。Bookability Filter 的离线结果，对比 18 个标记点的基线，见表 1：alpha 为 1.0、2.0、4.0、8.0 时，标记点分别减少 -39%、-25%、-9%、-1%。线上结果见表 2：alpha 为 1.0 时，未取消预订 +1.7%，5 星行程 +1.6%，到发现页的平均曝光 -14%，到发现页的平均点击 -5.7%。alpha 为 1.0 的最终更大规模实验：未取消预订 +1.9%，5 星行程 +2%，订到房源之前看到的结果 -16%，被点击的结果 -6.8%。稳健锚点，即第二高的房源：标记点 +6%，搜索用户到房源浏览用户的转化 +0.15%；把锚点设为房源数量的函数，标记点再 +2.6%。聚焦与紧迫感的对比：在 18 个标记点中随机选 14 个，预订 -1.5%，因此紧迫感不是原因。桌面端双层标记点，见表 3，alpha 为 1.0：未取消预订 +0.7%，5 星行程 +0.5%，到发现页的曝光 -21%，到发现页的点击 -1.7%。地图中心特征：预订 +0.27%，标记点 CTR +2%。算法 2 对比算法 1：新用户预订 +0.39%，p = 0.006。
  fields:
  - results_reported
