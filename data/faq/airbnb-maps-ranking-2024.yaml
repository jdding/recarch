- key: caveats
  q_en: What should I keep in mind when reading the results of Learning to Rank for Maps?
  a_en: Paper describes launched changes but gives no deployment date or traffic share beyond the experiment sizes. The paper's Table 1 lists average booking probability changes as large relative increases, 47% at alpha 1.0 relative to the baseline; these are offline simulation figures.
  q_zh: 读 Learning to Rank for Maps 的结果时要注意什么？
  a_zh: 论文描述了已上线的改动，但除了实验规模外，没有给出上线日期或流量占比。 论文表 1 把平均预订概率的变化列为较大的相对提升，alpha 为 1.0 时相对基线为 47%；这些是离线仿真的数字。
