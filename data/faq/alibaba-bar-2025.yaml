- key: what
  q_en: What is BAR, in one sentence?
  a_en: BAR brings bid signals into ad retrieval scoring with near-line embedding refreshes; a month-long A/B on Alibaba display advertising lifted platform revenue 4.32%.
  q_zh: BAR 一句话是什么？
  a_zh: BAR 把出价信号引入广告检索打分并以近线刷新广告向量；阿里展示广告一个月 A/B 平台收入提升 4.32%。
  fields:
  - tldr
- key: who
  q_en: Who built BAR and where does it run?
  a_en: 'BAR comes from Alibaba, 2025. Deployed in: Alibaba display advertising platform retrieval stage, full deployment.'
  q_zh: BAR 是谁做的，用在哪里？
  a_zh: BAR 来自 阿里巴巴，2025 年。上线位置：阿里展示广告平台检索阶段，全量部署。
  fields:
