- key: core
  q_en: What is the core idea of BAR?
  a_en: Score retrieval on predicted eCPM and keep ad embeddings fresh so the first funnel stage agrees with bid-driven ranking.
  q_zh: BAR 的核心思路是什么？
  a_zh: 让检索按预估 eCPM 打分并保持广告向量新鲜，使漏斗第一级与出价驱动的排序一致。
  fields:
  - core_idea
- key: online
  q_en: Does BAR have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: One month. A/B traffic: 10% of online traffic randomly partitioned into two groups; corroborated over the same month by a 50% scaled comparison and a 5% reverse holdout.'
  q_zh: BAR 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：一个月。A/B 流量：10% 线上流量随机分成两组；同周期以 50% 放量对比与 5% 反向留出实验相互印证。
  fields:
  - deployment.online_evidence
  - deployment.ab_duration
  - deployment.ab_traffic
- key: caveats
  q_en: What should I keep in mind when reading the results of BAR?
  a_en: 'The paper states the online revenue gain is the joint effect of the three components: a month-long per-component traffic split was not affordable in production, so the attribution of individual components rests on offline evidence and the responsiveness metrics. Recall is scored against the exposure of the incumbent system and PairAcc against the authors'' own monotonicity prior; the paper notes the online results are what ultimately test them, and the perturbation magnitudes are not verified against logged bid-change distributions.'
  q_zh: 读 BAR 的结果时要注意什么？
  a_zh: 论文说明线上收入提升是三个组件的联合效果：一个月内无法承受按组件拆分流量，组件归因依赖离线证据与响应性指标。 Recall 以现役系统的曝光为参照、PairAcc 以作者自己的单调性先验为参照；论文指出真正检验它们的是线上结果，且扰动幅度未对照日志中的出价变化分布核验。
  fields:
  - caveats.0
  - caveats.1
- key: training
  q_en: How is BAR trained?
  a_en: 'Training mode: Offline training, one epoch per model; model weights do not train online, only ad embeddings refresh near-line. Objectives: Pairwise learning-to-rank logistic loss over impression and ranking-log pairs; Bidding-aware objective: logistic monotonicity loss on synthetic bid-feature perturbations; Distillation auxiliary losses for pCTR and normalized pBid regression on the shared backbone.'
  q_zh: BAR 是怎么训练的？
  a_zh: 训练方式：离线训练，每个模型单轮；模型权重不在线训练，仅广告向量在近线刷新。 训练目标：曝光与排序日志样本对上的 pairwise 学习排序 logistic 损失；出价感知目标：对合成的出价特征扰动施加 logistic 单调性损失；共享骨干上的蒸馏辅助损失，回归 pCTR 与归一化 pBid。
  fields:
  - training.mode
  - training.objectives
