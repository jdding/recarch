- key: inputs
  q_en: What inputs does BAR use?
  a_en: 'IDs and tokenization: Categorical and bucketized numerical features embedded by lookup into one embedding space; ad identity carried by a 64-dimensional ad embedding. Input signals: Bid signals per Table 1: bid_type, bid_constraint, budget_left_ratio, time_left_ratio, default_bid_value; User profile, context and the last 100 clicked items as behavior sequence; Ranking-stage logs: impression ads and ads that reached ranking with their eCPM, i.e. pCTR times pBid times 1000.'
  q_zh: BAR 用了哪些输入？
  a_zh: ID 与 token 化：类别与分桶数值特征经查表嵌入同一向量空间，广告身份由 64 维广告向量承载。 输入特征：表 1 的出价信号：bid_type、bid_constraint、budget_left_ratio、time_left_ratio、default_bid_value；用户画像、上下文与最近 100 次点击的行为序列；排序阶段日志：曝光广告与到达排序的广告及其 eCPM，即 pCTR 乘 pBid 乘 1000。
  fields:
  - id_tokenization.approach
  - features_signals.0
  - features_signals.1
  - features_signals.2
