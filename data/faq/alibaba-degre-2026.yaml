  q_en: Does DeGRe have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: 8 days. A/B traffic: 2% of live traffic.'
  q_zh: DeGRe 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：8 天。A/B 流量：2% 线上流量。
