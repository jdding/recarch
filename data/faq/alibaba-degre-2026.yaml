- key: what
  q_en: What is DeGRe, in one sentence?
  a_en: 'Taobao Shangou''s DeGRe distills offline lookahead search into a greedy generative re-ranker; 8-day 2% A/B on Flash Shopping vs the base strategy: GMV +3.75%, orders +2.14%.'
  q_zh: DeGRe 一句话是什么？
  a_zh: 淘宝闪购 DeGRe 把离线前瞻搜索蒸馏进贪心式生成式重排模型；闪购上对比基础策略做 8 天 2% A/B：GMV +3.75%，订单 +2.14%。
  fields:
  - tldr
- key: who
  q_en: Who built DeGRe and where does it run?
  a_en: 'DeGRe comes from Alibaba Taobao Shangou, 2026. Deployed in: Taobao Flash Shopping homepage re-ranking, tested on 2% of traffic.'
  q_zh: DeGRe 是谁做的，用在哪里？
  a_zh: DeGRe 来自 阿里巴巴淘宝闪购，2026 年。上线位置：淘宝闪购首页重排，在 2% 流量上测试。
