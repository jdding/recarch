  - deployment.inference_cost
  - deployment.hardware
- key: training
  q_en: How is DeGRe trained?
  a_en: 'Training mode: Offline training with leave-one-out split on the last user session. Objectives: Cumulative regression for the Lookahead Evaluator; Hard-label imitation of mined sequences plus soft-label distillation weighted 0.01.'
  q_zh: DeGRe 是怎么训练的？
  a_zh: 训练方式：离线训练，以用户最后一次会话做 leave-one-out 划分。 训练目标：Lookahead Evaluator 的累计回归；对挖掘序列的硬标签模仿，加上权重为 0.01 的软标签蒸馏。
  fields:
  - training.mode
  - training.objectives
