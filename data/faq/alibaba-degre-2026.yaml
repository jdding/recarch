- key: caveats
  q_en: What should I keep in mind when reading the results of DeGRe?
  a_en: The online control is a base point-wise strategy, and the only generative or list-wise online baseline is PRM, a discriminative reranker; no other generative reranker was tested online. Offline hit rate is measured by a learned external evaluator on sampled permutations, so it is a model-based proxy, not logged user behavior.
  q_zh: 读 DeGRe 的结果时要注意什么？
  a_zh: 线上对照组是基础 point-wise 策略，而线上唯一的生成式或 list-wise 基线是判别式重排模型 PRM；没有在线上测试其他生成式重排模型。 离线命中率由一个学习得到的外部评估器在采样排列上测得，因此是基于模型的代理指标，不是真实的用户行为日志。
  fields:
  - caveats.0
  - caveats.1
- key: serving
  q_en: What serving latency, QPS, cost or hardware does DeGRe report?
  a_en: 'Serving latency: Mean added latency of 14.8 ms, against 6.2 ms for the PRM baseline. Serving QPS: not reported. Inference cost: not reported. Hardware: Models implemented on NVIDIA A100 80GB GPUs; serving hardware not reported.'
  q_zh: DeGRe 报告了怎样的服务延迟、QPS、成本和硬件？
  a_zh: 服务延迟：平均增加延迟 14.8 ms，PRM 基线为 6.2 ms。 服务 QPS：未报告。 推理成本：未报告。 硬件：模型在 NVIDIA A100 80GB GPU 上实现；在线服务硬件未报告。
  fields:
