- key: core
  q_en: What is the core idea of DeGRe?
  a_en: Offline lookahead search is distilled into a small generator that re-ranks in one greedy pass.
  q_zh: DeGRe 的核心思路是什么？
  a_zh: 把离线前瞻搜索蒸馏进小型生成器，一次贪心遍历完成重排。
  fields:
  - core_idea
- key: results
  q_en: What results does DeGRe report?
  a_en: 'Online 8-day A/B on 2% of Taobao Flash Shopping homepage traffic against the base multi-objective point-wise strategy: CTR +2.85%, orders +2.14%, GMV +3.75%, with PRM at +0.73%, +1.14% and +0.76%. Added latency is 14.8 ms for DeGRe and 6.2 ms for PRM. On Alipay traffic, GMV rises 4.14% and orders 3.39%. For new users GMV rises 2.72% and for existing users 3.73%. Offline generator HR@1% with beam size 8 is 88.72% on Flash Shopping, 71.06% on Taobao Ad and 89.10% on ML-1M, absolute gains of 53.19%, 28.95% and 29.90% over the best baseline.'
  q_zh: DeGRe 报告了哪些结果？
  a_zh: 在淘宝闪购首页 2% 流量上做 8 天线上 A/B，对比多目标 point-wise 基础策略：CTR +2.85%，订单 +2.14%，GMV +3.75%，PRM 分别为 +0.73%、+1.14% 和 +0.76%。增加的延迟：DeGRe 为 14.8 ms，PRM 为 6.2 ms。在支付宝流量上，GMV 提升 4.14%，订单提升 3.39%。新用户 GMV 提升 2.72%，老用户提升 3.73%。离线生成器在 beam size 为 8 时的 HR@1%：闪购为 88.72%，Taobao Ad 为 71.06%，ML-1M 为 89.10%，相比最强基线的绝对提升分别为 53.19%、28.95% 和 29.90%。
  fields:
  - results_reported
