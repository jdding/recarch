- key: what
  q_en: What is EdgeRec, in one sentence?
  a_en: Taobao keeps its candidate service and embedding tables in the cloud. The phone uses fresh activity to reorder unexposed candidates that it has already received.
  q_zh: EdgeRec 一句话是什么？
  a_zh: 淘宝在云端保留候选服务和嵌入表。手机根据最新行为，重排已经收到且尚未曝光的候选。
  fields:
  - tldr
- key: who
  q_en: Who built EdgeRec and where does it run?
  a_en: 'EdgeRec comes from Alibaba, 2020. Deployed in: Mobile Taobao homepage feed.'
  q_zh: EdgeRec 是谁做的，用在哪里？
  a_zh: EdgeRec 来自 阿里巴巴，2020 年。上线位置：手机淘宝首页信息流。
  fields:
  - company
  - year
  - deployed_in
- key: core
  q_en: What is the core idea of EdgeRec?
  a_en: Send candidate embeddings from the cloud and refresh their order locally as user behavior arrives.
  q_zh: EdgeRec 的核心思路是什么？
  a_zh: 云端下发候选嵌入，手机在新行为发生时更新展示顺序。
  fields:
  - core_idea
- key: results
  q_en: What results does EdgeRec report?
  a_en: The full system improved GMV by 10.92%, CTR by 7.18% and clicks by 8.87% against the previous Mobile Taobao recommender in a nearly two-week test. At peak traffic, the reported system response was at most 100 ms versus 1 s, and behavior capture took at most 300 ms versus 1 min.
  q_zh: EdgeRec 报告了哪些结果？
  a_zh: 在近两周的实验中，完整 EdgeRec 对比原有手机淘宝推荐，GMV 提升 10.92%，CTR 提升 7.18%，点击提升 8.87%。流量高峰的系统响应由不超过 1 s 降到不超过 100 ms，行为感知延迟由不超过 1 min 降到不超过 300 ms。
  fields:
  - results_reported
- key: online
  q_en: Does EdgeRec have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: 2019-10-26 to 2019-11-08. A/B traffic: Millions of randomized users in each arm. The percentage is undisclosed..'
  q_zh: EdgeRec 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：2019-10-26 至 2019-11-08。A/B 流量：每组随机分配数百万用户，流量比例未披露。。
  fields:
