  - deployment.ab_duration
  - deployment.ab_traffic
- key: caveats
  q_en: What should I keep in mind when reading the results of EdgeRec?
  a_en: The production test covers the combined EdgeRec system with its candidate payload and mobile reranker. The latency figures describe system behavior and response in the reported deployment. The paper does not identify the handset hardware or CPU and energy impact.
  q_zh: 读 EdgeRec 的结果时要注意什么？
  a_zh: 生产实验评估完整的 EdgeRec，包括云侧候选载荷和端侧重排器。 延迟来自文中的线上环境。论文未说明具体机型、CPU 和能耗影响。
  fields:
  - caveats.0
  - caveats.1
