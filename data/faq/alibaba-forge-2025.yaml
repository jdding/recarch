- key: core
  q_en: What is the core idea of FORGE?
  a_en: Build semantic IDs from fused multimodal and co-occurrence features, then spread items evenly over the codewords.
  q_zh: FORGE 的核心思路是什么？
  a_zh: 用融合了多模态和共现信息的特征构造 semantic ID，再把 item 均匀地分散到各个码字上。
  fields:
  - core_idea
- key: results
  q_en: What results does FORGE report?
  a_en: 'Offline on AL-GR stage S3, Final against base SID recipe: HR@20 4.33% to 5.44% and HR@1000 27.24% to 30.86%, which is +25.64% and +13.29% relative. On Amazon, Final HR@1000 is 13.04% against 8.07% for base. The same recipe also gains on the Taobao search task. Online, a 7-day A/B in the Guess You Like section of the Taobao homepage, Final against base: PVR +8.93%, HR +10.02% and transaction count +0.35%. The abstract states that the SID construction strategies have since been deployed at full scale on Taobao.'
  q_zh: FORGE 报告了哪些结果？
  a_zh: 离线，AL-GR 的 S3 阶段，Final 对比 base SID 方案：HR@20 从 4.33% 提高到 5.44%，HR@1000 从 27.24% 提高到 30.86%，相对提升分别为 +25.64% 和 +13.29%。在 Amazon 上，Final 的 HR@1000 为 13.04%，base 为 8.07%。同样的方案在淘宝搜索任务上也有提升。线上，在淘宝首页猜你喜欢板块做了 7 天 A/B，Final 对比 base：PVR +8.93%，HR +10.02%，成交笔数 +0.35%。摘要称这些 SID 构造策略此后已在淘宝全量部署。
  fields:
  - results_reported
