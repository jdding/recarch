- key: inputs
  q_en: What inputs does FORGE use?
  a_en: 'IDs and tokenization: RQ-VAE over fused text and image features, 3 levels with 8192 codewords each, followed by collision post-processing. Input signals: Item text and image features from a pretrained Chinese CLIP encoder, fused by a QFormer; Item-to-item co-occurrence pairs from user behavior, used in a contrastive loss; Item side information such as category, seller and price; User behavior sequence of up to 100 items, with a query keyword added for the search task.'
  q_zh: FORGE 用了哪些输入？
  a_zh: ID 与 token 化：对融合后的文本和图像特征做 RQ-VAE，共 3 层，每层 8192 个码字，再做冲突后处理。 输入特征：预训练的中文 CLIP 编码器提取的 item 文本和图像特征，由 QFormer 融合；来自用户行为的 item 共现对，用于对比损失；item 的辅助信息，如类目、商家和价格；最多 100 个 item 的用户行为序列，搜索任务中再加入查询词。
  fields:
  - id_tokenization.approach
  - features_signals.0
  - features_signals.1
  - features_signals.2
  - features_signals.3
