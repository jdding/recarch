- key: caveats
  q_en: What should I keep in mind when reading the results of FORGE?
  a_en: The paper calls itself a benchmark; the system-level evidence is one online A/B of the tuned SID recipe against the base recipe, not against the previous production retriever. The 0.35% transaction-count lift is called an increase in the abstract and an absolute increase in Section 4.3.6; the metric is not defined in more detail.
  q_zh: 读 FORGE 的结果时要注意什么？
  a_zh: 论文自称是基准；系统层面的证据只有一次线上 A/B，比较的是调优后的 SID 方案和 base 方案，不是此前的线上召回器。 0.35% 的成交笔数提升，摘要说是提升，4.3.6 节说是绝对提升；论文没有对这个指标做更细的定义。
  fields:
