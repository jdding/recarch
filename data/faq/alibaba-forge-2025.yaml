  q_en: Does FORGE have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: 7 days. A/B traffic: not reported.'
  q_zh: FORGE 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：7 天。A/B 流量：未报告。
