- key: what
  q_en: What is FORGE, in one sentence?
  a_en: Taobao's FORGE benchmarks how to build semantic IDs for generative retrieval; moving from the base SID recipe to its tuned Final recipe gave transaction count +0.35% in a 7-day A/B on Guess You Like.
  q_zh: FORGE 一句话是什么？
  a_zh: 淘宝的 FORGE 系统比较了生成式召回的 semantic ID 构造方法；把基础 SID 方案换成调优后的方案，在猜你喜欢的 7 天 A/B 中成交笔数 +0.35%。
  fields:
  - tldr
- key: who
  q_en: Who built FORGE and where does it run?
  a_en: 'FORGE comes from Alibaba Taobao & Tmall Group, 2025. Deployed in: Taobao homepage Guess You Like, generative retrieval, 7-day A/B.'
  q_zh: FORGE 是谁做的，用在哪里？
  a_zh: FORGE 来自 阿里巴巴淘天集团，2025 年。上线位置：淘宝首页猜你喜欢，生成式召回，7 天 A/B。
