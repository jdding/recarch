- key: inputs
  q_en: What inputs does HiSAC use?
  a_en: 'IDs and tokenization: Multi-level hierarchical semantic IDs from Residual Quantized VAE over frozen multimodal embeddings. Input signals: Item metadata text and product image through a frozen multimodal encoder; User behavior sequence of up to 10,000 interactions; Category and brand item-side features concatenated to the trainable ranking embedding; Time-decay feature; Vote counts over the semantic tree as agent weights.'
  q_zh: HiSAC 用了哪些输入？
  a_zh: ID 与 token 化：用残差量化 VAE 在冻结多模态嵌入上生成多层层级语义 ID。 输入特征：经冻结多模态编码器的物品元数据文本与商品图；最长 10,000 条交互的用户行为序列；拼进可训练排序嵌入的类目与品牌侧特征；时间衰减特征；语义树上的投票票数作为代理权重。
