- key: core
  q_en: What is the core idea of HiSAC?
  a_en: Sparsely activated personalized interest agents over a hierarchical semantic codebook compress ultra-long behavior sequences for the ranking stage.
  q_zh: HiSAC 的核心思路是什么？
  a_zh: 在层级语义码本上做稀疏激活的个性化兴趣代理，为排序阶段压缩超长行为序列。
