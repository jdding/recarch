- key: caveats
  q_en: What should I keep in mind when reading the results of HiSAC?
  a_en: The online baseline is described only as the strongest prior compression method in production; the paper does not name it. The paper reports no traffic share, bucket counts or user counts for the two-week A/B test.
  q_zh: 读 HiSAC 的结果时要注意什么？
  a_zh: 线上基线只被描述为线上最强前代压缩方法，论文未给名字。 论文未报告两周 A/B 的流量占比、分桶数或用户数。
