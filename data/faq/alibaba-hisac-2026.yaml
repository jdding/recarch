  - caveats.1
- key: training
  q_en: How is HiSAC trained?
  a_en: 'Training mode: Offline training; SIDs and agents are constructed offline daily with only newly added items processed. Objectives: Symmetric InfoNCE contrastive training of the multimodal encoder; RQ-VAE reconstruction with commitment loss and EMA codebook updates; CTR prediction for the trainable ranking embeddings used as aggregation content.'
  q_zh: HiSAC 是怎么训练的？
  a_zh: 训练方式：离线训练；SID 与代理离线每日构造，仅处理新增物品。 训练目标：多模态编码器的对称 InfoNCE 对比训练；RQ-VAE 重建加承诺损失与 EMA 码本更新；可训练排序嵌入的 CTR 预估，用作聚合内容。
  fields:
  - training.mode
  - training.objectives
