- key: what
  q_en: What is LUM, in one sentence?
  a_en: 'Large User Model: a generatively pre-trained transformer of up to 7B params whose outputs feed classic DLRMs; Taobao sponsored search ranking saw CTR +2.9%, RPM +1.2%.'
  q_zh: LUM 一句话是什么？
  a_zh: Large User Model：生成式预训练的 Transformer，参数最多达 7B，其输出供传统 DLRM 使用；淘宝搜索广告排序上线后 CTR +2.9%，RPM +1.2%。
  fields:
  - tldr
- key: who
  q_en: Who built LUM and where does it run?
  a_en: 'LUM comes from Alibaba, 2025. Deployed in: Taobao sponsored search ranking.'
  q_zh: LUM 是谁做的，用在哪里？
  a_zh: LUM 来自 阿里巴巴，2025 年。上线位置：淘宝搜索广告排序。
