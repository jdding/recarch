- key: core
  q_en: What is the core idea of LUM?
  a_en: Pre-train a transformer on user behavior, then feed its output as features to existing ranking models.
  q_zh: LUM 的核心思路是什么？
  a_zh: 在用户行为上预训练一个 Transformer，再把它的输出作为特征提供给现有的排序模型。
  fields:
  - core_idea
- key: results
  q_en: What results does LUM report?
  a_en: 'Online A/B in Taobao sponsored search ranking: CTR +2.9%, RPM +1.2%. Public datasets (Table 2, AUC): ML-1M LUM 0.7615 vs best listed baseline 0.7579 (SIM); ML-20M LUM 0.7483 vs best baseline 0.7463 (HSTU); Amazon Books LUM 0.6727 vs best baseline 0.6712 (HSTU).'
  q_zh: LUM 报告了哪些结果？
  a_zh: 淘宝搜索广告排序的线上 A/B：CTR +2.9%，RPM +1.2%。公开数据集见表 2，指标为 AUC：ML-1M 上 LUM 为 0.7615，已列出的最佳基线为 0.7579，即 SIM；ML-20M 上 LUM 为 0.7483，最佳基线为 0.7463，即 HSTU；Amazon Books 上 LUM 为 0.6727，最佳基线为 0.6712，即 HSTU。
  fields:
  - results_reported
