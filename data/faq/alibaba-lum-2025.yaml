- key: caveats
  q_en: What should I keep in mind when reading the results of LUM?
  a_en: Table 2 numbers were checked against the published WSDM 2026 PDF, and all three LUM and best-baseline AUCs match. Online result is for the ranking task in sponsored search only (per Sec 5.6).
  q_zh: 读 LUM 的结果时要注意什么？
  a_zh: 表 2 的数字已对照已发表的 WSDM 2026 PDF 核对，三个 LUM 和最佳基线的 AUC 都一致。 线上结果只针对搜索广告中的排序任务，见第 5.6 节。
