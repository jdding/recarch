- key: caveats
  q_en: What should I keep in mind when reading the results of MGOE?
  a_en: The efficiency comparisons are offline benchmarks on the public datasets, not production serving measurements. The paper states that MacGNN mainly considers the clicking task, while MMoE and MGOE consider clicking, adding to cart, favoring, and buying.
  q_zh: 读 MGOE 的结果时要注意什么？
  a_zh: 效率对比是公开数据集上的离线基准，不是生产服务测量。 论文说明 MacGNN 主要考虑点击任务，而 MMoE 与 MGOE 考虑点击、加购、收藏和购买。
  fields:
  - caveats.0
  - caveats.1
- key: training
  q_en: How is MGOE trained?
  a_en: 'Training mode: Offline. Objectives: Weighted sum of per-task binary cross-entropy with L1 and L2 regularization.'
  q_zh: MGOE 是怎么训练的？
  a_zh: 训练方式：离线。 训练目标：按任务二元交叉熵加权求和，加 L1 与 L2 正则。
