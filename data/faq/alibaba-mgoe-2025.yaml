- key: what
  q_en: What is MGOE, in one sentence?
  a_en: MGOE merges billion-scale task graphs into one macro graph and adds macro graph experts to multi-task ranking; the Alibaba A/B lifted GMV +16.46% over MMoE.
  q_zh: MGOE 一句话是什么？
  a_zh: MGOE 把十亿级任务图合并成一张宏图，为多任务排序加上宏图专家；阿里 A/B 中 GMV 较 MMoE +16.46%。
  fields:
  - tldr
- key: who
  q_en: Who built MGOE and where does it run?
  a_en: 'MGOE comes from Alibaba, 2025. Deployed in: Multi-task ranking in a leading billion-scale recommender system at Alibaba.'
  q_zh: MGOE 是谁做的，用在哪里？
  a_zh: MGOE 来自 阿里巴巴，2025 年。上线位置：阿里领先的十亿级推荐系统的多任务排序。
