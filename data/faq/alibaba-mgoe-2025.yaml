- key: core
  q_en: What is the core idea of MGOE?
  a_en: Merge the billion-scale graphs of different tasks into one macro graph, and let macro graph experts feed multi-task ranking without running per-task GNNs.
  q_zh: MGOE 的核心思路是什么？
  a_zh: 把不同任务的十亿级图合并成一张宏图，用宏图专家为多任务排序供信息，而不必按任务各跑 GNN。
  fields:
  - core_idea
- key: results
  q_en: What results does MGOE report?
  a_en: 'Online A/B on the Alibaba platform, Table 4, two weeks of average relative variation with MGOE as the ranking model: against MMoE, PCTR +2.16%, UCTR +1.63%, CVR +5.88%, GMV +16.46%, StayTime +4.12%; against MacGNN, PCTR +0.93%, UCTR +0.75%, CVR +3.69%, GMV +7.74%, StayTime +3.26%. Offline, Table 1, against the best of 10 multi-task baselines: average AUC improvements of 13.42% on Taobao, 7.84% on QB-video and 3.65% on QK-article, with average Logloss gains of 3.68%, 5.23% and 10.77%; Taobao average AUC 0.6981, QB-video 0.7839, QK-article 0.8700, and the largest single-task gain is Favor AUC 0.8016 at +23.68% on Taobao. Ablations, Table 2, Taobao average AUC: full 0.6936, w/o preference 0.6919, w/o adjustment 0.6836, w/o cascading 0.6927; QB-video: full 0.7715, w/o preference 0.7700, w/o adjustment 0.7513, w/o cascading 0.7640. Efficiency, Sec 4.5: 5.04M parameters, about 62.08% below PLE at 13.29M and 58.76% below MMoCEG at 12.22M; 1194 MiB GPU memory, about 60.10% below MoGENet and 19.66% below MMoCEG; inference time 45.13% to 72.64% faster than graph baselines on Taobao and up to 80.49% faster on QK-article.'
  q_zh: MGOE 报告了哪些结果？
  a_zh: 阿里平台线上 A/B，表 4，MGOE 作为排序模型两周平均相对变化：对比 MMoE，PCTR +2.16%、UCTR +1.63%、CVR +5.88%、GMV +16.46%、StayTime +4.12%；对比 MacGNN，PCTR +0.93%、UCTR +0.75%、CVR +3.69%、GMV +7.74%、StayTime +3.26%。离线见表 1，相对 10 个多任务基线中的最优者：平均 AUC 在 Taobao 提升 13.42%、QB-video 7.84%、QK-article 3.65%，平均 Logloss 分别改善 3.68%、5.23%、10.77%；Taobao 平均 AUC 0.6981，QB-video 0.7839，QK-article 0.8700，单任务最大增益是 Taobao 收藏任务 AUC 0.8016 即 +23.68%。消融见表 2，Taobao 平均 AUC：完整版 0.6936、去偏好分组 0.6919、去宏任务调整 0.6836、去级联 0.6927；QB-video：完整版 0.7715、去偏好分组 0.7700、去宏任务调整 0.7513、去级联 0.7640。效率见 4.5 节：参数 5.04M，比 PLE 的 13.29M 低约 62.08%，比 MMoCEG 的 12.22M 低 58.76%；GPU 显存 1194 MiB，比 MoGENet 低约 60.10%，比 MMoCEG 低 19.66%；Taobao 上推理时间比图基线快 45.13% 到 72.64%，QK-article 上最高快 80.49%。
  fields:
  - results_reported
