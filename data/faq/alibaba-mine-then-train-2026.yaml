- key: stage
  q_en: Which stages of the pipeline does Mine-Then-Train cover?
  a_en: 'Ranking: ID-based CTR prediction model of Taobao display advertising, MUSE in the E2EM study and the newer production model cited as EST in the NMRL experiments, consuming SCL multimodal representations through SimTier, SA-TA similarity features and linear-layer direct fusion.'
  q_zh: Mine-Then-Train 覆盖链路的哪些阶段？
  a_zh: 精排：淘宝展示广告基于 ID 的 CTR 预测模型，E2EM 研究用 MUSE，NMRL 实验用引用为 EST 的更新版生产模型，通过 SimTier、SA-TA 相似度特征与线性层直接融合消费 SCL 多模态表征。
