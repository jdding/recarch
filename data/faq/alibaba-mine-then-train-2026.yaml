- key: what
  q_en: What is Mine-Then-Train, in one sentence?
  a_en: Mines multimodally interpretable triplets from CTR clicks and fine-tunes the SCL encoder for Taobao display advertising; long-term A/B gives CTR +1.5% and RPM +0.5%.
  q_zh: Mine-Then-Train 一句话是什么？
  a_zh: 从 CTR 点击中挖掘多模态可解释三元组并微调 SCL 编码器服务淘宝展示广告；长期 A/B 给出 CTR +1.5%、RPM +0.5%。
