- key: core
  q_en: What is the core idea of Mine-Then-Train?
  a_en: Mine multimodally interpretable click triplets from CTR data first, then fine-tune the multimodal encoder on them so its representations match click preferences.
  q_zh: Mine-Then-Train 的核心思路是什么？
  a_zh: 先从 CTR 数据挖掘多模态可解释点击三元组，再用它们微调多模态编码器，让表征对齐点击偏好。
  fields:
