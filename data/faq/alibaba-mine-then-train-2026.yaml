  a_zh: 原文没有报告：A/B 流量占比、分桶数与测试时长；所提方法的训练算力、GPU 数量与微调时长；展示广告系统的服务延迟、QPS 与硬件；NMRL 实验的绝对 AUC 与 GAUC，论文只给相对提升；更新后编码器在生产中的推理成本变化。
