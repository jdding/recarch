- key: caveats
  q_en: What should I keep in mind when reading the results of Mine-Then-Train?
  a_en: The paper describes the online evaluation only as a long-term A/B test; no traffic share, bucket design or duration is given. The paper's stated limitations of the annotation model are that click-relevance scores can be inaccurate for some item pairs because it is trained directly on CTR data, and that preferences are learned solely through SID embeddings whose learning resembles ID-style memorization without direct access to raw multimodal content, limiting generalization.
  q_zh: 读 Mine-Then-Train 的结果时要注意什么？
  a_zh: 论文对线上评估只说长期 A/B 测试；未给流量占比、分桶设计或持续时长。 论文自己说明标注模型的两点局限：直接在 CTR 数据上训练使部分物品对的点击相关性打分可能不准；偏好只经 SID embedding 学习，机制近似 ID 式记忆、接触不到物品原始多模态内容，泛化受限。
  fields:
  - caveats.0
  - caveats.1
