- key: results
  q_en: What results does Mine-Then-Train report?
  a_en: 'Deployment, Sec 6.3: Native Multimodal Representation entered Taobao''s display advertising system in early 2026 and a long-term A/B test showed a 1.5% CTR improvement and a 0.5% RPM improvement, restated in the conclusion. Offline, Sec 6.2 Table 6, relative lifts over the baseline that already includes SCL representations: adding annotation-model scores gives GAUC +0.13% and AUC +0.08%, and the full NMRL method gives GAUC +0.22% and AUC +0.11%. Diagnosis of the rejected end-to-end alternative: Sec 3.2 Figure 2 shows the E2EM encoder drops GAUC below the production SCL encoder; Sec 3.3 Table 1 on the Taobao-MM benchmark gives GAUC 0.6154 for the frozen MUSE baseline, 0.6139 for target-side E2EM, 0.6128 with LEMUR''s memory bank and 0.6124 for target-and-sequence E2EM; Sec 3.3 Table 2 shows no optimizer or learning rate choice among SGD, Adam and AdamW at 2e-3 to 2e-5 beats 0.6154. Sec 4.1 Table 3 measures that multimodal similarity alone predicts clicks only slightly above random, MultiModal-Mean GAUC 0.541 and MultiModal-Max GAUC 0.536; Sec 4.2 Table 4 finds E2EM gradient cosine similarities of 0.016 and 0.006 against 0.144 and 0.849 for SCL, and Sec 4.2 reports that adding SCL loss to co-training drops CTR GAUC by 0.17 percentage points and SCL Top-1 accuracy by 5 pt. Mining quality, Sec 5.2: the annotation score alone lifts GAUC by 0.13%, and human voting on triplets with annotation-score margin above 0.15 versus below 0.05 gives Item 1 win rates of 85% versus 42%.'
  q_zh: Mine-Then-Train 报告了哪些结果？
  a_zh: 部署见 6.3 节：原生多模态表征于 2026 年初进入淘宝展示广告系统，长期 A/B 测试显示 CTR 提升 1.5%、RPM 提升 0.5%，结论部分重述。离线见 6.2 节表 6，相对已含 SCL 表征的基线：接入标注模型打分 GAUC +0.13%、AUC +0.08%，完整 NMRL 方法 GAUC +0.22%、AUC +0.11%。对被否决的端到端方案的诊断：3.2 节图 2 显示 E2EM 编码器的 GAUC 掉到生产 SCL 编码器之下；3.3 节表 1 在 Taobao-MM 基准上，冻结 MUSE 基线 GAUC 0.6154，target 侧 E2EM 0.6139，加 LEMUR 的 memory bank 0.6128，target 与序列双侧 E2EM 0.6124；3.3 节表 2 显示 SGD、Adam、AdamW 配 2e-3 到 2e-5 的学习率没有任何组合超过 0.6154。4.1 节表 3 量得多模态相似度单独预测点击只略高于随机，MultiModal-Mean GAUC 0.541、MultiModal-Max GAUC 0.536；4.2 节表 4 发现 E2EM 的梯度余弦相似度为 0.016 和 0.006，而 SCL 为 0.144 和 0.849；4.2 节还报告共训引入 SCL 损失后 CTR GAUC 掉 0.17 个百分点、SCL Top-1 准确率掉 5 个百分点。挖掘质量见 5.2 节：标注打分单独接入即带来 GAUC +0.13%，对标注分差 0.15 以上与 0.05 以下的三元组人工投票，物品 1 胜率分别为 85% 与 42%。
