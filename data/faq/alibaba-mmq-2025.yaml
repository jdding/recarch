- key: core
  q_en: What is the core idea of MMQ?
  a_en: Quantize multimodal item content with shared and modality-specific experts, then fine-tune the codes toward user behavior.
  q_zh: MMQ 的核心思路是什么？
  a_zh: 用共享与模态专属专家量化多模态内容，再把码微调到用户行为上。
  fields:
  - core_idea
- key: results
  q_en: What results does MMQ report?
  a_en: 'Online A/B, Sec 5, 30 days from July 6 to August 6, 2025 with 10% of random user traffic against the existing Item ID-based system: Advertising Revenue +0.90%, Conversion Rate +4.33%, Orders +3.52%. Offline ranking, Table 1a, against the best baseline: on the industrial dataset MMQ reaches AUC 0.7184 and GAUC 0.6081 with relative improvements +0.04% and +0.07%, reconstruction loss 0.5529 at +0.32% lower, codebook entropy 7.9560 at +2.08% and utilization 1.00; on Amazon Beauty AUC 0.6503 at +0.33% and GAUC 0.6020 at +0.31%. Offline generative retrieval, Table 1b, MMQ consistently surpasses modality-aligned and modality-separated quantization baselines in Recall and NDCG at 5 and 10 on both datasets. Ablations, Table 2: removing orthogonal regularization sharply lowers codebook utilization and entropy, and removing behavior-aware fine-tuning lowers Recall and NDCG in all settings; Figure 6 shows even a Specific-Only variant with 10 experts fails to match MMQ with 2 shared and 4 specific experts. Methods with semantic IDs achieve significant AUC improvements over the PPNet item-ID backbone on long-tail items.'
  q_zh: MMQ 报告了哪些结果？
  a_zh: 线上 A/B 见 5 节，2025 年七月 6 日至八月 6 日共 30 天，随机用户流量 10%，基线为既有物品 ID 系统：广告收入 +0.90%、转化率 +4.33%、订单 +3.52%。离线排序见表 1a，相对最优基线：工业集上 MMQ 达 AUC 0.7184、GAUC 0.6081，相对提升 +0.04% 与 +0.07%，重建损失 0.5529 低 +0.32%，码本熵 7.9560 高 +2.08%，利用率 1.00；Amazon Beauty 上 AUC 0.6503 高 +0.33%、GAUC 0.6020 高 +0.31%。离线生成式检索见表 1b，MMQ 在两个数据集的 Recall@5、@10 与 NDCG@5、@10 上稳定超过模态对齐与模态分离的量化基线。消融见表 2：去掉正交正则会使码本利用率与熵大幅下降，去掉行为感知微调会使各设置下 Recall 与 NDCG 全面下降；图 6 显示即便 10 个专属专家的 Specific-Only 变体也追不上 2 共享加 4 专属的 MMQ。语义 ID 方法在长尾物品上相对 PPNet 物品 ID 骨干取得显著 AUC 提升。
  fields:
  - results_reported
