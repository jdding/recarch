- key: training
  q_en: How is MMQ trained?
  a_en: 'Training mode: Two-stage: multimodal shared-specific pretraining, then behavior-aware fine-tuning. Objectives: Reconstruction loss for quantization with codebook entropy and utilization regularization; Behavior-aware fine-tuning aligning the semantic space with recommendation tasks.'
  q_zh: MMQ 是怎么训练的？
  a_zh: 训练方式：两阶段：多模态共享专属预训练，随后行为感知微调。 训练目标：带码本熵与利用率正则的量化重建损失；把语义空间与推荐任务对齐的行为感知微调。
