- key: caveats
  q_en: What should I keep in mind when reading the results of MMQ?
  a_en: The paper describes the platform as a leading e-commerce advertising platform in Southeast Asia without naming it. The paper's limitations section states the two-stage framework adds training complexity and the fine-tuning stage is task-dependent.
  q_zh: 读 MMQ 的结果时要注意什么？
  a_zh: 论文将该平台描述为东南亚头部电商广告平台，未给出名称。 论文局限一节说明两阶段框架增加训练复杂度，且微调阶段依赖任务。
