- key: what
  q_en: What is MMQ, in one sentence?
  a_en: MMQ tokenizes multimodal item content into semantic IDs with shared and specific experts; a 30-day A/B lifted advertising revenue +0.90% and CVR +4.33%.
  q_zh: MMQ 一句话是什么？
  a_zh: MMQ 用共享与专属专家把多模态内容量化成语义 ID；30 天 A/B 广告收入 +0.90%、CVR +4.33%。
