- key: scale
  q_en: What scale does MUSE report?
  a_en: 'Behavior sequence length: up to 100K interactions online; production offline experiments cap at 5,000. Production dataset: 3.71B samples, 0.19B users, 23.6B distinct items. Open-source dataset: 99.0M samples, 8.79M users, 35.4M distinct items, max sequence 1K. Traffic share: majority of traffic since mid-2025.'
  q_zh: MUSE 报告了哪些规模信息？
  a_zh: 行为序列长度：线上最多 100K 次交互；生产离线实验截断到 5,000。 生产数据集：3.71B 样本、0.19B 用户、23.6B 个去重物品。 开源数据集：99.0M 样本、8.79M 用户、35.4M 个去重物品、最长序列 1K。 流量占比：自 2025 年年中起承担大部分流量。
