- key: core
  q_en: What is the core idea of MUSE?
  a_en: Keep the GSU a plain cosine similarity over frozen multimodal embeddings and spend the complexity budget in the ESU on similarity histograms and semantic-aware fused attention
  q_zh: MUSE 的核心思路是什么？
  a_zh: GSU 保持为冻结多模态 embedding 上的朴素余弦相似度，把复杂度预算花在 ESU 的相似度直方图与语义感知融合注意力上
  fields:
  - core_idea
- key: results
  q_en: What results does MUSE report?
  a_en: 'Online, Sec 7.5 Table 6: a long-term A/B test in Taobao display advertising with MUSE at 100K sequence length against a production baseline based on SIM with 5K behavior length gave CTR +12.6%, RPM +5.1% and ROI +11.4%; deployment since mid-2025 handles the majority of traffic, Sec 5. Offline, Table 5, GAUC on production data truncated from 100K to 5K: MUSE 0.6377, +1.69% over the DIN base 0.6271, ahead of SIM-Hard 0.6351, SIM-Soft 0.6356, TWIN 0.6304 and MISS 0.6308; on the open-source dataset with 1K sequences, MUSE 0.6154, +1.18% over the base 0.6082. Ablations on production data: Table 1 GSU embeddings lift GAUC from 0.6356 with ID embeddings to 0.6377 with SCL, +0.33%, while Table 2 shows added retrieval complexity moves GAUC only between 0.6369 and 0.6379; Table 3 ESU designs go from 0.6301 with plain Target Attention to 0.6377 with SA-TA plus SimTier, +1.21%; Sec 7.3 Figure 5 reports +0.38% GAUC when the sequence extends from 5K to 100K.'
  q_zh: MUSE 报告了哪些结果？
  a_zh: 线上，7.5 节表 6：淘宝展示广告长期 A/B，MUSE 序列长度 100K 对基于 SIM、行为长度 5K 的生产基线，CTR +12.6%、RPM +5.1%、ROI +11.4%；自 2025 年年中部署以来承担大部分流量，见 5 节。离线，表 5，生产数据 GAUC、序列从 100K 截断到 5K：MUSE 0.6377，较 DIN 基线 0.6271 提升 +1.69%，高于 SIM-Hard 0.6351、SIM-Soft 0.6356、TWIN 0.6304 与 MISS 0.6308；开源数据集 1K 序列上，MUSE 0.6154，较基线 0.6082 提升 +1.18%。消融在生产数据上：表 1 中 GSU embedding 将 GAUC 从 ID embedding 的 0.6356 提到 SCL 的 0.6377，+0.33%；表 2 显示增加检索复杂度后 GAUC 只在 0.6369 到 0.6379 之间变动；表 3 中 ESU 设计从纯 Target Attention 的 0.6301 到 SA-TA 加 SimTier 的 0.6377，+1.21%；7.3 节图 5 报告序列从 5K 延长到 100K 时 GAUC +0.38%。
  fields:
