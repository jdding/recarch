- key: caveats
  q_en: What should I keep in mind when reading the results of MUSE?
  a_en: The offline comparison truncates production sequences from 100K to 5K interactions to accelerate experimentation; the online system runs 100K, per the Table 5 caption. The online test is described only as a long-term A/B test; the paper gives no traffic share, bucket split or duration.
  q_zh: 读 MUSE 的结果时要注意什么？
  a_zh: 离线对比为加速实验把生产序列从 100K 截断到 5K，线上系统则运行 100K，见表 5 说明。 线上测试仅描述为长期 A/B；论文未给出流量占比、分桶或时长。
