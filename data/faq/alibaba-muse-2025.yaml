- key: serving
  q_en: What serving latency, QPS, cost or hardware does MUSE report?
  a_en: 'Serving latency: Negligible incremental latency; GSU fetching is asynchronous during matching and cached in GPU memory, and similarity plus Top-K selection overlap other ranking feature processing. Serving QPS: not reported. Inference cost: not reported. Hardware: GSU embedding cache held in GPU memory; no specific accelerator models named.'
  q_zh: MUSE 报告了怎样的服务延迟、QPS、成本和硬件？
  a_zh: 服务延迟：增量延迟可忽略；GSU 拉取在 matching 期间异步进行并缓存进 GPU 显存，相似度与 top-K 选择与其他排序特征处理并行。 服务 QPS：未报告。 推理成本：未报告。 硬件：GSU embedding 缓存放在 GPU 显存；论文未指明具体加速卡型号。
