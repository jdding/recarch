- key: what
  q_en: What is MUSE, in one sentence?
  a_en: 'MUSE brings frozen multimodal embeddings into both stages of lifelong interest modeling; Taobao display advertising A/B: CTR +12.6%, RPM +5.1%, ROI +11.4%.'
  q_zh: MUSE 一句话是什么？
  a_zh: MUSE 把冻结的多模态 embedding 引入终身兴趣建模的两个阶段；淘宝展示广告 A/B：CTR +12.6%、RPM +5.1%、ROI +11.4%。
