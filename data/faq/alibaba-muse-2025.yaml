  q_en: Who built MUSE and where does it run?
  a_en: 'MUSE comes from Alibaba, 2025. Deployed in: Taobao display advertising ranking stage.'
  q_zh: MUSE 是谁做的，用在哪里？
  a_zh: MUSE 来自 阿里巴巴，2025 年。上线位置：淘宝展示广告排序阶段。
