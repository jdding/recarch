- key: caveats
  q_en: What should I keep in mind when reading the results of NEZHA?
  a_en: The paper states that the 7-day online test was a reverse A/B test on 10% of traffic; no further bucket detail is given, and the production training setup is not described beyond the semantic-ID configuration shared with the public experiments. Serving latencies in Table 1 are normalized by the 0.6B prefill time for confidentiality, so absolute milliseconds are not published.
  q_zh: 读 NEZHA 的结果时要注意什么？
  a_zh: 论文说明 7 天线上测试是占 10% 流量的反向 A/B；没有更多分桶细节，生产训练设置除与公开实验共享的语义 ID 配置外未作描述。 表 1 服务延迟按 0.6B 预填充时间归一化以保密，绝对毫秒数未公开。
  fields:
  - caveats.0
  - caveats.1
- key: stage
  q_en: Which stages of the pipeline does NEZHA cover?
  a_en: 'Retrieval: LLM generative retriever, benchmarked with Llama-1B and Qwen3-0.8B backbones, extended with an autoregressive draft head and hash-set verification.'
  q_zh: NEZHA 覆盖链路的哪些阶段？
  a_zh: 召回：LLM 生成式检索器，基准用 Llama-1B 与 Qwen3-0.8B 骨干，扩展自回归草稿头与哈希集验证。
  fields:
