- key: what
  q_en: What is NEZHA, in one sentence?
  a_en: NEZHA adds a self-drafting head and hash-set verification to generative retrieval, cutting Taobao ad latency from over 1000 ms to under 30 ms; A/B revenue +1.2%.
  q_zh: NEZHA 一句话是什么？
  a_zh: NEZHA 用自起草头加哈希集验证加速生成式检索，淘宝广告延迟从 1000 多毫秒降到 30 毫秒内；A/B 收入 +1.2%。
  fields:
  - tldr
- key: who
  q_en: Who built NEZHA and where does it run?
  a_en: 'NEZHA comes from Alibaba, 2025. Deployed in: Taobao Search Advertising recall, all slots including the first page.'
  q_zh: NEZHA 是谁做的，用在哪里？
  a_zh: NEZHA 来自 阿里巴巴，2025 年。上线位置：淘宝搜索广告召回，含首页在内的全部广告位。
