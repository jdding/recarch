- key: core
  q_en: What is the core idea of NEZHA?
  a_en: Let the LLM draft its own semantic-ID continuations and verify them against a hash set of valid items, so generative retrieval fits a 30 ms budget.
  q_zh: NEZHA 的核心思路是什么？
  a_zh: 让 LLM 自己草拟语义 ID 续写并用合法物品哈希集验证，使生成式检索塞进 30 毫秒预算。
  fields:
  - core_idea
- key: results
  q_en: What results does NEZHA report?
  a_en: 'Deployment, Sec 5: cutting total latency from over 1000 ms to below the 30 ms first-page threshold, offline hit rate on clicked items improves +0.58% at top 500 and +0.61% at top 1000; the 7-day online A/B test registered a 1.2% revenue increase for a billion-level business after the system took the prime first-page position in October 2025. Verification, Sec 3.3: the model-free hash-set verifier lifts the ratio of valid drafted candidates from 43% to over 93%, worth a 12 percentage point uplift in key offline metrics. Public benchmarks, Table 3, with Llama and Qwen backbones on Beauty, Games and Yelp: NEZHA matches or beats beam search and the MTP self-drafting baseline, for example Qwen Beauty Hit@5 0.0451 against 0.0446 for beam search, with Games Hit@5 0.0239 against 0.0226 marked statistically significant at p < 0.05, while latency sits close to the MTP baseline and far below beam search, whose normalized latency reaches 74.21 and 47.70 on Beauty against 7.00 and 4.41 for NEZHA.'
  q_zh: NEZHA 报告了哪些结果？
  a_zh: 部署见 5 节：总延迟从 1000 多毫秒降到 30 毫秒首页阈值以内；点击物品命中率离线提升 top 500 +0.58%、top 1000 +0.61%；2025 年十月进入首页首位后，7 天线上 A/B 收入 +1.2%，业务为十亿级。验证见 3.3 节：无模型哈希集验证把合法草稿候选比例从 43% 提到 93% 以上，对应离线关键指标 12 个百分点提升。公开基准见表 3，Llama 与 Qwen 骨干在 Beauty、Games、Yelp 上：NEZHA 追平或超过 beam search 与 MTP 自起草基线，如 Qwen Beauty Hit@5 0.0451 对 beam search 0.0446，Games Hit@5 0.0239 对 0.0226 且 p < 0.05 显著；延迟接近 MTP 基线并远低于 beam search，后者的归一化延迟在 Beauty 上达 74.21 和 47.70，NEZHA 为 7.00 和 4.41。
  fields:
  - results_reported
- key: online
  q_en: Does NEZHA have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: 7 days. A/B traffic: 10% of traffic, reverse A/B test.'
  q_zh: NEZHA 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：7 天。A/B 流量：占 10% 流量的反向 A/B。
