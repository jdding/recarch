- key: what
  q_en: What is RecBot, in one sentence?
  a_en: RecBot interprets commands about what to show next and uses domain tools to filter, match, downweight and combine candidate scores for the feed.
  q_zh: RecBot 一句话是什么？
  a_zh: RecBot 理解用户对接下来推荐内容的指令，再用工具过滤、匹配、降权和合并候选分数。
  fields:
  - tldr
