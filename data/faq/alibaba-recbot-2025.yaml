- key: core
  q_en: What is the core idea of RecBot?
  a_en: Turn user commands into typed preferences and execute an adaptive tool chain over feed candidates.
  q_zh: RecBot 的核心思路是什么？
  a_zh: 把用户指令转成有类型的偏好，再对推荐流的候选执行适应当前需求的工具链。
  fields:
  - core_idea
- key: results
  q_en: What results does RecBot report?
  a_en: Section 4.3 reports a three-month homepage A/B. Table 5 reports relative changes in negative feedback frequency of -0.71%, click item category diversity of +1.44%, add-to-cart of +1.28%, and GMV of +1.40%. The paper normalizes the time series for confidentiality.
  q_zh: RecBot 报告了哪些结果？
  a_zh: 第 4.3 节报告三个月首页 A/B。表 5 中负反馈频率 -0.71%、点击商品类目多样性 +1.44%、加购 +1.28%、GMV +1.40%。为保密，论文对随时间变化的曲线做了归一化。
  fields:
  - results_reported
