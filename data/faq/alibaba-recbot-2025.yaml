- key: caveats
  q_en: What should I keep in mind when reading the results of RecBot?
  a_en: The paper names the product surface as an e-commerce homepage and leaves the platform unnamed. The online result covers the full RecBot treatment. The comparisons between individual tools are offline.
  q_zh: 读 RecBot 的结果时要注意什么？
  a_zh: 论文给出电商首页这个业务入口，未披露平台名称。 线上试验评估整套 RecBot 方案。各工具的增量在离线实验里比较。
