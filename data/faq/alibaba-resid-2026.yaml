- key: results
  q_en: What results does ReSID report?
  a_en: Section 5.7 describes a user-randomized A/B from July 1–12, 2026, with 15% of traffic per bucket. ReSID replaced the TIGER-style advertising retriever while the other retrieval channels and downstream ranker stayed the same. Relative gains were +1.3% ad revenue, +1.1% CTR, +0.8% GMV and +4.0% long-tail exposure share. The paper reports 10.3 ms mean online response time and full deployment since July 2026.
  q_zh: ReSID 报告了哪些结果？
  a_zh: 第 5.7 节报告了 2026 年七月 1 日至 12 日的用户级随机 A/B，每个分组分配 15% 流量。ReSID 替换了 TIGER 式广告召回，其他召回通道和下游排序器保持相同。广告收入、CTR、GMV 和长尾曝光占比分别相对提升 1.3%、1.1%、0.8% 和 4.0%。线上平均响应时间为 10.3 毫秒，原文报告系统自 2026 年七月起全面上线。
  fields:
  - results_reported
- key: online
  q_en: Does ReSID have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: July 1–12, 2026. A/B traffic: 15% of traffic per bucket, randomized by user.'
  q_zh: ReSID 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：2026 年七月 1 日至 12 日。A/B 流量：按用户随机分组，每组 15% 流量。
