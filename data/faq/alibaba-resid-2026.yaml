- key: what
  q_en: What is ReSID, in one sentence?
  a_en: ReSID uses independent codebooks, guided decoding and partial ID matching to keep more long-tail products eligible. The online advertising test reported revenue up 1.3%.
  q_zh: ReSID 一句话是什么？
  a_zh: ReSID 用独立码本、引导解码和 ID 部分匹配，让更多长尾商品有机会被召回。线上广告实验报告收入提升 1.3%。
  fields:
  - tldr
