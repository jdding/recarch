- key: caveats
  q_en: What should I keep in mind when reading the results of ReSID?
  a_en: The long-tail exposure result is a relative change in share, with no absolute percentage-point change reported. The online response time is separate from the offline accelerator benchmark. Online serving hardware and throughput were not reported.
  q_zh: 读 ReSID 的结果时要注意什么？
  a_zh: 长尾曝光占比是相对变化，原文未报告绝对百分点变化。 线上响应时间与离线加速器试验分开计量。线上硬件和吞吐未报告。
