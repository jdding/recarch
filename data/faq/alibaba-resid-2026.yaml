- key: core
  q_en: What is the core idea of ReSID?
  a_en: Recover relevant long-tail items from near-matching semantic IDs kept by guided decoding.
  q_zh: ReSID 的核心思路是什么？
  a_zh: 从引导解码保留下来的近似语义 ID 中找回相关的长尾商品。
