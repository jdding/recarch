items:
- key: what
  q_en: What is SORT, in one sentence?
  a_en: Alibaba International's SORT is a Transformer ranker with request-centric samples and generative pre-training; on AliExpress it gives orders +7.47%, GMV +8.65% and latency -62%.
  q_zh: SORT 一句话是什么？
  a_zh: 阿里国际的 SORT 是以请求为中心组织样本、带生成式预训练的 Transformer 排序模型；在 AliExpress 上订单 +7.47%，GMV +8.65%，延迟 -62%。
  fields:
  - tldr
- key: who
  q_en: Who built SORT and where does it run?
  a_en: 'SORT comes from Alibaba International, 2026. Deployed in: AliExpress, all users, four main recommendation scenarios.'
  q_zh: SORT 是谁做的，用在哪里？
  a_zh: SORT 来自 Alibaba International，2026 年。上线位置：AliExpress，全部用户，四个主要推荐场景。
  fields:
  - company
  - year
