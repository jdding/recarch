- key: caveats
  q_en: What should I keep in mind when reading the results of SORT?
  a_en: Latency and throughput are reported only as relative changes against the production DLRM; absolute latency, QPS, serving hardware and traffic share are not given. The comparison is against a DLRM trained incrementally on over a year of data, while SORT uses three months of data, and the two also differ in model family, request-centric organization and the inference stack, so the gain is not attributable to the Transformer alone.
  q_zh: 读 SORT 的结果时要注意什么？
  a_zh: 延迟和吞吐只报告相对线上 DLRM 的变化；绝对延迟、QPS、线上服务硬件和流量占比均未给出。 对比的 DLRM 是增量训练了一年多的模型，而 SORT 只用三个月数据，两者在模型族、以请求为中心的样本组织和推理栈上也都不同，所以增益不能全部归功于 Transformer。
  fields:
  - caveats.0
  - caveats.1
- key: serving
  q_en: What serving latency, QPS, cost or hardware does SORT report?
  a_en: 'Serving latency: Latency -62% on average against the production DLRM, from -51% to -72% by scenario; absolute values not reported. Serving QPS: Throughput +589% on average, from +325% to +1180% by scenario; absolute QPS not reported. Inference cost: Inference optimizations give a 29.4% throughput increase and a 29.3% latency reduction over the unoptimized baseline; the base model needs 24G FLOPs per sample. Hardware: A100 GPUs for training; serving hardware not reported.'
  q_zh: SORT 报告了怎样的服务延迟、QPS、成本和硬件？
  a_zh: 服务延迟：相对线上 DLRM 平均延迟 -62%，分场景从 -51% 到 -72%；绝对值未报告。 服务 QPS：平均吞吐 +589%，分场景从 +325% 到 +1180%；绝对 QPS 未报告。 推理成本：推理优化相对未优化基线带来 29.4% 的吞吐提升和 29.3% 的延迟下降；base 模型每个样本需要 24G FLOPs。 硬件：训练使用 A100 GPU；线上服务硬件未报告。
  fields:
  - deployment.serving_latency
  - deployment.serving_qps
  - deployment.inference_cost
  - deployment.hardware
- key: training
  q_en: How is SORT trained?
  a_en: 'Training mode: Offline training on request-centric samples, one epoch by default, with item embeddings pre-trained and frozen. Objectives: Binary cross-entropy for click, cart and purchase, summed with weights; Generative pre-training of item embeddings by next-item prediction over click sequences, then sparse transfer and sparse freeze.'
  q_zh: SORT 是怎么训练的？
  a_zh: 训练方式：在以请求为中心的样本上离线训练，默认一个 epoch，item embedding 先预训练再冻结。 训练目标：点击、加购和购买的二元交叉熵，加权求和；用点击序列上的下一个 item 预测做 item embedding 的生成式预训练，然后做稀疏迁移和稀疏冻结。
  fields:
  - training.mode
  - training.objectives
