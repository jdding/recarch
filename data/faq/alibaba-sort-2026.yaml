- key: core
  q_en: What is the core idea of SORT?
  a_en: Rebuild the DLRM ranker as a Transformer over one request-centric sequence, and make it trainable with generative pre-training of frozen item embeddings.
  q_zh: SORT 的核心思路是什么？
  a_zh: 把 DLRM 排序模型重建为基于单条以请求为中心序列的 Transformer，并用冻结 item embedding 的生成式预训练让它能够稳定训练。
  fields:
  - core_idea
- key: results
  q_en: What results does SORT report?
  a_en: 'Online A/B over one month in four AliExpress scenarios, SORT against the production DLRM. Macro average: orders +7.47%, buyers +6.67%, GMV +8.65%, latency -62%, throughput +589%. By scenario, orders are HomePage +2.37%, DetailPage +8.99%, ShoppingCart +7.10% and AfterPayment +11.43%; GMV is +10.01%, +11.49%, +6.98% and +6.12%; latency is -62%, -51%, -64% and -72%; throughput is +325%, +405%, +448% and +1180%. Offline, base scale CTR AUC is SORT 0.7497, Transformer 0.7456, HSTU 0.7438 and OneTrans 0.7476; large scale SORT reaches CTR AUC 0.7536 against 0.7485 for the Transformer, +0.51pt, with 188G against 322G FLOPs. Generative pre-training with sparse transfer and freeze lifts base Transformer CTR AUC by +2.81pt, while transfer alone changes it by -0.13pt. Local window 256 was best of 64, 128 and 256. Inference optimizations give a 29.4% throughput increase and a 29.3% latency reduction over the unoptimized baseline. Scaling of data, model and sequence length each improves AUC, with data scaling the steepest.'
  q_zh: SORT 报告了哪些结果？
  a_zh: 四个 AliExpress 场景上为期一个月的线上 A/B，SORT 对比线上 DLRM。宏平均：订单 +7.47%，买家 +6.67%，GMV +8.65%，延迟 -62%，吞吐 +589%。分场景看，订单为 HomePage +2.37%、DetailPage +8.99%、ShoppingCart +7.10%、AfterPayment +11.43%；GMV 为 +10.01%、+11.49%、+6.98%、+6.12%；延迟为 -62%、-51%、-64%、-72%；吞吐为 +325%、+405%、+448%、+1180%。离线方面，base 规模的 CTR AUC：SORT 0.7497，Transformer 0.7456，HSTU 0.7438，OneTrans 0.7476；large 规模 SORT 达到 CTR AUC 0.7536，Transformer 为 0.7485，即 +0.51pt，FLOPs 为 188G 对 322G。采用稀疏迁移加冻结的生成式预训练，使 base Transformer 的 CTR AUC 提升 +2.81pt，而只做迁移则变化 -0.13pt。局部窗口在 64、128、256 中 256 最好。推理优化相比未优化基线带来 29.4% 的吞吐提升和 29.3% 的延迟下降。数据、模型和序列长度的扩展各自都提升 AUC，其中数据扩展斜率最陡。
  fields:
  - results_reported
