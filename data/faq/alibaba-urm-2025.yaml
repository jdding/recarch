- key: core
  q_en: What is the core idea of URM?
  a_en: One fine-tuned LLM generates retrieval results for any text-described objective over the full candidate set.
  q_zh: URM 的核心思路是什么？
  a_zh: 一个微调后的 LLM 按任意文本描述的目标在完整候选集上生成检索结果
