- key: inputs
  q_en: What inputs does URM use?
  a_en: 'IDs and tokenization: Full item IDs, not semantic IDs. Input signals: Serialized user features: static attributes, statistical features and behavior sequences, with empty features omitted and sequences truncated without padding; Retrieval objectives expressed as natural-language text, such as multi-scenario, multi-behavior, long-tail, serendipity, long-term interest and search; Fixed learnable query tokens appended to the input sequence; Item-side serialized text features through a General Text Embedding.'
  q_zh: URM 用了哪些输入？
  a_zh: ID 与 token 化：完整物品 ID，不用 Semantic ID。 输入特征：序列化用户特征：静态属性、统计特征与行为序列，空特征直接省略，序列只截断不填充；检索目标用自然语言文本表达，如多场景、多行为、长尾、惊喜度、长期兴趣与搜索；输入序列末尾附加固定可学习查询 token；物品侧序列化文本特征经 General Text Embedding 处理。
  fields:
  - id_tokenization.approach
  - features_signals.0
  - features_signals.1
  - features_signals.2
  - features_signals.3
