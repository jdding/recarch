- key: caveats
  q_en: What should I keep in mind when reading the results of URM?
  a_en: Retrieval results are precomputed asynchronously per 10-minute window, so the online path is not per-request LLM inference. The abstract states the core metric improved by 3% and the introduction says over 3%; Sec 5.5 Table 6 gives the exact +3.01% for advertising revenue.
  q_zh: 读 URM 的结果时要注意什么？
  a_zh: 检索结果按 10 分钟窗口异步预计算，线上路径不是每次请求都跑一遍 LLM 推理。 摘要写核心指标提升 3%，引言写超过 3%；5.5 节表 6 给出广告收入的精确值 +3.01%。
  fields:
  - caveats.0
  - caveats.1
- key: training
  q_en: How is URM trained?
  a_en: 'Training mode: Offline supervised fine-tuning on a 5% sample of daily data, aggregated hourly to fit a 24-hour budget. Objectives: Noise Contrastive Estimation loss over the max of M query-representation scores, with 10,000 negatives per batch sampled by the 3/4 power of item frequency.'
  q_zh: URM 是怎么训练的？
  a_zh: 训练方式：对每日数据抽样 5% 后做离线监督微调，按小时聚合以适配 24 小时预算。 训练目标：以 M 个查询表示得分最大值上的 NCE 损失为目标，每批 10,000 个负例按物品频次 3/4 次幂采样。
  fields:
  - training.mode
  - training.objectives
