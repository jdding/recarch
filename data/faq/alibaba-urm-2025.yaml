- key: what
  q_en: What is URM, in one sentence?
  a_en: URM turns a fine-tuned Qwen-7B LLM into a universal generative retriever driven by text objectives; an online A/B lifted advertising revenue +3.01%.
  q_zh: URM 一句话是什么？
  a_zh: URM 把微调后的 Qwen-7B LLM 变成由文本目标驱动的通用生成式检索器；线上 A/B 广告收入 +3.01%。
