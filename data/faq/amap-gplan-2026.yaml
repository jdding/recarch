- key: core
  q_en: What is the core idea of GPlan?
  a_en: Distill LLM trip planning into a small model with latent reasoning tokens, then teach it to change the plan when time or location changes.
  q_zh: GPlan 的核心思路是什么？
  a_zh: 把 LLM 行程规划蒸馏进带隐式推理 token 的小模型，再教它在时间或位置变化时改变计划。
  fields:
  - core_idea
- key: results
  q_en: What results does GPlan report?
  a_en: 'Online A/B, Sec 5.5, 14 consecutive days on the Amap homepage against the incumbent CTR-based ranking model, serving GPlan-1.7B: the general slice on 5% of traffic at about 600 QPS lifted UV-CTR +0.87%, and the cross-city slice on another 5% lifted +1.04%. Offline, Table 1, on 1,000 test sequences: GPlan-4B reaches Acc@1 62.7 and NDCG@3 0.7759, GPlan-1.7B reaches 60.5 and 0.7450, against SASRec 36.1 and 0.5865, BERT4Rec 37.4 and 0.5973, ReaRec 42.9 and 0.6442, P5 43.5 and 0.6581, TIGER 44.2 and 0.6647, an 18.5 percentage-point Acc@1 margin for GPlan-4B over TIGER. Ablations on GPlan-4B, Table 2: Direct-SFT Acc@1 61.2, CoT-SFT 62.3, PICD 62.6, PICD plus SC-DPO 62.7 with NDCG@3 0.7759 and NES 0.6365; LLM-judge scores: Flow 3.58, Logic 3.59, ST 3.75 and Overall 3.64 for the full model, against 3.37, 3.43, 3.49 and 3.43 for Direct-SFT. Table 3: CALR keeps Latent-Valid at 1.0 with Acc@1 62.6 while Cosine-LR drops Latent-Valid to 0.0; Table 4: vanilla DPO lowers all axes, Acc@1 62.1, ST 3.60, while SC-DPO raises ST to 3.75 without hurting Overall. Inference, Table 5: 299 ms Direct-SFT, 1.06 s CoT-SFT, 366 ms PICD at 1.7B; 437 ms, 1.85 s, 503 ms at 4B.'
  q_zh: GPlan 报告了哪些结果？
  a_zh: 线上 A/B 见 5.5 节，高德首页连续 14 天，基线为在线 CTR 排序模型，服务模型为 GPlan-1.7B：约占 600 QPS 的 5% 流量总体切片 UV-CTR +0.87%，另一 5% 跨城切片 +1.04%。离线见表 1，1000 条测试序列：GPlan-4B 达 Acc@1 62.7、NDCG@3 0.7759，GPlan-1.7B 达 60.5 和 0.7450，对比 SASRec 36.1 和 0.5865、BERT4Rec 37.4 和 0.5973、ReaRec 42.9 和 0.6442、P5 43.5 和 0.6581、TIGER 44.2 和 0.6647，GPlan-4B 领先 TIGER 18.5 个百分点。GPlan-4B 消融见表 2：Direct-SFT Acc@1 61.2、CoT-SFT 62.3、PICD 62.6、PICD 加 SC-DPO 62.7，NDCG@3 0.7759、NES 0.6365；LLM 评审分：Flow 3.58、Logic 3.59、ST 3.75、Overall 3.64，对比 Direct-SFT 的 3.37、3.43、3.49、3.43。表 3：CALR 保持 Latent-Valid 为 1.0 且 Acc@1 62.6，Cosine-LR 降到 0.0；表 4：朴素 DPO 全面下降，Acc@1 62.1、ST 3.60，SC-DPO 把 ST 提到 3.75 且不伤 Overall。推理见表 5：1.7B 下 Direct-SFT 299 毫秒、CoT-SFT 1.06 秒、PICD 366 毫秒；4B 下 437 毫秒、1.85 秒、503 毫秒。
  fields:
  - results_reported
