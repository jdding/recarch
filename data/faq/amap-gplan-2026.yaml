- key: what
  q_en: What is GPlan, in one sentence?
  a_en: GPlan distills LLM planning into a 1.7B model with latent CoT tokens and counterfactual DPO; the Amap A/B lifted UV-CTR +0.87% overall and +1.04% cross-city.
  q_zh: GPlan 一句话是什么？
  a_zh: GPlan 把 LLM 规划蒸馏进 1.7B 小模型，用隐式 CoT token 加反事实 DPO；高德 A/B 总体 UV-CTR +0.87%、跨城 +1.04%。
