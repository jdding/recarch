- key: caveats
  q_en: What should I keep in mind when reading the results of GPlan?
  a_en: Most training and offline evaluation targets are teacher-generated from Qwen3-235B-A22B rather than human-written, as the paper states in its label-provenance note; the offline metrics measure agreement with these curated targets. The LLM judge is GPT-4o and is applied only within the GPlan family because baselines emit ID-only sequences without parameter slots; the paper notes a residual risk that the judge may reward superficial context mentions.
  q_zh: 读 GPlan 的结果时要注意什么？
  a_zh: 论文标签来源说明指出，多数训练与离线评估目标由 Qwen3-235B-A22B 教师生成而非人工撰写；离线指标衡量与这些策划目标的一致性。 LLM 评审为 GPT-4o，且只在 GPlan 家族内进行，因为基线只输出 ID 序列而无参数槽；论文说明评审可能奖励表面化的上下文提及这一残余风险。
  fields:
  - caveats.0
  - caveats.1
- key: training
  q_en: How is GPlan trained?
  a_en: 'Training mode: Three phases: HITL data synthesis, PICD supervised distillation, SC-DPO post-training. Objectives: Section-normalized cross-entropy balancing CoT and JSON plan sections; SC-DPO: DPO plus anchor, gap and center terms on bidirectional counterfactual pairs.'
  q_zh: GPlan 是怎么训练的？
  a_zh: 训练方式：三阶段：人机协同数据合成、PICD 监督蒸馏、SC-DPO 后训练。 训练目标：按 CoT 与 JSON 计划分段归一的交叉熵；SC-DPO：在双向反事实对上的 DPO 加锚定、间隔和中心项。
  fields:
  - training.mode
  - training.objectives
