- key: core
  q_en: What is the core idea of Gwhere?
  a_en: An LLM generates next-POI semantic IDs from a contrastively learned multimodal tokenizer, aligned to exposure feedback.
  q_zh: Gwhere 的核心思路是什么？
  a_zh: 大模型根据对比学习得到的多模态分词器生成下一个 POI 的 Semantic ID，并按曝光反馈对齐。
  fields:
  - core_idea
- key: results
  q_en: What results does Gwhere report?
  a_en: Offline Acc@1 on the Amap dataset is 0.2820 for the deployed 0.5B variant and 0.3071 for the 7B variant against 0.2675 for the production cascade, a 14.8% relative gain for the 7B model. On public Foursquare and Gowalla data the 7B model improves over GNPR-SID by 11.3%, 8.1% and 13.2%. Ablation of the semantic IDs drops Acc@1 by 16.01%, and SFT plus the new alignment reaches 0.2820 against 0.2759 for SFT plus GRPO and 0.2634 for SFT plus DPO. In a one-month A/B on the Amap homepage card against the production cascade, P-CTR rises 5.83%, U-CTR 6.20%, active rate 9.67% and negative feedback rate falls 11.11%. Without the alignment objective the negative feedback rate falls only 5.85%.
  q_zh: Gwhere 报告了哪些结果？
  a_zh: 高德数据集上的离线 Acc@1：已部署的 0.5B 变体为 0.2820，7B 变体为 0.3071，线上级联为 0.2675，7B 模型相对提升 14.8%。在公开的 Foursquare 和 Gowalla 数据上，7B 模型相比 GNPR-SID 分别提升 11.3%、8.1% 和 13.2%。去掉 Semantic ID 的消融使 Acc@1 下降 16.01%；SFT 加新的对齐方法达到 0.2820，SFT 加 GRPO 为 0.2759，SFT 加 DPO 为 0.2634。在高德首页卡片上对比线上级联做一个月 A/B，P-CTR 提升 5.83%，U-CTR 提升 6.20%，活跃率提升 9.67%，负反馈率下降 11.11%。没有对齐目标时，负反馈率只下降 5.85%。
  fields:
  - results_reported
- key: online
  q_en: Does Gwhere have online evidence, and how long was the A/B?
