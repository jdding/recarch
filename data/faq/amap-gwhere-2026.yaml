- key: what
  q_en: What is Gwhere, in one sentence?
  a_en: 'Amap''s Gwhere has a Qwen LLM generate next-POI semantic IDs for the app homepage; one-month A/B vs the production cascade: P-CTR +5.83%, U-CTR +6.20%, negative feedback -11.11%. SID code released.'
  q_zh: Gwhere 一句话是什么？
  a_zh: 高德 Gwhere 让 Qwen 大模型为 App 首页生成下一个 POI 的 Semantic ID；对比线上级联做一个月 A/B：P-CTR +5.83%，U-CTR +6.20%，负反馈 -11.11%。SID 代码已开源。
  fields:
  - tldr
- key: who
  q_en: Who built Gwhere and where does it run?
  a_en: 'Gwhere comes from Alibaba Amap, 2026. Deployed in: Amap app homepage Guess Where You Go card, in place of a four-stage cascade.'
  q_zh: Gwhere 是谁做的，用在哪里？
  a_zh: Gwhere 来自 阿里巴巴高德，2026 年。上线位置：高德 App 首页「猜你想去」卡片，取代四阶段级联。
