- key: caveats
  q_en: What should I keep in mind when reading the results of Gwhere?
  a_en: The arXiv v1 PDF used here still shows placeholder ACM metadata, so it is not confirmed as the camera-ready text; the DOI is registered. The paper does not state the A/B traffic share or user counts beyond serving millions of active users.
  q_zh: 读 Gwhere 的结果时要注意什么？
  a_zh: 这里使用的 arXiv v1 PDF 仍带有占位的 ACM 元数据，因此无法确认它就是定稿版文本；DOI 已注册。 除了服务数百万活跃用户之外，论文没有说明 A/B 的流量占比和用户数。
  fields:
  - caveats.0
  - caveats.1
- key: stage
  q_en: Which stages of the pipeline does Gwhere cover?
  a_en: 'Single-stage: Qwen2.5 LLM generating POI semantic IDs, replacing the recall, coarse-rank, fine-rank and cognitive re-rank cascade.'
  q_zh: Gwhere 覆盖链路的哪些阶段？
  a_zh: 单阶段：Qwen2.5 大模型生成 POI 的 Semantic ID，取代召回、粗排、精排和认知重排的级联。
  fields:
