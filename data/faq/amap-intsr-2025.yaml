- key: what
  q_en: What is IntSR, in one sentence?
  a_en: 'IntSR unifies search and recommendation in one autoregressive generative model with query placeholders and temporal candidate alignment; Amap A/B: GMV +9.34%, CTR +2.76%, ACC +7.04%.'
  q_zh: IntSR 一句话是什么？
  a_zh: IntSR 用查询占位符与时间对齐候选采样把搜索和推荐统一进一个自回归生成式模型；高德 A/B：GMV +9.34%、CTR +2.76%、ACC +7.04%。
  fields:
  - tldr
- key: who
  q_en: Who built IntSR and where does it run?
  a_en: 'IntSR comes from Alibaba Amap, 2025. Deployed in: Amap homepage POI recommendation, digital assets Explore Feed and travel mode suggestion, serving hundreds of millions of daily active users.'
  q_zh: IntSR 是谁做的，用在哪里？
  a_zh: IntSR 来自 阿里巴巴高德，2025 年。上线位置：高德首页 POI 推荐、数字资产 Explore Feed 与出行方式建议，服务数亿日活用户。
  fields:
  - company
  - year
  - deployed_in
- key: core
  q_en: What is the core idea of IntSR?
  a_en: One autoregressive model serves search and recommendation by conditioning on query placeholders, with temporal candidate alignment fixing the time-varying vocabulary.
  q_zh: IntSR 的核心思路是什么？
  a_zh: 一个自回归模型靠查询占位符同时服务搜索与推荐，用时间对齐候选采样解决语料随时间变化的问题。
  fields:
  - core_idea
- key: online
  q_en: Does IntSR have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: not reported. A/B traffic: Control group of 10% of users, randomly selected and routed to the production baseline model.'
  q_zh: IntSR 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：未报告。A/B 流量：对照组为随机选出的 10% 用户，路由到生产基线模型。
  fields:
  - deployment.online_evidence
  - deployment.ab_duration
  - deployment.ab_traffic
- key: caveats
  q_en: What should I keep in mind when reading the results of IntSR?
  a_en: 'The paper claims state-of-the-art on most but not all metrics: on Amazon search HR@10, TEM and CoPPS reach 0.9051 and UniSAR 0.8977 against 0.8920 for IntSR in Table 1. The online A/B section reports relative lifts only, with a 10% control group; no absolute values, duration or significance levels are given.'
  q_zh: 读 IntSR 的结果时要注意什么？
  a_zh: 论文只主张多数指标上最优而非全部：Amazon 搜索 HR@10 上 TEM 与 CoPPS 达 0.9051、UniSAR 达 0.8977，IntSR 为 0.8920，见表 1。 线上 A/B 只给相对提升与 10% 对照组流量，未给绝对值、持续时间或显著性水平。
  fields:
  - caveats.0
  - caveats.1
- key: unknown
  q_en: What does the source of IntSR not report?
  a_en: 'The source does not report: A/B duration, treatment traffic share and significance levels; Absolute online metric values; only relative lifts are reported; Serving latency and QPS in production; Training compute for the public-dataset experiments; Rollout dates for the deployed scenarios.'
  q_zh: IntSR 的原文有哪些没有报告？
  a_zh: 原文没有报告：A/B 持续时间、实验组流量与显著性水平；线上指标的绝对值，只报告了相对提升；生产环境的延迟与 QPS；公开数据集实验的训练算力；各场景的全量上线时间。
  fields:
