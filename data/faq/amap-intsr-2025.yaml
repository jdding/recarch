  - unknown_fields.4
- key: stage
  q_en: Which stages of the pipeline does IntSR cover?
  a_en: 'Single-stage: HSTU-based Query-Driven Block stack with a DSFNet multi-scenario block; frozen Qwen3-0.6B embeds natural-language search queries.'
  q_zh: IntSR 覆盖链路的哪些阶段？
  a_zh: 单阶段：基于 HSTU 的 Query-Driven Block 堆栈加 DSFNet 多场景模块；冻结的 Qwen3-0.6B 嵌入自然语言搜索词。
  fields:
  - stages.0
- key: scale
  q_en: What scale does IntSR report?
  a_en: 'Deployment: Amap production across POI, digital assets and travel mode scenarios, serving hundreds of millions of daily active users; core components fully operational at scale for over 6 months. Online A/B control: 10% of users randomly selected as the control group on the production baseline model. Industrial dataset: Amap Digital Assets: 52M users, 819 items, mean 12 and median 2 interactions. Public datasets: Amazon Kindle Store 68223 users and 61934 items; KuaiSAR 22700 users and 673415 items.'
  q_zh: IntSR 报告了哪些规模信息？
  a_zh: 部署：高德生产的 POI、数字资产与出行方式场景，服务数亿日活用户；多个核心组件在全量规模稳定运行超过 6 个月。 线上 A/B 对照：随机选 10% 用户作对照组，路由到生产基线模型。 工业数据集：高德数字资产：5200 万用户、819 个物品，人均交互均值 12、中位数 2。 公开数据集：Amazon Kindle Store 68223 用户与 61934 物品；KuaiSAR 22700 用户与 673415 物品。
