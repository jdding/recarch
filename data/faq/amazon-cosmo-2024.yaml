- key: what
  q_en: What is COSMO, in one sentence?
  a_en: Amazon generates shopping-intent knowledge offline and serves it from a cache to refine product searches. Product sales rose 0.7% in the tested search navigation segment.
  q_zh: COSMO 一句话是什么？
  a_zh: Amazon 离线生成购物意图知识，通过缓存为商品搜索提供细化选项。受试搜索导航流量上的商品销售指标增长 0.7%。
  fields:
  - tldr
- key: who
  q_en: Who built COSMO and where does it run?
  a_en: 'COSMO comes from Amazon, 2024. Deployed in: Amazon search navigation, tested on a segment of U.S. traffic.'
  q_zh: COSMO 是谁做的，用在哪里？
  a_zh: COSMO 来自 Amazon，2024 年。上线位置：Amazon 搜索导航，在部分美国流量上测试。
