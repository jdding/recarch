- key: core
  q_en: What is the core idea of COSMO?
  a_en: Generate shopping-intent relations from behavior data, then serve them as cached search refinements.
  q_zh: COSMO 的核心思路是什么？
  a_zh: 从购物行为生成意图关系，写入缓存以支持搜索细化。
  fields:
  - core_idea
- key: results
  q_en: What results does COSMO report?
  a_en: Section 4.3.2 reports Amazon search navigation A/B tests over several months in total, targeting approximately 10% of U.S. traffic. Adding the COSMO knowledge to navigation yielded a 0.7% relative increase in product sales and an 8% increase in navigation engagement rate in the tested segment. The paper gives no detailed control configuration.
  q_zh: COSMO 报告了哪些结果？
  a_zh: 第 4.3.2 节报告了 Amazon 搜索导航合计数月的线上 A/B，覆盖约 10% 的美国流量。导航引入 COSMO 知识后，受试流量的商品销售指标相对增长 0.7%，导航交互率增长 8%。论文未披露详细的对照配置。
  fields:
  - results_reported
- key: online
  q_en: Does COSMO have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: Several months across tests. A/B traffic: About 10% of Amazon''s U.S. traffic targeted across the tests.'
  q_zh: COSMO 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：各次测试合计数月。A/B 流量：各次测试整体覆盖约 10% 的 Amazon 美国流量。
  fields:
  - deployment.online_evidence
  - deployment.ab_duration
  - deployment.ab_traffic
- key: caveats
  q_en: What should I keep in mind when reading the results of COSMO?
  a_en: The reported gains apply to the tested search navigation feature and traffic segment. Search relevance and session recommendation have separate offline results. The authors describe daily updates and explain their limitations for short-lived changes such as flash sales.
  q_zh: 读 COSMO 的结果时要注意什么？
  a_zh: 线上提升限于受试的搜索导航功能和流量。搜索相关性与会话推荐另有离线结果。 作者描述了每日更新流程，也说明它对限时促销等短期变化存在局限。
  fields:
  - caveats.0
  - caveats.1
- key: unknown
  q_en: What does the source of COSMO not report?
  a_en: 'The source does not report: Per-arm traffic allocation, precise test dates and detailed control configuration; Production latency in milliseconds, serving QPS, hardware configuration and monetary cost.'
  q_zh: COSMO 的原文有哪些没有报告？
  a_zh: 原文没有报告：每组流量、确切实验日期与对照组详细配置；生产延迟毫秒数、QPS、硬件配置及推理费用。
