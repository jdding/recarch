- key: caveats
  q_en: What should I keep in mind when reading the results of Amazon item-to-item collaborative filtering?
  a_en: Industry report with no quantitative evaluation; the claim about CTR and conversion is qualitative. Describes the 2003 system; the paper cites an Amazon patent (US 6,266,649) for the method.
  q_zh: 读 Amazon item-to-item collaborative filtering 的结果时要注意什么？
  a_zh: 这是一份没有定量评估的行业报告；关于 CTR 和转化率的说法是定性的。 介绍的是 2003 年的系统；论文引用了 Amazon 的一项专利 US 6,266,649 来说明该方法。
  fields:
  - caveats.0
  - caveats.1
- key: stage
  q_en: Which stages of the pipeline does Amazon item-to-item collaborative filtering cover?
  a_en: 'Retrieval: Item-to-item collaborative filtering: offline cosine similarity between item vectors (dimensions are customers who bought the item), stored as a similar-items table; online aggregation of items similar to the user''s purchases and ratings, then recommend the most popular or correlated.'
  q_zh: Amazon item-to-item collaborative filtering 覆盖链路的哪些阶段？
  a_zh: 召回：item-to-item 协同过滤：离线计算 item 向量之间的余弦相似度，向量的维度是购买过该 item 的顾客，存成相似商品表；在线聚合与用户购买和评分过的 item 相似的 item，再推荐最热门或最相关的。
  fields:
  - stages.0
