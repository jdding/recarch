- key: what
  q_en: What is Amazon item-to-item collaborative filtering, in one sentence?
  a_en: Item-to-item collaborative filtering precomputes a similar-items table offline, so online recommendation is a lookup that scales independently of the number of customers.
  q_zh: Amazon item-to-item collaborative filtering 一句话是什么？
  a_zh: item-to-item 协同过滤离线预计算相似商品表，因此在线推荐只是一次查表，其扩展性与顾客数量无关。
  fields:
  - tldr
- key: who
  q_en: Who built Amazon item-to-item collaborative filtering and where does it run?
  a_en: 'Amazon item-to-item collaborative filtering comes from Amazon, 2003. Deployed in: Amazon.com homepage, shopping cart and email campaigns.'
  q_zh: Amazon item-to-item collaborative filtering 是谁做的，用在哪里？
  a_zh: Amazon item-to-item collaborative filtering 来自 Amazon，2003 年。上线位置：Amazon.com 首页、购物车和邮件营销活动。
