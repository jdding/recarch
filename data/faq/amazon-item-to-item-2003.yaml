- key: results
  q_en: What results does Amazon item-to-item collaborative filtering report?
  a_en: 'No experimental metrics. The paper states qualitatively that click-through and conversion rates of recommendations vastly exceed untargeted content such as banner ads and top-seller lists, and that the algorithm scales independently of customer and item counts. Surfaces named: homepage ''Your Recommendations'', shopping-cart recommendations, and many email campaigns.'
  q_zh: Amazon item-to-item collaborative filtering 报告了哪些结果？
  a_zh: 没有实验指标。论文只定性地说，推荐的点击率和转化率远高于横幅广告和畅销榜这类非定向内容，并且算法的扩展性与顾客数和商品数无关。提到的位置有：首页的「为您推荐」、购物车推荐，以及许多邮件营销活动。
  fields:
  - results_reported
