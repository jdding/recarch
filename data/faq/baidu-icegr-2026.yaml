  - deployment.ab_duration
  - deployment.ab_traffic
- key: caveats
  q_en: What should I keep in mind when reading the results of ICEGR?
  a_en: The production A/B evaluates the added path, including direct insertion. It does not isolate a gain for the tokenizer. The 20% describes live traffic assigned to the experiment. Per-arm allocations and absolute metric values were not published.
  q_zh: 读 ICEGR 的结果时要注意什么？
  a_zh: 生产 A/B 测量包含直接插入候选的整条新增路径。分词器的独立贡献未报告。 20% 是纳入实验的生产流量。各组分流和指标绝对值未公布。
  fields:
