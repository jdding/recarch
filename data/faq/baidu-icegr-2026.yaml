- key: what
  q_en: What is ICEGR, in one sentence?
  a_en: Baidu aligns generated product IDs with query intent and places a fixed number of top candidates directly in search results. Order volume rose 15.96% in its production A/B.
  q_zh: ICEGR 一句话是什么？
  a_zh: 百度让生成的商品 ID 与查询意图对齐，并把固定数量的头部候选直接放进搜索结果。生产 A/B 中，订单量增长 15.96%。
  fields:
  - tldr
- key: who
  q_en: Who built ICEGR and where does it run?
  a_en: 'ICEGR comes from Baidu, 2026. Deployed in: Baidu E-commerce Search, as an additional path in the production A/B.'
  q_zh: ICEGR 是谁做的，用在哪里？
  a_zh: ICEGR 来自 百度，2026 年。上线位置：百度电商搜索生产 A/B 中的新增召回路径。
  fields:
  - company
  - year
  - deployed_in
- key: core
  q_en: What is the core idea of ICEGR?
  a_en: Constrain generated product candidates by query intent throughout tokenization, training and preference calibration.
  q_zh: ICEGR 的核心思路是什么？
  a_zh: 在分词、训练和偏好校准中持续用查询意图约束生成的商品候选。
  fields:
  - core_idea
- key: results
  q_en: What results does ICEGR report?
  a_en: Section 4.5 and Table 5 report a two-week production A/B on 20% of live traffic. The control used the existing MCA system. The treatment added a generative path to the same pipeline, inserting a fixed number of the highest ICEGR candidates directly into impressions. Relative lifts were +3.52% CTR, +15.96% order volume and +7.53% GMV. Section 4.6 reports 156 ms mean generator latency and 2,200 peak QPS with beam size 50 and 67 NVIDIA L20 GPUs.
  q_zh: ICEGR 报告了哪些结果？
  a_zh: 第 4.5 节和表 5 报告了占线上流量 20%、持续两周的生产 A/B。对照组使用现有 MCA，实验组在同一链路加上生成路径，将固定数量的 ICEGR 头部候选直接放进曝光列表。相对对照组，CTR +3.52%，订单量 +15.96%，GMV +7.53%。第 4.6 节报告生成器在 67 张 NVIDIA L20 GPU、束宽 50 的配置下，平均延迟为 156 毫秒，峰值吞吐为 2,200 QPS。
  fields:
  - results_reported
- key: online
  q_en: Does ICEGR have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: Two weeks. A/B traffic: 20% of live traffic in the experiment.'
  q_zh: ICEGR 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：两周。A/B 流量：实验占生产流量 20%。
  fields:
