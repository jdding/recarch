- key: inputs
  q_en: What inputs does ICEGR use?
  a_en: 'IDs and tokenization: Intent-aware semantic IDs. Input signals: Real and synthetic search queries; Product content and shared-query clicks; Relevance and historical business feedback from clicks, payments and GMV.'
