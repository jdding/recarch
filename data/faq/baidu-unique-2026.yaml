items:
- key: what
  q_en: What is UNIQUE, in one sentence?
  a_en: 'Baidu feed model that predicts single-layer semantic codes for retrieval and scores candidates in the same early-fusion Transformer; one-week A/B: watch duration +0.96%, distribution volume +1.08%.'
  q_zh: UNIQUE 一句话是什么？
  a_zh: 百度信息流模型在同一个早期融合 Transformer 中，为召回预测单层语义码，并为候选打分；一周 A/B：观看时长 +0.96%，分发量 +1.08%。
  fields:
  - tldr
- key: who
  q_en: Who built UNIQUE and where does it run?
  a_en: 'UNIQUE comes from Baidu, 2026. Deployed in: Mobile Baidu homepage feed, discovery page and short-video recommendation, retrieval stage.'
  q_zh: UNIQUE 是谁做的，用在哪里？
  a_zh: UNIQUE 来自 百度，2026 年。上线位置：手机百度首页信息流、发现页和短视频推荐，召回阶段。
  fields:
  - company
  - year
  - deployed_in
- key: core
  q_en: What is the core idea of UNIQUE?
  a_en: One Transformer does generative retrieval over a flat code book, then scores the retrieved items.
  q_zh: UNIQUE 的核心思路是什么？
  a_zh: 一个 Transformer 在扁平码本上做生成式召回，再对召回出的 item 打分。
  fields:
  - core_idea
- key: results
  q_en: What results does UNIQUE report?
  a_en: 'Online (one-week full A/B vs previous production retrieval pipeline, p < 0.05): total watch duration +0.96%, total distribution volume +1.08%, user retention +0.70%; new users +1.44% watch time, high-activity +1.11%; UNIQUE accounts for 22.5% of the retrieval candidate pool. Serving: P80 35 ms, P99 89 ms, online inference MFU 44.23%, about 10,000 QPS peak, about $0.0013 per 1,000 requests. Codebook analysis: resource-count variance 1510.85 to 389.57 (flat vs hierarchical). Offline on KuaiRand-Pure: HR@10 0.0575, HR@50 0.1510, NDCG@10 0.0310, NDCG@50 0.0473, CTR-AUC 0.7252 vs UniGRF-HSTU 0.0511/0.1453/0.0298/0.0430/0.7168. Ablation (HR@50): w/o generative objective 0.1374 (-9.01%), w/o early fusion 0.1398 (-7.42%), w/o flat quantization 0.1421 (-5.89%).'
  q_zh: UNIQUE 报告了哪些结果？
  a_zh: 线上结果为一周全量 A/B，对比此前线上的召回链路，p < 0.05：总观看时长 +0.96%，总分发量 +1.08%，用户留存 +0.70%；新用户观看时长 +1.44%，高活跃用户 +1.11%；UNIQUE 占召回候选池的 22.5%。在线服务：P80 35 ms，P99 89 ms，线上推理 MFU 44.23%，峰值约 10,000 QPS，每 1,000 个请求约 $0.0013。码本分析：资源计数方差从 1510.85 降到 389.57，即从层级码本到扁平码本。在 KuaiRand-Pure 上的离线结果：HR@10 0.0575，HR@50 0.1510，NDCG@10 0.0310，NDCG@50 0.0473，CTR-AUC 0.7252，对比 UniGRF-HSTU 的 0.0511、0.1453、0.0298、0.0430、0.7168。消融实验的指标为 HR@50：去掉生成目标为 0.1374，即 -9.01%；去掉早期融合为 0.1398，即 -7.42%；去掉扁平量化为 0.1421，即 -5.89%。
  fields:
  - results_reported
