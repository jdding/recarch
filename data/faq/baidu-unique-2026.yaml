- key: caveats
  q_en: What should I keep in mind when reading the results of UNIQUE?
  a_en: 'The paper gives two start dates: the introduction says deployed since February 2026, Section 4.1.2 says January 2026. Offline evidence is a small public benchmark (KuaiRand-Pure, 7,583 items) that the authors call a sanity check; production-scale offline metrics are not reported.'
  q_zh: 读 UNIQUE 的结果时要注意什么？
  a_zh: 论文给出了两个起始时间：引言称自 February 2026 起部署，第 4.1.2 节则称 January 2026。 离线证据是一个小型公开基准，即有 7,583 个 item 的 KuaiRand-Pure，作者称之为合理性检验；没有报告线上规模的离线指标。
