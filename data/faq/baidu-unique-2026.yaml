- key: inputs
  q_en: What inputs does UNIQUE use?
  a_en: 'IDs and tokenization: Single-layer flat codebook (EMA vector quantization) with balanced assignment. Input signals: User profile token, short-term impressions (clicked and exposed-not-clicked), medium-term satisfied watches, long-term interests grouped by category; Item ID, category, publisher, title terms and other item metadata; Feedback signals covering relevance, CTR, dwell or duration, and completion.'
  q_zh: UNIQUE 用了哪些输入？
  a_zh: ID 与 token 化：单层扁平码本，EMA 向量量化，带均衡分配。 输入特征：用户画像 token、短期曝光，包括点击的和曝光未点击的、中期的满意观看、按类目分组的长期兴趣；item ID、类目、发布者、标题词和其他 item 元数据；反馈信号，涵盖相关性、CTR、停留或时长以及完播。
  fields:
  - id_tokenization.approach
  - features_signals.0
  - features_signals.1
  - features_signals.2
