- key: inputs
  q_en: What inputs does FLUID use?
  a_en: 'IDs and tokenization: LUCID: 4-level RQ-KMeans code with 64 clusters per level, embedded by a prefix n-gram scheme. Input signals: Slice-level LUCID of the current 2-minute content segment; Room-level LUCID from majority voting over the slices so far; Video frames, titles, OCR, ASR transcripts, author bios, audience comments and sticker tags as encoder input; User features and user history tokens in the Zenith++ ranker.'
  q_zh: FLUID 用了哪些输入？
  a_zh: ID 与 token 化：LUCID：4 层 RQ-KMeans 编码，每层 64 个聚类，用前缀 n-gram 方式做 embedding。 输入特征：当前 2 分钟内容片段的切片级 LUCID；直播间级 LUCID，由已有切片的多数投票得到；作为编码器输入的视频帧、标题、OCR、ASR 转写、作者简介、观众评论和贴纸标签；Zenith++ 排序模型中的用户特征和用户历史 token。
  fields:
  - id_tokenization.approach
