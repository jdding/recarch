- key: core
  q_en: What is the core idea of FLUID?
  a_en: Retire the candidate item ID in a livestreaming ranker and let discrete multimodal LUCID codes, added by staged warmup, play its role.
  q_zh: FLUID 的核心思路是什么？
  a_zh: 去掉直播排序模型里候选侧的 item ID，用分阶段预热加入的离散多模态 LUCID 编码来承担它的角色。
  fields:
  - core_idea
- key: results
  q_en: What results does FLUID report?
  a_en: 'Online A/B against the production baseline, arms +Slice, -ID and FLUID. FLUID: Quality Watch Duration +0.55%, Quality Watch Session +0.51%, Cold-Start Room Views +2.05%, Niche Room Views +2.87%, Unique Watched Tags +1.63%, Stay Duration +0.07%, Active Hours +0.05%. +Slice gives +0.43% Quality Watch Duration and +1.15% Cold-Start Room Views with retention not significant; removing the item ID alone gives -0.02% Quality Watch Duration, +1.58% Cold-Start Room Views and -0.05% Stay Duration. Offline CTR AUC is 0.7784 for the baseline, 0.7801 with slice LUCID, 0.7748 without item ID and 0.7802 for FLUID, with logloss 0.1264, 0.1263, 0.1273 and 0.1262. Prefix n-gram embedding gives AUC 0.7802 against 0.7793 for level-wise decoding, and independent slice and room tables 0.7802 against 0.7798 for a shared table. Early fusion variants change AUC by -0.13% to +0.01%, and naive joint training +0.00%. The staged warmup gives +0.22%, +0.11% and +0.23% AUC at stages one to three. On the encoder, Live Q2I R@10 rises from 43.96 for CLIP-B/32 plus Albert-V2 to 47.44 with Qwen3-Embedding and SigLIP2.'
  q_zh: FLUID 报告了哪些结果？
  a_zh: 对比线上基线的 A/B，三个实验组为 +Slice、-ID 和 FLUID。FLUID：优质观看时长 +0.55%，优质观看场次 +0.51%，冷启动直播间曝光 +2.05%，小众直播间曝光 +2.87%，去重观看标签数 +1.63%，停留时长 +0.07%，活跃时长 +0.05%。+Slice 的优质观看时长 +0.43%，冷启动直播间曝光 +1.15%，留存不显著；只去掉 item ID 时，优质观看时长 -0.02%，冷启动直播间曝光 +1.58%，停留时长 -0.05%。离线 CTR AUC：基线 0.7784，加切片 LUCID 为 0.7801，去掉 item ID 为 0.7748，FLUID 为 0.7802，对应的 logloss 为 0.1264、0.1263、0.1273 和 0.1262。前缀 n-gram embedding 的 AUC 为 0.7802，逐层解码为 0.7793；独立的切片表和直播间表为 0.7802，共享表为 0.7798。早融合各种变体使 AUC 变化 -0.13% 到 +0.01%，直接联合训练为 +0.00%。分阶段预热在第一到第三阶段的 AUC 分别为 +0.22%、+0.11% 和 +0.23%。编码器方面，Live Q2I R@10 从 CLIP-B/32 加 Albert-V2 的 43.96 提升到使用 Qwen3-Embedding 和 SigLIP2 后的 47.44。
  fields:
  - results_reported
