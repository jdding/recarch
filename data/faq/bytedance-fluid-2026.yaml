items:
- key: what
  q_en: What is FLUID, in one sentence?
  a_en: ByteDance's FLUID drops the item ID from a production livestreaming ranker, using multimodal semantic codes instead; A/B gives Quality Watch Duration +0.55% and Cold-Start Room Views +2.05%.
  q_zh: FLUID 一句话是什么？
  a_zh: 字节的 FLUID 把生产直播排序模型里的 item ID 去掉，换成多模态语义编码；A/B 下优质观看时长 +0.55%，冷启动直播间曝光 +2.05%。
  fields:
  - tldr
- key: who
  q_en: Who built FLUID and where does it run?
  a_en: 'FLUID comes from ByteDance, 2026. Deployed in: ByteDance livestreaming ranking, over one billion combined users.'
