- key: caveats
  q_en: What should I keep in mind when reading the results of FLUID?
  a_en: The A/B duration, traffic share and platform split are not stated, and the paper reports only relative changes against the production baseline; the retention gains are tiny, Active Hours +0.05% and Stay Duration +0.07%. Table 4 marks changes that are not significant at p < 0.05 as n.s., but gives no confidence intervals, no repeated runs and no per-platform split.
  q_zh: 读 FLUID 的结果时要注意什么？
  a_zh: 论文没有写 A/B 时长、流量占比和各平台的拆分，只报告相对线上基线的变化；留存方面的收益很小，活跃时长 +0.05%，停留时长 +0.07%。 Table 4 把在 p < 0.05 下不显著的变化标为 n.s.，但没有给置信区间、重复实验和分平台的结果。
