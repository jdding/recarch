- key: what
  q_en: What is GEAR, in one sentence?
  a_en: 'ByteDance generative ad retrieval with BasisRQ tokenizer and a joint reranking head on Douyin Ads; global A/B on 5% traffic per group for 7 days: ADSS +0.563%, ADVV +0.658%.'
  q_zh: GEAR 一句话是什么？
  a_zh: 字节跳动在抖音广告中上线生成式广告召回，包含 BasisRQ 分词器和联合重排头；全局 A/B 每组 5% 流量、7 天：ADSS +0.563%，ADVV +0.658%。
  fields:
  - tldr
- key: who
  q_en: Who built GEAR and where does it run?
  a_en: 'GEAR comes from ByteDance, 2026. Deployed in: Douyin Ads retrieval, as an extra generative channel.'
  q_zh: GEAR 是谁做的，用在哪里？
  a_zh: GEAR 来自 字节跳动，2026 年。上线位置：抖音广告召回，作为额外的生成式通道。
