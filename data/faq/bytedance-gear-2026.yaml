- key: caveats
  q_en: What should I keep in mind when reading the results of GEAR?
  a_en: arXiv preprint (v1); no peer-reviewed venue found, so there is no published version to check. The paper reports revenue-style metrics (ADSS, ADVV) as relative gains only; no absolute values, confidence intervals or per-segment results.
  q_zh: 读 GEAR 的结果时要注意什么？
  a_zh: arXiv 预印本 v1；没有找到经同行评审的发表会议，因此没有可核对的正式发表版。 论文只以相对提升报告收入类指标 ADSS 和 ADVV；没有绝对值、置信区间或分人群结果。
