- key: core
  q_en: What is the core idea of GEAR?
  a_en: Quantize item embeddings into token sequences and decode them as an extra retrieval channel.
  q_zh: GEAR 的核心思路是什么？
  a_zh: 把 item embedding 量化成 token 序列，并作为额外的召回通道解码。
  fields:
  - core_idea
- key: results
  q_en: What results does GEAR report?
  a_en: 'Online A/B on Douyin Ads, 7 days, 5% of traffic per treatment group, GEAR as an extra retrieval path vs the production system without it: ADSS +0.563%, ADVV +0.658%; cold-start activation rate of new advertisers +1.46%. Subset ablation (ADSS/ADVV): GEAR +0.446/+0.498, w/o prefix-aware BasisRQ +0.288/+0.219, w/o rerank +0.358/+0.341, w/o secpm reweight +0.395/+0.354. Tokenizer analysis per Table 2: prefix-aware BasisRQ (2048, 512, 128) utilization 8.83%, collision rate 52.3%, MSE 1.82e-3; vanilla RQ with EMA 4.22%, 84.2%, 2.32e-3.'
  q_zh: GEAR 报告了哪些结果？
  a_zh: 抖音广告线上 A/B，7 天，每个实验组 5% 流量，GEAR 作为额外召回路径，对比没有它的线上系统：ADSS +0.563%，ADVV +0.658%；新广告主冷启动激活率 +1.46%。子集消融，指标为 ADSS 和 ADVV：GEAR +0.446/+0.498，去掉前缀感知 BasisRQ 为 +0.288/+0.219，去掉重排为 +0.358/+0.341，去掉 secpm 重加权为 +0.395/+0.354。分词器分析见表 2：前缀感知 BasisRQ，码本大小 2048、512、128，利用率 8.83%，碰撞率 52.3%，MSE 1.82e-3；带 EMA 的普通 RQ 分别为 4.22%、84.2%、2.32e-3。
  fields:
  - results_reported
