- key: what
  q_en: What is HAP, in one sentence?
  a_en: Toutiao splits pre-ranking into a cheap pass for all candidates and a stronger pass for the shortlist. App usage time rose by 0.4% in its production A/B test.
  q_zh: HAP 一句话是什么？
  a_zh: 今日头条先用轻量模型评估所有候选，再用更强的模型细排候选短名单。线上 A/B 中应用使用时长提升 0.4%。
  fields:
  - tldr
- key: who
  q_en: Who built HAP and where does it run?
  a_en: 'HAP comes from ByteDance, 2026. Deployed in: Toutiao feed pre-ranking, fully rolled out at the time of the paper.'
  q_zh: HAP 是谁做的，用在哪里？
  a_zh: HAP 来自 字节跳动，2026 年。上线位置：论文撰写时已在今日头条信息流预排序全量上线。
  fields:
  - company
  - year
  - deployed_in
- key: core
  q_en: What is the core idea of HAP?
  a_en: Score all candidates cheaply, then apply a stronger pre-ranker to the shortlist.
  q_zh: HAP 的核心思路是什么？
  a_zh: 先用轻量模型给所有候选打分，再用更强的预排序模型评估短名单。
  fields:
  - core_idea
- key: results
  q_en: What results does HAP report?
  a_en: In Section 4.6, the Toutiao online A/B against the prior production pre-ranker reports app usage time +0.4%, active days +0.05% and CTR +3.0%. The authors report comparable serving latency and 6% lower CPU usage, with the top 550 candidates, about 30%, routed to the expressive model. At the time of writing, HAP had been fully deployed for 9 months. In the separate offline ToutiaoRec evaluation in Table 3, hard-negative AUC was 0.8023 for HAP and 0.7917 for HCCP.
  q_zh: HAP 报告了哪些结果？
  a_zh: 第 4.6 节报告了今日头条线上 A/B。与此前的线上预排序模型相比，应用使用时长 +0.4%，活跃天数 +0.05%，CTR +3.0%。作者报告两者在线延迟相当，CPU 用量下降 6%。轻量模型打分后，前 550 个候选进入更强的模型，约占候选集的 30%。论文撰写时，HAP 已全量部署 9 个月。表 3 的 ToutiaoRec 离线实验中，HAP 在困难负样本上的 AUC 为 0.8023，HCCP 为 0.7917。
  fields:
  - results_reported
- key: online
  q_en: Does HAP have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: not reported. A/B traffic: not reported.'
  q_zh: HAP 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：未报告。A/B 流量：未报告。
  fields:
  - deployment.online_evidence
  - deployment.ab_duration
  - deployment.ab_traffic
- key: caveats
  q_en: What should I keep in mind when reading the results of HAP?
  a_en: The 30% figure is the fraction of candidates routed within a request. The paper gives no traffic split for the production A/B. The 9 months refer to the period of full deployment at the time of the paper. The production A/B duration is unreported.
  q_zh: 读 HAP 的结果时要注意什么？
  a_zh: 30% 是单次请求内进入高容量模型的候选比例。论文未报告线上 A/B 的流量分配。 9 个月是论文撰写时的全量部署时长，线上 A/B 的时长未报告。
  fields:
  - caveats.0
  - caveats.1
- key: serving
  q_en: What serving latency, QPS, cost or hardware does HAP report?
  a_en: 'Serving latency: Comparable to the prior production model. Serving QPS: not reported. Inference cost: CPU usage 6% lower than the prior production model. Hardware: not reported.'
  q_zh: HAP 报告了怎样的服务延迟、QPS、成本和硬件？
  a_zh: 服务延迟：与此前的线上模型相当。 服务 QPS：未报告。 推理成本：CPU 用量比此前的线上模型低 6%。 硬件：未报告。
  fields:
  - deployment.serving_latency
  - deployment.serving_qps
  - deployment.inference_cost
  - deployment.hardware
- key: training
  q_en: How is HAP trained?
  a_en: 'Training mode: Joint optimization on request-level recommendation logs. Objectives: Groupwise contrastive losses over negatives of different difficulty; Contrastive loss over hard negatives for the expressive model; Auxiliary binary cross-entropy that also uses requests without clicks.'
  q_zh: HAP 是怎么训练的？
  a_zh: 训练方式：使用按请求记录的推荐日志联合优化。 训练目标：按负样本难度分组计算对比损失；高容量模型在困难负样本上计算对比损失；辅助二元交叉熵也利用无点击请求。
  fields:
  - training.mode
  - training.objectives
