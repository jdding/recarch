- key: stage
  q_en: Which stages of the pipeline does LEMUR cover?
  a_en: 'Ranking: RankMixer ranking backbone with jointly trained bidirectional query and document text transformers, an SQDC contrastive loss, a LONGER-style decoder over memory-bank multimodal sequences, and a cosine-similarity module.'
  q_zh: LEMUR 覆盖链路的哪些阶段？
  a_zh: 精排：RankMixer 排序骨干，联合训练的双向查询与文档文本 Transformer、SQDC 对比损失、读记忆库多模态序列的 LONGER 式解码器，以及余弦相似度模块。
