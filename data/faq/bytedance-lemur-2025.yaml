- key: what
  q_en: What is LEMUR, in one sentence?
  a_en: LEMUR trains ByteDance's multimodal encoders end to end with the Douyin Search ranker and serves history from a memory bank; a 14-day A/B cut the query change rate by 0.843% with offline QAUC +0.81%.
  q_zh: LEMUR 一句话是什么？
  a_zh: LEMUR 让字节的多模态编码器与抖音搜索排序器端到端联合训练，并用记忆库服务行为序列；14 天 A/B 查询改写率下降 0.843%，离线 QAUC +0.81%。
