- key: core
  q_en: What is the core idea of LEMUR?
  a_en: Train the multimodal encoders jointly with the ranker and serve history from a memory bank, removing the frozen two-stage pipeline.
  q_zh: LEMUR 的核心思路是什么？
  a_zh: 让多模态编码器与排序器联合训练并用记忆库服务历史序列，去掉冻结的两阶段管线。
