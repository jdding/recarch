- key: caveats
  q_en: What should I keep in mind when reading the results of LEMUR?
  a_en: The arXiv v2 text read is a preprint in a placeholder ACM template; the final CIKM 2026 text was not read. The online A/B reports no traffic share, bucket counts or user numbers, and the query change rate is a search-experience proxy, not the five-second watch CTR the model optimizes.
  q_zh: 读 LEMUR 的结果时要注意什么？
  a_zh: 所读 arXiv v2 是占位 ACM 模板的预印本；未读到 CIKM 2026 最终文本。 线上 A/B 未给流量占比、桶数或用户数，查询改写率是搜索体验代理指标，不是模型优化的五秒观看 CTR。
