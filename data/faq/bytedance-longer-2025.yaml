  - deployment.ab_traffic
- key: caveats
  q_en: What should I keep in mind when reading the results of LONGER?
  a_en: Offline benchmark is the paper's own Douyin Ads CVR dataset; baselines include DIN, TWIN, HSTU and a vanilla Transformer. The 'dozens of scenarios' deployment count is a paper claim without per-scenario breakdown.
  q_zh: 读 LONGER 的结果时要注意什么？
  a_zh: 离线基准是论文自己的抖音广告 CVR 数据集；基线包括 DIN、TWIN、HSTU 和普通 Transformer。 「dozens of scenarios」的部署数量是论文的说法，没有按场景拆分。
  fields:
  - caveats.0
  - caveats.1
- key: scale
  q_en: What scale does LONGER report?
  a_en: 'Sequence length: up to 10,000 behaviors, end-to-end. Offline dataset: 5.2B samples, 130 days (Douyin Ads CVR). Deployment: ''dozens'' of scenarios at ByteDance, billions of users (abstract).'
  q_zh: LONGER 报告了哪些规模信息？
  a_zh: 序列长度：最长 10,000 个行为，端到端。 离线数据集：5.2B 个样本，130 天，抖音广告 CVR。 部署：字节跳动的「dozens」个场景，数十亿用户，来自摘要。
  fields:
