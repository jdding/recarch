- key: what
  q_en: What is LONGER, in one sentence?
  a_en: Long-sequence transformer ranker modeling histories of up to 10,000 items; deployed in Douyin Ads and E-Commerce, e.g. Short Video ADSS +2.097%.
  q_zh: LONGER 一句话是什么？
  a_zh: 长序列 Transformer 排序模型，可建模最长 10,000 个 item 的历史；已部署在抖音广告和电商，例如短视频 ADSS +2.097%。
  fields:
  - tldr
- key: who
  q_en: Who built LONGER and where does it run?
  a_en: 'LONGER comes from ByteDance, 2025. Deployed in: Dozens of ByteDance advertising and e-commerce scenarios.'
  q_zh: LONGER 是谁做的，用在哪里？
  a_zh: LONGER 来自 字节跳动，2025 年。上线位置：字节跳动数十个广告和电商场景。
  fields:
  - company
  - year
  - deployed_in
- key: core
  q_en: What is the core idea of LONGER?
  a_en: Model user histories up to 10,000 items end-to-end with global tokens and token merging.
  q_zh: LONGER 的核心思路是什么？
  a_zh: 用全局 token 和 token 合并，端到端地建模最长 10,000 个 item 的用户历史。
  fields:
  - core_idea
- key: results
  q_en: What results does LONGER report?
  a_en: 'Douyin Ads A/B (ADSS / ADVV): Live Streaming +1.063% / +1.168%, Short Video +2.097% / +2.151%, Mall +1.816% / +1.407%. Douyin E-Commerce A/B also reported (Order/U etc.; not reproduced). Offline: +1.57% AUC over base on Douyin Ads CVR.'
  q_zh: LONGER 报告了哪些结果？
  a_zh: 抖音广告 A/B，指标为 ADSS 和 ADVV：直播 +1.063% 和 +1.168%，短视频 +2.097% 和 +2.151%，商城 +1.816% 和 +1.407%。论文还报告了抖音电商 A/B，指标为 Order/U 等，这里没有复现。离线：在抖音广告 CVR 上，AUC 比基础模型高 +1.57%。
  fields:
  - results_reported
- key: online
  q_en: Does LONGER have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: not reported. A/B traffic: not reported.'
  q_zh: LONGER 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：未报告。A/B 流量：未报告。
