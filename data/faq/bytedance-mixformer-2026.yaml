- key: core
  q_en: What is the core idea of MixFormer?
  a_en: One backbone mixes feature interaction and sequence modeling in a single parameter space.
  q_zh: MixFormer 的核心思路是什么？
  a_zh: 一个骨干在同一个参数空间里混合特征交互和序列建模。
  fields:
  - core_idea
- key: results
  q_en: What results does MixFormer report?
  a_en: 'Offline (Table 1, relative to TA to DLRM baseline AUC 0.8554 Finish / 0.8124 Skip): MixFormer-medium +1.28% Finish AUC, +1.60% Finish UAUC, +1.60% Skip AUC, +2.46% Skip UAUC with 1,226M dense params and 3,503 GFLOPs/batch; STCA to RankMixer +1.12% / +1.40% / +1.43% / +2.14% with 1,255M and 6,736 GFLOPs; UI-MixFormer-medium has the same accuracy at 2,242 GFLOPs (about 36% fewer FLOPs). Online A/B for two weeks vs the deployed STCA to RankMixer baseline per Table 2: Douyin overall Active Day +0.0415%, Duration +0.2799%, Like +0.1766%, Finish +0.3897%, Comment +0.7035%; Douyin Lite overall Active Day +0.0252%, Duration +0.4105%, Like +0.2125%, Finish +0.2924%, Comment +1.9097%. Paper states all are significant and not yet converged.'
  q_zh: MixFormer 报告了哪些结果？
  a_zh: 离线见表 1，相对 TA to DLRM 基线，基线的 AUC 为 Finish 0.8554、Skip 0.8124：MixFormer-medium 的 Finish AUC +1.28%，Finish UAUC +1.60%，Skip AUC +1.60%，Skip UAUC +2.46%，稠密参数 1,226M，每个 batch 3,503 GFLOPs；STCA to RankMixer 为 +1.12%、+1.40%、+1.43%、+2.14%，参数 1,255M，6,736 GFLOPs；UI-MixFormer-medium 精度相同，只需 2,242 GFLOPs，FLOPs 约减少 36%。两周线上 A/B，对比线上的 STCA to RankMixer 基线，见表 2：抖音整体活跃天数 +0.0415%，时长 +0.2799%，点赞 +0.1766%，完播 +0.3897%，评论 +0.7035%；抖音极速版整体活跃天数 +0.0252%，时长 +0.4105%，点赞 +0.2125%，完播 +0.2924%，评论 +1.9097%。论文称所有指标都显著，且尚未收敛。
  fields:
  - results_reported
