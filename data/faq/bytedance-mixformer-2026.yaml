- key: what
  q_en: What is MixFormer, in one sentence?
  a_en: Unified Transformer-style ranker co-scaling dense features and user sequences at Douyin; offline AUC above STCA to RankMixer; UI-decoupled variant cuts FLOPs ~36%; A/B on Douyin and Douyin Lite.
  q_zh: MixFormer 一句话是什么？
  a_zh: 抖音统一的 Transformer 风格排序模型，同步扩展稠密特征和用户序列；离线 AUC 高于 STCA to RankMixer；用户与 item 解耦的变体让 FLOPs 降低约 36%；已在抖音和抖音极速版做 A/B。
  fields:
  - tldr
