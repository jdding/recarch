- key: caveats
  q_en: What should I keep in mind when reading the results of MixFormer?
  a_en: Table 2 reports relative improvements only, with no confidence intervals, traffic share or launch status; the paper says A/B experiments were run, not that MixFormer replaced the production ranker. The offline dataset is Douyin-internal; the paper evaluates no public dataset.
  q_zh: 读 MixFormer 的结果时要注意什么？
  a_zh: 表 2 只报告相对提升，没有置信区间、流量占比或上线状态；论文说做了 A/B 实验，但没有说 MixFormer 已取代线上排序模型。 离线数据集是抖音内部的；论文没有在公开数据集上评估。
  fields:
  - caveats.0
  - caveats.1
- key: training
  q_en: How is MixFormer trained?
  a_en: 'Training mode: Offline training on Douyin logs in a hybrid framework, with the sparse part async on Adagrad and the dense part sync on RMSProp at lr 0.01. Objectives: CTR-style binary classification for Finish and Skip tasks (AUC, UAUC).'
  q_zh: MixFormer 是怎么训练的？
  a_zh: 训练方式：在抖音日志上以混合框架做离线训练，稀疏部分用 Adagrad 异步更新，稠密部分用 RMSProp 同步更新，lr 为 0.01。 训练目标：Finish 和 Skip 任务的 CTR 风格二分类，指标为 AUC 和 UAUC。
  fields:
  - training.mode
  - training.objectives
