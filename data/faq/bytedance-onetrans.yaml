- key: what
  q_en: What is OneTrans, in one sentence?
  a_en: OneTrans-GSR generates the final mixed-content slate in one decoder. Against the production cascade, GMV per user rose 2.63% and latency across reranking and mix-ranking fell 13%.
  q_zh: OneTrans 一句话是什么？
  a_zh: OneTrans-GSR 用一个解码器生成混合内容的最终曝光列表。与线上级联相比，人均 GMV 提升 2.63%，重排与混排的合计延迟下降 13%。
  fields:
  - tldr
- key: who
  q_en: Who built OneTrans and where does it run?
  a_en: 'OneTrans comes from ByteDance, 2025. Deployed in: ByteDance e-commerce reranking and mix-ranking.'
  q_zh: OneTrans 是谁做的，用在哪里？
  a_zh: OneTrans 来自 字节跳动，2025 年。上线位置：字节跳动电商推荐的重排与混排。
  fields:
  - company
  - year
  - deployed_in
- key: core
  q_en: What is the core idea of OneTrans?
  a_en: Use one autoregressive policy to choose and order a mixed-content slate under business constraints.
  q_zh: OneTrans 的核心思路是什么？
  a_zh: 用一个自回归策略在业务约束下挑选候选，并排出混合内容的曝光列表。
  fields:
  - core_idea
- key: results
  q_en: What results does OneTrans report?
  a_en: Section 6.7 and Table 11 report a one-week account-randomized A/B test, with eligible traffic split equally across arms. Against the deployed Generator–Evaluator cascade, OneTrans-GSR raised GMV per user 2.63%, advertiser value 2.06% and repurchase rate 2.03%. Repurchase was read after a 14-day observation window. End-to-end latency across reranking and mix-ranking fell 13%.
  q_zh: OneTrans 报告了哪些结果？
  a_zh: 第 6.7 节和表 11 报告了一周按账号随机分组的线上 A/B，符合条件的流量在两组间等分。相对线上 Generator–Evaluator 级联，OneTrans-GSR 的人均 GMV 提升 2.63%，广告主价值提升 2.06%，复购率提升 2.03%。复购率在 14 天观察窗口结束后统计。重排和混排的端到端延迟下降 13%。
  fields:
  - results_reported
- key: online
  q_en: Does OneTrans have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: One week. A/B traffic: Equal shares of eligible traffic, randomized at the account level.'
  q_zh: OneTrans 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：一周。A/B 流量：按账号随机分组，符合条件的流量在两组间等分。
  fields:
  - deployment.online_evidence
  - deployment.ab_duration
  - deployment.ab_traffic
- key: caveats
  q_en: What should I keep in mind when reading the results of OneTrans?
  a_en: The A/B compares a complete replacement of reranking and mix-ranking. Retrieval, fine ranking and the business rule set were held fixed. The latency change covers reranking and mix-ranking. Table 10 measures the decoder path separately.
  q_zh: 读 OneTrans 的结果时要注意什么？
  a_zh: A/B 评估整体替换重排和混排的效果。召回、精排与业务规则保持一致。 延迟降幅覆盖重排和混排两段。表 10 单独测量解码器路径。
  fields:
  - caveats.0
  - caveats.1
