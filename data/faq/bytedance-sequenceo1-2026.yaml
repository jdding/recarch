- key: core
  q_en: What is the core idea of SequenceO1?
  a_en: Compress up to 100K history events into a fixed-size sketch, then attend over the sketch.
  q_zh: SequenceO1 的核心思路是什么？
  a_zh: 把最多 100K 个历史事件压缩成定长 sketch，再对 sketch 做注意力。
  fields:
