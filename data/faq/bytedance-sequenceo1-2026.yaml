- key: caveats
  q_en: What should I keep in mind when reading the results of SequenceO1?
  a_en: The online baseline is ByteDance's own STCA 10K + TWIN V2 production ranker, so gains are specific to that stack. Reported FLOP reductions are analytical under the observed cache-hit rates (0.5 training, 0.6 serving); no measured latency or throughput numbers are given.
  q_zh: 读 SequenceO1 的结果时要注意什么？
  a_zh: 线上基线是字节跳动自己的 STCA 10K + TWIN V2 线上排序模型，因此提升只适用于这套链路。 报告的 FLOPs 降低是在观测到的缓存命中率下，即训练 0.5，在线 0.6，分析推算出来的；没有给出实测的延迟或吞吐数字。
  fields:
  - caveats.0
  - caveats.1
