- key: inputs
  q_en: What inputs does SequenceO1 use?
  a_en: 'Input signals: User interaction history up to 100K events, with item embeddings fused with action-type embeddings by a SwiGLU; Recent 10K suffix as a separate branch; Target and candidate item features, user/request and non-sequential dense features.'
  q_zh: SequenceO1 用了哪些输入？
  a_zh: 输入特征：最多 100K 个事件的用户交互历史，item embedding 与行为类型 embedding 通过 SwiGLU 融合；最近的 10K 后缀，作为单独的分支；目标和候选 item 特征，用户和请求特征，以及非序列稠密特征。
  fields:
