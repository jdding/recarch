- key: results
  q_en: What results does SequenceO1 report?
  a_en: 'Online one-month A/B on Douyin and Douyin Lite replacing TWIN V2 in the STCA 10K baseline (all significant). Douyin overall: 30-Day Activeness +0.1968%, Duration +1.4999%, Finish +2.3256%, Comment +3.5910%, Like +2.3617%, Dislike -6.9829%. Douyin Lite overall: Activeness +0.2335%, Duration +1.6655%, Finish +3.4872%, Comment +8.6132%, Like +2.9399%, Dislike -5.9972%. Offline production setting vs STCA 10K + TWIN V2: Finish AUC +0.29% (UAUC +0.40%), Skip AUC +0.23%, Share UAUC +0.94%, Favourite UAUC +1.47%. Ablation (Finish AUC over STCA(512)): SA +1.07% vs KMeans clustering +0.30%, chunk mean pooling +0.46%, position-bucket queries +0.72%, Lightning-Attention +0.83%, recent-behavior query init +0.78%; directly scaled STCA +1.29%, so SA retains 83%. FLOPs of the ultra-long branch at 100K are 49.9x (training, hit 0.5, R=40) and 63.9x (inference, hit 0.6, R=300) below direct STCA.'
  q_zh: SequenceO1 报告了哪些结果？
  a_zh: 抖音和抖音极速版上，在 STCA 10K 基线中替换 TWIN V2，做一个月线上 A/B，全部显著。抖音整体：30 日活跃度 +0.1968%，时长 +1.4999%，Finish +2.3256%，评论 +3.5910%，点赞 +2.3617%，不喜欢 -6.9829%。抖音极速版整体：活跃度 +0.2335%，时长 +1.6655%，Finish +3.4872%，评论 +8.6132%，点赞 +2.9399%，不喜欢 -5.9972%。线上设置下的离线结果，对比 STCA 10K + TWIN V2：Finish AUC +0.29%，其 UAUC +0.40%，Skip AUC +0.23%，Share UAUC +0.94%，Favourite UAUC +1.47%。消融实验，指标为相对 STCA-512 的 Finish AUC：SA +1.07%，KMeans 聚类 +0.30%，分块均值池化 +0.46%，位置分桶 query +0.72%，Lightning-Attention +0.83%，用最近行为初始化 query +0.78%；直接扩展 STCA 为 +1.29%，因此 SA 保留了 83%。100K 下超长分支的 FLOPs 比直接用 STCA 低 49.9x，即训练，命中率 0.5，R=40，以及 63.9x，即推理，命中率 0.6，R=300。
  fields:
  - results_reported
