- key: what
  q_en: What is SequenceO1, in one sentence?
  a_en: 'Douyin''s fine-ranker compresses 100K behaviors into a cacheable fixed-size sketch with Sketch Attention, plus STCA over a recent 10K; replaces TWIN V2; 1-month A/B: Finish +2.33%, Duration +1.5%.'
  q_zh: SequenceO1 一句话是什么？
  a_zh: 抖音精排模型用 Sketch Attention 把 100K 个行为压缩成可缓存的定长 sketch，再对最近 10K 个行为做 STCA；取代 TWIN V2；1 个月 A/B：Finish +2.33%，时长 +1.5%。
