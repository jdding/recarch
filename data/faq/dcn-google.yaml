- key: what
  q_en: What is DCN, in one sentence?
  a_en: DCN-V2 replaces the cross vector with a full weight matrix and adds a low-rank mixture variant called DCN-Mix that is 30% cheaper; best on Criteo with AUC 0.8115 and on MovieLens-1M.
  q_zh: DCN 一句话是什么？
  a_zh: DCN-V2 把 cross 向量换成完整的权重矩阵，并增加一个叫 DCN-Mix 的低秩混合变体，成本低 30%；在 Criteo 上 AUC 为 0.8115，在 MovieLens-1M 上也最好。
  fields:
  - tldr
