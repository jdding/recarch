- key: core
  q_en: What is the core idea of DCN?
  a_en: Replace the cross vector with a full weight matrix, plus a low-rank mixture variant to cut cost.
  q_zh: DCN 的核心思路是什么？
  a_zh: 把 cross 向量换成完整的权重矩阵，并加一个低秩混合变体来降低成本。
