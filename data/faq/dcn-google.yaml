- key: results
  q_en: What results does DCN report?
  a_en: 'Criteo test per Table 6, LogLoss / AUC: DCN-V2 0.4406 / 0.8115; DCN-Mix 0.4408 / 0.8112 with 30% lower cost (2.4M vs 3.5M params); CrossNet 0.4413 / 0.8107; DCN 0.4420 / 0.8099; DNN 0.4421 / 0.8098; DeepFM 0.4420 / 0.8099; DLRM 0.4427 / 0.8092; AutoInt+ 0.4420 / 0.8101; xDeepFM 0.4421 / 0.8099 (about 10 times the FLOPS). The paper treats 0.001 on Criteo as significant. MovieLens-1M: DCN-V2 0.3170 / 0.8950, DCN-Mix 0.3160 / 0.8964, DCN 0.3197 / 0.8935. Synthetic polynomial fitting per Table 1: on f3, DCN-V2 RMSE 6.7E-07 vs DCN 2.6 and a large DNN 7.8E-02. Fixed-memory comparison per Table 7: CrossNet beats DNN at every size, for example 2.6E+06 params LogLoss 0.4415 vs 0.4423. Production per Sec 8: 0.6% AUCLoss (1 - AUC) improvement over the production MLP, where 0.1% is considered significant, plus significant gains in online business metrics, unnamed; Table 8 relative AUCLoss vs same-sized ReLU layers: 1-layer DCN-V2 -0.19%, 2-layer DCN-V2 -0.45% (2-layer ReLU -0.15%).'
  q_zh: DCN 报告了哪些结果？
  a_zh: Criteo 测试集，见表 6，格式为 LogLoss / AUC：DCN-V2 0.4406 / 0.8115；DCN-Mix 0.4408 / 0.8112，成本低 30%，参数 2.4M 对比 3.5M；CrossNet 0.4413 / 0.8107；DCN 0.4420 / 0.8099；DNN 0.4421 / 0.8098；DeepFM 0.4420 / 0.8099；DLRM 0.4427 / 0.8092；AutoInt+ 0.4420 / 0.8101；xDeepFM 0.4421 / 0.8099，FLOPS 约为 10 倍。论文认为 Criteo 上 0.001 就算显著。MovieLens-1M：DCN-V2 0.3170 / 0.8950，DCN-Mix 0.3160 / 0.8964，DCN 0.3197 / 0.8935。合成多项式拟合，见表 1：在 f3 上，DCN-V2 的 RMSE 为 6.7E-07，DCN 为 2.6，大型 DNN 为 7.8E-02。固定内存的对比，见表 7：CrossNet 在每种规模下都优于 DNN，例如参数 2.6E+06 时 LogLoss 为 0.4415，对比 0.4423。线上结果，见第 8 节：相比线上的 MLP，AUCLoss 即 1 - AUC 提升 0.6%，其中 0.1% 就被视为显著，另有显著的线上业务指标提升，未具名；表 8 相对同样大小 ReLU 层的 AUCLoss：1 层 DCN-V2 为 -0.19%，2 层 DCN-V2 为 -0.45%，2 层 ReLU 为 -0.15%。
  fields:
