- key: training
  q_en: How is DCN trained?
  a_en: 'Training mode: Benchmarks: TensorFlow v1, Adam, batch size 512 (128 for MovieLens), He normal init, gradient clipping norm 10, EMA 0.9999; 5 runs per best configuration. Production: sampled user logs of hundreds of billions of training examples. Objectives: log loss on clicks.'
  q_zh: DCN 是怎么训练的？
  a_zh: 训练方式：基准实验：TensorFlow v1，Adam，batch size 512，MovieLens 为 128，He normal 初始化，梯度裁剪范数 10，EMA 0.9999；每个最佳配置跑 5 次。线上：用户日志采样得到的数千亿个训练样本。 训练目标：点击上的 log loss。
