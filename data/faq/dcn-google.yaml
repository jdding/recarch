- key: caveats
  q_en: What should I keep in mind when reading the results of DCN?
  a_en: The production system, product and online metrics are not named; no online numbers are given, only a 0.6% offline AUCLoss gain. The paper says DNN performance on Criteo is neck to neck with most baselines once tuned, and that the cross-network advantage is more pronounced on synthetic data than on Criteo.
  q_zh: 读 DCN 的结果时要注意什么？
  a_zh: 论文没有说明线上系统、产品和线上指标；没有给出线上数字，只有离线 AUCLoss 提升 0.6%。 论文称调优之后，DNN 在 Criteo 上与多数基线不相上下，cross network 的优势在合成数据上比在 Criteo 上更明显。
