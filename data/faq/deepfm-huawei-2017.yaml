- key: what
  q_en: What is DeepFM, in one sentence?
  a_en: DeepFM swaps Wide & Deep's hand-crafted wide part for a factorization machine sharing embeddings with the deep part, beating Wide&Deep, LR and FM on Criteo.
  q_zh: DeepFM 一句话是什么？
  a_zh: DeepFM 把 Wide & Deep 手工设计的 wide 部分换成与 deep 部分共享 embedding 的因子分解机，在 Criteo 上优于 Wide&Deep、LR 和 FM。
  fields:
  - tldr
- key: who
  q_en: Who built DeepFM and where does it run?
  a_en: 'DeepFM comes from Huawei Noah''s Ark Lab, 2017. Deployed in: Evaluated offline on Criteo and a Huawei App Store game-center log.'
  q_zh: DeepFM 是谁做的，用在哪里？
  a_zh: DeepFM 来自 华为诺亚方舟实验室，2017 年。上线位置：在 Criteo 和华为应用商店游戏中心的日志上做离线评估。
  fields:
  - company
  - year
  - deployed_in
- key: core
  q_en: What is the core idea of DeepFM?
  a_en: Share embeddings between a factorization machine and a deep part, with no feature engineering.
  q_zh: DeepFM 的核心思路是什么？
  a_zh: 让因子分解机和 deep 部分共享 embedding，不需要特征工程。
  fields:
  - core_idea
