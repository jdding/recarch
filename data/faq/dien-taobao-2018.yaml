- key: what
  q_en: What is DIEN, in one sentence?
  a_en: 'DIEN models how user interest evolves over the behavior sequence with an auxiliary-loss GRU; Taobao display ads A/B: CTR +20.7%, eCPM +17.1% over the base model.'
  q_zh: DIEN 一句话是什么？
  a_zh: DIEN 用带辅助损失的 GRU 建模用户兴趣在行为序列上如何演化；淘宝展示广告 A/B：相比基础模型，CTR +20.7%，eCPM +17.1%。
  fields:
  - tldr
