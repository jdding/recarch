- key: caveats
  q_en: What should I keep in mind when reading the results of DIEN?
  a_en: The online DIN number here (+8.9% CTR) differs from the DIN paper's 'up to 10.0%' because baselines and periods differ. Alibaba authors; the paper names Taobao display advertising as the deployment.
  q_zh: 读 DIEN 的结果时要注意什么？
  a_zh: 这里的线上 DIN 数字 +8.9% CTR，与 DIN 论文的「up to 10.0%」不同，因为基线和时间段不同。 作者来自阿里巴巴；论文把淘宝展示广告作为部署场景。
