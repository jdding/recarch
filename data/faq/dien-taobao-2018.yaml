  q_en: Who built DIEN and where does it run?
  a_en: 'DIEN comes from Alibaba / Taobao, 2018. Deployed in: Taobao display advertising.'
  q_zh: DIEN 是谁做的，用在哪里？
  a_zh: DIEN 来自 阿里巴巴 / 淘宝，2018 年。上线位置：淘宝展示广告。
