- key: core
  q_en: What is the core idea of DIEN?
  a_en: Model how user interest evolves with an auxiliary loss and an attentional GRU.
  q_zh: DIEN 的核心思路是什么？
  a_zh: 用辅助损失和带注意力的 GRU 建模用户兴趣如何演化。
  fields:
  - core_idea
- key: results
  q_en: What results does DIEN report?
  a_en: 'Online A/B in Taobao display advertising from 2018-06-07 to 2018-07-12 (Table 5, vs BaseModel): DIEN CTR +20.7%, PPC -3.0%, eCPM +17.1%; DIN in the same table +8.9% CTR, -2.0% PPC, +6.7% eCPM. Offline AUC on the industrial dataset per Table 3: BaseModel 0.6350, Wide&Deep 0.6362, PNN 0.6353, DIN 0.6428, two-layer GRU attention 0.6457, BaseModel+GRU+AUGRU 0.6493, DIEN 0.6541. Public sets (Table 2, Electronics / Books): DIEN 0.7792 / 0.8453 vs DIN 0.7603 / 0.7880.'
  q_zh: DIEN 报告了哪些结果？
  a_zh: 2018-06-07 至 2018-07-12，淘宝展示广告的线上 A/B，见表 5，对比 BaseModel：DIEN 的 CTR +20.7%，PPC -3.0%，eCPM +17.1%；同一张表中的 DIN 为 CTR +8.9%，PPC -2.0%，eCPM +6.7%。工业数据集上的离线 AUC，见表 3：BaseModel 0.6350，Wide&Deep 0.6362，PNN 0.6353，DIN 0.6428，两层 GRU attention 0.6457，BaseModel+GRU+AUGRU 0.6493，DIEN 0.6541。公开数据集，见表 2，Electronics / Books：DIEN 为 0.7792 / 0.8453，DIN 为 0.7603 / 0.7880。
  fields:
  - results_reported
- key: online
  q_en: Does DIEN have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: 2018-06-07 to 2018-07-12. A/B traffic: not reported.'
  q_zh: DIEN 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：2018-06-07 to 2018-07-12。A/B 流量：未报告。
