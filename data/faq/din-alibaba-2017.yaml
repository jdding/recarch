- key: what
  q_en: What is DIN, in one sentence?
  a_en: DIN weights each past behavior by its relevance to the candidate ad through a local activation unit; deployed in Alibaba display ads with up to +10.0% CTR in an online A/B.
  q_zh: DIN 一句话是什么？
  a_zh: DIN 通过局部激活单元，按每个历史行为与候选广告的相关性加权；已部署在阿里巴巴展示广告中，线上 A/B 里 CTR 最高提升 +10.0%。
  fields:
  - tldr
