- key: caveats
  q_en: What should I keep in mind when reading the results of DIN?
  a_en: '''Up to 10.0% CTR'' is the paper''s phrasing; the paper''s footnote says ads are ranked by CTR^alpha x bid price with alpha > 1.0. Absolute AUCs on the Alibaba dataset are low (about 0.60) because the metric is user-weighted over many near-identical impressions.'
  q_zh: 读 DIN 的结果时要注意什么？
  a_zh: 「CTR 最高提升 10.0%」是论文原话；论文脚注说明，广告按 CTR^alpha x 出价排序，其中 alpha > 1.0。 阿里巴巴数据集上的绝对 AUC 偏低，约 0.60，因为该指标按用户加权，而且有大量几乎相同的曝光。
  fields:
  - caveats.0
  - caveats.1
