- key: results
  q_en: What results does DIN report?
  a_en: 'Online A/B in Alibaba display advertising from 2017-05 to 2017-06 (about a month): DIN with the proposed regularizer and activation contributes up to +10.0% CTR and +3.8% RPM over BaseModel, the previous online model; DIN now serves the main traffic. Offline on Alibaba dataset per Table 5: DIN 0.6029 AUC (+6.08% RelaImpr over BaseModel); with MBA regularization and Dice 0.6083 (+11.65%, +0.0113 absolute AUC); about 0.009 absolute AUC over DeepFM. Amazon Electro per Table 3: DIN 0.8818, with Dice 0.8871 vs BaseModel 0.8624.'
  q_zh: DIN 报告了哪些结果？
  a_zh: 阿里巴巴展示广告线上 A/B，2017-05 到 2017-06，约一个月：采用所提正则和激活函数的 DIN，相比此前的线上模型 BaseModel，CTR 最高提升 +10.0%，RPM 最高提升 +3.8%；DIN 现已承接主流量。离线结果见阿里巴巴数据集上的表 5：DIN 的 AUC 为 0.6029，相对 BaseModel 的 RelaImpr 为 +6.08%；加上 MBA 正则和 Dice 后 AUC 为 0.6083，RelaImpr 为 +11.65%，绝对 AUC 提升 +0.0113；相比 DeepFM，绝对 AUC 约高 0.009。Amazon Electro 见表 3：DIN 为 0.8818，加 Dice 后为 0.8871，BaseModel 为 0.8624。
  fields:
  - results_reported
