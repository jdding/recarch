- key: core
  q_en: What is the core idea of DSSM?
  a_en: Project query and document into one semantic space with DNNs over letter-trigram word hashing, and train on clickthrough data to rank clicked documents highest.
  q_zh: DSSM 的核心思路是什么？
  a_zh: 用基于字母 trigram 词哈希的 DNN 把查询和文档投影到同一个语义空间，并在点击数据上训练，让被点击的文档排在最前。
  fields:
  - core_idea
- key: results
  q_en: What results does DSSM report?
  a_en: 'Offline NDCG at 1, 3 and 10 on 16,510 queries with 2-fold cross validation and paired t-tests at p < 0.05. L-WH DNN, the best DSSM, scores 0.362, 0.425 and 0.498. Baselines: TF-IDF 0.319, 0.382, 0.462; BM25 0.308, 0.373, 0.455; word translation model 0.332, 0.400, 0.478; LSA 0.298, 0.372, 0.455; PLSA 0.295, 0.371, 0.456; DAE 0.310, 0.377, 0.459; BLTM-PR 0.337, 0.403, 0.480; DPM 0.329, 0.401, 0.479. DSSM variants: DNN without word hashing on a 40K vocabulary 0.342, 0.410, 0.486; L-WH linear 0.357, 0.422, 0.495; L-WH non-linear 0.357, 0.421, 0.494. The paper states a margin of 2.5-4.3% in NDCG@1 over the competing methods, 3.2 points in NDCG@1 for supervised DNN over DAE with the same 40K vocabulary, and 0.4-0.5 point from raising non-linear layers from one to three.'
  q_zh: DSSM 报告了哪些结果？
  a_zh: 在 16,510 条查询上的离线 NDCG@1、3、10，采用 2 折交叉验证和 p < 0.05 的配对 t 检验。最佳的 DSSM 即 L-WH DNN 得分为 0.362、0.425 和 0.498。基线：TF-IDF 0.319、0.382、0.462；BM25 0.308、0.373、0.455；词翻译模型 0.332、0.400、0.478；LSA 0.298、0.372、0.455；PLSA 0.295、0.371、0.456；DAE 0.310、0.377、0.459；BLTM-PR 0.337、0.403、0.480；DPM 0.329、0.401、0.479。DSSM 的各个变体：不用词哈希、40K 词表的 DNN 为 0.342、0.410、0.486；L-WH linear 为 0.357、0.422、0.495；L-WH non-linear 为 0.357、0.421、0.494。论文给出的结论是：NDCG@1 上比其他方法领先 2.5-4.3%，同样 40K 词表下有监督 DNN 比 DAE 高 3.2 个点，非线性层从一层增加到三层带来 0.4-0.5 个点。
  fields:
