items:
- key: what
  q_en: What is DSSM, in one sentence?
  a_en: DSSM runs a query and a document through the same kind of DNN over letter-trigram word hashing, scores them by cosine and trains on clicks; NDCG@1 is 0.362 against 0.319 for TF-IDF.
  q_zh: DSSM 一句话是什么？
  a_zh: DSSM 让查询和文档各自经过同类 DNN，输入是字母 trigram 词哈希，用余弦打分并在点击数据上训练；NDCG@1 为 0.362，TF-IDF 为 0.319。
  fields:
  - tldr
