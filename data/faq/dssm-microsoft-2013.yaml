- key: caveats
  q_en: What should I keep in mind when reading the results of DSSM?
  a_en: 'Offline evaluation only: the paper reports no A/B test and makes no production deployment claim, and the authors name a commercial search engine without saying whether DSSM served traffic; it is admitted through the exemption for papers cited 500 or more times. Documents are represented by their titles only, and the evaluation set is assumed to contain only new or tail URLs without click information, so the setting is narrower than full web ranking.'
  q_zh: 读 DSSM 的结果时要注意什么？
  a_zh: 只有离线评估：论文没有 A/B 测试，也没有生产部署声明，作者只写了某个商业搜索引擎，没有说 DSSM 是否承接过流量；它是靠被引 500 次以上的例外准入的。 文档只用标题表示，而且评估集假设只含没有点击信息的新 URL 或长尾 URL，所以设定比完整的网页排序窄。
  fields:
  - caveats.0
  - caveats.1
- key: inputs
  q_en: What inputs does DSSM use?
  a_en: 'IDs and tokenization: Letter-trigram word hashing, a fixed linear layer over a bag of letter n-grams. Input signals: Raw term counts of the query and of the document title, passed through letter-trigram word hashing; Query-title pairs from clickthrough logs as the only supervision.'
  q_zh: DSSM 用了哪些输入？
  a_zh: ID 与 token 化：字母 trigram 词哈希，即作用在字母 n-gram 词袋上的固定线性层。 输入特征：查询和文档标题的原始词计数，送入字母 trigram 词哈希；点击日志里的查询和标题对，是唯一的监督信号。
  fields:
