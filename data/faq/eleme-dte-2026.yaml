- key: caveats
  q_en: What should I keep in mind when reading the results of DTE?
  a_en: Table 2 labels BST+ALiBi the production baseline offline; the online A/B baseline is described only as the production baseline, and the paper does not say the two are identical. Efficiency figures are offline inference latency under the paper setup; serving cost appears only as the +0.3% average latency change, and serving QPS and hardware are not reported.
  q_zh: 读 DTE 的结果时要注意什么？
  a_zh: 离线表 2 把 BST+ALiBi 标为生产基线；线上 A/B 只说对照是生产基线，论文没说两者是同一个。 效率数字是论文设置下的离线推理延迟；服务成本只以 +0.3% 平均延迟变化呈现，未报告服务 QPS 和硬件。
  fields:
  - caveats.0
  - caveats.1
- key: inputs
  q_en: What inputs does DTE use?
  a_en: 'IDs and tokenization: Plain item ID embeddings; no semantic IDs and no item tokenizer. Input signals: Interaction timestamps: time gap to the current prediction, hour of day and weekday, as temporal primitives; Target-side traffic statistics per time segment, previous-day value and 30-day historical average, for the burst term; Average-pooled user history embedding, the input of the gating MLP that personalizes the temporal mixture.'
  q_zh: DTE 用了哪些输入？
  a_zh: ID 与 token 化：普通物品 ID 嵌入；无 Semantic ID，也无物品 tokenizer。 输入特征：交互时间戳：距当前预测的时间间隔、小时内时刻和星期几，作为时间基元；按时间段的目标侧流量统计：前一日取值和 30 天历史均值，用于突发项；用户历史平均池化嵌入，是门控 MLP 的输入，用于个性化时间混合权重。
  fields:
  - id_tokenization.approach
  - features_signals.0
  - features_signals.1
  - features_signals.2
