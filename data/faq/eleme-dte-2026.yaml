- key: core
  q_en: What is the core idea of DTE?
  a_en: Encode user-adaptive temporal rhythms into item embeddings and gate a relative-order bias by time gap, giving a generative ranker both signals for 238 extra parameters.
  q_zh: DTE 的核心思路是什么？
  a_zh: 把用户自适应的时间节律编码进物品嵌入，并按时间间隔门控相对顺序偏置，让生成式排序器以 238 个额外参数同时获得两类信号。
  fields:
  - core_idea
- key: results
  q_en: What results does DTE report?
  a_en: 'Offline on the industrial Shangou dataset DTE reaches GAUC 0.7098 and Logloss 0.2578, against 0.6982 and 0.2589 for BST+ALiBi, which Table 2 labels the production baseline, and 0.6978 for RAB, Table 2; on KuaiRand it reaches GAUC 0.9243 and Logloss 0.2972 against 0.9113 for RAB. Ablation on the industrial dataset, Table 3: removing the macro module drops GAUC to 0.6852, the micro module to 0.7006, recency to 0.6991, periodicity to 0.6975, the burst term to 0.7017 and the soft gate to 0.6987. Overhead, Table 4: DTE adds 238 parameters, 0.47 KB in FP16, with offline inference latency 3.02 ms, against 256 parameters and 3.09 ms for RAB, 9600 parameters and 3.18 ms for BST, and 327680 parameters and 3.76 ms for TiSASRec. A three-week online A/B with 20% treatment and 20% control user buckets reports CTR +1.8% and RPM +3.0% over the production baseline, significant at p < 0.01 with two-sided tests, while average serving latency rose +0.3% from 15.4 ms to 15.5 ms. DTE was then rolled out to 100% of the Shangou advertisement recommendation traffic in the Taobao App in January 2026, and no systematic regression was observed after the rollout.'
  q_zh: DTE 报告了哪些结果？
  a_zh: 工业闪购数据集离线结果，DTE 达到 GAUC 0.7098、Logloss 0.2578，表 2 标为生产基线的 BST+ALiBi 为 0.6982 和 0.2589，RAB 为 0.6978，见表 2；KuaiRand 上 DTE 达到 GAUC 0.9243、Logloss 0.2972，RAB 为 0.9113。工业数据集消融，表 3：去掉宏观模块 GAUC 降到 0.6852，去掉微观模块到 0.7006，去掉近因到 0.6991，去掉周期到 0.6975，去掉突发项到 0.7017，去掉软门控到 0.6987。开销，表 4：DTE 增加 238 个参数、FP16 下 0.47 KB，离线推理延迟 3.02 ms；RAB 为 256 个参数、3.09 ms，BST 为 9600 个参数、3.18 ms，TiSASRec 为 327680 个参数、3.76 ms。20% 实验桶加 20% 对照桶的三周线上 A/B 报告 CTR +1.8%、RPM +3.0%，优于生产基线，双侧检验 p < 0.01 显著，平均服务延迟 +0.3%，从 15.4 ms 升到 15.5 ms。随后 DTE 于 2026 年一月在淘宝 App 闪购广告推荐流量上 100% 上线，上线后未观察到系统性回退。
  fields:
  - results_reported
- key: online
  q_en: Does DTE have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: Three weeks, covering multiple complete weekly cycles. A/B traffic: User-level randomization with a 20% treatment bucket and a 20% control bucket under the same serving pipeline.'
  q_zh: DTE 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：三周，覆盖多个完整周周期。A/B 流量：用户级随机化，同一服务管线下 20% 实验桶加 20% 对照桶。
