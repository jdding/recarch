items:
- key: what
  q_en: What is DTE, in one sentence?
  a_en: DTE splits time in a generative ranker into user-adaptive rhythms and a dense-order gate; a three-week Shangou A/B shows CTR +1.8% and RPM +3.0% with +0.3% latency.
  q_zh: DTE 一句话是什么？
  a_zh: DTE 把生成式排序器里的时间拆成用户自适应节律和密集顺序门控；三周闪购 A/B 显示 CTR +1.8%、RPM +3.0%，延迟 +0.3%。
  fields:
  - tldr
- key: who
  q_en: Who built DTE and where does it run?
  a_en: 'DTE comes from Ele.me / Taobao Shangou, 2026. Deployed in: Shangou advertisement ranking in the Taobao App, full traffic since January 2026.'
  q_zh: DTE 是谁做的，用在哪里？
  a_zh: DTE 来自 饿了么 / 淘宝闪购，2026 年。上线位置：淘宝 App 闪购广告排序，自 2026 年一月起全量流量。
