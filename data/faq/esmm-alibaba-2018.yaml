- key: stage
  q_en: Which stages of the pipeline does ESMM cover?
  a_en: 'Ranking: ESMM: shared embedding layer feeding a CVR tower and a CTR tower (both Embedding&MLP); loss = CTR loss + CTCVR loss over all impressions, no direct CVR loss.'
  q_zh: ESMM 覆盖链路的哪些阶段？
  a_zh: 精排：ESMM：共享 embedding 层，同时供给 CVR 塔和 CTR 塔，两个塔都是 Embedding&MLP；损失 = CTR 损失 + CTCVR 损失，都在全部曝光上计算，没有直接的 CVR 损失。
  fields:
  - stages.0
