items:
- key: what
  q_en: What is ESMM, in one sentence?
  a_en: ESMM trains CTR and CTCVR over the entire impression space so conversion rate is estimated without sample-selection bias; public-data CVR AUC 68.56 vs 66.00 baseline.
  q_zh: ESMM 一句话是什么？
  a_zh: ESMM 在整个曝光空间上训练 CTR 和 CTCVR，从而在没有样本选择偏差的情况下估计转化率；公开数据上 CVR AUC 为 68.56，对比基线 66.00。
  fields:
  - tldr
- key: who
  q_en: Who built ESMM and where does it run?
  a_en: 'ESMM comes from Alibaba, 2018. Deployed in: Post-click CVR estimation on Taobao recommender data, evaluated offline.'
  q_zh: ESMM 是谁做的，用在哪里？
  a_zh: ESMM 来自 阿里巴巴，2018 年。上线位置：淘宝推荐数据上的点击后 CVR 预估，离线评估。
  fields:
  - company
  - year
  - deployed_in
- key: core
  q_en: What is the core idea of ESMM?
  a_en: Train CTR and CTCVR over the entire space with a shared embedding table, and derive CVR from them.
  q_zh: ESMM 的核心思路是什么？
  a_zh: 用共享 embedding 表在整个空间上训练 CTR 和 CTCVR，再由它们推导 CVR。
  fields:
  - core_idea
- key: results
  q_en: What results does ESMM report?
  a_en: 'Public Dataset AUC (CVR / CTCVR): BASE 66.00 / 62.07; OVERSAMPLING 67.18 / 63.05; UNBIAS 66.65 / 63.56; DIVISION 67.56 / 63.62; ESMM-NS 68.25 / 64.44; ESMM 68.56 / 65.32 (+2.56 and +3.25 absolute over BASE). Product Dataset trained on the whole data: ESMM +2.18% absolute AUC on CVR and +2.32% on CTCVR over BASE, which the paper says is the latest model serving the main traffic in its real system; the paper calls a 0.1% AUC gain remarkable.'
  q_zh: ESMM 报告了哪些结果？
  a_zh: Public Dataset 的 AUC，格式为 CVR / CTCVR：BASE 66.00 / 62.07；OVERSAMPLING 67.18 / 63.05；UNBIAS 66.65 / 63.56；DIVISION 67.56 / 63.62；ESMM-NS 68.25 / 64.44；ESMM 68.56 / 65.32，相比 BASE 绝对提升 +2.56 和 +3.25。在完整数据上训练的 Product Dataset：相比 BASE，ESMM 在 CVR 上 AUC 绝对提升 +2.18%，在 CTCVR 上提升 +2.32%，论文称 BASE 是其真实系统中承担主要流量的最新模型；论文认为 0.1% 的 AUC 提升就很可观。
  fields:
  - results_reported
- key: online
  q_en: Does ESMM have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Deployed, no online results. A/B duration: not reported. A/B traffic: not reported.'
  q_zh: ESMM 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：已部署，无线上结果。A/B 时长：未报告。A/B 流量：未报告。
  fields:
  - deployment.online_evidence
  - deployment.ab_duration
  - deployment.ab_traffic
- key: caveats
  q_en: What should I keep in mind when reading the results of ESMM?
  a_en: Offline AUC only; the paper does not report an online A/B test or state that ESMM was deployed, so evidence stays research_only here. The paper says the BASE model serves main traffic; it is the baseline, not ESMM.
  q_zh: 读 ESMM 的结果时要注意什么？
  a_zh: 只有离线 AUC；论文没有报告线上 A/B 测试，也没有说明 ESMM 已部署，所以这里证据仍为 research_only。 论文称 BASE 模型承担主要流量；它是基线，不是 ESMM。
