- key: results
  q_en: What results does Etsy Unified Embedding Retrieval report?
  a_en: 'Offline per Table I, Recall@100 all / head / tail, Recall@1000: BM25 0.55/0.63/0.45, 0.62; Base 0.33/0.32/0.42, 0.61; Large vocab 0.45/0.45/0.49, 0.72; Random-walk 0.6/0.74/0.52, 0.72; UEPPR 0.674/0.71/0.69, 0.82; UEPPR boost 0.708/0.72/0.71, 0.85. Negative mining ablation per Table II: hard + uniform +3% R@100 and +1.2% R@1000; adding dynamic +9.3% and +5.1%; weighted +11% and +6%. Without hard negatives purchase recall@100 drops 7%. Feature importance relative to the Large vocab model per Table III: T5 title+tags 1.0%, attributes 3.9%, description 6.3%, graph 15%. Location features: 8% relative gain in purchase recall for US users; 98th percentile candidate distance 2600 vs 4200 miles. 1-layer transformer on user history: +2% offline recall. Online A/B tests on live traffic, aggregated: +2.63% site-wide conversion rate, +5.58% organic search purchase rate, larger for signed-in and habitual buyers.'
  q_zh: Etsy Unified Embedding Retrieval 报告了哪些结果？
  a_zh: 离线结果，见表 I，格式为 Recall@100 的全部 / 头部 / 长尾，以及 Recall@1000：BM25 0.55/0.63/0.45，0.62；Base 0.33/0.32/0.42，0.61；Large vocab 0.45/0.45/0.49，0.72；Random-walk 0.6/0.74/0.52，0.72；UEPPR 0.674/0.71/0.69，0.82；UEPPR boost 0.708/0.72/0.71，0.85。负样本挖掘消融，见表 II：hard 加 uniform 使 R@100 提升 +3%，R@1000 提升 +1.2%；加入 dynamic 后为 +9.3% 和 +5.1%；加权后为 +11% 和 +6%。没有 hard 负样本时，购买 recall@100 下降 7%。特征重要性，见表 III，相对 Large vocab 模型：T5 标题加标签 1.0%，属性 3.9%，描述 6.3%，图 15%。位置特征：美国用户的购买 recall 相对提升 8%；第 98 百分位的候选距离为 2600 对比 4200 英里。在用户历史上加 1 层 transformer：离线 recall 提升 +2%。线上 A/B 测试，在线上流量中汇总：全站转化率 +2.63%，自然搜索购买率 +5.58%，登录用户和老买家的提升更大。
