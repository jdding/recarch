- key: stage
  q_en: Which stages of the pipeline does Etsy Unified Embedding Retrieval cover?
  a_en: 'Retrieval: Two-tower. Score y = cos(P(p), Q(q,u)). Product encoder P: token/ID average embeddings in field groups, location encoder (K-means buckets with k = 50, 100, 500 and zip-code prefixes), transformer representation from a T5-small encoder pre-trained to generate the most-purchased query from product text, and a bipartite-graph encoder that averages sampled neighbor query embeddings from over a year of logs, with shared parameter updates frozen. Query-user encoder Q: query tokens, user location, recent searches, recent shop clicks, terms of recently clicked items and tags of purchased items, via a lightweight 1-layer transformer over [q, recent queries, recently clicked shops].'
  q_zh: Etsy Unified Embedding Retrieval 覆盖链路的哪些阶段？
  a_zh: 召回：双塔。得分 y = cos[P[p], Q[q,u]]。商品编码器 P：按字段分组的 token 和 ID 平均 embedding，位置编码器，使用 k = 50、100、500 的 K-means 分桶和邮政编码前缀，来自 T5-small 编码器的 transformer 表示，该编码器经预训练，用于根据商品文本生成购买最多的 query，以及二部图编码器，对来自超过一年日志的采样邻居 query embedding 取平均，并冻结共享参数的更新。Query 与用户编码器 Q：query token、用户位置、最近的搜索、最近点击的店铺、最近点击商品的词项和已购商品的标签，通过对 q、最近的 query 和最近点击的店铺做 1 层轻量 transformer 得到。
  fields:
