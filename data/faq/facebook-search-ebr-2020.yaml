- key: caveats
  q_en: What should I keep in mind when reading the results of Embedding-based Retrieval in Facebook Search?
  a_en: No online A/B numbers appear in the paper; the A/B statement is qualitative. Offline recall gains are relative or absolute points on different verticals and are not additive.
  q_zh: 读 Embedding-based Retrieval in Facebook Search 的结果时要注意什么？
  a_zh: 论文中没有线上 A/B 数字；关于 A/B 的说法是定性的。 离线 recall 的提升是不同垂直领域上的相对或绝对百分点，不能叠加。
