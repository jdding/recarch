- key: core
  q_en: What is the core idea of Embedding-based Retrieval in Facebook Search?
  a_en: A two-tower unified embedding for searcher and document, served inside the Unicorn inverted index.
  q_zh: Embedding-based Retrieval in Facebook Search 的核心思路是什么？
  a_zh: 搜索者和文档的双塔统一 embedding，在 Unicorn 倒排索引内部提供服务。
  fields:
  - core_idea
- key: results
  q_en: What results does Embedding-based Retrieval in Facebook Search report?
  a_en: 'Offline recall gains: unified vs text embeddings +18% for events and +16% for groups; for the group model (Table 1) location features +2.20% absolute recall and social embedding features +1.77%; word n-grams on top of character trigrams +1.5%; online hard negative mining +8.38% (people), +7% (groups), +5.33% (events); offline HNM ensemble and cascade give up to about 3.4% to 4.39% recall over the baseline. ANN (Table 3, 128-d): 1-recall@10 with PQ16 67.54%, OPQ16,PQ16 70.51% to 74.29%, PQ64 74.81% equal to flat 74.81%. Online: the paper says EBR on verticals gave significant metrics gains in A/B experiments but reports no online numbers.'
  q_zh: Embedding-based Retrieval in Facebook Search 报告了哪些结果？
  a_zh: 离线 recall 提升：统一 embedding 对比文本 embedding，活动 +18%，群组 +16%；群组模型见表 1，位置特征使 recall 绝对提升 +2.20%，社交 embedding 特征提升 +1.77%；在字符三元组之上加词 n-gram 提升 +1.5%；在线 hard 负样本挖掘提升：人 +8.38%，群组 +7%，活动 +5.33%；离线 HNM 集成和级联相比基线使 recall 提升最高约 3.4% 到 4.39%。ANN，见表 3，128 维：1-recall@10 在 PQ16 下为 67.54%，OPQ16,PQ16 为 70.51% 到 74.29%，PQ64 为 74.81%，与 flat 的 74.81% 相同。线上：论文称垂直领域上的 EBR 在 A/B 实验中带来了显著的指标提升，但没有报告线上数字。
  fields:
  - results_reported
