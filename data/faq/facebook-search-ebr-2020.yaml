- key: what
  q_en: What is Embedding-based Retrieval in Facebook Search, in one sentence?
  a_en: Facebook Search retrieves with a unified two-tower embedding that matches searcher, query and context against the document, trained with triplet loss and hard negatives.
  q_zh: Embedding-based Retrieval in Facebook Search 一句话是什么？
  a_zh: Facebook 搜索 用统一的双塔 embedding 做召回，把搜索者、query 和上下文与文档匹配，用 triplet 损失和 hard 负样本训练。
  fields:
  - tldr
- key: who
  q_en: Who built Embedding-based Retrieval in Facebook Search and where does it run?
  a_en: 'Embedding-based Retrieval in Facebook Search comes from Meta / Facebook, 2020. Deployed in: Facebook Search retrieval, including people, groups, pages and events.'
  q_zh: Embedding-based Retrieval in Facebook Search 是谁做的，用在哪里？
  a_zh: Embedding-based Retrieval in Facebook Search 来自 Meta / Facebook，2020 年。上线位置：Facebook 搜索 召回，包括人、群组、主页和活动。
