- key: what
  q_en: What is GLMix, in one sentence?
  a_en: GLMix adds per-member and per-job coefficients to a global model. In LinkedIn's A/B test, clicks on the Apply button rose 20% to 40% against LR-Cosine.
  q_zh: GLMix 一句话是什么？
  a_zh: GLMix 在全局模型上加入成员和职位各自的系数。LinkedIn 线上 A/B 中，相比 LR-Cosine，申请按钮点击增加 20% 到 40%。
  fields:
  - tldr
- key: who
  q_en: Who built GLMix and where does it run?
  a_en: 'GLMix comes from LinkedIn, 2016. Deployed in: LinkedIn job recommender, Jobs you may be interested in.'
  q_zh: GLMix 是谁做的，用在哪里？
  a_zh: GLMix 来自 LinkedIn，2016 年。上线位置：LinkedIn 职位推荐，「你可能感兴趣的职位」。
  fields:
  - company
  - year
  - deployed_in
- key: core
  q_en: What is the core idea of GLMix?
  a_en: Add per-member and per-job random-effect coefficients to a global model.
  q_zh: GLMix 的核心思路是什么？
  a_zh: 在全局模型之上加入每个成员和每个职位的随机效应系数。
  fields:
  - core_idea
- key: results
  q_en: What results does GLMix report?
  a_en: The online A/B sampled 2% of members per model and reported one week of results in November 2015. Against production LR-Cosine, daily job application clicks rose 20% to 40% and job detail views rose 10% to 20%. The paper defines application clicks as clicks on the Apply button.
  q_zh: GLMix 报告了哪些结果？
  a_zh: 线上 A/B 为每个模型抽取 2% 的成员，论文给出 2015 年十一月一周的结果。对照生产 LR-Cosine，申请按钮点击量每天增加 20% 到 40%，职位详情页访问量增加 10% 到 20%。论文把申请点击定义为点击申请按钮。
  fields:
  - results_reported
- key: online
  q_en: Does GLMix have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: One week of results from November 2015. A/B traffic: 2% of members sampled per model.'
  q_zh: GLMix 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：论文报告 2015 年十一月一周的结果。A/B 流量：每个模型使用随机抽取的 2% 成员。
  fields:
  - deployment.online_evidence
  - deployment.ab_duration
  - deployment.ab_traffic
- key: training
  q_en: How is GLMix trained?
  a_en: 'Training mode: Offline distributed. Objectives: Logistic response prediction.'
  q_zh: GLMix 是怎么训练的？
  a_zh: 训练方式：离线分布式。 训练目标：Logistic 反馈预测。
