- key: caveats
  q_en: What should I keep in mind when reading the results of SDF?
  a_en: The item sample is weighted by the size of the view change. An item counts as stale when at least three of five raters agree. The estimate describes the sampled items the filter moved. The two-year report count is deployment monitoring across model upgrades and locale expansion.
  q_zh: 读 SDF 的结果时要注意什么？
  a_zh: 抽样按浏览量变化幅度加权。五位独立标注员中至少三位判为过时才计入过时。该估计描述过滤器改变浏览量的抽样内容。 两年的投诉数来自线上监测，期间包含模型升级和地区扩展。
