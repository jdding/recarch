- key: inputs
  q_en: What inputs does SDF use?
  a_en: 'IDs and tokenization: Content representations for filtering. Input signals: Related-item pairs and publication times for detecting supersession; Text, image and video content for modeling relevance decay; Historical search-click traffic as the traffic-ratio training signal.'
