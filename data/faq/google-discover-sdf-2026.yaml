- key: core
  q_en: What is the core idea of SDF?
  a_en: Remove candidates made obsolete by newer items or by the decay of their own relevance.
  q_zh: SDF 的核心思路是什么？
  a_zh: 移除已被新内容取代或自身时效衰减的候选。
  fields:
