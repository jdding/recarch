- key: results
  q_en: What results does SDF report?
  a_en: Section 4.2 reports stale-content prevalence deltas of -6.91 percentage points for SDF and -0.10 for the age-cutoff plus engagement-cliff baseline. Each delta subtracts the stale share among items whose views fell from the stale share among items whose views rose. Items were sampled weekly over four weeks. In the separate two-month joint holdback with both filters disabled for controls, dismissal rate changed by -0.16 ± 0.07%, feed diversity by +0.13 ± 0.04%, and positive engagement by +0.26 ± 0.18%. The ranges are 95% confidence intervals. Section 4.3 reports 54.9% fewer user-filed staleness reports over two years versus the pre-deployment baseline. In the first quarter of 2026, serving CPU and TPU hours fell 4.76% for the relational filter and an additional 3.98% for the intrinsic filter.
  q_zh: SDF 报告了哪些结果？
  a_zh: 第 4.2 节报告，SDF 的过时占比差为 -6.91 个百分点，发布时间阈值加互动骤降的基线为 -0.10 个百分点。占比差等于浏览量增加组的过时占比减去浏览量减少组的过时占比，样本连续四周按周抽取。另做两个月的联合保留组实验，禁用对照组的两道过滤器。划走率变化为 -0.16 ± 0.07%，信息流多样性为 +0.13 ± 0.04%，正向互动为 +0.26 ± 0.18%，区间为 95% 置信区间。第 4.3 节报告，相比部署前，两年内用户提交的过时投诉减少 54.9%。2026 年第一季度，两道过滤器分别节省服务侧 CPU 和 TPU 用时 4.76% 和额外的 3.98%。
  fields:
  - results_reported
