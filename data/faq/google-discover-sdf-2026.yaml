- key: caveats
  q_en: What should I keep in mind when reading the results of SDF?
  a_en: The prevalence delta compares two sampled sets of items. It measures a different outcome from the joint-holdback experiment. The two-year report count is deployment monitoring across model upgrades and locale expansion.
  q_zh: 读 SDF 的结果时要注意什么？
  a_zh: 过时内容占比差来自两组抽样内容，与联合保留组实验衡量的结果不同。 两年的投诉数来自线上监测，期间包含模型升级和地区扩展。
