- key: results
  q_en: What results does SDF report?
  a_en: Section 4.2 reports stale-content prevalence deltas of -6.91 percentage points for SDF and -0.10 for the age-cutoff plus engagement-cliff baseline. Each delta compares the stale shares of promoted and demoted items sampled over four consecutive weeks. In the separate two-month joint holdback with both filters disabled for controls, dismissal rate fell 0.16%, feed diversity rose 0.13%, and positive engagement rose 0.26%. Section 4.3 reports 54.9% fewer user-filed staleness reports over two years versus the pre-deployment baseline. In the first quarter of 2026, serving CPU and TPU hours fell 4.76% for the relational filter and an additional 3.98% for the intrinsic filter.
  q_zh: SDF 报告了哪些结果？
  a_zh: 第 4.2 节报告，SDF 的过时内容占比差为 -6.91 个百分点，发布时间阈值加互动骤降的基线为 -0.10 个百分点。每个占比差比较连续四周抽样中曝光增加与曝光减少的内容。另做两个月的联合保留组实验，对照组禁用两道过滤器，SDF 的划走率下降 0.16%，信息流多样性提升 0.13%，正向互动提升 0.26%。第 4.3 节报告，相比部署前，两年内用户提交的过时投诉减少 54.9%。2026 年第一季度，两道过滤器分别节省服务侧 CPU 和 TPU 用时 4.76% 和额外的 3.98%。
  fields:
  - results_reported
