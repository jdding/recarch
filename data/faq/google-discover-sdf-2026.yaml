- key: what
  q_en: What is SDF, in one sentence?
  a_en: Google Discover filters outdated candidates before ranking. In a two-month holdback with both filters disabled for the control group, SDF lifted positive feed engagement by 0.26%.
  q_zh: SDF 一句话是什么？
  a_zh: Google Discover 在排序前过滤过时内容。在为期两个月的保留组实验中，对照组禁用两道过滤器，SDF 使信息流正向互动提升 0.26%。
