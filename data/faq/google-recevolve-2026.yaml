- key: core
  q_en: What is the core idea of RecEvolve?
  a_en: Keep an experiment record that can reject cheap proxy shortcuts and carry validated evidence into the next architecture change.
  q_zh: RecEvolve 的核心思路是什么？
  a_zh: 用试验记录识别会抬高代理指标的改动，把验证过的证据带到下一次架构修改。
  fields:
  - core_idea
- key: results
  q_en: What results does RecEvolve report?
  a_en: Section 5.7 and Table 2 compare the selected model with the production baseline. The reported relative changes were +3.77% user satisfaction, +7.44% unique content and −16.50% cold-start discovery time.
  q_zh: RecEvolve 报告了哪些结果？
  a_zh: 第 5.7 节和表 2 比较入选模型与生产基线。论文报告用户满意度指标相对提升 3.77%，独特内容指标相对提升 7.44%，冷启动发现时间相对降低 16.50%。
  fields:
  - results_reported
- key: online
  q_en: Does RecEvolve have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: not reported. A/B traffic: not reported.'
  q_zh: RecEvolve 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：未报告。A/B 流量：未报告。
