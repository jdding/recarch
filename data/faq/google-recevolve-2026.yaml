- key: caveats
  q_en: What should I keep in mind when reading the results of RecEvolve?
  a_en: The online test covers a selected trained model. The paper does not attribute the result to any one edit in isolation. The batch-size shortcut was a separate exploratory run and was rolled back.
  q_zh: 读 RecEvolve 的结果时要注意什么？
  a_zh: 线上试验覆盖整套入选模型，论文没有对单项改动做线上归因。 批量缩小的例子来自另一轮探索，该改动已回滚。
  fields:
