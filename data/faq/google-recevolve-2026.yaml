- key: what
  q_en: What is RecEvolve, in one sentence?
  a_en: A proposal agent, critic and coding agent use a shared research record to improve a production two-tower retriever. Google tested the selected model against the incumbent on live traffic.
  q_zh: RecEvolve 一句话是什么？
  a_zh: 提案、评审和编码 Agent 共用研发记录，迭代生产双塔召回模型。Google 用真实流量比较入选模型和现网模型。
  fields:
  - tldr
- key: who
  q_en: Who built RecEvolve and where does it run?
  a_en: 'RecEvolve comes from Google, 2026. Deployed in: A Google production two-tower retrieval service whose product name is undisclosed.'
  q_zh: RecEvolve 是谁做的，用在哪里？
  a_zh: RecEvolve 来自 Google，2026 年。上线位置：Google 的生产双塔召回服务，产品名未披露。
  fields:
