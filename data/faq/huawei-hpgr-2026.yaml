items:
- key: what
  q_en: What is HPGR, in one sentence?
  a_en: 'Huawei''s HPGR adds session pre-training and preference-guided sparse attention to an HSTU ranker; 7-day 50% A/B on AppGallery vs the production DLRM: eCPM +1.99%.'
  q_zh: HPGR 一句话是什么？
  a_zh: 华为 HPGR 在 HSTU 排序模型上加入会话预训练和偏好引导的稀疏注意力；AppGallery 上对比线上 DLRM 做 7 天 50% A/B：eCPM +1.99%。
  fields:
  - tldr
- key: who
  q_en: Who built HPGR and where does it run?
  a_en: 'HPGR comes from Huawei, 2026. Deployed in: AppGallery app recommendation ranking, tested on half of traffic.'
  q_zh: HPGR 是谁做的，用在哪里？
  a_zh: HPGR 来自 华为，2026 年。上线位置：AppGallery 应用推荐排序，在一半流量上测试。
  fields:
  - company
  - year
  - deployed_in
- key: core
  q_en: What is the core idea of HPGR?
  a_en: An HSTU ranker is pre-trained on user sessions and then restricted by a sparse attention mask to the most relevant history.
  q_zh: HPGR 的核心思路是什么？
  a_zh: HSTU 排序模型先在用户会话上预训练，再通过稀疏注意力掩码，把注意力限制在最相关的历史上。
  fields:
  - core_idea
- key: results
  q_en: What results does HPGR report?
  a_en: 'Online 7-day A/B on AppGallery with traffic split evenly against the production DLRM: eCPM +1.99%, reported as statistically significant. Offline AUC on a 2.5% user sample is 0.8377 for HPGR against 0.8253 for MTGR, 0.8220 for HSTU and 0.8194 for SASRec, a gain of 0.0124 absolute and 1.50% relative over MTGR. On the full test set, HPGR reaches AUC 0.89288, 0.01139 above MTGR, and the production DLRM scores 0.8880 against 0.8929 for HPGR. Pre-training alone gives 0.8327, adding the session module gives 0.8374 and the sparse attention module gives 0.8348.'
  q_zh: HPGR 报告了哪些结果？
  a_zh: AppGallery 上做 7 天线上 A/B，流量平均分配，对比线上 DLRM：eCPM +1.99%，论文称统计显著。2.5% 用户样本上的离线 AUC：HPGR 为 0.8377，MTGR 为 0.8253，HSTU 为 0.8220，SASRec 为 0.8194，相比 MTGR 绝对提升 0.0124，相对提升 1.50%。在完整测试集上，HPGR 的 AUC 为 0.89288，比 MTGR 高 0.01139，线上 DLRM 为 0.8880，HPGR 为 0.8929。仅预训练为 0.8327，加入会话模块为 0.8374，加入稀疏注意力模块为 0.8348。
  fields:
  - results_reported
- key: online
  q_en: Does HPGR have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: 7 days. A/B traffic: Half of traffic, split evenly between control and treatment.'
  q_zh: HPGR 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：7 天。A/B 流量：一半流量，在对照组和实验组之间平均分配。
  fields:
  - deployment.online_evidence
  - deployment.ab_duration
  - deployment.ab_traffic
- key: caveats
  q_en: What should I keep in mind when reading the results of HPGR?
  a_en: The online evidence is a single eCPM figure with no confidence interval or per-metric breakdown. Main offline results use a 2.5% user sample of a proprietary dataset, with a full-set check for the top models only.
  q_zh: 读 HPGR 的结果时要注意什么？
  a_zh: 线上证据只有一个 eCPM 数字，没有置信区间，也没有分指标的拆解。 主要的离线结果使用私有数据集的 2.5% 用户样本，只对排名靠前的模型做了完整数据集的检查。
  fields:
  - caveats.0
  - caveats.1
