- key: what
  q_en: What is GCRank, in one sentence?
  a_en: 'JD''s GCRank feeds LLM and flow-matching generated context into takeout ad ranking; 7-day 20% A/B vs the production DLRM: CTR +5.07%, CVR +4.71%, RPM +6.42%, then full traffic.'
  q_zh: GCRank 一句话是什么？
  a_zh: 京东 GCRank 把大模型和 flow matching 生成的上下文输入外卖广告排序；对比线上 DLRM 做 7 天 20% A/B：CTR +5.07%，CVR +4.71%，RPM +6.42%，随后全量上线。
  fields:
  - tldr
- key: who
  q_en: Who built GCRank and where does it run?
  a_en: 'GCRank comes from JD.com, 2026. Deployed in: JD takeout food delivery ad ranking, tested on 20% of traffic then rolled out to all traffic.'
  q_zh: GCRank 是谁做的，用在哪里？
  a_zh: GCRank 来自 京东，2026 年。上线位置：京东外卖广告排序，先在 20% 流量上测试，再推到全量流量。
