- key: caveats
  q_en: What should I keep in mind when reading the results of GCRank?
  a_en: The paper states that reported results were transformed to protect proprietary business information, so absolute values may not match raw logs. The offline dataset is proprietary and no public dataset is used.
  q_zh: 读 GCRank 的结果时要注意什么？
  a_zh: 论文说明，为保护商业机密，报告的结果经过变换，因此绝对数值可能与原始日志不一致。 离线数据集是私有的，没有使用公开数据集。
  fields:
  - caveats.0
  - caveats.1
- key: inputs
  q_en: What inputs does GCRank use?
  a_en: 'IDs and tokenization: No semantic IDs; text and context prompts are encoded by LLMs into embeddings. Input signals: User behavior sequences of the past 60 days, up to 300 interactions; Time, location, POI and AOI context; Store and area text attributes, such as taste and price level; Ad features.'
  q_zh: GCRank 用了哪些输入？
  a_zh: ID 与 token 化：不使用 Semantic ID；文本和上下文 prompt 由大模型编码成 embedding。 输入特征：过去 60 天的用户行为序列，最多 300 次交互；时间、位置、POI 和 AOI 上下文；店铺和区域的文本属性，如口味和价格档位；广告特征。
