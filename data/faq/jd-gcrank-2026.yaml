- key: core
  q_en: What is the core idea of GCRank?
  a_en: LLMs and flow matching generate four kinds of context that a takeout ad ranker fuses through LoRA-style adapters.
  q_zh: GCRank 的核心思路是什么？
  a_zh: 大模型和 flow matching 生成四类上下文，外卖广告排序模型通过 LoRA 风格的 adapter 融合它们。
  fields:
  - core_idea
- key: results
  q_en: What results does GCRank report?
  a_en: 'Online 7-day A/B with a 20% traffic allocation against the production DLRM, all p < 0.0001: CTR +5.07%, CVR +4.71%, RPM +6.42%, with TP99 latency up about 2 ms; daily gains stay stable across the 7 days, and the model was then rolled out to all platform traffic. Offline AUC on the industrial set is 0.7679 for CTR and 0.7053 for CVR for GCRank against 0.7513 and 0.6619 for the production DLRM and 0.7545 and 0.6659 for HSTU.'
  q_zh: GCRank 报告了哪些结果？
  a_zh: 线上 7 天 A/B，分配 20% 流量，对比线上 DLRM，全部 p < 0.0001：CTR +5.07%，CVR +4.71%，RPM +6.42%，TP99 延迟增加约 2 ms；7 天内每日收益保持稳定，随后模型推到平台全量流量。工业数据集上的离线 AUC：GCRank 的 CTR 为 0.7679，CVR 为 0.7053；线上 DLRM 分别为 0.7513 和 0.6619；HSTU 分别为 0.7545 和 0.6659。
  fields:
  - results_reported
- key: online
  q_en: Does GCRank have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: 7 days. A/B traffic: 20% of traffic.'
  q_zh: GCRank 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：7 天。A/B 流量：20% 流量。
