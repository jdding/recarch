- key: caveats
  q_en: What should I keep in mind when reading the results of AgentX?
  a_en: The AUC count uses the business baseline as the reference. It does not count record-setting improvements over every ancestor. The reported online ranges cover selected launch reviews. The corresponding controls differ across business settings.
  q_zh: 读 AgentX 的结果时要注意什么？
  a_zh: AUC 次数以业务基线为参照。超越谱系里所有早期版本的次数另算。 线上区间来自入选的上线评审，各业务场景使用各自的对照。
  fields:
