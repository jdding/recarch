- key: core
  q_en: What is the core idea of AgentX?
  a_en: Link each model change to its baseline, parent and hypothesis so later experiments can act on accumulated evidence.
  q_zh: AgentX 的核心思路是什么？
  a_zh: 把每次改动和业务基线、直接父版本及研究假设关联起来，让后续实验用得上之前的证据。
  fields:
  - core_idea
- key: results
  q_en: What results does AgentX report?
  a_en: In the offline production evaluation, 560 of 636 completed model-changing experiments exceeded their setting's business baseline on AUC. A separate lineage analysis compares changes with their direct parents and strongest earlier results. Table 6 reports five recent launch reviews with coarse ranges. Review 3 reports multi-task objective pruning with watch time up 0.3% to 0.8% across two clients and FLOPs and parameter count approximately 10% lower. Review 1 reports acquisition efficiency up 10% to 15% with adaptive attention temperature.
  q_zh: AgentX 报告了哪些结果？
  a_zh: 离线评估中，636 次完成的模型改动有 560 次的 AUC 超过各自业务基线。论文另做谱系分析，比较直接父模型和此前最优结果。表 6 给出五次近期上线评审的粗粒度区间。第 3 项剪除辅助任务，两个客户端的观看时长 +0.3% 至 +0.8%，FLOPs 和参数量约降 10%。第 1 项使用自适应注意力温度，获客效率 +10% 至 +15%。
  fields:
  - results_reported
