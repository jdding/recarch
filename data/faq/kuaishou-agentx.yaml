- key: what
  q_en: What is AgentX, in one sentence?
  a_en: AgentX makes model research cumulative by recording experiments, their direct parents and the evidence behind each change. The authors report production A/B results for five recent launch reviews.
  q_zh: AgentX 一句话是什么？
  a_zh: AgentX 记录模型实验、直接父版本和每次改动的证据，让后续研究可以接着做。论文报告了最近五次上线评审对应的生产 A/B。
  fields:
  - tldr
- key: who
  q_en: Who built AgentX and where does it run?
  a_en: 'AgentX comes from Kuaishou, 2026. Deployed in: Model-development and evaluation workflows for Kuaishou production recommenders.'
  q_zh: AgentX 是谁做的，用在哪里？
  a_zh: AgentX 来自 快手，2026 年。上线位置：快手生产推荐系统的模型研发和评估流程。
  fields:
