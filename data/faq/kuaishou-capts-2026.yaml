- key: what
  q_en: What is CAPTS, in one sentence?
  a_en: Kuaishou's CAPTS learns which history items should seed each item-to-item retrieval channel; in the Kwai online A/B it gave total app time spent +0.713% and average app time spent per device +0.586%.
  q_zh: CAPTS 一句话是什么？
  a_zh: 快手的 CAPTS 学习该用哪些历史 item 去驱动各个 item 到 item 召回通道；在 Kwai 线上 A/B 中总 App 使用时长 +0.713%，每台设备平均 App 使用时长 +0.586%。
  fields:
  - tldr
- key: who
  q_en: Who built CAPTS and where does it run?
  a_en: 'CAPTS comes from Kuaishou, 2026. Deployed in: Kwai short-video feed, trigger selection for 4 I2I channels.'
  q_zh: CAPTS 是谁做的，用在哪里？
  a_zh: CAPTS 来自 快手，2026 年。上线位置：Kwai 短视频信息流，为 4 个 I2I 通道选触发 item。
