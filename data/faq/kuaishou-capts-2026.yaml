- key: caveats
  q_en: What should I keep in mind when reading the results of CAPTS?
  a_en: CAPTS is a trigger-selection module in front of existing retrievers, so it is narrower than a full retrieval system; the full pipeline is shown only at the level of Figure 4. The A/B duration, traffic share and number of users are not given in the paper.
  q_zh: 读 CAPTS 的结果时要注意什么？
  a_zh: CAPTS 是放在现有召回器之前的触发 item 选择模块，范围比完整的召回系统窄；完整流水线只在图 4 的层面上展示。 论文没有给出 A/B 的时长、流量占比和用户数。
  fields:
  - caveats.0
  - caveats.1
- key: serving
  q_en: What serving latency, QPS, cost or hardware does CAPTS report?
  a_en: 'Serving latency: not reported. Serving QPS: not reported. Inference cost: Online scoring covers 10^2 to 10^3 recent candidates and a nearline cache covers 10^3 to 10^4 long-term candidates; the paper says only lightweight scoring, routing and cache lookup are added. Hardware: not reported.'
  q_zh: CAPTS 报告了怎样的服务延迟、QPS、成本和硬件？
  a_zh: 服务延迟：未报告。 服务 QPS：未报告。 推理成本：在线对 10^2 到 10^3 个近期候选打分，近线缓存覆盖 10^3 到 10^4 个长期候选；论文称只增加了轻量的打分、路由和缓存查询。 硬件：未报告。
  fields:
  - deployment.serving_latency
  - deployment.serving_qps
  - deployment.inference_cost
  - deployment.hardware
- key: training
  q_en: How is CAPTS trained?
  a_en: 'Training mode: Offline training on replayed logs, with periodic weight synchronization to serving. Objectives: Weighted binary cross-entropy on the per-channel value label; Intensity-aware calibration loss; Diversity loss on the uniqueness head, with weights lambda and mu.'
  q_zh: CAPTS 是怎么训练的？
  a_zh: 训练方式：在重放日志上离线训练，并定期把权重同步到线上服务。 训练目标：针对每个通道价值标签的加权二元交叉熵；感知强度的校准损失；独特性头上的多样性损失，权重为 lambda 和 mu。
  fields:
  - training.mode
  - training.objectives
