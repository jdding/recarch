- key: core
  q_en: What is the core idea of CAPTS?
  a_en: Credit each history item by the watch time of the items it would retrieve, then route items to the channels where they add the most.
  q_zh: CAPTS 的核心思路是什么？
  a_zh: 按触发 item 能召回的内容所带来的观看时长给它打分，再把它路由到最能增加增量的通道。
  fields:
  - core_idea
- key: results
  q_en: What results does CAPTS report?
  a_en: 'Offline on Kwai-Industrial, overall Recall@K over 3 I2I channels: CAPTS reaches R@100 0.0255, R@500 0.0963, R@1000 0.1519 and R@2000 0.1994, which is +25.0%, +17.9%, +13.8% and +10.7% relative to the best baseline at each K. Online, in a large-scale A/B on Kwai with 4 I2I channels, CAPTS against the incumbent rule-based policy: daily active devices +0.115%, total app time spent +0.713%, average app time spent per device +0.586%, total video watch time +0.506% and average watch time per device +0.395%. The summed exposure share of the four I2I channels rises from 26.24% to 27.55%. The paper says the localized change has also supported deployment in the Kwai e-commerce recommendation scenario.'
  q_zh: CAPTS 报告了哪些结果？
  a_zh: 离线，在 Kwai-Industrial 上，对 3 个 I2I 通道合并后的 Recall@K：CAPTS 的 R@100 为 0.0255，R@500 为 0.0963，R@1000 为 0.1519，R@2000 为 0.1994，相对每个 K 下最好的基线分别提升 +25.0%、+17.9%、+13.8% 和 +10.7%。线上，在 Kwai 做了大规模 A/B，开 4 个 I2I 通道，CAPTS 对比现有的规则策略：日活设备 +0.115%，总 App 使用时长 +0.713%，每台设备平均 App 使用时长 +0.586%，视频总观看时长 +0.506%，每台设备平均观看时长 +0.395%。4 个 I2I 通道的曝光占比合计从 26.24% 升到 27.55%。论文称这一局部改动也支撑了 Kwai 电商推荐场景的部署。
  fields:
  - results_reported
