- key: caveats
  q_en: What should I keep in mind when reading the results of EvoRec?
  a_en: The experiment adds a retrieval channel for lead-generation ads. Effects describe that deployment scope. The high-intent subgroup is defined using explicit inquiry or search intent signals.
  q_zh: 读 EvoRec 的结果时要注意什么？
  a_zh: 实验覆盖线索广告的一个补充召回通道，指标只对应受测业务。 高意图人群根据显式咨询或搜索意图定义。
