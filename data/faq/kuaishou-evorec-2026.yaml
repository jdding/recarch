- key: core
  q_en: What is the core idea of EvoRec?
  a_en: Cache a learned plan and query vectors nearline, then let a separate executor use the latest catalog to produce candidates.
  q_zh: EvoRec 的核心思路是什么？
  a_zh: 近线缓存召回计划和查询向量，让独立执行器用最新目录补充线上候选。
  fields:
  - core_idea
- key: results
  q_en: What results does EvoRec report?
  a_en: Section 4.4 reports a seven-day A/B from August 28 to September 3, 2026 with approximately 5% of eligible traffic per arm. Table 6 gives relative gains of +4.6% billed ad revenue, +3.5% CTCVR and +0.8% impressions within the deployment scope. The reported cost metric increased 3.6%. The +14.5% revenue result applies to the high-intent subgroup.
  q_zh: EvoRec 报告了哪些结果？
  a_zh: 第 4.4 节报告 2026 年八月 28 日至九月 3 日的七天 A/B，每组约占符合条件流量的 5%。表 6 中，计费广告收入 +4.6%、CTCVR +3.5%、曝光 +0.8%，报告的成本指标 +3.6%。收入 +14.5% 对应高意图人群。
  fields:
  - results_reported
- key: online
  q_en: Does EvoRec have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: Seven days, August 28 to September 3, 2026. A/B traffic: Approximately 5% of eligible traffic per arm.'
  q_zh: EvoRec 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：七天，2026 年八月 28 日至九月 3 日。A/B 流量：每组约占符合条件流量的 5%。
