- key: what
  q_en: What is EvoRec, in one sentence?
  a_en: EvoRec plans retrieval nearline and supplies an extra candidate channel to Kuaishou's existing ads stack. The deployment test leaves downstream pre-ranking and ranking models fixed.
  q_zh: EvoRec 一句话是什么？
  a_zh: EvoRec 在近线规划召回，为快手现有广告系统提供额外候选通道，部署实验沿用现有预排序和排序模型。
