- key: inputs
  q_en: What inputs does EvoRec use?
  a_en: 'IDs and tokenization: Dense embeddings of retrieval queries and items. Input signals: User memory and recent behavior; Ad inquiry messages and recent searches as explicit signals of need; Outcomes and error diagnoses from previous recommendations.'
  q_zh: EvoRec 用了哪些输入？
  a_zh: ID 与 token 化：检索查询与物品的稠密向量。 输入特征：用户记忆和近期行为；广告咨询消息和近期搜索提供的显式需求；之前推荐的反馈及错误诊断结果。
