- key: inputs
  q_en: What inputs does GloRank use?
  a_en: 'IDs and tokenization: RQ-based Semantic IDs, depth 4, codebook size 256. Input signals: Item textual attributes, for Amazon title, categories, description, price and brand; for MovieLens title and genres; User interaction history serialized as Semantic IDs; The candidate slate serialized as Semantic IDs; List-wise reward signals for GRPO post-training.'
  q_zh: GloRank 用了哪些输入？
  a_zh: ID 与 token 化：RQ Semantic ID，深度 4，码本大小 256。 输入特征：物品文本属性，Amazon 用标题、类目、描述、价格和品牌，MovieLens 用标题和题材；序列化为 Semantic ID 的用户交互历史；序列化为 Semantic ID 的候选列表；GRPO 后训练用的列表收益信号。
