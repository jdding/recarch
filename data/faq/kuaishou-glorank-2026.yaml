- key: caveats
  q_en: What should I keep in mind when reading the results of GloRank?
  a_en: The A/B platform is described only as a leading content platform; Kuaishou comes from the author affiliation, and no rollout beyond the A/B is stated. The arXiv v1 text read is a preprint in a placeholder ACM template; the final CIKM 2026 text was not read.
  q_zh: 读 GloRank 的结果时要注意什么？
  a_zh: A/B 平台只被描述为领先内容平台；快手身份来自作者署名，未说明 A/B 之外的全量状态。 所读 arXiv v1 是占位 ACM 模板的预印本；未读到 CIKM 2026 最终文本。
