- key: core
  q_en: What is the core idea of GloRank?
  a_en: Generate global Semantic IDs instead of picking local indices, so each output neuron always means the same item, and align the generator with list-wise rewards.
  q_zh: GloRank 的核心思路是什么？
  a_zh: 生成全局 Semantic ID 而不是选局部下标，让每个输出神经元始终对应同一物品，再用列表收益对齐生成器。
  fields:
  - core_idea
- key: results
  q_en: What results does GloRank report?
  a_en: 'Offline, generating a list of length 6 from 50 candidates, Table 2: on the industrial e-commerce dataset GloRank reaches Precision 62.56, NDCG 90.15, MAP 84.84 and F1 74.32, with relative improvements over the best baseline of 3.99%, 2.35%, 3.39% and 3.97%; on Amazon Books 83.75, 90.08, 85.10 and 86.97, improving 4.23%, 6.13%, 9.23% and 4.23%; on MovieLens-1M 75.79, 87.56, 81.19 and 82.57, improving 3.03%, 4.95%, 6.60% and 3.02%. Ablation, Table 3: without pre-training, NDCG collapses to 24.13 on Amazon Books; without post-training, MAP falls to 83.68 on Amazon Books, while on MovieLens-1M post-training adds 2.34% MAP from 78.85 to 81.19 and 1.62% NDCG from 85.94 to 87.56. A local action space variant degrades sharply, and under a cold start on Amazon Books with 5% of items removed from training, GoalRank MAP drops by over 88.4% while GloRank loses only 4.9%. Online, Table 4: over 14 days on 7.8% of live traffic with an equal-size GoalRank control on a content platform serving over 400 million DAU, Watch Time +0.095%, Effective View +0.111%, Like +0.286%, Comment +0.462% and Forward +0.447%, all significant at p < 0.05 by t-test, with Active Devices +0.030% in the text.'
  q_zh: GloRank 报告了哪些结果？
  a_zh: 离线任务为从 50 个候选生成长度 6 的列表，表 2：工业电商数据集上 GloRank 达到 Precision 62.56、NDCG 90.15、MAP 84.84、F1 74.32，相对最优基线提升 3.99%、2.35%、3.39%、3.97%；Amazon Books 上为 83.75、90.08、85.10、86.97，提升 4.23%、6.13%、9.23%、4.23%；MovieLens-1M 上为 75.79、87.56、81.19、82.57，提升 3.03%、4.95%、6.60%、3.02%。消融见表 3：去掉预训练，Amazon Books 的 NDCG 崩到 24.13；去掉后训练，Amazon Books 的 MAP 降到 83.68，而 MovieLens-1M 上后训练带来 MAP 从 78.85 到 81.19 的 2.34% 提升和 NDCG 从 85.94 到 87.56 的 1.62% 提升。局部动作空间变体明显退化；在 Amazon Books 上从训练集移除 5% 物品的冷启动设定下，GoalRank 的 MAP 下降超过 88.4%，GloRank 只降 4.9%。线上见表 4：在日活超过 4 亿的内容平台上，以 7.8% 线上流量与等规模 GoalRank 对照组跑了 14 天，观看时长 +0.095%、有效观看 +0.111%、点赞 +0.286%、评论 +0.462%、转发 +0.447%，全部经 t 检验 p < 0.05 显著，正文另报告活跃设备 +0.030%。
  fields:
  - results_reported
