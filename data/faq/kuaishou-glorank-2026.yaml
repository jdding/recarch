- key: what
  q_en: What is GloRank, in one sentence?
  a_en: GloRank reranks by generating global Semantic IDs with constrained decoding and GRPO post-training; a 14-day A/B beats the deployed GoalRank with Comment +0.462% and Watch Time +0.095%.
  q_zh: GloRank 一句话是什么？
  a_zh: GloRank 用受限解码生成全局 Semantic ID 做重排，再用 GRPO 后训练；14 天 A/B 胜过已上线的 GoalRank，评论 +0.462%、观看时长 +0.095%。
  fields:
  - tldr
- key: who
  q_en: Who built GloRank and where does it run?
  a_en: 'GloRank comes from Kuaishou, 2026. Deployed in: List-wise reranking on a leading content platform, live A/B traffic.'
  q_zh: GloRank 是谁做的，用在哪里？
  a_zh: GloRank 来自 快手，2026 年。上线位置：领先内容平台的 list-wise 重排，线上 A/B 流量。
  fields:
  - company
  - year
