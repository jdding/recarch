- key: what
  q_en: What is KuaiFormer, in one sentence?
  a_en: 'Pure-Transformer real-time retrieval for short video: next-action prediction with multiple interest query tokens; offline HR@500 15.61% vs 11.31% for the best other method.'
  q_zh: KuaiFormer 一句话是什么？
  a_zh: 面向短视频的纯 Transformer 实时召回：带多个兴趣 query token 的下一行为预测；离线 HR@500 为 15.61%，最好的其他方法为 11.31%。
  fields:
  - tldr
- key: who
  q_en: Who built KuaiFormer and where does it run?
  a_en: 'KuaiFormer comes from Kuaishou, 2024. Deployed in: Kuaishou short-video retrieval, one extra pathway since May 2024.'
  q_zh: KuaiFormer 是谁做的，用在哪里？
  a_zh: KuaiFormer 来自 快手，2024 年。上线位置：快手短视频召回，自 May 2024 起作为一条额外通路。
