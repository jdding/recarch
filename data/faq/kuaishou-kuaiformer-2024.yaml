- key: caveats
  q_en: What should I keep in mind when reading the results of KuaiFormer?
  a_en: The paper's abstract says the system serves over 400 million DAU; the online A/B was on 10% of users for one week. The paper's Table 3 appears in the text as 'Table 3 (a)-(c)' for hyperparameter plots that are drawn in Figure 3; the numbers cited here come from the text and the compression table.
  q_zh: 读 KuaiFormer 的结果时要注意什么？
  a_zh: 论文摘要称系统服务超过四亿日活用户；线上 A/B 是在 10% 的用户上做了一周。 论文的表 3 在正文中写作「Table 3 [a]-[c]」，指画在图 3 中的超参数图；这里引用的数字来自正文和压缩表。
  fields:
  - caveats.0
  - caveats.1
- key: serving
  q_en: What serving latency, QPS, cost or hardware does KuaiFormer report?
  a_en: 'Serving latency: The paper says retrieval must finish within a few milliseconds; no measured number. Serving QPS: Peak over 100,000 requests per second. Inference cost: not reported. Hardware: GPU brute-force top-K search in practice; no GPU type or count.'
  q_zh: KuaiFormer 报告了怎样的服务延迟、QPS、成本和硬件？
  a_zh: 服务延迟：论文称召回必须在几毫秒内完成；没有实测数字。 服务 QPS：峰值超过每秒 100,000 个请求。 推理成本：未报告。 硬件：实际使用 GPU 暴力 top-K 搜索；没有给出 GPU 型号和数量。
  fields:
  - deployment.serving_latency
  - deployment.serving_qps
  - deployment.inference_cost
  - deployment.hardware
- key: training
  q_en: How is KuaiFormer trained?
  a_en: 'Training mode: Online learning on a distributed training framework; the model continuously consumes new logs and updates parameters to the online service at minute-level frequency. Sparse embeddings sit on a dedicated embedding server and dense parameters are shipped periodically. Objectives: next-item prediction with smoothed logQ-corrected in-batch softmax.'
  q_zh: KuaiFormer 是怎么训练的？
  a_zh: 训练方式：在分布式训练框架上在线学习；模型持续消费新日志，并以分钟级频率把参数更新到在线服务。稀疏 embedding 放在专门的 embedding 服务器上，稠密参数定期下发。 训练目标：下一个 item 预测，使用平滑且经 logQ 校正的 batch 内 softmax。
  fields:
  - training.mode
  - training.objectives
