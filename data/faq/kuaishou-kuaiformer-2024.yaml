- key: core
  q_en: What is the core idea of KuaiFormer?
  a_en: A pure Transformer with learnable query tokens for multiple interests and adaptive item compression.
  q_zh: KuaiFormer 的核心思路是什么？
  a_zh: 纯 Transformer，用可学习的 query token 表示多个兴趣，并做自适应 item 压缩。
  fields:
  - core_idea
- key: results
  q_en: What results does KuaiFormer report?
  a_en: 'Offline hit rate against real viewed items on replayed online requests per Table 1, KuaiFormer vs best other method: HR@50 4.21% vs GNN 3.97%; HR@100 6.58% vs GPRP 5.21%; HR@500 15.61% vs GPRP 11.31%; HR@1000 19.88% vs GPRP 15.70%. SASRec scores 1.17/2.51/5.37/7.22. Online A/B, one week with 10% of users in three scenarios per Table 2: video watch time +0.360% (Kuaishou single page), +0.126% (Kuaishou Lite single page), +0.411% (Kuaishou double page); also usage-time and engagement columns (likes, follows, comments, Novel Surprise views) positive in Table 2; the column headers are garbled in the extracted text so individual non-watch-time values are not quoted here. The paper calls it one of the most significant retrieval experiments at Kuaishou in 2024. Ablations: accuracy rises from 0.325 (length 8) to 0.441 (256); layers 1 to 5 raise accuracy from 0.391 to 0.435 with diminishing returns after 4 (0.433); query tokens saturate near 6; compressed 256 gives 0.445 vs 0.441 uncompressed and 0.417 at length 64.'
  q_zh: KuaiFormer 报告了哪些结果？
  a_zh: 在回放的线上请求上，用真实观看过的 item 计算离线命中率，见表 1，KuaiFormer 对比最好的其他方法：HR@50 为 4.21%，GNN 为 3.97%；HR@100 为 6.58%，GPRP 为 5.21%；HR@500 为 15.61%，GPRP 为 11.31%；HR@1000 为 19.88%，GPRP 为 15.70%。SASRec 得分为 1.17/2.51/5.37/7.22。线上 A/B，一周，三个场景各取 10% 的用户，见表 2：视频观看时长 +0.360%，快手单列；+0.126%，快手极速版单列；+0.411%，快手双列；表 2 中使用时长和互动列，包括点赞、关注、评论和 Novel Surprise 观看，也都为正；提取出的文本里列标题是乱码，所以这里没有引用观看时长以外的各项数值。论文称这是快手 2024 年最显著的召回实验之一。消融：准确率从 0.325，长度 8，升到 0.441，长度 256；1 到 5 层使准确率从 0.391 升到 0.435，4 层之后收益递减，为 0.433；query token 在 6 个左右饱和；压缩后的 256 为 0.445，未压缩为 0.441，长度 64 为 0.417。
  fields:
  - results_reported
