- key: what
  q_en: What is NAR4Rec, in one sentence?
  a_en: Kuaishou computes the item distribution for each output position in parallel and evaluates the resulting slates. Views rose 1.161% against Edge-rerank in the production A/B.
  q_zh: NAR4Rec 一句话是什么？
  a_zh: 快手并行计算每个输出位置的物品分布，再对生成的列表进行评估。生产 A/B 对比 Edge-rerank，播放量提升 1.161%。
  fields:
  - tldr
- key: who
  q_en: Who built NAR4Rec and where does it run?
  a_en: 'NAR4Rec comes from Kuaishou, 2024. Deployed in: Kuaishou short-video recommendation, fully deployed per the authors.'
  q_zh: NAR4Rec 是谁做的，用在哪里？
  a_zh: NAR4Rec 来自 快手，2024 年。上线位置：作者报告已在快手短视频推荐全量部署。
