- key: core
  q_en: What is the core idea of NAR4Rec?
  a_en: Compute output-position scores in parallel, then construct and evaluate candidate slates.
  q_zh: NAR4Rec 的核心思路是什么？
  a_zh: 并行计算输出位置的分数，再构建并评估备选列表。
  fields:
  - core_idea
- key: results
  q_en: What results does NAR4Rec report?
  a_en: In Section 5.3 and Table 5, Kuaishou ran a 10-day A/B with 20% of app traffic on NAR4Rec and the remainder on Edge-rerank. Relative gains were +1.161% views, +1.71% likes, +1.15% follows, +1.82% long views and +2.45% complete views. The authors report full deployment at the time of the paper. In a separate offline Avito benchmark in Table 4, inference took 0.037 seconds per batch for NAR4Rec and 0.186 seconds for Seq2Slate on a Tesla T4 at batch size 1024.
  q_zh: NAR4Rec 报告了哪些结果？
  a_zh: 第 5.3 节和表 5 报告快手 10 天 A/B。NAR4Rec 用于 20% 的 App 流量，其余仍使用 Edge-rerank。播放量、点赞、关注、长播放和完整播放相对提升 1.161%、1.71%、1.15%、1.82% 和 2.45%。作者撰文时报告已全量上线。表 4 单独报告 Avito 离线耗时。在 Tesla T4 上、批大小 1024，NAR4Rec 每批推理用时 0.037 秒，Seq2Slate 用时 0.186 秒。
  fields:
  - results_reported
- key: online
  q_en: Does NAR4Rec have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: 10 days. A/B traffic: 20% treatment on NAR4Rec, remaining app traffic on Edge-rerank.'
  q_zh: NAR4Rec 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：10 天。A/B 流量：20% 的 App 流量使用 NAR4Rec，其余使用 Edge-rerank。
  fields:
