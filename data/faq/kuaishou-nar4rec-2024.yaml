  - deployment.ab_traffic
- key: caveats
  q_en: What should I keep in mind when reading the results of NAR4Rec?
  a_en: The Avito latency numbers describe offline batch inference. Production request latency is undisclosed. The production comparison evaluates the complete re-ranker. Component ablations are reported separately.
  q_zh: 读 NAR4Rec 的结果时要注意什么？
  a_zh: Avito 耗时来自离线批量推理。原文未披露生产请求延迟。 生产对比评估整套重排系统。原文另有组件消融实验。
