  q_en: What is the core idea of Kuaishou On-device Short-video Reranking?
  a_en: Use live phone features to update the next-video choice while keeping the cloud's candidate and scoring service.
  q_zh: Kuaishou On-device Short-video Reranking 的核心思路是什么？
  a_zh: 端侧用最新行为完善下一条视频选择，云侧继续提供候选与预估分。
