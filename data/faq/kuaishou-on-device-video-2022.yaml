- key: what
  q_en: What is Kuaishou On-device Short-video Reranking, in one sentence?
  a_en: The phone uses a self-contained ranker to rescore a small slate of cloud videos after each swipe. It combines fresh behavior and playback context with server predictions.
  q_zh: Kuaishou On-device Short-video Reranking 一句话是什么？
  a_zh: 每次滑动后，手机用自包含模型重排一小组云侧视频，结合最新行为、播放条件和服务器的预估分。
