  q_en: What should I keep in mind when reading the results of Kuaishou On-device Short-video Reranking?
  a_en: The results come from a single-video viewing surface. The client chooses from the current cloud slate. Table 7 measures the model and search on the device. The paper reports engagement lifts against the server-only production order.
