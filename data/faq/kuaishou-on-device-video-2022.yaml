  q_en: What results does Kuaishou On-device Short-video Reranking report?
  a_en: Table 6 reports +1.277% effective view, +8.218% like and +13.598% follow for context-aware reranking versus no mobile reranking over one week. Table 7 reports average model plus beam-search costs of 120.80 ms on Android and 49.39 ms on iOS.
  q_zh: Kuaishou On-device Short-video Reranking 报告了哪些结果？
  a_zh: 表 6 的一周 A/B 中，上下文感知重排比没有端侧重排的线上对照提升有效观看 1.277%、点赞 8.218% 和关注 13.598%。表 7 的模型与束搜索平均耗时为 Android 120.80 ms、iOS 49.39 ms。
