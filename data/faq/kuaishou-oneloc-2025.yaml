- key: what
  q_en: What is OneLoc, in one sentence?
  a_en: OneLoc generates geo-aware semantic IDs end to end for Kuaishou local life; a one-week A/B at 10% traffic lifted GMV +21.016% and now serves full traffic.
  q_zh: OneLoc 一句话是什么？
  a_zh: OneLoc 为快手本地生活端到端生成地理感知语义 ID；10% 流量一周 A/B GMV +21.016%，现已全量。
