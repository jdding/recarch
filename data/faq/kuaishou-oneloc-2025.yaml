- key: caveats
  q_en: What should I keep in mind when reading the results of OneLoc?
  a_en: The paper states that local life service is disabled when a user forbids the app from visiting her real-time location. Offline baselines include traditional and generative recommenders, but the online comparison is against the production multi-stage pipeline only.
  q_zh: 读 OneLoc 的结果时要注意什么？
  a_zh: 论文说明当用户禁止 App 访问其实时位置时，本地生活服务会被停用。 离线基线含传统与生成式推荐器，但线上仅与生产多阶段管线对比。
  fields:
  - caveats.0
  - caveats.1
- key: inputs
  q_en: What inputs does OneLoc use?
  a_en: 'IDs and tokenization: Geo-aware semantic IDs from residual quantization with 3 codebooks of 8192 clusters. Input signals: Watch, click and pay behavior sequences with location IDs and location context embeddings; User real-time location as a gate and as the decoder query, with surrounding locations as keys and values; Geographic reward by user-store distance and GMV reward for DPO preference pairs.'
  q_zh: OneLoc 用了哪些输入？
  a_zh: ID 与 token 化：残差量化 3 个 8192 聚类码本的地理感知语义 ID。 输入特征：带位置 ID 与位置上下文嵌入的观看、点击、支付行为序列；用户实时位置作为门控与解码器 Query，周边位置作为 Key 和 Value；按用户门店距离的地理奖励与 GMV 奖励，用于 DPO 偏好对。
  fields:
  - id_tokenization.approach
  - features_signals.0
  - features_signals.1
  - features_signals.2
