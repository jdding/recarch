- key: core
  q_en: What is the core idea of OneLoc?
  a_en: Fuse location into semantic IDs, attention and decoder prompts, then align generation with distance and GMV rewards.
  q_zh: OneLoc 的核心思路是什么？
  a_zh: 把位置融入语义 ID、注意力和解码器提示，再用距离与 GMV 奖励对齐生成。
  fields:
  - core_idea
- key: results
  q_en: What results does OneLoc report?
  a_en: 'Online A/B, Table 4, one week, which Sec 5 describes as run on Kuaishou''s primary short-video recommendation scenario, at 10% treatment traffic against the production-level multi-stage pipeline with identical candidate pools: GMV +21.016%, order volume +17.891%, number of paying users +18.585% and new paying users +23.027%, all significant at p < 0.01 under two-tailed t-tests. Offline, Sec 4.2: on KuaiLLSR, OneLoc improves Recall@5 +13.46%, Recall@20 +10.44%, NDCG@5 +14.47% and NDCG@20 +12.97% over the second-best baseline; on the Foursquare global dataset the average gains are +13.18% Recall@5 and +16.34% NDCG@5. Ablations, Table 3: removing location scores drops Recall@5 from 0.3565 to 0.3476, removing the location gate to 0.3501, and removing geo-aware self-attention entirely to 0.3315. Scaling from 0.05B to 0.3B brings an average +6.96% recall and +7.29% NDCG.'
  q_zh: OneLoc 报告了哪些结果？
  a_zh: 线上 A/B 见表 4，一周，5 节称在快手主要短视频推荐场景进行，实验组 10% 流量，基线为候选池一致的生产级多阶段管线：GMV +21.016%、订单量 +17.891%、本地生活付费用户数 +18.585%、新付费用户 +23.027%，双尾 t 检验 p < 0.01。离线见 4.2 节：KuaiLLSR 上 Recall@5 +13.46%、Recall@20 +10.44%、NDCG@5 +14.47%、NDCG@20 +12.97%；Foursquare 全球集平均 Recall@5 +13.18%、NDCG@5 +16.34%。消融见表 3：去掉位置分数 Recall@5 从 0.3565 降到 0.3476，去掉位置门控降到 0.3501，整个地理感知自注意力去掉降到 0.3315。模型从 0.05B 扩到 0.3B 平均召回 +6.96%、NDCG +7.29%。
  fields:
  - results_reported
- key: online
  q_en: Does OneLoc have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: One week. A/B traffic: 10% of traffic in the treatment group, control on the production pipeline.'
  q_zh: OneLoc 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：一周。A/B 流量：实验组 10% 流量，对照组用生产管线。
