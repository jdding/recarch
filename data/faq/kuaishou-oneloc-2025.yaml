  q_en: Who built OneLoc and where does it run?
  a_en: 'OneLoc comes from Kuaishou, 2025. Deployed in: Kuaishou local life service, full traffic.'
  q_zh: OneLoc 是谁做的，用在哪里？
  a_zh: OneLoc 来自 快手，2025 年。上线位置：快手本地生活服务，全量流量。
