- key: training
  q_en: How is OneMall trained?
  a_en: 'Training mode: Next-token-prediction pre-training followed by RL post-training, in streaming training aligned to the LLM pre-train and post-train recipe; the online ranking model serves as the reward model. Objectives: Autoregressive next-item Semantic ID generation as the main objective; Two-tower style in-batch contrastive task as the auxiliary objective, on the final Semantic ID state against the item embedding, reaching over 98% accuracy@1; DPO and GRPO policy optimization against the fused ranking reward, with loss weight NTP plus 0.5 times RL.'
  q_zh: OneMall 是怎么训练的？
  a_zh: 训练方式：先下一 token 预测预训练、再 RL 后训练，流式训练，整体对齐 LLM 预训练加后训练范式；线上排序模型充当奖励模型。 训练目标：自回归下一物品语义 ID 生成为主目标；双塔式批内对比任务作辅助目标，用最终语义 ID 状态对物品向量，accuracy@1 超 98%；以融合排序奖励为信号做 DPO 与 GRPO 策略优化，损失权重为 NTP 加 0.5 倍 RL。
  fields:
  - training.mode
  - training.objectives
