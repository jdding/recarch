- key: core
  q_en: What is the core idea of OneMall?
  a_en: Tokenize items into three-level business-aware Semantic IDs, generate candidates with a sparse MoE decoder, and train the retriever against ranking-model rewards with DPO and GRPO.
  q_zh: OneMall 的核心思路是什么？
  a_zh: 把物品编码成业务感知的三级语义 ID，用 Sparse MoE 解码器生成候选，再以排序模型奖励经 DPO 与 GRPO 训练检索器。
