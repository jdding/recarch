- key: what
  q_en: What is OneMall, in one sentence?
  a_en: OneMall unifies Kuaishou e-commerce retrieval with a business-aware Semantic ID tokenizer, a sparse MoE decoder and ranking-reward RL; A/B lifts GMV up to +14.71% and serves over 400 million DAU.
  q_zh: OneMall 一句话是什么？
  a_zh: OneMall 用业务感知语义 ID 分词器加 Sparse MoE 解码器与排序奖励 RL 统一快手电商检索；A/B 使 GMV 最高提升 +14.71%，服务超 4 亿日活。
