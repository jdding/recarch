- key: inputs
  q_en: What inputs does OneMall use?
  a_en: 'IDs and tokenization: Three-level Semantic IDs: two Res-Kmeans layers plus a 16-bit FSQ layer with a 4096 code, over LLM-aligned item embeddings, extending QARM''s Res-Kmeans into ResKmeansFSQ. Input signals: Exposure, Click and Buy behavior sequences, each compressed by its own Query-Former; Item-side attributes such as product category, price and shop information, fed to an item tower for the auxiliary contrastive task; Multimodal tokenizer inputs: product main image 224*224 and title; short-video sample 6 frames 224*224 with title, OCR and ASR; Real-time selling-product Semantic IDs as an additional feature for live-streaming items; Ranking-model outputs CTR, CTCVR and EGPM fused into the RL reward.'
  q_zh: OneMall 用了哪些输入？
  a_zh: ID 与 token 化：三级语义 ID：两层 Res-Kmeans 加一层 16 比特 FSQ、末层 4096 码，量化对象是 LLM 对齐的物品向量，沿 QARM 的 Res-Kmeans 扩展成 ResKmeansFSQ。 输入特征：曝光、点击、购买行为序列，各由一个 Query-Former 压缩；物品侧属性，如商品类目、价格、店铺信息，进物品塔做辅助对比任务；分词器的多模态输入：商品主图 224*224 加标题；短视频抽 6 帧画面 224*224 加标题、OCR 与 ASR；直播物品的实时在售商品语义 ID 附加特征；排序模型输出的 CTR、CTCVR、EGPM 融合成 RL 奖励。
  fields:
