- key: results
  q_en: What results does OneSearch report?
  a_en: 'Online A/B on Kuaishou mall search (OneSearch with additional reward-model selection vs online cascade): search PVs +1.10%, item CTR +1.67%, PV CTR +3.14%, PV CVR +1.78%, buyers +2.40%, orders +3.22%. Pure OneSearch (no reward-model selection) is comparable to the online cascade. A cascade with only recall + pre-rank (no ranking) lost 9.97% item CTR and 39.14% orders.'
  q_zh: OneSearch 报告了哪些结果？
  a_zh: 快手商城搜索的线上 A/B，即额外选用奖励模型的 OneSearch 对比线上级联：搜索 PV +1.10%，item CTR +1.67%，PV CTR +3.14%，PV CVR +1.78%，买家数 +2.40%，订单 +3.22%。纯 OneSearch，不选用奖励模型，与线上级联相当。只有召回加预排序、没有排序的级联，item CTR 下降 9.97%，订单下降 39.14%。
  fields:
  - results_reported
