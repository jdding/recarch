- key: core
  q_en: What is the core idea of OneSearch?
  a_en: One encoder-decoder generates item semantic IDs and replaces the recall, pre-rank and rank cascade.
  q_zh: OneSearch 的核心思路是什么？
  a_zh: 一个 encoder-decoder 生成 item Semantic ID，取代召回、预排序和排序的级联。
