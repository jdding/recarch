- key: caveats
  q_en: What should I keep in mind when reading the results of OneSearch?
  a_en: Title calls this a 'preliminary exploration'; deployment is partial (100% / 50% / 20% on three surfaces). Best online gains require the added reward-model selection; the pure generative model only matches the cascade.
  q_zh: 读 OneSearch 的结果时要注意什么？
  a_zh: 标题称这是「preliminary exploration」；部署是部分的，三个场景上分别为 100%、50% 和 20%。 最好的线上收益需要额外选用奖励模型；纯生成式模型只能与级联持平。
