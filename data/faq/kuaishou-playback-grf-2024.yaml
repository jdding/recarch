- key: core
  q_en: What is the core idea of Kwai Playback GRF?
  a_en: Use a playback-risk gate to decide when cached candidates should replace the next cloud-ranked video.
  q_zh: Kwai Playback GRF 的核心思路是什么？
  a_zh: 先判断播放风险，再决定是否用已缓存的视频替换云侧排定的下一条。
  fields:
  - core_idea
- key: results
  q_en: What results does Kwai Playback GRF report?
  a_en: The full system improved overall watch time by 0.839% and watch time under poor network conditions by 44.45% against no GRF. Table 5 averages the last seven days of the production test. A separate gate-only arm kept cloud scores for cache ranking.
  q_zh: Kwai Playback GRF 报告了哪些结果？
  a_zh: 完整系统对比无 GRF，整体观看时长提升 0.839%，弱网条件下观看时长提升 44.45%。表 5 统计生产实验最后七天的均值。另有只加门控、用云侧分数排缓存的试验组。
  fields:
  - results_reported
- key: online
  q_en: Does Kwai Playback GRF have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: 2023-08 to 2023-10. Results average the last seven days.. A/B traffic: 10% of traffic per experiment arm.'
  q_zh: Kwai Playback GRF 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：2023-08 至 2023-10，报告最后七天的均值。。A/B 流量：每个试验组覆盖 10% 流量。
