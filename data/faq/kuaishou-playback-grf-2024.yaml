- key: what
  q_en: What is Kwai Playback GRF, in one sentence?
  a_en: Kwai tests whether the upcoming video is likely to stutter. When the gate fires, the phone uses a ranker to choose a playable replacement from its personalized cache.
  q_zh: Kwai Playback GRF 一句话是什么？
  a_zh: Kwai 在下一条播放前判断是否容易卡顿。命中门控条件时，手机从个性化缓存中重排并选出替代视频。
