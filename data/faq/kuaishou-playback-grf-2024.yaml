- key: caveats
  q_en: What should I keep in mind when reading the results of Kwai Playback GRF?
  a_en: The poor-network result applies to the conditions defined in the paper. The overall result comes from a different aggregation in the same experiment. Local replacements come from a personalized cache with cloud replenishment. Temporary offline operation is bounded by the cached items.
  q_zh: 读 Kwai Playback GRF 的结果时要注意什么？
  a_zh: 弱网结果限于文中的弱网条件。整体观看时长使用同一实验的整体统计口径。 本地替代项来自云侧持续补充的个性化缓存。临时断网下的服务范围由缓存决定。
