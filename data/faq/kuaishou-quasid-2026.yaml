- key: training
  q_en: How is QuaSID trained?
  a_en: 'Training mode: Offline periodic training of the tokenizer, then application in retrieval and ranking. Objectives: Reconstruction and residual quantization; Hamming-guided margin repulsion; Dual-tower contrastive loss.'
  q_zh: QuaSID 是怎么训练的？
  a_zh: 训练方式：离线周期性训练分词器，再应用到召回和排序中。 训练目标：重建和残差量化；Hamming 引导的 margin 排斥；双塔对比损失。
