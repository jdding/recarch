- key: what
  q_en: What is QuaSID, in one sentence?
  a_en: 'Kuaishou''s QuaSID learns semantic IDs that repel only genuinely colliding items; 5% traffic, 5-day A/B on e-commerce: ranking GMV-S2 +2.38%, cold-start retrieval completed orders up to +6.42%.'
  q_zh: QuaSID 一句话是什么？
  a_zh: 快手 QuaSID 学习 Semantic ID，只排斥真正发生冲突的 item；电商 5% 流量、5 天 A/B：排序 GMV-S2 +2.38%，冷启动召回成交订单最高 +6.42%。
  fields:
  - tldr
- key: who
  q_en: Who built QuaSID and where does it run?
  a_en: 'QuaSID comes from Kuaishou, 2026. Deployed in: Kuaishou e-commerce recommendation, in generative retrieval, discriminative retrieval and ranking.'
