- key: caveats
  q_en: What should I keep in mind when reading the results of QuaSID?
  a_en: The online control is the same stack with its previous tokenizer, which the paper does not name. The arXiv v1 PDF used here carries a template conference placeholder, so it is not confirmed as the camera-ready KDD text; the DOI is registered.
  q_zh: 读 QuaSID 的结果时要注意什么？
  a_zh: 线上对照组是同一条链路加上它此前的分词器，论文没有说明是哪一个。 这里使用的 arXiv v1 PDF 带有模板会议占位符，因此无法确认它就是 KDD 定稿版文本；DOI 已注册。
