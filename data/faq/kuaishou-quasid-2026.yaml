- key: core
  q_en: What is the core idea of QuaSID?
  a_en: A semantic-ID tokenizer pushes apart only the item pairs whose code collisions are real conflicts, scaled by severity.
  q_zh: QuaSID 的核心思路是什么？
  a_zh: Semantic ID 分词器只推开那些码冲突属于真实冲突的 item 对，并按严重程度缩放。
  fields:
  - core_idea
- key: results
  q_en: What results does QuaSID report?
  a_en: In a 5-day A/B on about 5% of Kuaishou e-commerce traffic, over 20 million users, all results significant, replacing the tokenizer with QuaSID gives in generative retrieval completed orders +0.21%, GMV-S1 +1.03% and GMV-S2 +0.55%, and in ranking GMV-S2 +2.38%, GMV-S1 +1.44% and completed orders +0.20%. On cold-start retrieval, completed orders rise +6.42% for videos under 100 views and +4.69% under 600 views, and retrieval overall gains +1.09% completed orders and +1.69% GMV. Offline on Amazon Beauty with the TIGER backbone, HR@10 is 0.0392 against 0.0379 for RQ-Kmeans and 0.0300 for RQ-VAE, and NDCG@10 is 0.0230 against 0.0211; the paper reports 5.9% better top-K ranking quality than the best baseline. Adding the repulsion loss to other tokenizers lifts NDCG@10 by up to 15.3% on Beauty and 20.1% on Toys.
  q_zh: QuaSID 报告了哪些结果？
  a_zh: 在快手电商约 5% 流量、超过两千万用户上做 5 天 A/B，所有结果显著；把分词器换成 QuaSID 后，生成式召回的成交订单 +0.21%，GMV-S1 +1.03%，GMV-S2 +0.55%；排序的 GMV-S2 +2.38%，GMV-S1 +1.44%，成交订单 +0.20%。冷启动召回上，观看次数不足 100 的视频成交订单 +6.42%，不足 600 的 +4.69%；召回整体成交订单 +1.09%，GMV +1.69%。在 Amazon Beauty 上用 TIGER 骨干做离线实验，HR@10 为 0.0392，RQ-Kmeans 为 0.0379，RQ-VAE 为 0.0300；NDCG@10 为 0.0230，对比 0.0211；论文称 top-K 排序质量比最佳基线高 5.9%。把排斥损失加到其他分词器上，NDCG@10 在 Beauty 上最多提升 15.3%，在 Toys 上最多提升 20.1%。
  fields:
  - results_reported
