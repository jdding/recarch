- key: what
  q_en: What is RecHarness, in one sentence?
  a_en: RecHarness allocates a limited trial budget among expert-defined directions using a bandit. A language model implements the selected edit and validation feedback guides later trials.
  q_zh: RecHarness 一句话是什么？
  a_zh: RecHarness 用多臂老虎机在专家定义的改动方向之间分配有限试验次数。语言模型实现被选中的改动，验证结果决定后续分配。
  fields:
  - tldr
- key: who
  q_en: Who built RecHarness and where does it run?
  a_en: 'RecHarness comes from Kuaishou, 2026. Deployed in: A large-scale short-video advertising ranking system.'
  q_zh: RecHarness 是谁做的，用在哪里？
  a_zh: RecHarness 来自 快手，2026 年。上线位置：大规模短视频广告排序系统。
  fields:
  - company
  - year
  - deployed_in
- key: core
  q_en: What is the core idea of RecHarness?
  a_en: Use observed validation returns to decide which type of model change gets the next trial.
  q_zh: RecHarness 的核心思路是什么？
  a_zh: 根据已经观察到的验证收益，把下一次试验分给合适的模型改动方向。
  fields:
  - core_idea
- key: results
  q_en: What results does RecHarness report?
  a_en: Section 3.5 and Table 4 report a 7-day short-video advertising A/B test on 10% of production traffic. For the selected sequence-encoder candidate, Advertiser Value increased 2.084%, revenue increased 0.534% and exposure increased 0.559%.
  q_zh: RecHarness 报告了哪些结果？
  a_zh: 第 3.5 节和表 4 报告短视频广告的 7 天 A/B，覆盖 10% 的生产流量。入选的序列编码改动使广告主价值提升 2.084%，收入提升 0.534%，曝光提升 0.559%。
  fields:
  - results_reported
- key: online
  q_en: Does RecHarness have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: 7 days. A/B traffic: 10% of production traffic.'
  q_zh: RecHarness 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：7 天。A/B 流量：10% 的生产流量。
