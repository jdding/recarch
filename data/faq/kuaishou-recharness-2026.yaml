- key: caveats
  q_en: What should I keep in mind when reading the results of RecHarness?
  a_en: The production experiment measures one promoted candidate. The paper compares trial-allocation policies offline. Experts define the available edit directions and the optimization objective.
  q_zh: 读 RecHarness 的结果时要注意什么？
  a_zh: 生产实验测量的是一项入选的排序改动。试验分配策略的对比在离线完成。 改动方向和优化目标由工程师定义。
  fields:
