- key: what
  q_en: What is RQ-Reg, in one sentence?
  a_en: RQ-Reg turns GMV prediction into coarse-to-fine code generation; a 7-day 10% A/B on Kuaishou ads lifted advertiser value +4.19% and long-tail +4.76%.
  q_zh: RQ-Reg 一句话是什么？
  a_zh: RQ-Reg 把 GMV 预测变成粗到细码生成；快手广告 7 天 10% A/B 广告主价值 +4.19%、长尾 +4.76%。
  fields:
  - tldr
- key: who
  q_en: Who built RQ-Reg and where does it run?
  a_en: 'RQ-Reg comes from Kuaishou, 2026. Deployed in: Kuaishou advertising ranker, GMV prediction model.'
  q_zh: RQ-Reg 是谁做的，用在哪里？
  a_zh: RQ-Reg 来自 快手，2026 年。上线位置：快手广告排序器的 GMV 预测模型。
