- key: core
  q_en: What is the core idea of RQ-Reg?
  a_en: Decompose a continuous target into coarse-to-fine quantization codes and generate them autoregressively, with an ordinal objective keeping code embeddings continuous.
  q_zh: RQ-Reg 的核心思路是什么？
  a_zh: 把连续目标分解为粗到细的量化码并自回归生成，用序数目标让码嵌入保持连续。
  fields:
  - core_idea
- key: results
  q_en: What results does RQ-Reg report?
  a_en: 'Online A/B, Table 7, seven days at 10% per arm against the WLR production baseline: overall AUC +0.12% and advertiser value ADVV +4.19%; on long-tailed commodity prices AUC +0.23% and ADVV +4.76%. Figure 5 daily trajectory: ADVV gains stay consistent and statistically significant across days 1 to 7; on day 8 the experimental bucket switched back to WLR, and the A/A test on days 9 to 13 shows a clear drop in ADVV, which the paper offers as evidence the gains come from the model. Offline, Table 1 and Table 2: RQ-Reg compares favorably against regression, classification and ordinal baselines on watch-time and LTV benchmarks; Table 3 ablations show consistent degradation without the representation objective or scheduled sampling; Table 5: RQ K-means beats K-means and dynamic quantile; Table 6: reconstruction MAE 1.33e-3 against 3.28e-3 for dynamic quantile with shorter fixed code length; Figure 3: error and MAE decrease monotonically with RQ levels up to plateau at L 3 and above.'
  q_zh: RQ-Reg 报告了哪些结果？
  a_zh: 线上 A/B 见表 7，每臂 10% 流量共七天，基线为 WLR 生产模型：整体 AUC +0.12%、广告主价值 ADVV +4.19%；长尾商品价位上 AUC +0.23%、ADVV +4.76%。图 5 逐日轨迹：第 1 至 7 天 ADVV 增益一致且统计显著；第 8 天实验桶切回 WLR，第 9 至 13 天 A/A 测试的 ADVV 明显回落，论文以此作为增益来自模型的证据。离线方面，表 1 与表 2：RQ-Reg 在观看时长与 LTV 基准上优于回归、分类与序数基线；表 3 消融显示去掉表示目标或计划采样一致退化；表 5：RQ K-means 胜过 K-means 与动态分位；表 6：重建 MAE 1.33e-3 对动态分位 3.28e-3 且码长更短固定；图 3：随 RQ 级数增加误差与 MAE 单调下降，L 至 3 后趋平。
  fields:
  - results_reported
- key: online
  q_en: Does RQ-Reg have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: Seven days, followed by a 5-day A/A holdout after switching back. A/B traffic: 10% of traffic per arm, about 40 million unique users per model.'
  q_zh: RQ-Reg 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：七天，随后切回基线再做 5 天 A/A 留白。A/B 流量：每臂 10% 流量，每模型约 4000 万独立用户。
  fields:
  - deployment.online_evidence
  - deployment.ab_duration
  - deployment.ab_traffic
- key: caveats
  q_en: What should I keep in mind when reading the results of RQ-Reg?
  a_en: The paper reports relative lifts over the production baseline; absolute AUC and ADVV values are not published. The A/B allocates 10% of traffic to each arm, matching arms at about 40 million users; bucket construction beyond that is not described.
  q_zh: 读 RQ-Reg 的结果时要注意什么？
  a_zh: 论文报告相对生产基线的提升；绝对 AUC 与 ADVV 值未公布。 A/B 每臂 10% 流量，两臂各约 4000 万用户；此之外的桶构造未描述。
  fields:
  - caveats.0
  - caveats.1
- key: stage
  q_en: Which stages of the pipeline does RQ-Reg cover?
  a_en: 'Ranking: GMV prediction model inside the two-stage advertising ranker, a 3 by 32 RQ codebook with an LSTM backbone, predicting a coarse-to-fine code sequence whose reconstruction is the GMV estimate.'
  q_zh: RQ-Reg 覆盖链路的哪些阶段？
  a_zh: 精排：两阶段广告排序器中的 GMV 预测模型：3×32 RQ 码本加 LSTM 骨干，预测粗到细码序列并重建为 GMV 估计。
  fields:
  - stages.0
- key: scale
  q_en: What scale does RQ-Reg report?
  a_en: 'Platform: Kuaishou short-video platform, over 400 million DAU, billions of daily impressions. A/B scale: 10% of traffic per arm, about 40 million unique users per model, seven days. Codebook: 3 RQ levels of 32 codes in the deployed configuration.'
  q_zh: RQ-Reg 报告了哪些规模信息？
  a_zh: 平台：快手短视频平台，超 4 亿日活，日数十亿曝光。 A/B 规模：每臂 10% 流量，每模型约 4000 万独立用户，七天。 码本：部署配置为 3 层 RQ 每层 32 码。
