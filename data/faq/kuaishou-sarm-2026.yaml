- key: what
  q_en: What is SARM, in one sentence?
  a_en: Kuaishou's SARM lets an offline multimodal LLM write semantic anchors for each live stream and trains them end to end inside the ranker; a two-week A/B shows Watch Time +0.962% on Kuaishou Lite.
  q_zh: SARM 一句话是什么？
  a_zh: 快手的 SARM 让离线多模态 LLM 为每个直播间写语义锚点，并在排序模型内端到端训练；两周 A/B 中快手极速版 Watch Time +0.962%。
