- key: core
  q_en: What is the core idea of SARM?
  a_en: Let an offline multimodal LLM write text anchors for each live stream, and train their encoder end to end inside the ranker, with a memory bank so nothing heavy runs per request.
  q_zh: SARM 的核心思路是什么？
  a_zh: 让离线多模态 LLM 为每个直播间写文字锚点，并在排序模型内端到端训练其编码器，再用 memory bank 保证每个请求都不用运行重计算。
  fields:
  - core_idea
- key: results
  q_en: What results does SARM report?
  a_en: Offline, with the deployed HoME as the base ranker, CTR AUC and GAUC go from 0.8387 and 0.6453 to 0.8411 and 0.6485 with SARM, and LVTR AUC and GAUC from 0.8928 and 0.7542 to 0.8959 and 0.7580. The two-stage baselines with tags, SIDs, or MLLM embeddings from MMBee and SIM reach CTR AUC 0.8390, 0.8389, 0.8385 and 0.8394. Gated fusion after every layer was the best fusion variant, and the stratified analysis shows larger relative gains for low-exposure authors. Replacing the Qwen2.5-VL-7B anchors with Qwen3-VL-8B raises the CTR AUC increment over the base from +0.19% to +0.24%. A two-week online A/B on key pages reports, for Kuaishou, Exposure +0.424%, Watch Count +0.189%, Watch Time +0.092%, Click +0.982%, Gift +0.482%, Effective View +0.070% and Follow +0.805%; for Kuaishou Lite, Exposure +1.190%, Watch Count +0.397%, Watch Time +0.962%, Click +0.562%, Gift +1.287%, Effective View +0.340% and Follow +0.522%. Table 5 puts training CPU at 51.71% against 48.69% for the base, GPU at 80.29% against 77.54%, training time per pass at 1.08x, inference QPS at 271.30 against 280.71 and time per query at 1.02x, with no statistically significant degradation reported.
  q_zh: SARM 报告了哪些结果？
  a_zh: 离线，以线上的 HoME 为基础排序模型，SARM 把 CTR 的 AUC 和 GAUC 从 0.8387 和 0.6453 提高到 0.8411 和 0.6485，LVTR 的 AUC 和 GAUC 从 0.8928 和 0.7542 提高到 0.8959 和 0.7580。使用标签、SID 或 MMBee 与 SIM 的 MLLM embedding 的两阶段基线，CTR AUC 分别为 0.8390、0.8389、0.8385 和 0.8394。每一层之后做门控融合是最好的融合方式，分层分析显示低曝光主播的相对收益更大。把 Qwen2.5-VL-7B 锚点换成 Qwen3-VL-8B，相对基础模型的 CTR AUC 提升从 +0.19% 增加到 +0.24%。关键页面上为期两周的线上 A/B：快手的 Exposure +0.424%，Watch Count +0.189%，Watch Time +0.092%，Click +0.982%，Gift +0.482%，Effective View +0.070%，Follow +0.805%；快手极速版的 Exposure +1.190%，Watch Count +0.397%，Watch Time +0.962%，Click +0.562%，Gift +1.287%，Effective View +0.340%，Follow +0.522%。Table 5 中训练 CPU 利用率为 51.71%，基础模型为 48.69%；GPU 为 80.29%，基础模型为 77.54%；每轮训练时间为 1.08x；推理 QPS 为 271.30，基础模型为 280.71；每次查询时间为 1.02x，论文没有报告统计显著的退化。
  fields:
  - results_reported
