- key: caveats
  q_en: What should I keep in mind when reading the results of SARM?
  a_en: The arXiv version read is a preprint in a placeholder ACM template, with the conference line still reading Conference acronym XX; the final CIKM 2026 text was not read. Online results are relative percentage changes against the production ranker over two weeks, with no traffic share, user count or confidence intervals given.
  q_zh: 读 SARM 的结果时要注意什么？
  a_zh: 读的 arXiv 版本是占位 ACM 模板下的预印本，会议行仍写着 Conference acronym XX，最终的 CIKM 2026 正文没有读。 线上结果是相对线上排序模型的相对百分比变化，周期两周，没有给出流量占比、用户数或置信区间。
