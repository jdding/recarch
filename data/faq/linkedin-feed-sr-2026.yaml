- key: caveats
  q_en: What should I keep in mind when reading the results of Feed SR?
  a_en: The paper gives no A/B traffic share, duration, user count or confidence intervals; the lifts are relative changes in time spent and in likes, comments and shares. Serving cost is reported as relative speedups and relative energy per item; absolute latency, GPU type and fleet size for serving are not given.
  q_zh: 读 Feed SR 的结果时要注意什么？
  a_zh: 论文没有给出 A/B 流量占比、时长、用户数或置信区间；提升是停留时间以及点赞、评论和分享的相对变化。 服务成本以相对加速比和每物品相对能耗给出；服务用的绝对延迟、GPU 型号和集群规模都没有给出。
  fields:
  - caveats.0
  - caveats.1
- key: inputs
  q_en: What inputs does Feed SR use?
  a_en: 'IDs and tokenization: Per-post feature embeddings and an action embedding per post, no semantic IDs. Input signals: Member history of up to 1000 impressed posts from one year of data, with the member action on each post; Post features and ID embeddings; Late-fused context features, mainly item popularity and viewer-author affinity; Member profile embeddings from a fine-tuned Qwen3 0.6 billion parameter model, refreshed daily.'
  q_zh: Feed SR 用了哪些输入？
  a_zh: ID 与 token 化：每个帖子的特征 embedding 加每个帖子的行为 embedding，不使用 Semantic ID。 输入特征：会员一年数据中最多 1000 条曝光帖子的历史，以及会员对每条帖子的行为；帖子特征和 ID embedding；后期融合的上下文特征，主要是物品热度和浏览者与作者的亲和度；会员画像 embedding，来自微调过的 Qwen3 6 亿参数模型，每天刷新。
