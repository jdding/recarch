- key: what
  q_en: What is Feed SR, in one sentence?
  a_en: LinkedIn's Feed SR replaces the DCNv2 ranker with a Transformer over a year of post and action history for 1.2 billion members; time spent +2.10%, likes, comments and shares +3.52%.
  q_zh: Feed SR 一句话是什么？
  a_zh: LinkedIn 的 Feed SR 用处理一年帖子与行为历史的 Transformer 取代 DCNv2 排序模型，服务 12 亿会员；停留时间 +2.10%，点赞、评论和分享 +3.52%。
