- key: core
  q_en: What is the core idea of Feed SR?
  a_en: Replace the DCNv2 Feed ranker with a decoder-only Transformer over a year of interleaved posts and actions, and make it serve with shared-context batching, custom kernels and a split CPU and GPU stack.
  q_zh: Feed SR 的核心思路是什么？
  a_zh: 用处理一年帖子与行为交错历史的仅解码器 Transformer 取代 DCNv2 的 Feed 排序模型，并通过共享上下文批处理、自定义 kernel 和 CPU 与 GPU 拆分的服务栈让它能上线。
  fields:
  - core_idea
- key: results
  q_en: What results does Feed SR report?
  a_en: Online, Feed SR was compared in controlled A/B tests with the previous production ranker, and the paper reports Overall time spent +2.10% and likes, comments and shares +3.52%. By segment, DAU gains are +2.38% and +4.07%, WAU +1.84% and +3.40%, MAU +0.82% and +1.86%, and new members are not statistically significant. These online results exclude incremental training. Feed SR has served the majority of Feed traffic for over three months. Relative energy per item against the previous model is 0.2 times in training and 0.7 times in inference. Training efficiency work reduced GPU hours by 22% for the metrics kernel, 15% for optimizer fusing, 50% for data loading and 16% for parallel evaluation. Scaling shows Long Dwell AUC improving by about 0.0093 per 10 times training FLOPs over 10^17 to 10^19 FLOPs. In the ablations, replacing the layers with HSTU lowers Long Dwell AUC by 0.23% and Contributions AUC by 0.28%, a Linear head lowers Long Dwell AUC by 1.20%, and no position embedding lowers it by 0.91%.
  q_zh: Feed SR 报告了哪些结果？
  a_zh: 线上，Feed SR 与此前的线上排序模型做对照 A/B 测试，论文报告整体停留时间 +2.10%，点赞、评论和分享 +3.52%。分人群看，DAU 提升为 +2.38% 和 +4.07%，WAU 为 +1.84% 和 +3.40%，MAU 为 +0.82% 和 +1.86%，新会员没有统计显著性。这些线上结果不含增量训练。Feed SR 已服务 Feed 流量的大部分超过三个月。相对此前模型的每物品能耗，训练是 0.2 倍，推理是 0.7 倍。训练效率方面的工作，使指标 kernel 的 GPU 小时减少 22%，optimizer 融合减少 15%，数据加载减少 50%，并行评估减少 16%。scaling 显示在 10^17 到 10^19 FLOPs 范围内，训练 FLOPs 每增加 10 倍，Long Dwell AUC 约提升 0.0093。消融中，把层换成 HSTU 使 Long Dwell AUC 降低 0.23%，Contributions AUC 降低 0.28%，Linear 头使 Long Dwell AUC 降低 1.20%，去掉位置 embedding 使其降低 0.91%。
  fields:
  - results_reported
