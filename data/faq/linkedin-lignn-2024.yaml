- key: what
  q_en: What is LiGNN, in one sentence?
  a_en: 'LiGNN: a deployed GraphSAGE-style GNN over a graph with up to a hundred billion nodes; reports about +2% Ads CTR and +1% job-application hearing-back rate.'
  q_zh: LiGNN 一句话是什么？
  a_zh: LiGNN：已部署的 GraphSAGE 风格 GNN，图规模最高达千亿节点；报告广告 CTR 约 +2%，求职申请收到回复率约 +1%。
