- key: results
  q_en: What results does LiGNN report?
  a_en: 'Abstract-level approximate relative production gains: 1% job application hearing-back rate, 2% Ads CTR, 0.5% Feed engaged DAU, 0.2% sessions and 0.1% WAU from People Recommendation. Follow Feed (Table 4, incremental validation AUC): 200 vs 20 neighbors +3.2%, attention aggregator +0.9%, dual encoder +2.5%, ID embeddings +15.3%, graph densification +0.5%, 2-hop PPR sampling +0.6%, temporal graph +5.8%; offline recall +9.6% vs the rule-based candidate selection; online +0.5% Feed engaged DAU. Temporal ablation (Table 1, Feed): baseline AUC 0.71978; all combined 0.76176 (+5.83%). OON Feed: about +0.2% DAU engaging with professional content. Jobs per Table 5: offline AUC +1.1%, online renewal rate +0.3%, positive hearing-back rate +1.0%, company follows +1.8%; temporal model +6.8% AUC in Job Recommendation Ranking with +0.4% job viewers and +0.4% qualified applicants. People Recommendation per Table 7: offline recall +29.6%, sessions +0.2%, WAU +0.1%, new member connections +2.4%; PPR sampling beats weighted sampling by at least 2% (multi-hop PPR +2.3%, 2-hop PPR +2.1%). Ads per Table 8: member embeddings +0.17% AUC, all embeddings +0.39% AUC, about +2% online CTR.'
  q_zh: LiGNN 报告了哪些结果？
  a_zh: 摘要中给出的线上相对收益，均为近似值：求职申请收到回复率 1%，广告 CTR 2%，Feed 互动 DAU 0.5%，人的推荐带来的会话数 0.2% 和 WAU 0.1%。Follow Feed，见表 4，增量验证 AUC：200 个邻居对比 20 个 +3.2%，attention 聚合器 +0.9%，双编码器 +2.5%，ID embedding +15.3%，图稠密化 +0.5%，2 跳 PPR 采样 +0.6%，时序图 +5.8%；离线 recall 相比基于规则的候选选择 +9.6%；线上 Feed 互动 DAU +0.5%。时序消融，见表 1，Feed：基线 AUC 0.71978；全部组合 0.76176，即 +5.83%。OON Feed：与专业内容互动的 DAU 约 +0.2%。职位，见表 5：离线 AUC +1.1%，线上续订率 +0.3%，正向回复率 +1.0%，公司关注 +1.8%；时序模型在职位推荐排序中 AUC +6.8%，职位浏览者 +0.4%，合格申请者 +0.4%。人的推荐，见表 7：离线 recall +29.6%，会话数 +0.2%，WAU +0.1%，新增成员连接 +2.4%；PPR 采样至少比加权采样好 2%，多跳 PPR +2.3%，2 跳 PPR +2.1%。广告，见表 8：成员 embedding AUC +0.17%，全部 embedding AUC +0.39%，线上 CTR 约 +2%。
  fields:
  - results_reported
