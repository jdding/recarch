- key: caveats
  q_en: What should I keep in mind when reading the results of LiGNN?
  a_en: The headline gains are described by the paper as approximate relative improvements and are not all from a single A/B; each product has its own A/B with its own metrics. The paper's ablation numbers are validation AUC lifts on Follow Feed and are incremental (each row on top of the previous).
  q_zh: 读 LiGNN 的结果时要注意什么？
  a_zh: 论文把头条收益描述为近似的相对提升，并非全部来自同一个 A/B；每个产品有自己的 A/B 和自己的指标。 论文的消融数字是 Follow Feed 上的验证 AUC 提升，且是增量的，即每一行都叠加在上一行之上。
  fields:
  - caveats.0
  - caveats.1
