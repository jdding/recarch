- key: training
  q_en: How is LiGNN trained?
  a_en: 'Training mode: Offline training on Kubernetes with a CPU Graph Engine (Microsoft DeepGNN) plus GPU trainers fetching sampled compute graphs over gRPC; Horovod with NCCL ring allreduce. Distributed training uses 6 to 24 workers. Objectives: link prediction with binary cross entropy and in-batch negative objectives; long-term loss predicting future events for the temporal model.'
  q_zh: LiGNN 是怎么训练的？
  a_zh: 训练方式：在 Kubernetes 上离线训练，用 CPU 图引擎 Microsoft DeepGNN，加上通过 gRPC 拉取采样计算图的 GPU 训练器；Horovod 搭配 NCCL ring allreduce。分布式训练使用 6 到 24 个 worker。 训练目标：链接预测，使用二元交叉熵和 batch 内负样本目标；预测未来事件的长期损失，用于时序模型。
  fields:
  - training.mode
  - training.objectives
