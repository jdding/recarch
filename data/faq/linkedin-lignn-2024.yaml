- key: core
  q_en: What is the core idea of LiGNN?
  a_en: A GraphSAGE-style encoder over a hundred-billion-node graph, with temporal modeling and 2-hop PPR sampling.
  q_zh: LiGNN 的核心思路是什么？
  a_zh: 在千亿节点的图上用 GraphSAGE 风格的编码器，带时序建模和 2 跳 PPR 采样。
  fields:
