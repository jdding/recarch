- key: core
  q_en: What is the core idea of Semantic Search?
  a_en: Distill relevance and engagement teachers into one compact SLM ranker and serve it with prefill-only GPU inference, making LLM-based semantic search practical at production scale.
  q_zh: Semantic Search 的核心思路是什么？
  a_zh: 把相关性与互动教师蒸馏进一个紧凑的 SLM 排序模型，用仅预填充的 GPU 推理服务，让基于 LLM 的语义搜索能在生产规模运行。
