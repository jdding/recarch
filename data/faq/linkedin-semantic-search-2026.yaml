- key: caveats
  q_en: What should I keep in mind when reading the results of Semantic Search?
  a_en: The launch gains are reported in the Online Deployment section without experiment design details; the paper gives no A/B traffic share, duration or confidence intervals. The abstract reports ranking throughput over 75× under a fixed latency constraint, while Sec 2.3.3 reports about 76× for MixLM over raw-text SLMs and about 10× over summarized-text SLMs; the two comparisons use different baselines.
  q_zh: 读 Semantic Search 的结果时要注意什么？
  a_zh: 上线收益在 Online Deployment 一节给出，但没有实验设计细节；论文未给 A/B 流量占比、时长或置信区间。 摘要写的是固定延迟约束下排序吞吐超过 75×，2.3.3 节写的是 MixLM 对原文 SLM 约 76×、对摘要 SLM 约 10×；两个比较的基线不同。
  fields:
