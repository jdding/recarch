  q_en: What is Semantic Search, in one sentence?
  a_en: LinkedIn distills LLM relevance and engagement teachers into a compact SLM ranker for Semantic Search; Job Search NDCG@10 +7.73%, Poor Match Rate@10 -46.88%, DAU over +1.2% since launch.
