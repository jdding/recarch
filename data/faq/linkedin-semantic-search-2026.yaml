- key: inputs
  q_en: What inputs does Semantic Search use?
  a_en: 'IDs and tokenization: Structured raw-text prompts and embeddings; no item IDs or semantic IDs. Input signals: Query Understanding outputs: routing decisions, normalized attributes and query reformulations shared across stages; Shared searcher context in the prompt prefix: searcher profile and interactions; Member summary generated by an RL-trained summarizer over profiles, professional content, search activity and historical queries; Member text features such as headlines, past positions and locations; Activity history text, for example the last 10 job titles the member interacted with; Numerical features such as common connections, network distance and historical CTR with explicit clicks and impressions, truncated to 2 decimal places.'
  q_zh: Semantic Search 用了哪些输入？
  a_zh: ID 与 token 化：结构化原文提示与嵌入表示，没有物品 ID 或 Semantic ID。 输入特征：Query Understanding 输出：路由决策、归一化属性与查询改写，全阶段共享；提示前缀中的共享搜索者上下文：搜索者资料与互动；由强化学习训练的摘要器生成的会员摘要，覆盖资料、职业内容、搜索活动与历史查询；会员文本特征，如 headline、过往职位与地点；活动历史文本，如会员最近互动的 10 个职位标题；数值特征，如共同人脉数、网络距离与带显式点击和曝光的历史 CTR，截断到 2 位小数。
