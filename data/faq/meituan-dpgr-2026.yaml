- key: caveats
  q_en: What should I keep in mind when reading the results of DPGR?
  a_en: The online gains are cumulative over three rollout stages against a two-tower control, so they mix the generative backbone, state conditioning and multi-intent generation. The offline evidence is mainly an internal dataset; the public KuaiRand-Pure set lacks content, POI and spatiotemporal signals.
  q_zh: 读 DPGR 的结果时要注意什么？
  a_zh: 线上收益是对比双塔对照组、三个上线阶段累计的结果，因此混合了生成式骨干、状态条件和多意图生成的贡献。 离线证据主要来自内部数据集；公开的 KuaiRand-Pure 数据集缺少内容、POI 和时空信号。
  fields:
  - caveats.0
  - caveats.1
- key: inputs
  q_en: What inputs does DPGR use?
  a_en: 'IDs and tokenization: Discrete intent codes learned by quantizing dual-domain behaviors, codebook size 256. Input signals: Content interactions on notes, videos and reviews; POI interactions such as collects and check-ins; Domain type and action type per interaction; Spatiotemporal context of scene, time slot, location and travel state.'
  q_zh: DPGR 用了哪些输入？
  a_zh: ID 与 token 化：通过量化双域行为学到的离散意图码，码本大小 256。 输入特征：对笔记、视频和点评的内容交互；POI 交互，如收藏和打卡；每个交互的域类型和行为类型；由场景、时段、位置和出行状态构成的时空上下文。
