- key: what
  q_en: What is DPGR, in one sentence?
  a_en: 'Meituan''s DPGR is an HSTU-based generative retriever over Dianping content and POI actions; 7-day 15% A/B vs the two-tower: POI collects +5.209%, content views +1.486%.'
  q_zh: DPGR 一句话是什么？
  a_zh: 美团 DPGR 是基于 HSTU 的生成式召回模型，覆盖大众点评内容和 POI 行为；对比双塔做 7 天 15% A/B：POI 收藏 +5.209%，内容浏览 +1.486%。
  fields:
  - tldr
- key: who
  q_en: Who built DPGR and where does it run?
  a_en: 'DPGR comes from Meituan, 2026. Deployed in: Dianping homepage feed and immersive video stream, retrieval stage, tested on 15% of traffic.'
  q_zh: DPGR 是谁做的，用在哪里？
  a_zh: DPGR 来自 美团，2026 年。上线位置：大众点评首页信息流和沉浸式视频流，召回阶段，在 15% 流量上测试。
