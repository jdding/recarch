- key: core
  q_en: What is the core idea of DPGR?
  a_en: An HSTU sequence model predicts discrete intent codes, and each code issues its own ANN query.
  q_zh: DPGR 的核心思路是什么？
  a_zh: HSTU 序列模型预测离散意图码，每个意图码各自发起一次 ANN 查询。
  fields:
  - core_idea
- key: results
  q_en: What results does DPGR report?
  a_en: 'Online A/B, 7 days on a 15% random bucket against the production discriminative two-tower retriever, cumulative over three rollout stages, all p < 0.05: content views +1.486%, content watch time +1.015%, POI clicks +0.527%, POI collects +5.209%. Stage 1 with the plain HSTU backbone gave +0.493% content views and +3.226% POI collects; stage 2 with state conditioning gave +1.103% and +3.314%. Offline on the internal Dianping set, Recall@200 is 0.6594 for DPGR with three intents, 0.4777 for one intent, 0.3517 for TBGRecall, 0.3206 for HSTU and 0.0415 for DSSM. On public KuaiRand-Pure, Recall@100 is 0.3265 for DPGR against 0.3184 for HSTU.'
  q_zh: DPGR 报告了哪些结果？
  a_zh: 线上 A/B：在 15% 随机分桶上对比线上判别式双塔召回，持续 7 天，三个上线阶段累计，全部 p < 0.05：内容浏览 +1.486%，内容观看时长 +1.015%，POI 点击 +0.527%，POI 收藏 +5.209%。第 1 阶段使用普通 HSTU 骨干，内容浏览 +0.493%，POI 收藏 +3.226%；第 2 阶段加入状态条件后，分别为 +1.103% 和 +3.314%。大众点评内部数据集上的离线结果：Recall@200，三意图的 DPGR 为 0.6594，单意图为 0.4777，TBGRecall 为 0.3517，HSTU 为 0.3206，DSSM 为 0.0415。公开数据集 KuaiRand-Pure 上，Recall@100，DPGR 为 0.3265，HSTU 为 0.3184。
  fields:
  - results_reported
