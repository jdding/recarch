- key: caveats
  q_en: What should I keep in mind when reading the results of MTGenRec?
  a_en: The paper states that MTGenRec is developed based on TorchRec, and TorchRec is the only PyTorch-native GRM training framework, so no alternative baselines are compared. The online A/B baseline is the production DLRM that has been continuously learning for 2 years, while the GRM is trained from scratch on 10 days of logs, which the paper itself notes as a significantly lower training data volume.
  q_zh: 读 MTGenRec 的结果时要注意什么？
  a_zh: 论文说明 MTGenRec 基于 TorchRec 开发，且 TorchRec 是唯一面向 PyTorch 的 GRM 训练框架，因此未比较其他基线。 线上 A/B 的基线是持续学习 2 年的生产 DLRM，而 GRM 在 10 天日志上从零训练，论文自己也指出训练数据量明显更少。
  fields:
  - caveats.0
  - caveats.1
- key: training
  q_en: How is MTGenRec trained?
  a_en: 'Training mode: Offline end-to-end synchronous training over Hive log chunks with a pipelined next-batch prefetch. Objectives: Cross-entropy loss of the GRM, with weighted gradient averaging to correct for dynamic batch sizes across devices.'
  q_zh: MTGenRec 是怎么训练的？
  a_zh: 训练方式：基于 Hive 日志块的离线端到端同步训练，带下一批预取流水线。 训练目标：GRM 的交叉熵损失，按动态批大小做加权梯度平均以校正跨设备差异。
  fields:
  - training.mode
  - training.objectives
