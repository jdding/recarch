- key: core
  q_en: What is the core idea of MTGenRec?
  a_en: Give generative recommenders a training system with dynamic hash embedding tables, deduplicated lookups and sequence balancing, so full-length sequences train at over 100 GPUs.
  q_zh: MTGenRec 的核心思路是什么？
  a_zh: 为生成式推荐器配上带动态哈希嵌入表、去重查找和序列均衡的训练系统，让全长序列在 100 多张 GPU 上训练。
