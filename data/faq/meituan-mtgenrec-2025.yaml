- key: what
  q_en: What is MTGenRec, in one sentence?
  a_en: MTGenRec trains Meituan's generative recommenders 1.6x to 2.4x faster on over 100 GPUs with dynamic embedding tables and sequence balancing; Take-away A/B lifted orders +1.22%.
  q_zh: MTGenRec 一句话是什么？
  a_zh: MTGenRec 用动态嵌入表和序列均衡让美团生成式推荐器在 100 多张 GPU 上训练快 1.6 至 2.4 倍；外卖 A/B 订单 +1.22%。
