- key: inputs
  q_en: What inputs does MTGenRec use?
  a_en: 'IDs and tokenization: Plain feature IDs mapped into dynamic hash-based embedding tables; no semantic IDs. Input signals: Contextual, historical and exposed item sequences of the GRM; Sparse categorical features across users, items and context; Variable-length user sequences, average length 600 and maximum 3,000.'
  q_zh: MTGenRec 用了哪些输入？
  a_zh: ID 与 token 化：普通特征 ID 映射进动态哈希嵌入表；无 Semantic ID。 输入特征：GRM 的上下文、历史与曝光物品序列；覆盖用户、物品和上下文的稀疏类别特征；变长用户序列，平均长度 600，最长 3000。
