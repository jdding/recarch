- key: what
  q_en: What is MTGR, in one sentence?
  a_en: HSTU-based generative ranker that keeps DLRM cross features; vs a years-optimized DLRM, conversion volume +1.22% and CTR +1.31% with 12% cheaper inference.
  q_zh: MTGR 一句话是什么？
  a_zh: 基于 HSTU 的生成式排序器，保留 DLRM 的交叉特征；对比优化多年的 DLRM，转化量 +1.22%，CTR +1.31%，推理成本降低 12%。
