- key: core
  q_en: What is the core idea of MTGR?
  a_en: An HSTU-based generative ranker that keeps DLRM features and compresses samples per user.
  q_zh: MTGR 的核心思路是什么？
  a_zh: 基于 HSTU 的生成式排序器，保留 DLRM 特征，并按用户压缩样本。
