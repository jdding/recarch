- key: results
  q_en: What results does MTGR report?
  a_en: 'MTGR-large vs a years-optimized DLRM baseline: online conversion volume +1.22%, CTR +1.31%; training cost unchanged and inference cost -12%; described as the largest gain in nearly two years, handling the main traffic.'
  q_zh: MTGR 报告了哪些结果？
  a_zh: MTGR-large 对比优化多年的 DLRM 基线：线上转化量 +1.22%，CTR +1.31%；训练成本不变，推理成本 -12%；被描述为近两年最大的收益，承接主流量。
  fields:
  - results_reported
