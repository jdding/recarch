- key: stage
  q_en: Which stages of the pipeline does MTGR cover?
  a_en: 'Ranking: MTGR: HSTU-style stack where tokens come from user features, real-time and historical behavior sequences, and candidate items (with their cross features); logits read from candidate tokens via an MLP.'
  q_zh: MTGR 覆盖链路的哪些阶段？
  a_zh: 精排：MTGR：HSTU 风格的堆叠，token 来自用户特征、实时和历史行为序列，以及候选 item，带它们的交叉特征；通过 MLP 从候选 token 读出 logit。
