  q_en: Does MTGR have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: not reported. A/B traffic: 2% of traffic, millions of exposures per day.'
  q_zh: MTGR 有线上证据吗，A/B 做了多久？
