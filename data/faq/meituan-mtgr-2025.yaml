- key: caveats
  q_en: What should I keep in mind when reading the results of MTGR?
  a_en: Gains are against Meituan's own highly tuned DLRM baseline in specific scenarios; the scenarios are only described as 'our scenarios'. The paper claims plain generative recommendation that drops cross features degrades quality, which is its own finding on its own data.
  q_zh: 读 MTGR 的结果时要注意什么？
  a_zh: 收益是对比美团自己高度调优的 DLRM 基线，且在特定场景中；这些场景只被描述为「our scenarios」。 论文称，去掉交叉特征的纯生成式推荐会降低质量，这是它在自己数据上的发现。
  fields:
  - caveats.0
  - caveats.1
