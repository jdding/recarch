- key: what
  q_en: What is SIF, in one sentence?
  a_en: Meituan SIF keeps the context of each past interaction in compressed tokens. Against the production HyFormer ranker, CTR rose 2.03% in a seven-day A/B test.
  q_zh: SIF 一句话是什么？
  a_zh: 美团 SIF 用压缩 token 保留每次历史交互的上下文。为期七天的线上 A/B 中，CTR 较线上 HyFormer 排序器提升 2.03%。
  fields:
  - tldr
- key: who
  q_en: Who built SIF and where does it run?
  a_en: 'SIF comes from Meituan, 2026. Deployed in: Meituan food-delivery recommendation.'
  q_zh: SIF 是谁做的，用在哪里？
  a_zh: SIF 来自 美团，2026 年。上线位置：美团外卖推荐。
  fields:
  - company
  - year
