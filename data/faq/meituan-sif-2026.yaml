- key: core
  q_en: What is the core idea of SIF?
  a_en: Compress the context of each past interaction and attend over the resulting history when scoring the current candidate.
  q_zh: SIF 的核心思路是什么？
  a_zh: 压缩每次历史交互的上下文，再根据压缩后的历史为当前候选打分。
  fields:
  - core_idea
- key: results
  q_en: What results does SIF report?
  a_en: In Section 4.5 and Table 5, a 5% traffic holdout over 7 days against the production HyFormer ranker reports CTR +2.03%, CVR +1.21% and GMV per session +1.35%. CTR rose 0.53% for users with fewer than 10 interactions and 3.12% for users with at least 500 interactions.
  q_zh: SIF 报告了哪些结果？
  a_zh: 第 4.5 节和表 5 记录了为期 7 天、保留流量占比 5% 的线上实验。相对线上 HyFormer，CTR +2.03%，CVR +1.21%，每会话 GMV +1.35%。历史交互少于 10 次的用户 CTR 提升 0.53%，至少有 500 次交互的用户提升 3.12%。
  fields:
  - results_reported
- key: online
  q_en: Does SIF have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: 7 days. A/B traffic: 5% traffic holdout.'
  q_zh: SIF 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：7 天。A/B 流量：保留 5% 流量。
  fields:
  - deployment.online_evidence
  - deployment.ab_duration
  - deployment.ab_traffic
- key: caveats
  q_en: What should I keep in mind when reading the results of SIF?
  a_en: The 5% figure is the reported holdout share. The paper gives no allocation for each experiment arm. The online results cover the reported food-delivery deployment. The paper does not give serving latency or hardware.
  q_zh: 读 SIF 的结果时要注意什么？
  a_zh: 5% 是原文报告的保留流量比例，各实验组分别占多少流量未报告。 结果来自论文描述的外卖上线场景，服务延迟和硬件未报告。
  fields:
  - caveats.0
  - caveats.1
- key: training
  q_en: How is SIF trained?
  a_en: 'Training mode: Label-supervised tokenization and discriminative ranking. Objectives: Interaction prediction with binary cross-entropy; Quantization commitment loss and alignment of the current-request projection with the codebook.'
  q_zh: SIF 是怎么训练的？
  a_zh: 训练方式：用标签监督样本分词，并训练判别式排序模型。 训练目标：用二元交叉熵预测交互；量化承诺损失，以及当前请求投影与码本的对齐损失。
  fields:
