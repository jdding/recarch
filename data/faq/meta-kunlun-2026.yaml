- key: caveats
  q_en: What should I keep in mind when reading the results of Kunlun?
  a_en: 'The deployment claim is one sentence in the abstract, contribution list and Section 5.4: "1.2% improvement in topline metrics". The paper gives no A/B design, traffic share, surface breakdown or duration. All scaling and ablation numbers come from offline training on internal datasets; absolute NE values are not shown and NEs are not comparable across compute scales.'
  q_zh: 读 Kunlun 的结果时要注意什么？
  a_zh: 部署的说法只有一句，出现在摘要、贡献列表和第 5.4 节中：「topline 指标提升 1.2%」。论文没有给出 A/B 设计、流量占比、分场景拆解或时长。 所有扩展和消融数字都来自内部数据集上的离线训练；没有展示绝对的 NE 值，且不同算力档位之间的 NE 不可比。
  fields:
  - caveats.0
  - caveats.1
