- key: inputs
  q_en: What inputs does Kunlun use?
  a_en: 'IDs and tokenization: ID embeddings. Input signals: Hundreds to thousands of non-sequence dense and sparse features such as user demographics, ad metadata and context; 10+ user-history sequences of length hundreds to thousands, over event types (clicks, conversions, impressions); Timestamp gaps (Rotary Temporal Embeddings, log-scaled).'
  q_zh: Kunlun 用了哪些输入？
  a_zh: ID 与 token 化：ID embeddings。 输入特征：数百到数千个非序列稠密和稀疏特征，如用户人口属性、广告元数据和上下文；10 条以上的用户历史序列，长度从数百到数千，覆盖点击、转化和曝光等事件类型；时间戳间隔，使用 Rotary Temporal Embeddings，取对数缩放。
  fields:
