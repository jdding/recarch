- key: core
  q_en: What is the core idea of Kunlun?
  a_en: One stack of Transformer and interaction blocks handles sequence and non-sequence features.
  q_zh: Kunlun 的核心思路是什么？
  a_zh: 同一组 Transformer 和交互模块同时处理序列特征和非序列特征。
  fields:
  - core_idea
- key: results
  q_en: What results does Kunlun report?
  a_en: 'Paper claims: MFU 17% to 37% on NVIDIA B200; 2x scaling efficiency over state-of-the-art (scaling coefficient about 2x InterFormer). NE gain over Wukong at 6/60/180 GFLOPs: Kunlun 0.31%/0.66%/0.79% vs InterFormer 0.31%/0.36%/0.50% (Figure 3; Kunlun uses 154.9 vs 172.3 GFLOPs at the 180 scale). Ablations per Table 1: w/o GDPA MFU 34.0%, QPS -8%, NE +0.04%; Computation Skip -43.1% FLOPs and +35% QPS at NE-neutral; sliding window +31.1% QPS and -29.5% FLOPs; event personalization +13% QPS and -11% FLOPs. Production: deployed across major Meta Ads models with a 1.2% improvement in topline metrics.'
  q_zh: Kunlun 报告了哪些结果？
  a_zh: 论文声称：NVIDIA B200 上 MFU 为 17% 到 37%；扩展效率是当前最优方法的 2x，扩展系数约为 InterFormer 的 2x。相对 Wukong 的 NE 提升，在 6、60、180 GFLOPs 下：Kunlun 为 0.31%、0.66%、0.79%，InterFormer 为 0.31%、0.36%、0.50%，见图 3；在 180 这一档，Kunlun 用 154.9 GFLOPs，InterFormer 用 172.3。消融见表 1：去掉 GDPA 后 MFU 为 34.0%，QPS -8%，NE +0.04%；Computation Skip 在 NE 不变时 FLOPs -43.1%，QPS +35%；滑动窗口 QPS +31.1%，FLOPs -29.5%；事件个性化 QPS +13%，FLOPs -11%。线上：已部署在 Meta 主要的广告模型中，topline 指标提升 1.2%。
  fields:
  - results_reported
