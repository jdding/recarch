- key: what
  q_en: What is Kunlun, in one sentence?
  a_en: 'Efficiency-first joint sequence plus feature-interaction ads ranker at Meta: MFU 17% to 37% on B200, 2x scaling efficiency over InterFormer; deployed with +1.2% topline.'
  q_zh: Kunlun 一句话是什么？
  a_zh: Meta 以效率优先的序列加特征交互联合广告排序模型：B200 上 MFU 从 17% 提升到 37%，扩展效率是 InterFormer 的 2x；已上线，topline 提升 +1.2%。
