- key: core
  q_en: What is the core idea of Meta Lattice?
  a_en: Redesign the model space across thousands of domain-objective pairs by consolidating data and unifying models.
  q_zh: Meta Lattice 的核心思路是什么？
  a_zh: 通过整合数据和统一模型，重新设计数千个领域目标组合上的模型空间。
