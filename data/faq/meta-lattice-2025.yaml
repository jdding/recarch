- key: caveats
  q_en: What should I keep in mind when reading the results of Meta Lattice?
  a_en: The production measures cover the combined redesign. The paper leaves the mix of revenue-driving metrics unspecified. Ads quality is the paper's measure of user satisfaction. It reports the conversion gain as up to 6%.
  q_zh: 读 Meta Lattice 的结果时要注意什么？
  a_zh: 生产指标对应整套改造。论文未披露驱动收入的指标由哪些具体项组成。 论文用广告质量衡量用户满意度。转化改善为最高 6%。
