- key: results
  q_en: What results does Meta Lattice report?
  a_en: Section 5 compares Lattice with prior Meta Ads portfolios served by separate models trained on isolated data. The combined redesign reports +10% on revenue-driving top-line metrics, +11.5% on ads quality, up to +6% in ad conversions and 20% savings in power capacity. In the separate CTR experiment in Section 4.5, Table 5 reports a 0.24% loss improvement from KTAP at a 0.6 cache hit rate and a six-hour TTL, versus 0.12% with soft-label distillation.
  q_zh: Meta Lattice 报告了哪些结果？
  a_zh: 第 5 节比较 Lattice 和此前的 Meta 广告系统。此前每个领域与目标组合单独建模，训练数据互相隔离。整套改造的结果为驱动收入的指标 +10%，广告质量 +11.5%，广告转化最高 +6%，节省 20% 电力容量。第 4.5 节还有单独的 CTR 实验。表 5 显示，缓存命中率为 0.6、有效期为六小时时，KTAP 的损失改善为 0.24%，软标签蒸馏为 0.12%。
  fields:
  - results_reported
