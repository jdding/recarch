- key: what
  q_en: What is LLaTTE, in one sentence?
  a_en: 'Two-stage ads sequence modeling at Meta: a huge async upstream user model caches embeddings for a light online ranker; about 0.25% NE gain and +4.3% conversions on Feed and Reels.'
  q_zh: LLaTTE 一句话是什么？
  a_zh: Meta 的两阶段广告序列建模：一个庞大的异步上游用户模型缓存 embedding，供轻量的在线排序模型使用；Feed 和 Reels 上 NE 约提升 0.25%，转化 +4.3%。
  fields:
  - tldr
