- key: caveats
  q_en: What should I keep in mind when reading the results of LLaTTE?
  a_en: Scaling-law studies are offline on the upstream model, on a proprietary platform; the paper reports slopes and NE deltas but no absolute NE. The deployed online sequence module is intentionally much smaller than the models in the scaling study.
  q_zh: 读 LLaTTE 的结果时要注意什么？
  a_zh: 扩展律研究是在私有平台上对上游模型做的离线实验；论文报告斜率和 NE 变化量，但没有绝对 NE。 线上部署的序列模块有意比扩展实验中的模型小得多。
