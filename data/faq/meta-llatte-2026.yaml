- key: inputs
  q_en: What inputs does LLaTTE use?
  a_en: 'IDs and tokenization: ID embeddings plus dense content embeddings. Input signals: User sequences of 500 to 5000 actions in experiments and about 400 per source online; Ad, user-ad and context features; Dense content embeddings from LLaMA-based and multimodal content-understanding models.'
  q_zh: LLaTTE 用了哪些输入？
  a_zh: ID 与 token 化：ID embedding 加稠密内容 embedding。 输入特征：实验中的用户序列为 500 到 5000 个行为，线上每个来源约 400 个；广告、用户与广告交叉以及上下文特征；来自基于 LLaMA 和多模态内容理解模型的稠密内容 embedding。
