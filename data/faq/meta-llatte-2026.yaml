- key: core
  q_en: What is the core idea of LLaTTE?
  a_en: A compact transformer sequence module in the online ranker consumes cached embeddings from a large asynchronous upstream user model.
  q_zh: LLaTTE 的核心思路是什么？
  a_zh: 在线排序模型里的紧凑 Transformer 序列模块，使用大型异步上游用户模型缓存的 embedding。
  fields:
  - core_idea
- key: results
  q_en: What results does LLaTTE report?
  a_en: 'Scaling (offline, NE vs production baseline): Deep-Balanced L=8, d=256 gives -0.17% NE; with content embeddings a 4-layer model gains -0.118% vs +0.06% to -0.01% without. Slopes alpha vs log10 FLOPs: sequence length 0.265, depth 0.200, width 0.133, no-content 0.082. Upstream to downstream transfer ratio about 50% (upstream -0.14% gives downstream -0.07%; 53% for a model-heavy variant). Production: across multiple large-scale A/B tests the online LLaTTE plus upstream embeddings gave about 0.25% NE reduction on the flagship ads ranker, a 4.3% conversion uplift on Facebook Feed and Reels, with no measurable P99 change.'
  q_zh: LLaTTE 报告了哪些结果？
  a_zh: 扩展实验，离线，NE 相对线上基线：Deep-Balanced L=8、d=256 时 NE 为 -0.17%；加入内容 embedding 后，4 层模型 NE 为 -0.118%，不加则为 +0.06% 到 -0.01%。斜率 alpha 对 log10 FLOPs：序列长度 0.265，深度 0.200，宽度 0.133，不含内容 0.082。上游到下游的传递比约为 50%，上游 -0.14% 对应下游 -0.07%；偏模型的变体为 53%。线上：在多个大规模 A/B 测试中，在线 LLaTTE 加上游 embedding 让旗舰广告排序模型的 NE 约降低 0.25%，Facebook Feed 和 Reels 的转化提升 4.3%，P99 无可测量的变化。
  fields:
  - results_reported
