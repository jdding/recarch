- key: core
  q_en: What is the core idea of MPZCH?
  a_en: Track the ID occupying every slot and probe linearly, evicting expired entries with a full state reset, so each user and item keeps its own fresh embedding.
  q_zh: MPZCH 的核心思路是什么？
  a_zh: 记录每个槽位的占用 ID 并线性探测，淘汰过期条目时整体重置状态，让每个用户和物品保有自己的新鲜嵌入。
  fields:
  - core_idea
- key: results
  q_en: What results does MPZCH report?
  a_en: 'Collision study, Table 1, on 150 million unique user IDs: the Sigrid hash baseline keeps a 13.61% collision rate even at 3.33x capacity, while MPZCH reaches a 0.0000% collision rate at 1.33x capacity with probe depth 256, where Sigrid retains 29.65%, and at 2.0x capacity with probe depth 64, where Sigrid retains 21.31%; at probe depth 8 and 1.00x capacity it sits at 12.09% versus Sigrid 36.79%. Kernel benchmark, Table 2: batched HBM or CUDA latency stays at 0.8 to 0.9 ms for probe depths 8 through 512, UVM batched 4.4 ms, CPU or DRAM batched 6.1 to 8.9 ms and non-batched 94.2 to 102.7 ms. User embeddings, Table 3: deploying MPZCH in the production Video Late-Stage Ranking model improved Normalized Entropy in 14 of 17 prediction tasks with 3 neutral, including Video View Duration +0.38%, Video View Percentage 100 +0.12% and Skip +0.12%, gains the paper calls statistically significant given years of prior optimization. Item embeddings, Sec 4.2: in the HSTU-based video retrieval model with 24-hour Post ID and 72-hour Owner ID TTLs, A/B testing yielded 0.83% more impressions for new videos posted within 48 hours; intra-creator embedding similarity rose from 0.66% to 0.91% same day and same-and-next day, +38%, and overall from 0.62% to 0.77%, +25%.'
  q_zh: MPZCH 报告了哪些结果？
  a_zh: 冲突研究，表 1，1.5 亿唯一用户 ID：Sigrid 哈希基线在 3.33 倍容量下仍有 13.61% 冲突率，MPZCH 在 1.33 倍容量、探测深度 256 时冲突率为 0.0000%，此时 Sigrid 为 29.65%；在 2.0 倍容量、深度 64 时同样 0.0000%，此时 Sigrid 为 21.31%；深度 8 且 1.00 倍容量时为 12.09%，Sigrid 为 36.79%。内核基准见表 2：HBM 即 CUDA 批处理延迟在深度 8 到 512 间保持 0.8 到 0.9 毫秒，UVM 批处理 4.4 毫秒，CPU 即 DRAM 批处理 6.1 到 8.9 毫秒、非批处理 94.2 到 102.7 毫秒。用户嵌入见表 3：在生产视频后期排序模型部署 MPZCH 后，17 个预测任务中 14 个 Normalized Entropy 改善、3 个持平，含视频观看时长 +0.38%、视频观看完成率 100 +0.12%、跳过 +0.12%，论文称鉴于该模型已经多年迭代优化，这些提升具有统计显著性。物品嵌入见 4.2 节：在 Post ID 24 小时、Owner ID 72 小时 TTL 的 HSTU 视频检索模型中，A/B 使 48 小时内发布的新视频曝光提升 0.83%；同一创作者视频嵌入相似度从 0.66% 升至 0.91%，当天与次日均 +38%，总体从 0.62% 升至 0.77% 即 +25%。
  fields:
  - results_reported
