- key: what
  q_en: What is MPZCH, in one sentence?
  a_en: MPZCH removes embedding-table collisions with linear probing and TTL eviction; at Meta it reached zero collisions for 150M users and +0.83% impressions for new videos.
  q_zh: MPZCH 一句话是什么？
  a_zh: MPZCH 用线性探测加 TTL 淘汰消除嵌入表冲突；在 Meta 对 1.5 亿用户实现零冲突，新视频曝光 +0.83%。
  fields:
  - tldr
- key: who
  q_en: Who built MPZCH and where does it run?
  a_en: 'MPZCH comes from Meta, 2026. Deployed in: Video Late-Stage Ranking and an HSTU video retrieval model at Meta.'
  q_zh: MPZCH 是谁做的，用在哪里？
  a_zh: MPZCH 来自 Meta，2026 年。上线位置：Meta 的视频后期排序模型与 HSTU 视频检索模型。
