- key: caveats
  q_en: What should I keep in mind when reading the results of MPZCH?
  a_en: The A/B traffic share, duration and significance levels are not reported. The paper notes that MPZCH requires table capacity to exceed ID cardinality and a sufficient probe depth, for example 512, to guarantee zero collisions.
  q_zh: 读 MPZCH 的结果时要注意什么？
  a_zh: 未报告 A/B 流量占比、时长与显著性水平。 论文说明 MPZCH 需要表容量超过 ID 基数并配合足够探测深度如 512 才能保证零冲突。
