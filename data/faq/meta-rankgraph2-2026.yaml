- key: core
  q_en: What is the core idea of RankGraph-2?
  a_en: A heterogeneous co-engagement graph with a co-learned cluster index replaces online KNN.
  q_zh: RankGraph-2 的核心思路是什么？
  a_zh: 异构共同互动图加上联合学习的聚类索引，取代在线 KNN。
  fields:
  - core_idea
- key: results
  q_en: What results does RankGraph-2 report?
  a_en: 'Online, from a 14-day A/B on two surfaces with RankGraph-2 added as a retrieval source and all results significant at p < 0.05: U2I2I CTR +0.96% / +0.33% and CVR +2.75% / +0.76% on Surface 1 / Surface 2; U2U2I CTR +0.40% / +0.20% and CVR +1.01% / +0.17%. Cluster index serving cost -83% vs online KNN at comparable CTR and CVR; 20+ retrieval launches. Offline (100K users, Table 2) Recall@5 0.143 vs 0.038 for GAT-DGI (3.8x) and 0.013 for HSTU; item embeddings per Table 3 Recall@100 0.775 vs 0.374 for PBG (2.1x) and 0.434 for HSTU. Index hitrate@1 0.846 vs 0.871 for original embeddings, 0.717 without regularization.'
  q_zh: RankGraph-2 报告了哪些结果？
  a_zh: 线上结果来自两个场景上 14 天的 A/B，把 RankGraph-2 作为召回源加入，所有结果在 p < 0.05 下显著：场景 1 和场景 2 上，U2I2I 的 CTR 分别为 +0.96% 和 +0.33%，CVR 分别为 +2.75% 和 +0.76%；U2U2I 的 CTR 分别为 +0.40% 和 +0.20%，CVR 分别为 +1.01% 和 +0.17%。聚类索引的在线服务成本比在线 KNN 低 83%，CTR 和 CVR 相当；共 20+ 次召回上线。离线结果见表 2，100K 用户：Recall@5 为 0.143，GAT-DGI 为 0.038，即 3.8x，HSTU 为 0.013；item embedding 见表 3，Recall@100 为 0.775，PBG 为 0.374，即 2.1x，HSTU 为 0.434。索引 hitrate@1 为 0.846，原始 embedding 为 0.871，去掉正则为 0.717。
  fields:
  - results_reported
