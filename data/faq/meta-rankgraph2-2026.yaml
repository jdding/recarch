- key: caveats
  q_en: What should I keep in mind when reading the results of RankGraph-2?
  a_en: Surfaces are anonymized as Surface 1 and Surface 2; absolute metric values are not given. Offline baselines are GAT-DGI, PyTorch-BigGraph and HSTU, evaluated on Meta internal data with samples of 100K users or 1,000 edges.
  q_zh: 读 RankGraph-2 的结果时要注意什么？
  a_zh: 两个场景被匿名为场景 1 和场景 2；没有给出指标的绝对值。 离线基线为 GAT-DGI、PyTorch-BigGraph 和 HSTU，在 Meta 内部数据上评估，样本为 100K 用户或 1,000 条边。
  fields:
  - caveats.0
  - caveats.1
- key: training
  q_en: How is RankGraph-2 trained?
  a_en: 'Training mode: Continuous training on edge-centric data from a graph rebuilt every 3 hours from 24 hours of engagement. Objectives: Margin ranking loss plus InfoNCE (tau 0.06) per edge type, weighted by uncertainty weighting; Reconstruction loss, contrastive loss on reconstructed embeddings and code-imbalance regularization for the cluster index.'
  q_zh: RankGraph-2 是怎么训练的？
  a_zh: 训练方式：在每 3 小时用 24 小时互动数据重建一次的图上，基于以边为中心的数据持续训练。 训练目标：每种边类型各用 margin ranking loss 加 InfoNCE，tau 为 0.06，并用不确定性加权；聚类索引使用重建损失、对重建 embedding 的对比损失以及码不均衡正则。
  fields:
  - training.mode
  - training.objectives
