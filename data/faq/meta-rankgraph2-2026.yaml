- key: what
  q_en: What is RankGraph-2, in one sentence?
  a_en: Meta graph retrieval co-designing graph construction, GNN training and a learned cluster index; up to +0.96% CTR and +2.75% CVR in 14-day A/B tests, serving cost -83%, 20+ retrieval launches.
  q_zh: RankGraph-2 一句话是什么？
  a_zh: Meta 的图召回系统，联合设计图构建、GNN 训练和学习得到的聚类索引；14 天 A/B 中 CTR 最高 +0.96%，CVR 最高 +2.75%，在线服务成本 -83%，共 20+ 次召回上线。
  fields:
  - tldr
