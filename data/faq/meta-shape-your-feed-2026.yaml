- key: caveats
  q_en: What should I keep in mind when reading the results of Shape Your Feed?
  a_en: The paper does not name the host app or the feed surface; the card says Meta social feed. The headline offline accuracy of 98.85% is measured on labels from the same LLM judge ensemble that produced the training labels; on the independent human-labeled set accuracy is 95.8% and F1 is 75.1%.
  q_zh: 读 Shape Your Feed 的结果时要注意什么？
  a_zh: 论文没有说明所在的 App 和信息流场景；本卡写作 Meta 社交信息流。 离线准确率 98.85% 这个头条数字，是在与训练标签同一个 LLM 评审团给出的标签上测得的；在独立的人工标注集上准确率为 95.8%，F1 为 75.1%。
  fields:
  - caveats.0
  - caveats.1
- key: training
  q_en: How is Shape Your Feed trained?
  a_en: 'Training mode: Offline SFT and recurring DPO of the alignment scorer. Objectives: SFT on labels from an LLM-as-a-Judge ensemble, with rationales generated by Llama 4 Maverick; DPO on chosen and rejected pairs from explicit user feedback and judge-annotated contexts.'
  q_zh: Shape Your Feed 是怎么训练的？
  a_zh: 训练方式：对齐打分器的离线 SFT 和定期 DPO。 训练目标：用 LLM 评审团的标签做 SFT，推理理由由 Llama 4 Maverick 生成；用来自显式用户反馈和评审标注上下文的选中与拒绝样本对做 DPO。
  fields:
  - training.mode
  - training.objectives
