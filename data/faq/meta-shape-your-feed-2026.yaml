  q_en: Does Shape Your Feed have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: Several months. A/B traffic: A randomized subset of live production traffic, US and Canada users aged 18 and above; share not reported.'
  q_zh: Shape Your Feed 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：数月。A/B 流量：一小部分随机化的线上生产流量，用户为 18 岁以上的美国和加拿大用户；占比未报告。
