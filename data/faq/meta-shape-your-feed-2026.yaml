- key: what
  q_en: What is Shape Your Feed, in one sentence?
  a_en: Meta's Shape Your Feed turns user feedback into a Semantic Profile that an 8B LLM uses to prune and re-rank feed candidates; the online A/B shows post dislike -2.74% and post dismiss -1.70%.
  q_zh: Shape Your Feed 一句话是什么？
  a_zh: Meta 的 Shape Your Feed 把用户反馈变成语义画像，由一个 8B 的 LLM 据此剔除并重排信息流候选；线上 A/B 中不喜欢帖子 -2.74%，忽略帖子 -1.70%。
  fields:
  - tldr
