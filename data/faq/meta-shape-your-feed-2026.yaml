- key: core
  q_en: What is the core idea of Shape Your Feed?
  a_en: Keep a text Semantic Profile of what the user asked for and use an 8B LLM to prune and re-rank candidates against it on top of the production ranker.
  q_zh: Shape Your Feed 的核心思路是什么？
  a_zh: 维护一份记录用户所说偏好的文本语义画像，用 8B 的 LLM 在生产排序之上据此剔除并重排候选。
  fields:
  - core_idea
- key: results
  q_en: What results does Shape Your Feed report?
  a_en: 'Offline, the alignment scorer on a judge-annotated evaluation set: few-shot baseline accuracy 83.84% with latency 650 ms, SFT 98.21% with 325 ms and SFT plus DPO 98.85% with 323 ms; F1 53.00%, 76.97% and 79.51%. On the independent golden set of 1029 human samples, SFT plus DPO reaches accuracy 95.8%, precision 75.6%, recall 74.7% and F1 75.1%; zero-shot Llama 3 8B scores accuracy 87.0% and Llama 3 70B 94.6% on that set. Online, a large-scale A/B over several months on a randomized subset of production traffic, with users in the US and Canada aged 18 and above, restricted to the Context-Aware Feedback Pills interface: post dismiss -1.70%, post dislike -2.74% and interest consumption +0.16%, all against the production baseline. Context-Aware Pills took 76.02% of pill interactions against 23.98% for static pills. The full system adds +0.043% critical-path latency and +0.412% direct-tier latency.'
  q_zh: Shape Your Feed 报告了哪些结果？
  a_zh: 离线，对齐打分器在评审团标注的评测集上：few-shot 基线的准确率为 83.84%，延迟 650 ms，SFT 为 98.21%，延迟 325 ms，SFT 加 DPO 为 98.85%，延迟 323 ms；F1 分别为 53.00%、76.97% 和 79.51%。在 1029 条人工样本组成的独立 golden 集上，SFT 加 DPO 的准确率为 95.8%，精确率 75.6%，召回率 74.7%，F1 为 75.1%；零样本的 Llama 3 8B 在该集合上准确率为 87.0%，Llama 3 70B 为 94.6%。线上，在一小部分随机化的生产流量上做了持续数月的大规模 A/B，用户为 18 岁以上的美国和加拿大用户，只开放上下文感知反馈药丸界面：忽略帖子 -1.70%，不喜欢帖子 -2.74%，兴趣消费 +0.16%，均相对生产基线。上下文感知药丸占药丸交互的 76.02%，静态药丸为 23.98%。整套系统给关键路径增加 +0.043% 的延迟，给直接层增加 +0.412% 的延迟。
  fields:
  - results_reported
