- key: core
  q_en: What is the core idea of Unity?
  a_en: Tokenize engagement events into latent tokens, then add a Transformer that generalizes DCN v2 and a masked self-supervised loss.
  q_zh: Unity 的核心思路是什么？
  a_zh: 把互动事件 tokenize 成隐式 token，再加一个推广了 DCN v2 的 Transformer 和 masked 自监督损失。
  fields:
  - core_idea
- key: results
  q_en: What results does Unity report?
  a_en: 'Production (Meta): Pollen first launched April 2023 on short-form video; A/B +2.76% WatchTime on VDD and +3.68% WatchTime on IFR (statistically significant); offline VDD NE gains -0.34% to -0.49% per Table 2 and IFR click NE -0.66%, like -0.97% per Table 3. Pollen on one core ads model: -0.15% NE. Unity tokenization: ads -0.15% NE (RQ) vs mid-2025 baseline per Table 4; VDD -0.38% to -0.58% NE per Table 5. Unity Encoder on five core ads models (vs July 2025 baselines): -0.06% to -0.14% NE (Table 6; models A-E -0.08, -0.1, -0.06, -0.14, -0.08). Adding SSL gives about -0.05% NE more on average. Scaling per Table 7: Unity Tiny/XS/S/M reach -0.05/-0.08/-0.10/-0.13% NE at +4/+14/+72/+260% FLOPs, claimed 2.3x-4.9x scaling efficiency vs the existing scaling curve. Public datasets per Table 8: small AUC gains over DCNv2 and Wukong on KuaiVideo, AmazonElectronics, TaobaoAds.'
  q_zh: Unity 报告了哪些结果？
  a_zh: Meta 线上：Pollen 于 April 2023 首次在短视频上线；A/B 中 VDD 的 WatchTime +2.76%，IFR 的 WatchTime +3.68%，均统计显著；按表 2，离线 VDD 的 NE 提升为 -0.34% 到 -0.49%，按表 3，IFR 点击 NE -0.66%，点赞 -0.97%。Pollen 在一个核心广告模型上：NE -0.15%。Unity tokenization：按表 4，相对 mid-2025 基线，广告 NE -0.15%，用 RQ；按表 5，VDD NE -0.38% 到 -0.58%。Unity Encoder 在五个核心广告模型上，相对 July 2025 基线：NE -0.06% 到 -0.14%，表 6；模型 A-E 为 -0.08、-0.1、-0.06、-0.14、-0.08。加入 SSL 平均再多带来约 -0.05% NE。按表 7 的扩展：Unity Tiny/XS/S/M 在 FLOPs +4/+14/+72/+260% 时达到 NE -0.05/-0.08/-0.10/-0.13%，声称相对现有扩展曲线的扩展效率为 2.3x-4.9x。按表 8 的公开数据集：在 KuaiVideo、AmazonElectronics、TaobaoAds 上，相对 DCNv2 和 Wukong 有小幅 AUC 提升。
  fields:
  - results_reported
