- key: caveats
  q_en: What should I keep in mind when reading the results of Unity?
  a_en: Several Unity Encoder ads configurations are described as "in the process of full-scale production launch" with "early online A/B" showing gains, but no A/B figures are given for them; the only quoted online numbers are the 2023 Pollen WatchTime gains. Ads results are offline NE only. NE differences are relative to moving production baselines; models A-E are anonymized.
  q_zh: 读 Unity 的结果时要注意什么？
  a_zh: Unity Encoder 的若干广告配置被描述为「in the process of full-scale production launch」，并称「early online A/B」显示有收益，但没有给出它们的 A/B 数字；唯一引用的线上数字是 2023 年 Pollen 的 WatchTime 收益。 广告结果只有离线 NE。NE 的差异是相对不断变化的线上基线；模型 A-E 已匿名。
  fields:
  - caveats.0
  - caveats.1
