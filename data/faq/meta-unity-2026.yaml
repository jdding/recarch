- key: training
  q_en: How is Unity trained?
  a_en: 'Training mode: Pretrain-style joint SSL plus supervised loss; production models are recurrently trained on fresh data at near-real-time cadence. Objectives: Supervised engagement prediction across click, conversion, like and watch-time tasks; Masked latent-token reconstruction (SSL).'
  q_zh: Unity 是怎么训练的？
  a_zh: 训练方式：预训练式的 SSL 与有监督损失联合训练；线上模型以近实时的节奏在新数据上持续训练。 训练目标：跨点击、转化、点赞和观看时长任务的有监督互动预测；Masked 隐 token 重建，SSL。
  fields:
  - training.mode
  - training.objectives
