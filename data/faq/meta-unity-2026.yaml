- key: what
  q_en: What is Unity, in one sentence?
  a_en: Meta ranking recipe of latent event tokenization, Pollen Transformer and masked-token SSL; Pollen A/B +2.76% to +3.68% WatchTime on video; Unity Encoder -0.06% to -0.14% NE on five ads models.
  q_zh: Unity 一句话是什么？
  a_zh: Meta 的排序方案：隐式事件 tokenization、Pollen Transformer 和 masked-token SSL；Pollen 的 A/B 中视频 WatchTime +2.76% 到 +3.68%；Unity Encoder 在五个广告模型上 NE -0.06% 到 -0.14%。
  fields:
  - tldr
- key: who
  q_en: Who built Unity and where does it run?
  a_en: 'Unity comes from Meta, 2026. Deployed in: Meta ads ranking across five core ads models, and short-form video ranking for IFR and VDD.'
  q_zh: Unity 是谁做的，用在哪里？
  a_zh: Unity 来自 Meta，2026 年。上线位置：Meta 的五个核心广告模型的广告排序，以及 IFR 和 VDD 的短视频排序。
