- key: caveats
  q_en: What should I keep in mind when reading the results of VLM?
  a_en: Online A/B metrics are anonymized into Metric-Topline, Metrics-C and Metrics-E categories following prior work, so surface names and metric identities are not public. The platforms are described as powered by distinct model architectures but are not named.
  q_zh: 读 VLM 的结果时要注意什么？
  a_zh: 线上 A/B 指标沿用先前工作的做法做了匿名化，分为 Metric-Topline、Metrics-C 和 Metrics-E 三类，场景名与指标身份未公开。 论文说明两个平台由不同模型架构驱动，但未给出平台名称。
