- key: what
  q_en: What is VLM, in one sentence?
  a_en: Versioned late materialization stores each user's history once and rebuilds it at training time; it cuts primary read bandwidth up to -70.3% and unlocked 4K-to-64K sequences at Meta.
  q_zh: VLM 一句话是什么？
  a_zh: 版本化晚物化让每份用户历史只存一份、训练时重建；主读取带宽最高降 70.3%，并在 Meta 解锁了 4K 到 64K 的序列扩展。
  fields:
  - tldr
