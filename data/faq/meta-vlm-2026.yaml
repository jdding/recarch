- key: core
  q_en: What is the core idea of VLM?
  a_en: Store the append-only user history once in an immutable tier and rebuild the exact inference-time state at training time from lightweight version pointers.
  q_zh: VLM 的核心思路是什么？
  a_zh: 把只追加的用户历史在不可变层只存一份，训练时用轻量版本指针重建精确的推理时状态。
  fields:
  - core_idea
- key: results
  q_en: What results does VLM report?
  a_en: 'System efficiency, Table 1, against the Fat Row baseline on three model tenants sharing one union dataset: primary write bandwidth -46.2% shared across tenants; primary read bandwidth Model A -70.3%, Model B -50.9%, Model C -47.7%; sequence lookup bandwidth added by late materialization, streaming, Model A +62.7%, Model B +16.2%, Model C +8.7%, batch, +24.6%, +6.5% and +3.4%; per-batch data loading latency Model A +9.7%, Model B -26.4%, Model C -36.2%. The immutable store delivers 3.4x read throughput per unit host resource; tuning the disaggregated preprocessing base batch adds 15% per-worker throughput; pipelined I/O prefetching adds 10% on heavy-lookup models; data-affinity bucketing and symmetric sharding cut batch read bandwidth by 60% and raise per-worker throughput by 28%. Model quality, Section 5.2: the Fat Row Wall sits at about 4K where data-service usage exceeds 0.75 of GPU training power; Platform A gains 1.2% cumulative Normalized Entropy from 4K to 64K, above 5% total, and Platform B gains 0.65% from 4K to 10K, where a 1% NE improvement is considered a success. Online A/B, Table 2, with anonymized metrics: Platform A at 4K to 16K lifts Metric-Topline +0.22%, Metrics-C +4.1%, Metrics-E-1 +2.3% and Metrics-E-2 +4.3%; Platform B at 4K to 10K lifts Metric-Topline +0.14%, Metrics-C +0.79%, Metrics-E-3 +1.4% and Metrics-E-4 +1.7%.'
  q_zh: VLM 报告了哪些结果？
  a_zh: 系统效率，表 1，相对 Fat Row 基线、共享同一并集数据集的三个模型租户：主写入带宽 -46.2%，由租户共享；主读取带宽 Model A -70.3%、Model B -50.9%、Model C -47.7%；晚物化新增的序列查找带宽，流式下 Model A +62.7%、Model B +16.2%、Model C +8.7%，批式下 +24.6%、+6.5%、+3.4%；每批数据加载延迟 Model A +9.7%、Model B -26.4%、Model C -36.2%。不可变存储每单位主机资源读吞吐为 3.4 倍；分离式预处理的基础批大小调优带来每 worker 吞吐 15% 提升；流水线 I/O 预取在重查找模型上带来 10%；数据亲和分桶与对称分片把批式读取带宽降 60%、每 worker 吞吐提升 28%。模型质量见 5.2 节：Fat Row 墙约在 4K，此时数据服务资源超过 GPU 训练算力的 0.75；Platform A 从 4K 到 64K 累计 Normalized Entropy 提升 1.2%，总计超过 5%，Platform B 从 4K 到 10K 提升 0.65%，论文说明该生产规模下 1% 的 NE 提升即被视为成功。线上 A/B 见表 2，指标匿名化：Platform A 在 4K 到 16K 使 Metric-Topline +0.22%、Metrics-C +4.1%、Metrics-E-1 +2.3%、Metrics-E-2 +4.3%；Platform B 在 4K 到 10K 使 Metric-Topline +0.14%、Metrics-C +0.79%、Metrics-E-3 +1.4%、Metrics-E-4 +1.7%。
  fields:
  - results_reported
