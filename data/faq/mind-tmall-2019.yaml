  q_en: Who built MIND and where does it run?
  a_en: 'MIND comes from Alibaba / Tmall, 2019. Deployed in: Matching stage of the Mobile Tmall App homepage.'
  q_zh: MIND 是谁做的，用在哪里？
  a_zh: MIND 来自 阿里巴巴 / 天猫，2019 年。上线位置：手机天猫 App 首页的匹配阶段。
