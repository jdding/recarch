- key: results
  q_en: What results does MIND report?
  a_en: 'Offline HitRate per Table 2, TmallData with K = 5, d = 64: MIND-K-interest HR@10 0.0972 vs YouTube DNN 0.0589 (+65.03%), HR@50 0.2080 vs 0.1256, HR@100 0.2699 vs 0.1648; Amazon Books K = 3, d = 36: HR@10 0.0309 vs 0.0231 (+33.77%). Online: one-week A/B on the Tmall homepage against item-based CF (which served the majority of traffic) and YouTube DNN; MIND beats both on CTR, with 5-7 interests best and 5 enough, while the dynamic interest number gives similar CTR to 7 interests and lowers serving cost. Exact CTR deltas appear only in Figure 4, not in the text.'
  q_zh: MIND 报告了哪些结果？
  a_zh: 离线 HitRate，见表 2，TmallData 上 K = 5，d = 64：MIND-K-interest 的 HR@10 为 0.0972，YouTube DNN 为 0.0589，+65.03%，HR@50 为 0.2080 对 0.1256，HR@100 为 0.2699 对 0.1648；Amazon Books 上 K = 3，d = 36：HR@10 为 0.0309 对 0.0231，+33.77%。线上：在天猫首页做为期一周的 A/B，对比基于 item 的 CF，它承接了大部分流量，以及 YouTube DNN；MIND 的 CTR 优于两者，其中 5-7 个兴趣最好，5 个就够，而动态兴趣数的 CTR 与 7 个兴趣相近，并降低了服务成本。具体的 CTR 提升只出现在图 4 中，正文里没有。
  fields:
  - results_reported
