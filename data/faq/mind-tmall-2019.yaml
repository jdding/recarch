- key: what
  q_en: What is MIND, in one sentence?
  a_en: MIND gives each user several interest vectors via capsule-style dynamic routing; on TmallData HR@10 is 0.0972 vs 0.0589 for YouTube DNN.
  q_zh: MIND 一句话是什么？
  a_zh: MIND 用胶囊式动态路由为每个用户生成多个兴趣向量；在 TmallData 上 HR@10 为 0.0972，YouTube DNN 为 0.0589。
  fields:
  - tldr
