- key: core
  q_en: What is the core idea of MIND?
  a_en: Represent each user with several interest vectors from capsule-style dynamic routing.
  q_zh: MIND 的核心思路是什么？
  a_zh: 用胶囊式动态路由，为每个用户生成多个兴趣向量。
  fields:
