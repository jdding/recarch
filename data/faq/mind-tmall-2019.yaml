- key: caveats
  q_en: What should I keep in mind when reading the results of MIND?
  a_en: Online CTR gains are shown only in a figure per Figure 4; no numeric lift is in the text. The paper says the homepage of the Mobile Tmall App accounts for about half of Tmall traffic; this is context, not a statement about MIND's share.
  q_zh: 读 MIND 的结果时要注意什么？
  a_zh: 线上 CTR 的提升只在图 4 中以图的形式给出；正文中没有数值提升。 论文称手机天猫 App 的首页约占天猫流量的一半；这是背景，并不是关于 MIND 占比的陈述。
  fields:
  - caveats.0
  - caveats.1
- key: training
  q_en: How is MIND trained?
  a_en: 'Training mode: Offline training on a Model Training Platform using 100 GPUs, about 8 hours per run; the served network is updated every day. Objectives: sampled-softmax next-item likelihood.'
  q_zh: MIND 是怎么训练的？
  a_zh: 训练方式：在模型训练平台上离线训练，用 100 块 GPU，每轮约 8 小时；线上服务的网络每天更新。 训练目标：sampled-softmax 的下一个 item 似然。
  fields:
