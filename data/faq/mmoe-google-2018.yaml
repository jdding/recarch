items:
- key: what
  q_en: What is MMoE, in one sentence?
  a_en: Multi-gate Mixture-of-Experts gives each task its own gate over shared experts, learning task relationships from data; tested at Google, shared-bottom was the one in production.
  q_zh: MMoE 一句话是什么？
  a_zh: Multi-gate Mixture-of-Experts 让每个任务在共享的 expert 上有自己的 gate，从数据中学习任务之间的关系；在 Google 测试，线上跑的是 shared-bottom。
  fields:
  - tldr
- key: who
  q_en: Who built MMoE and where does it run?
  a_en: 'MMoE comes from Google, 2018. Deployed in: Evaluated on a large-scale content recommendation ranking model at Google, product not named, launch not stated.'
  q_zh: MMoE 是谁做的，用在哪里？
  a_zh: MMoE 来自 Google，2018 年。上线位置：在 Google 的一个大规模内容推荐排序模型上评估，未说明具体产品，也未说明是否上线。
  fields:
