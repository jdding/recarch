- key: caveats
  q_en: What should I keep in mind when reading the results of MMoE?
  a_en: 'No launch is stated: the paper says a shared-bottom model is already used in production and reports live experiments for MMoE, but never says MMoE was deployed, so the evidence level is Research only. See youtube-multitask-ranking-2019 for a separate paper that uses MMoE in a ranking system (not yet verified against full text). The Google product, traffic share, experiment length and metric definitions are not given; the live metrics are relative changes with confidence levels only.'
  q_zh: 读 MMoE 的结果时要注意什么？
  a_zh: 没有说明是否上线：论文称线上已经在用 shared-bottom 模型，并报告了 MMoE 的线上实验，但从未说 MMoE 已部署，所以证据等级为仅研究。另一篇在排序系统中使用 MMoE 的论文见 youtube-multitask-ranking-2019，尚未对照全文验证。 没有给出 Google 的产品、流量占比、实验时长和指标定义；线上指标只有相对变化和置信水平。
