- key: inputs
  q_en: What inputs does MMoE use?
  a_en: 'IDs and tokenization: Embeddings for sparse features; dense features normalized to [0, 1]. Input signals: Sparse features with embeddings and normalized dense features in the Google content recommendation system; the feature list is not given; User implicit feedback such as clicks and likes as labels; UCI census-income demographic features, 40 in total, with education and marital status removed when used as labels; Synthetic regression data with controlled task correlation.'
  q_zh: MMoE 用了哪些输入？
  a_zh: ID 与 token 化：稀疏特征用 embedding；稠密特征归一化到 [0, 1]。 输入特征：Google 内容推荐系统中带 embedding 的稀疏特征和归一化的稠密特征；没有给出特征列表；用户的隐式反馈，如点击和点赞，作为标签；UCI 人口普查收入的人口统计特征，共 40 个，当作标签使用时去掉教育和婚姻状况；任务相关性可控的合成回归数据。
