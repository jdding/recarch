- key: core
  q_en: What is the core idea of MMoE?
  a_en: Replace the shared bottom with shared experts and give each task its own gate.
  q_zh: MMoE 的核心思路是什么？
  a_zh: 把 shared bottom 换成共享的 expert，并为每个任务配一个自己的 gate。
  fields:
  - core_idea
- key: results
  q_en: What results does MMoE report?
  a_en: 'Synthetic data, with 200 runs per setting, input dim 100, 8 experts of size 16, towers of size 8 and 13,056 parameters, shows that the performance gap across task correlations is much smaller for MMoE than for OMoE and Shared-Bottom, both MoE models beat Shared-Bottom on average, and repeated-run loss variance is much lower for MoE models. Census-income, mean AUC over 400 runs: Group 1 (income main task) best / mean AUC: Single-Task 0.9398 / 0.9337, Shared-Bottom 0.9361 / 0.9295, Cross-Stitch 0.9406 / 0.9361, OMoE 0.9387 / 0.9319, MMoE 0.9410 / 0.9359; Group 2 (education main task): Single-Task 0.8843 / 0.8792, Shared-Bottom 0.8836 / 0.8813, Cross-Stitch 0.8855 / 0.8819, OMoE 0.8852 / 0.8813, MMoE 0.8860 / 0.8826; Tensor-Factorization is far worse in both (0.7460 / 0.6765 and 0.7367 / 0.7256). Google content recommendation, offline engagement per Table 3 AUC at 2M / 4M / 6M steps: Shared-Bottom 0.6879 / 0.6888 / 0.6900, MMoE 0.6894 / 0.6897 / 0.6908; R-squared Shared-Bottom 0.08812 / 0.09159 / 0.09287, MMoE 0.08978 / 0.09263 / 0.09362. Live experiments (Table 4, same live traffic share for both): Shared-Bottom vs Single-Task: engagement -0.22% (90% confidence level), satisfaction +19.72% (95%); MMoE vs Shared-Bottom: engagement +0.25% (95%), satisfaction +2.65% (95%).'
  q_zh: MMoE 报告了哪些结果？
  a_zh: 合成数据，每种设置跑 200 次，输入维度 100，8 个 expert，每个大小 16，tower 大小 8，共 13,056 个参数，结果显示：在不同任务相关性下，MMoE 的性能差距比 OMoE 和 Shared-Bottom 小得多，两种 MoE 模型平均都优于 Shared-Bottom，重复运行的损失方差 MoE 模型低得多。人口普查收入，400 次运行的平均 AUC：Group 1，主任务为收入，最佳 / 平均 AUC：Single-Task 0.9398 / 0.9337，Shared-Bottom 0.9361 / 0.9295，Cross-Stitch 0.9406 / 0.9361，OMoE 0.9387 / 0.9319，MMoE 0.9410 / 0.9359；Group 2，主任务为教育：Single-Task 0.8843 / 0.8792，Shared-Bottom 0.8836 / 0.8813，Cross-Stitch 0.8855 / 0.8819，OMoE 0.8852 / 0.8813，MMoE 0.8860 / 0.8826；Tensor-Factorization 在两组中都差得多，0.7460 / 0.6765 和 0.7367 / 0.7256。Google 内容推荐，离线互动，按表 3，在 2M / 4M / 6M 步时的 AUC：Shared-Bottom 0.6879 / 0.6888 / 0.6900，MMoE 0.6894 / 0.6897 / 0.6908；R-squared：Shared-Bottom 0.08812 / 0.09159 / 0.09287，MMoE 0.08978 / 0.09263 / 0.09362。线上实验，见表 4，两者线上流量占比相同：Shared-Bottom 对比 Single-Task：互动 -0.22%，90% 置信水平，满意度 +19.72%，95%；MMoE 对比 Shared-Bottom：互动 +0.25%，95%，满意度 +2.65%，95%。
  fields:
  - results_reported
