- key: results
  q_en: What results does GenPage report?
  a_en: 'Online A/B vs mature multi-stage production homepage recommender (14 days, five WBC variants, all significant with p < 0.001): best variant +0.24% on the core engagement metric used for launch decisions (95% CI [0.17%, 0.30%]); end-to-end serving latency -20%. Offline per Table 1 pretraining vs none for WBC: loss 0.321 vs 0.333, Row AUC 0.884 vs 0.879, Entity AUC 0.920 vs 0.910. Scaling 120M to 900M reduces WBC loss by about 1.3%, while cumulative context enrichment reduces it by about 6.9%. RL post-training raises page reward and homepage diversity offline.'
  q_zh: GenPage 报告了哪些结果？
  a_zh: 线上 A/B，对比成熟的多阶段线上首页推荐系统，14 天，五个 WBC 变体，全部显著，p < 0.001：最佳变体在用于上线决策的核心互动指标上 +0.24%，95% 置信区间 [0.17%, 0.30%]；端到端在线服务延迟 -20%。离线结果见表 1，WBC 有预训练对比无预训练：loss 为 0.321 对 0.333，Row AUC 为 0.884 对 0.879，Entity AUC 为 0.920 对 0.910。模型规模从 120M 扩到 900M，WBC loss 约降低 1.3%，而累积加入上下文信息可降低约 6.9%。RL 后训练在离线提升了页面奖励和首页多样性。
  fields:
  - results_reported
