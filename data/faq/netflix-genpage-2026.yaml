- key: core
  q_en: What is the core idea of GenPage?
  a_en: Generate the whole multi-row homepage autoregressively, with each row and entity as one token.
  q_zh: GenPage 的核心思路是什么？
  a_zh: 自回归地生成整个多 row 首页，每个 row 和 entity 各占一个 token。
