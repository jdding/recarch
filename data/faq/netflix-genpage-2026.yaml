- key: caveats
  q_en: What should I keep in mind when reading the results of GenPage?
  a_en: Only the WBC variant is online; the RL variant has not shipped and its offline evaluation is circular, since the reward model is also the training signal. The A/B test decoded over the existing production row and entity candidate sets, so candidate generation was not replaced.
  q_zh: 读 GenPage 的结果时要注意什么？
  a_zh: 只有 WBC 变体上线；RL 变体尚未发布，它的离线评估是循环论证，因为奖励模型同时也是训练信号。 A/B 测试是在现有线上的 row 和 entity 候选集上解码的，因此候选生成并没有被取代。
  fields:
  - caveats.0
  - caveats.1
