- key: what
  q_en: What is GenPage, in one sentence?
  a_en: 'Netflix replaces the multi-stage homepage stack with one decoder-only Transformer that generates the whole page; A/B vs production: +0.24% core engagement at p<0.001 and 20% lower serving latency.'
  q_zh: GenPage 一句话是什么？
  a_zh: Netflix 用一个 decoder-only Transformer 取代多阶段首页链路，直接生成整个页面；对比线上系统的 A/B：核心互动指标 +0.24%，p<0.001，在线服务延迟降低 20%。
