- key: training
  q_en: How is OneRec trained?
  a_en: 'Training mode: Pretraining of the generator, then post-training with preference alignment on real user interaction signals. Objectives: Next semantic-ID token prediction; Duration-Aware Reward Shaping to reduce video-duration bias; Adaptive Ratio Clipping / GBPO (Gradient-Bounded Policy Optimization) for stable policy updates.'
  q_zh: OneRec 是怎么训练的？
  a_zh: 训练方式：先预训练生成器，再用真实的用户交互信号做偏好对齐的后训练。 训练目标：下一个 Semantic ID token 的预测；Duration-Aware Reward Shaping，用于降低视频时长偏差；Adaptive Ratio Clipping 和 GBPO，即 Gradient-Bounded Policy Optimization，用于稳定策略更新。
  fields:
  - training.mode
  - training.objectives
