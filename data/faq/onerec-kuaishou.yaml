- key: core
  q_en: What is the core idea of OneRec?
  a_en: A lazy decoder-only generator over 3-level semantic IDs, post-trained with real user-feedback rewards.
  q_zh: OneRec 的核心思路是什么？
  a_zh: 在 3 级 Semantic ID 上的 lazy decoder-only 生成器，用真实的用户反馈奖励做后训练。
