- key: results
  q_en: What results does OneRec report?
  a_en: 'A/B of OneRec-V2 on the Kuaishou and Kuaishou Lite feeds versus OneRec-V1 (5% traffic group, one week, 1B model, user-feedback signals only): App Stay Time +0.467% / +0.741%, LT7 +0.069% / +0.034% (Table 8). Platform with 400 million daily active users. Compared with OneRec-V1 at 1B parameters in Fig 1 right and Table 7.'
  q_zh: OneRec 报告了哪些结果？
  a_zh: OneRec-V2 在快手和快手极速版信息流上相对 OneRec-V1 的 A/B：5% 流量组，一周，1B 模型，只用用户反馈信号：App 停留时长 +0.467% / +0.741%，LT7 +0.069% / +0.034%，见表 8。平台有四亿日活用户。在图 1 右侧和表 7 中，与 1B 参数的 OneRec-V1 对比。
  fields:
