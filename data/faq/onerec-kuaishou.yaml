- key: caveats
  q_en: What should I keep in mind when reading the results of OneRec?
  a_en: Gains are relative to OneRec-V1, not to a non-OneRec baseline; the A/B used only user-feedback reward signals, to reduce system complexity. In a separate 1% experiment with caching disabled (Appendix D), the paper reports cold-start video views down 44.7% on Kuaishou and 36.7% on Kuaishou Lite, an ecosystem-level cost.
  q_zh: 读 OneRec 的结果时要注意什么？
  a_zh: 收益是相对 OneRec-V1，而不是相对非 OneRec 的基线；A/B 只用用户反馈奖励信号，以降低系统复杂度。 在一个单独的 1% 实验中，关闭缓存，见附录 D，论文报告冷启动视频的播放量在快手下降 44.7%，在快手极速版下降 36.7%，这是生态层面的代价。
  fields:
  - caveats.0
  - caveats.1
- key: serving
  q_en: What serving latency, QPS, cost or hardware does OneRec report?
  a_en: 'Serving latency: 36 ms online latency with context length 3000 and beam size 512. Serving QPS: not reported. Inference cost: not reported. Hardware: L20 GPUs with 62% model FLOPs utilization.'
  q_zh: OneRec 报告了怎样的服务延迟、QPS、成本和硬件？
  a_zh: 服务延迟：线上延迟 36 ms，上下文长度 3000，beam 大小 512。 服务 QPS：未报告。 推理成本：未报告。 硬件：L20 GPU，模型 FLOPs 利用率 62%。
