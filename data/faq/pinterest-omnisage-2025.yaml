- key: caveats
  q_en: What should I keep in mind when reading the results of OmniSage?
  a_en: The +2.5% sitewide repin figure is aggregated by the authors across five applications; per-application A/B values were not captured here. Open-source code exists, but the Pinterest graph and training data do not.
  q_zh: 读 OmniSage 的结果时要注意什么？
  a_zh: 全站 repin +2.5% 的数字是作者在五个应用上汇总的；这里没有记录各应用的 A/B 数值。 有开源代码，但没有 Pinterest 的图和训练数据。
