- key: results
  q_en: What results does OmniSage report?
  a_en: 'Abstract: approximately +2.5% sitewide repins (saves) across five applications from the OmniSage representations (online). Offline gains vs PinSage / PinnerFormer reported in Sec 4.2 (Table 5 etc.; not reproduced).'
  q_zh: OmniSage 报告了哪些结果？
  a_zh: 摘要：线上，OmniSage 表示在五个应用上带来全站 repin，即 save，约 +2.5%。相对 PinSage 和 PinnerFormer 的离线收益见第 4.2 节，表 5 等，这里未复现。
  fields:
