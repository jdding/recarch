- key: what
  q_en: What is OmniSage, in one sentence?
  a_en: 'Pinterest''s successor to PinSage: pin and board embeddings from graph, content and user sequences via three contrastive tasks; about +2.5% sitewide repins.'
  q_zh: OmniSage 一句话是什么？
  a_zh: Pinterest 对 PinSage 的继任者：通过三个对比任务，从图、内容和用户序列学习 pin 和 board 的 embedding；全站 repin 约 +2.5%。
