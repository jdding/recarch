- key: what
  q_en: What is PinFM, in one sentence?
  a_en: An activity-sequence foundation model feeds Pinterest rankers. Fresh Saves rose 5.70% in Home Feed and fell 0.82% in Related Items, where the cold-start changes were absent.
  q_zh: PinFM 一句话是什么？
  a_zh: Pinterest 的行为序列基础模型接入下游排序。首页新内容收藏增加 5.70%，相关推荐的新内容收藏下降 0.82%，后者未采用冷启动处理。
