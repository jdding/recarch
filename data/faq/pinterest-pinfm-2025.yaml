- key: core
  q_en: What is the core idea of PinFM?
  a_en: A pretrained user-activity sequence model feeds downstream rankers through a deduplicated cross-attention transformer.
  q_zh: PinFM 的核心思路是什么？
  a_zh: 预训练的用户行为序列模型，通过去重的 cross-attention transformer 为下游排序器提供输入。
  fields:
  - core_idea
- key: results
  q_en: What results does PinFM report?
  a_en: In Table 7, adding PinFM to the Home Feed ranker raised sitewide Saves 1.20%, Home Feed Saves 2.60% and Fresh Saves 5.70%. In Related Items ranking the corresponding changes were +0.72%, +2.09% and -0.82%. The reported confidence level is 95%. The Home Feed treatment used the cold-start changes; the Related Items treatment omitted them. In the separate offline Home Feed study (Table 2), Save HIT@3 for items younger than 28 days was -4.40% for PinFM without cold-start handling and +17.72% with the full cold-start recipe, both against the ranker without PinFM. The paper also reports DCAT throughput +600% on internal data.
  q_zh: PinFM 报告了哪些结果？
  a_zh: 表 7 中，首页排序接入 PinFM 后，全站收藏 +1.20%、首页收藏 +2.60%、新内容收藏 +5.70%。相关推荐排序实验的全站收藏 +0.72%、页面收藏 +2.09%、新内容收藏 -0.82%。论文给出的置信水平为 95%。首页实验组采用了冷启动处理，相关推荐实验组没有使用。表 2 是独立的离线首页实验。对上线未满 28 天的内容，未做冷启动处理的 PinFM 的 Save HIT@3 为 -4.40%，用完整方案后为 +17.72%，两者均以未接入 PinFM 的排序器为对照。另一个内部基准报告 DCAT 使吞吐增加 600%。
  fields:
  - results_reported
