- key: caveats
  q_en: What should I keep in mind when reading the results of PinFM?
  a_en: The abstract summarizes a 20% new-item engagement improvement. Table 2 concerns offline Save HIT@3 and Table 7 gives the measured online Fresh Saves for each product surface. The online traffic split and measurement duration are not disclosed.
  q_zh: 读 PinFM 的结果时要注意什么？
  a_zh: 摘要概述约 20% 的新内容互动提升。表 2 是离线 Save HIT@3，表 7 分别列出两个页面的实际线上新内容收藏。 未披露两个线上排序实验的流量分配和时长。
