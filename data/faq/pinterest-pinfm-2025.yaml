- key: core
  q_en: What is the core idea of PinFM?
  a_en: A pretrained user-activity sequence model feeds downstream rankers through a deduplicated cross-attention transformer.
  q_zh: PinFM 的核心思路是什么？
  a_zh: 预训练的用户行为序列模型，通过去重的 cross-attention transformer 为下游排序器提供输入。
  fields:
  - core_idea
- key: results
  q_en: What results does PinFM report?
  a_en: Throughput +600% from DCAT (internal data); +20% engagement with new (fresh) items attributed to learning user-sequence/candidate interactions; deployed to Home Feed and Related Items Feed with neutral cost and marginal latency increase. Per-surface online lifts are in the paper's tables and are not reproduced here.
  q_zh: PinFM 报告了哪些结果？
  a_zh: DCAT 带来吞吐 +600%，内部数据；对新 item，即 fresh item 的互动 +20%，归因于学习用户序列和候选之间的交互；已部署到 Home Feed 和 Related Items Feed，成本持平，延迟略有增加。各场景的线上提升在论文的表中，这里未复现。
  fields:
  - results_reported
