- key: what
  q_en: What is PinFM, in one sentence?
  a_en: A 20B+ parameter pretrained user-sequence foundation model coupled into Home Feed and Related Items rankers; DCAT gives +600% throughput, +20% new-item engagement.
  q_zh: PinFM 一句话是什么？
  a_zh: 一个 20B+ 参数、预训练的用户序列基础模型，耦合进 Home Feed 和 Related Items 的排序器；DCAT 带来 +600% 吞吐，新 item 互动 +20%。
