  q_en: What should I keep in mind when reading the results of PinFM?
  a_en: Per-surface online A/B percentages were not extracted, so only abstract-level claims are listed. The 20% fresh-item engagement figure is from the paper's abstract; its experimental setup was not re-derived here.
