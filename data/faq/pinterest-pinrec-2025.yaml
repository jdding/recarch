- key: caveats
  q_en: What should I keep in mind when reading the results of PinRec?
  a_en: The A/B tests give no duration, traffic share or user count, and the paper reports only relative lifts; the Pareto figures omit absolute values as non-public. Table 7 compares PinRec-OC with a control group that is not described further; Tables 5 and 6 do not name a baseline either, and the candidates are added next to other candidate generators.
  q_zh: 读 PinRec 的结果时要注意什么？
  a_zh: A/B 没有给出时长、流量占比或用户数，论文只报告相对提升；Pareto 图因属于非公开信息而省略了绝对值。 Table 7 的对照是一个没有进一步描述的 control group；Table 5 和 Table 6 也没有写明基线，候选还是与其他候选生成器并列加入的。
  fields:
  - caveats.0
  - caveats.1
- key: scale
  q_en: What scale does PinRec report?
  a_en: 'Transformer size: about 100 million parameters, 12 layers and 768 hidden dimensions. GPU memory per model: about 1.6GiB including KV cache and CUDA graphs. Latency at 80 QPS: PinRec-OC p50 40ms and p90 65ms; PinRec-UC p50 23ms and p90 46ms.'
  q_zh: PinRec 报告了哪些规模信息？
  a_zh: Transformer 规模：约 1 亿参数，12 层，768 隐层维度。 每个模型的 GPU 显存：约 1.6GiB，含 KV cache 和 CUDA graphs。 Latency at 80 QPS：PinRec-OC 的 p50 为 40ms、p90 为 65ms；PinRec-UC 的 p50 为 23ms、p90 为 46ms。
  fields:
  - scale.0
  - scale.1
  - scale.2
- key: serving
  q_en: What serving latency, QPS, cost or hardware does PinRec report?
  a_en: 'Serving latency: At 80 QPS, p50 40ms and p90 65ms for PinRec-OC, p50 23ms and p90 46ms for PinRec-UC; 3-4x a two-tower model at p50 and under 1% added end-to-end latency when parallelized. Serving QPS: Latency was measured at 80 QPS; total production QPS is not reported. Inference cost: About 1.6GiB of GPU memory with KV cache and CUDA graphs, and about 250 MiB without them, the same as the existing two-tower retrieval. Hardware: NVIDIA L40S GPUs for the transformer; Faiss IVF-HNSW on CPU hosts.'
  q_zh: PinRec 报告了怎样的服务延迟、QPS、成本和硬件？
  a_zh: 服务延迟：80 QPS 下，PinRec-OC 的 p50 为 40ms、p90 为 65ms，PinRec-UC 的 p50 为 23ms、p90 为 46ms；p50 是双塔模型的 3-4x，并行化后端到端延迟增加不到 1%。 服务 QPS：延迟是在 80 QPS 下测得的；生产总 QPS 未报告。 推理成本：含 KV cache 和 CUDA graphs 时约 1.6GiB GPU 显存，不含时约 250 MiB，与现有双塔召回相当。 硬件：Transformer 使用 NVIDIA L40S GPU；Faiss IVF-HNSW 运行在 CPU 主机上。
  fields:
