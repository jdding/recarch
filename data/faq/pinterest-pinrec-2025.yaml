- key: what
  q_en: What is PinRec, in one sentence?
  a_en: Pinterest's PinRec is one generative retriever pre-trained across surfaces and fine-tuned per surface, with outcome-conditioned generation; Search A/B gives fulfillment +2.24% and saves +3.88%.
  q_zh: PinRec 一句话是什么？
  a_zh: Pinterest 的 PinRec 是跨场景预训练、再按场景微调的统一生成式召回模型，带结果条件生成；Search A/B 中 fulfillment +2.24%，saves +3.88%。
