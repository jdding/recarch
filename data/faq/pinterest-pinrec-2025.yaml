- key: core
  q_en: What is the core idea of PinRec?
  a_en: Pre-train one generative retriever on all surfaces, fine-tune it per surface, and condition generation on the outcome each surface cares about.
  q_zh: PinRec 的核心思路是什么？
  a_zh: 预训练一个跨所有场景的生成式召回模型，按场景微调，并让生成以各场景关心的结果为条件。
  fields:
  - core_idea
- key: results
  q_en: What results does PinRec report?
  a_en: 'Online A/B as a candidate generator, passed through unmodified ranking and blending. Search, PinRec-OC against a control group: search fulfillment rate +2.24%, search saves +3.88% and search shares +5.30%. Home Feed, OC against UC: fulfilled sessions +0.21% against +0.02%, site-wide grid clicks +1.76% against +0.58%, Home Feed grid clicks +4.01% against +1.87%. Related Pins, OC: fulfilled sessions +0.21%, time spent +0.38%, site-wide grid clicks +0.76%, sitewide saves +0.26%, and in Search fulfillment +0.42% and saves +0.39%. Zero-shot, Related Searches fulfilled sessions +1.66% and module click rate +4.04%, and for Ads cost per acquisition -1.83% and cost per click -1.41%. Against a production two-tower model, corpus coverage +17.3% for OC and +6.2% for UC. Offline unordered recall at 10 on Home Feed, Related Pins and Search: SASRec 0.382, 0.426, 0.142; PinnerFormer 0.461, 0.412, 0.257; TIGER 0.208, 0.230, 0.090; HSTU 0.596, 0.539, 0.179; PinRec-UC 0.608, 0.521, 0.350; PinRec-OC 0.625, 0.537, 0.352. Removing outcome conditioning costs -7.5% to -12.6% recall and removing fine-tuning costs -2.0% to -4.5%. Autoregressive generation with 16 steps lifts recall by +71.4% on Related Pins, +8.8% on Home Feed and +11.1% on Search against 1 step. Serving latency is 3-4x a two-tower model at p50 and adds under 1% end-to-end.'
  q_zh: PinRec 报告了哪些结果？
  a_zh: 作为候选生成器的线上 A/B，候选原样进入排序和混排。Search 上，PinRec-OC 对比 control group：search fulfillment rate +2.24%，search saves +3.88%，search shares +5.30%。Home Feed 上，OC 对比 UC：fulfilled sessions +0.21% 对 +0.02%，site-wide grid clicks +1.76% 对 +0.58%，Home Feed grid clicks +4.01% 对 +1.87%。Related Pins 上，OC：fulfilled sessions +0.21%，time spent +0.38%，site-wide grid clicks +0.76%，sitewide saves +0.26%，同时 Search 的 fulfillment +0.42%，saves +0.39%。零样本方面，Related Searches 的 fulfilled sessions +1.66%，module click rate +4.04%，Ads 的 cost per acquisition -1.83%，cost per click -1.41%。对比线上的生产双塔模型，corpus coverage OC 为 +17.3%，UC 为 +6.2%。离线 unordered recall at 10，依次为 Home Feed、Related Pins、Search：SASRec 0.382、0.426、0.142；PinnerFormer 0.461、0.412、0.257；TIGER 0.208、0.230、0.090；HSTU 0.596、0.539、0.179；PinRec-UC 0.608、0.521、0.350；PinRec-OC 0.625、0.537、0.352。去掉结果条件，recall 下降 -7.5% 到 -12.6%；去掉微调，下降 -2.0% 到 -4.5%。与 1 步相比，16 步自回归生成使 recall 在 Related Pins 上提升 +71.4%，Home Feed 上 +8.8%，Search 上 +11.1%。服务延迟在 p50 上是双塔模型的 3-4x，端到端只增加不到 1%。
  fields:
  - results_reported
