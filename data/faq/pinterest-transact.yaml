- key: training
  q_en: How is TransAct trained?
  a_en: 'Training mode: Offline training from scratch on two weeks of Homefeed logs, evaluated on data collected 7 days after the training window. Objectives: Multi-head cross-entropy of the CTR model; Next-action loss: sampled softmax between the user embedding and the PinSage embedding of the next engaged Pin against in-batch or impression-based negatives.'
  q_zh: TransAct 是怎么训练的？
  a_zh: 训练方式：两周首页日志上从零离线训练，评估集取训练窗口结束后第 7 天的数据。 训练目标：CTR 模型的多头交叉熵；下一动作损失：用户嵌入与下一正向互动 Pin 的 PinSage 嵌入对批内或曝光负样本的 sampled softmax。
  fields:
  - training.mode
  - training.objectives
