- key: what
  q_en: What is TransAct, in one sentence?
  a_en: TransAct V2 adds lifelong sequences and a next-action loss to Pinterest's Homefeed ranker; the A/B lifted repin volume +6.35% and cut hides -12.80%.
  q_zh: TransAct 一句话是什么？
  a_zh: TransAct V2 为首页排序器加入终身行为序列和下一动作损失；A/B 转发量 +6.35%、隐藏量 -12.80%。
