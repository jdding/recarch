- key: core
  q_en: What is the core idea of TransAct?
  a_en: Anchor nearest-neighbor search on each candidate to mine lifelong, real-time and impression sequences, and add a next-action loss so one small transformer serves both ranking and behavior forecasting.
  q_zh: TransAct 的核心思路是什么？
  a_zh: 用候选锚定的最近邻检索挖掘终身、实时和曝光序列，并加下一动作损失，让一个小 transformer 同时服务排序和行为预测。
  fields:
  - core_idea
- key: results
  q_en: What results does TransAct report?
  a_en: 'Online A/B, Table 3, each group at 1.5% of Homefeed visitors against the production TransAct with real-time sequences: TransAct V2 lifts Homefeed Repin Volume +6.35%, reduces Homefeed Hide Volume -12.80%, improves Impression Diversity +0.45% and Time Spent on App +1.41%; the note states that a 1% increase in repin volume is considered a substantial gain. Offline, Table 2, HIT@3 over repin: BST +6.04%, TransAct real-time +7.74%, adding in-batch NAL +8.41%, impression NAL +8.92%, and TransAct V2 with real-time, lifelong sequences and impression NAL +13.31%, while HIT@3 over hide falls -11.25% for V2 against -6.86% for the real-time TransAct. NAL ablation, Table 4: impression-based negatives reach +1.10% repin and -2.39% hide against +0.63% and -1.90% for in-batch. Serving ablations: the fused dequantization and NN search kernel cut model latency 20% against native PyTorch; the Single Kernel Unified Transformer reaches 85.09% lower latency and 13.24% less GPU memory at sequence length 192, with latency decreases from -59.29% at length 64 to -84.79% at 256 and -73.10% at 2048; copy time improves 85% at batch 128, 82% at 256 and 85% at 512; model run latency falls 75%, 75% and 81% at batches 128, 256 and 512; end-to-end inference latency improves 103x at p50, 338x at p90 and 250x at p99, with batch preparation 5x faster and queuing delay reduced about 1300x; the pinned memory arena alone adds up to 35% inference speed in the final setup.'
  q_zh: TransAct 报告了哪些结果？
  a_zh: 线上 A/B，表 3，每组 1.5% 首页访客，基线为带实时序列的生产 TransAct：TransAct V2 使首页转发量 +6.35%、首页隐藏量 -12.80%、曝光多样性 +0.45%、应用时长 +1.41%；表注说明转发量提升 1% 即被视为显著收益。离线见表 2，HIT@3/repin：BST +6.04%、实时 TransAct +7.74%、加批内 NAL +8.41%、加曝光 NAL +8.92%、带实时加终身序列加曝光 NAL 的 TransAct V2 达 +13.31%，同时 HIT@3/hide 下降 -11.25%，实时 TransAct 为 -6.86%。NAL 消融见表 4：曝光负样本达到 repin +1.10%、hide -2.39%，批内负样本为 +0.63% 和 -1.90%。服务消融：融合反量化与 NN 检索核较原生 PyTorch 降低模型延迟 20%；单核统一 transformer 在序列长度 192 时延迟低 85.09%、GPU 显存少 13.24%，长度 64 到 2048 的延迟降幅从 -59.29% 到 -84.79% 再到 -73.10%；批 128、256、512 的拷贝时间分别改善 85%、82%、85%；模型运行延迟在批 128、256、512 分别下降 75%、75%、81%；端到端推理延迟 p50 提升 103 倍、p90 提升 338 倍、p99 提升 250 倍，批处理加速 5 倍、排队延迟约降 1300 倍；固定内存竞技场在最终配置中带来最高 35% 的推理提速。
  fields:
  - results_reported
