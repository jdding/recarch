- key: caveats
  q_en: What should I keep in mind when reading the results of TransAct?
  a_en: The paper notes that TWIN is not compared because it relies on a computationally expensive offline inference system, and BERT4Rec-style models are omitted due to differences in problem formulation. The offline evaluation metric HIT@3 is a Pinterest-internal ranking metric computed over recommendation chunks.
  q_zh: 读 TransAct 的结果时要注意什么？
  a_zh: 论文说明 TWIN 因依赖昂贵的离线推理系统而未比较，BERT4Rec 类模型因问题设定不同而未直接比较。 离线指标 HIT@3 是 Pinterest 内部按推荐 chunk 计算的排序指标。
  fields:
  - caveats.0
  - caveats.1
- key: serving
  q_en: What serving latency, QPS, cost or hardware does TransAct report?
  a_en: 'Serving latency: p99 over one-minute windows in an environment of 29,000 examples per second per host; end-to-end inference latency improves 103x at p50, 338x at p90 and 250x at p99 over the unoptimized baseline; SKUT latency -85.09% at sequence length 192. Serving QPS: 29,000 examples per second per host in the serving evaluation. Inference cost: Request-level deduplication cuts PCIe transfers of sequence features 8x; the fused transformer is 6.6 times faster than PyTorch; copy time falls 85% at batch 128. Hardware: NVIDIA A10G GPUs with 8 MB shared memory.'
  q_zh: TransAct 报告了怎样的服务延迟、QPS、成本和硬件？
  a_zh: 服务延迟：每主机每秒 29,000 样本环境下按一分钟窗口的 p99 评估；端到端推理延迟较未优化基线 p50 提升 103 倍、p90 提升 338 倍、p99 提升 250 倍；SKUT 在序列长度 192 延迟低 85.09%。 服务 QPS：服务评估中每主机每秒 29,000 个样本。 推理成本：请求级去重使序列特征 PCIe 传输降 8 倍；融合 transformer 比 PyTorch 快 6.6 倍；批 128 拷贝时间降 85%。 硬件：NVIDIA A10G GPU，8 MB 共享内存。
