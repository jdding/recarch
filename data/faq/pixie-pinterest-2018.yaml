- key: caveats
  q_en: What should I keep in mind when reading the results of Pixie?
  a_en: The paper reports both 'more than 80% of all user engagement' in the abstract and intro, and 'over half of all pins saved each day' in Sec 5 and the conclusion for Pixie-backed systems; these are different measures. The 2017 paper's A/B lifts compare against previous production systems which were largely offline, Hadoop-based and precomputed rather than a modern ranking stack.
  q_zh: 读 Pixie 的结果时要注意什么？
  a_zh: 论文在摘要和引言中报告「more than 80% of all user engagement」，在第 5 节和结论中又对 Pixie 支撑的系统报告「over half of all pins saved each day」；这是不同的度量。 这篇 2017 年论文的 A/B 提升是对比之前的线上系统，那些系统大多是离线的、基于 Hadoop 的、预计算的，而不是现代的排序栈。
  fields:
  - caveats.0
  - caveats.1
- key: training
  q_en: How is Pixie trained?
  a_en: 'Training mode: No model training. The graph is rebuilt once per day: a Hadoop pipeline outputs board-pin edges, then a graph compiler on a single terabyte-scale RAM machine prunes it and writes a binary that servers load; servers restart once a day to load the latest graph. Objectives: none; ranking by random-walk visit counts.'
  q_zh: Pixie 是怎么训练的？
  a_zh: 训练方式：不训练模型。图每天重建一次：Hadoop 流水线输出 board-pin 边，再由一台太字节级内存的机器上的图编译器裁剪它，并写出供服务器加载的二进制文件；服务器每天重启一次以加载最新的图。 训练目标：无；按随机游走的访问次数排序。
  fields:
  - training.mode
  - training.objectives
