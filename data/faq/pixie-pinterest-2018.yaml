- key: results
  q_en: What results does Pixie report?
  a_en: 'Offline hit rate for predicting the re-pinned pin per Table 1, top 10 / 100 / 1000: content-based textual 1.0% / 2.2% / 4.8%, visual 1.1% / 2.4% / 4.5%, combined 2.1% / 4.6% / 10.5%, Pixie 6.3% / 23.1% / 52.2%. Online A/B vs old systems per Table 2, engagement per pin: Homefeed +48%, Related Pins +13%, board recommendations +26%, Explore tab +20%, localization +48% to 75% pins in the user''s language; text also gives +50% for switching one Homefeed source from Hadoop to Pixie and +3% Related Pins saves per day from shorter walks. Reacting in real time gives 30% to 50% higher engagement than waiting days or hours. Early stopping with n_p = 2000 and n_v = 4 gives 84% overlap with the gold-standard set at about 3 times faster. Graph pruning: the F1 score peaks at 58% above the unpruned graph at delta = 0.91 with only 20% of the edges (the graph is about a sixth of its size). Language bias (Table 3): for English query pins, target-language share Basic vs Pixie walk is Japanese 16.35% vs 80.33%, Spanish 41.94% vs 94.51%, Slovak 2.13% vs 42.55%.'
  q_zh: Pixie 报告了哪些结果？
  a_zh: 离线命中率，预测被再次 pin 的 pin，见表 1，top 10 / 100 / 1000：基于内容的文本 1.0% / 2.2% / 4.8%，视觉 1.1% / 2.4% / 4.5%，二者结合 2.1% / 4.6% / 10.5%，Pixie 6.3% / 23.1% / 52.2%。线上 A/B 相对旧系统，见表 2，每个 pin 的互动：Homefeed +48%，Related Pins +13%，board 推荐 +26%，「探索」标签页 +20%，本地化使用用户语言的 pin +48% 到 75%；正文还给出把 Homefeed 的一个来源从 Hadoop 换成 Pixie 带来 +50%，以及更短的游走使 Related Pins 每天的保存量 +3%。实时响应比等待数天或数小时，互动高 30% 到 50%。提前停止，n_p = 2000，n_v = 4，与金标准集合的重合度为 84%，速度快约 3 倍。图裁剪：F1 分数在 delta = 0.91 时达到峰值，比未裁剪的图高 58%，而只保留 20% 的边，图大小约为原来的六分之一。语言偏置，见表 3：对英文的查询 pin，目标语言占比，基础游走对 Pixie 游走，日语为 16.35% 对 80.33%，西班牙语为 41.94% 对 94.51%，斯洛伐克语为 2.13% 对 42.55%。
  fields:
