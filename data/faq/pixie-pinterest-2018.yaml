- key: what
  q_en: What is Pixie, in one sentence?
  a_en: Pixie runs biased random walks on an in-memory pin-board graph with 2B pins and 17B edges for real-time candidates; offline top-1000 hit rate 52.2% vs 10.5% for content-based.
  q_zh: Pixie 一句话是什么？
  a_zh: Pixie 在含 2B 个 pin 和 17B 条边的内存 pin-board 图上做有偏随机游走，实时产出候选；离线 top-1000 命中率为 52.2%，基于内容的为 10.5%。
  fields:
  - tldr
