- key: core
  q_en: What is the core idea of Pixie?
  a_en: Biased random walks with restarts on an in-memory pin-board graph return candidates in real time.
  q_zh: Pixie 的核心思路是什么？
  a_zh: 在内存 pin-board 图上做带重启的有偏随机游走，实时返回候选。
