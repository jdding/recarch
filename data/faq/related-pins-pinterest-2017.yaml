- key: results
  q_en: What results does Related Pins at Pinterest report?
  a_en: First learned ranker increased user propensity to save and click Related Pins results by over 30%. Related Pins grew from about 10% of pins saved in 2014 to over 40% of saves and impressions by 2017. Local-language share of impressions raised from 9% to 54% in major international countries. Memboost is described as significantly boosting engagement but no percentage is given. PR AUC offline metrics were extremely predictive of closeups and click-throughs in A/B tests, but save behavior was hard to predict offline.
  q_zh: Related Pins at Pinterest 报告了哪些结果？
  a_zh: 首个学习式排序器使用户保存和点击 Related Pins 结果的倾向提升超过 30%。Related Pins 从 2014 年约占 10% 的 pin 保存量，增长到 2017 年超过 40% 的保存和曝光。在主要的国际市场中，本地语言曝光占比从 9% 提高到 54%。论文称 Memboost 显著提升了互动，但没有给出百分比。离线的 PR AUC 指标对 A/B 测试中的 closeup 和点击具有很强的预测性，但保存行为难以在离线预测。
