- key: stage
  q_en: Which stages of the pipeline does Related Pins at Pinterest cover?
  a_en: 'Retrieval: Multiple candidate generators: board co-occurrence, first as a v1 Hadoop map-reduce of pin pairs on the same board plus a hand-tuned text and category relevance score built by two engineers in three weeks, and later as the Pixie online random walk of about 100,000 steps with restarts over the pruned pin-board graph; Pin2Vec, a word2vec-like N-way classification embedding of the N most popular pins from same-user session co-saves with nearest-neighbor lookup; search-based candidates from pin annotations, visually similar candidates (near-duplicate lookup and a visual-embedding nearest neighbor), and locale-segmented variants of these. Ranking: Memboost scoring plus a learned ranker: V1 linear RankSVM on Memboost-derived pairs; V2 linear on individual session pairs (save > long click > click > closeup > impression); V3 GBDT with RankNet pairwise loss; V4 logistic GBDT with binary ''pin saved'' labels and reweighted positives.'
  q_zh: Related Pins at Pinterest 覆盖链路的哪些阶段？
  a_zh: 召回：多个候选生成器：board 共现，起初是 v1 的 Hadoop map-reduce，取同一 board 上的 pin 对，加上两名工程师用三周做出的、手工调的文本和类目相关性分数，后来是 Pixie 线上随机游走，在裁剪后的 pin-board 图上带重启走约 100,000 步；Pin2Vec，类似 word2vec 的 N-way 分类 embedding，对象是同一用户会话中共同保存的 N 个最热门的 pin，用最近邻查找；基于 pin 标注的搜索候选，视觉相似的候选，即近重复查找加视觉 embedding 最近邻，以及这些候选按地区划分的变体。 精排：Memboost 打分加学习式排序器：V1 在 Memboost 派生的 pair 上训练线性 RankSVM；V2 在单个会话 pair 上训练线性模型，顺序为 save > long click > click > closeup > impression；V3 用 RankNet pairwise 损失的 GBDT；V4 用二元的「pin saved」标签并对正样本重新加权的 logistic GBDT。
  fields:
  - stages.0
  - stages.1
