- key: what
  q_en: What is SID-LLM, in one sentence?
  a_en: Shopify uses one product vocabulary with different generators for search and feed retrieval. The added feed source lifted attributed orders by 7.95% on the tested surface.
  q_zh: SID-LLM 一句话是什么？
  a_zh: Shopify 共用商品词表，搜索和信息流则使用各自的召回生成器。新增候选源后，受试首页场景的归因订单增长 7.95%。
  fields:
  - tldr
- key: who
  q_en: Who built SID-LLM and where does it run?
  a_en: 'SID-LLM comes from Shopify, 2026. Deployed in: Shopify production search and home feed candidate retrieval.'
  q_zh: SID-LLM 是谁做的，用在哪里？
  a_zh: SID-LLM 来自 Shopify，2026 年。上线位置：Shopify 线上搜索和首页信息流候选召回。
