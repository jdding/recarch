- key: core
  q_en: What is the core idea of SID-LLM?
  a_en: Share the product vocabulary and choose a decoding path for each discovery task.
  q_zh: SID-LLM 的核心思路是什么？
  a_zh: 共用商品词表，为各个发现任务选择合适的解码路径。
  fields:
  - core_idea
- key: results
  q_en: What results does SID-LLM report?
  a_en: Sections 9.1.1 and 9.2.2 describe different experiments. Search A/B tests informed deployment, with numeric lifts unreported. Table 19 compares the home feed with and without the additional SID-LLM candidate source. On the impacted surface, attributed orders rose 7.95%, converting users 8.60% and conversion rate 9.85%. All three passed the reported Dunnett correction.
  q_zh: SID-LLM 报告了哪些结果？
  a_zh: 第 9.1.1 和 9.2.2 节分别描述搜索和信息流实验。搜索实验支持部署，但原文未披露量化收益。表 19 对比首页信息流加入 SID-LLM 候选源的实验组和未加入的对照组。受试场景的归因订单增长 7.95%，转化用户增长 8.60%，转化率增长 9.85%。三项均通过原文报告的 Dunnett 校正。
  fields:
  - results_reported
- key: online
  q_en: Does SID-LLM have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: not reported. A/B traffic: not reported.'
  q_zh: SID-LLM 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：未报告。A/B 流量：未报告。
