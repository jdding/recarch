- key: caveats
  q_en: What should I keep in mind when reading the results of SID-LLM?
  a_en: The figures apply to the impacted home feed surface. They do not quantify Shopify-wide orders or a standalone search effect. The unified distilled student is an offline experiment. The production A/B used the task-specific recommendation decoder.
  q_zh: 读 SID-LLM 的结果时要注意什么？
  a_zh: 数值仅限受试首页信息流场景。Shopify 全站订单和搜索的独立提升幅度均未报告。 统一蒸馏模型只在离线实验中评估。线上 A/B 使用面向推荐任务的解码器。
  fields:
  - caveats.0
  - caveats.1
- key: training
  q_en: How is SID-LLM trained?
  a_en: 'Training mode: Continued task-mixed pre-training followed by task-specific post-training. Objectives: Learn product vocabulary and query or history to product mappings; Fine-tune the deployed generators for their respective discovery tasks.'
  q_zh: SID-LLM 是怎么训练的？
  a_zh: 训练方式：在混合任务上继续预训练，再针对各个任务做后训练。 训练目标：学习商品词表及查询或历史与商品的对应关系；分别面向各自任务微调线上生成器。
  fields:
  - training.mode
  - training.objectives
