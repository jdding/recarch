- key: what
  q_en: What is SIM, in one sentence?
  a_en: SIM handles lifelong behavior sequences with a two-stage search-then-model cascade; in Alibaba display ads since 2019 it gives CTR +7.1%, RPM +4.4%.
  q_zh: SIM 一句话是什么？
  a_zh: SIM 用先搜索、再建模的两阶段级联处理终身行为序列；自 2019 年起用于阿里巴巴展示广告，CTR +7.1%，RPM +4.4%。
  fields:
  - tldr
- key: who
  q_en: Who built SIM and where does it run?
  a_en: 'SIM comes from Alibaba, 2020. Deployed in: Alibaba display advertising CTR prediction since 2019, serving the main traffic.'
  q_zh: SIM 是谁做的，用在哪里？
  a_zh: SIM 来自 阿里巴巴，2020 年。上线位置：自 2019 年起用于阿里巴巴展示广告的 CTR 预测，承接主流量。
