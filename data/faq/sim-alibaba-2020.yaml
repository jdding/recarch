- key: caveats
  q_en: What should I keep in mind when reading the results of SIM?
  a_en: Abstract-level online lift (7.1% CTR, 4.4% RPM) comes without baseline traffic share or duration. The 22 TB figure is for the user behavior tree index; storage of other features is not given.
  q_zh: 读 SIM 的结果时要注意什么？
  a_zh: 摘要层面的线上提升，CTR 7.1%，RPM 4.4%，没有给出基线的流量占比或时长。 22 TB 的数字是用户行为树索引的；没有给出其他特征的存储。
  fields:
  - caveats.0
  - caveats.1
- key: stage
  q_en: Which stages of the pipeline does SIM cover?
  a_en: 'Ranking: SIM: GSU (hard-search or soft-search, trained with an auxiliary CTR loss) + ESU (multi-head attention with time-interval embeddings) feeding an MLP; loss = alpha*Loss_GSU + beta*Loss_ESU.'
  q_zh: SIM 覆盖链路的哪些阶段？
  a_zh: 精排：SIM：GSU，硬搜索或软搜索，用辅助的 CTR 损失训练，加 ESU，带时间间隔 embedding 的 multi-head attention，再接 MLP；损失 = alpha*Loss_GSU + beta*Loss_ESU。
  fields:
  - stages.0
- key: scale
  q_en: What scale does SIM report?
  a_en: 'Max behavior sequence length: 54,000 (paper says 54x MIMN''s 1000). User behavior tree index size: 22 TB. Peak traffic: more than 1 million users per second.'
  q_zh: SIM 报告了哪些规模信息？
  a_zh: 最大行为序列长度：54,000，论文称是 MIMN 的 1000 的 54x。 用户行为树索引大小：22 TB。 峰值流量：每秒超过一百万用户。
