- key: core
  q_en: What is the core idea of SIM?
  a_en: A General Search Unit retrieves relevant behaviors from the lifelong sequence, then an Exact Search Unit attends over them.
  q_zh: SIM 的核心思路是什么？
  a_zh: General Search Unit 从终身序列中检索相关行为，再由 Exact Search Unit 对它们做 attention。
  fields:
  - core_idea
- key: results
  q_en: What results does SIM report?
  a_en: 'Online (Table 5, since 2019 in Alibaba display advertising): CTR +7.1%, RPM +4.4% lift; SIM serves the main traffic. Industrial AUC per Table 4: DIEN 0.6452, MIMN 0.6541, SIM (hard) 0.6604, SIM (soft) 0.6625, SIM (hard) with time info 0.6624; hard-search chosen for deployment because soft-search''s gain is slight and it needs nearest-neighbor search online. Public AUC (Table 2, Taobao / Amazon): DIN 0.9214 / 0.7276, MIMN 0.9278 / 0.7396, SIM (soft) 0.9416 / 0.7510; SIM (soft) with time info 0.9501 on Taobao.'
  q_zh: SIM 报告了哪些结果？
  a_zh: 线上，见表 5，自 2019 年起用于阿里巴巴展示广告：CTR +7.1%，RPM +4.4%；SIM 承接主流量。工业数据集 AUC，见表 4：DIEN 0.6452，MIMN 0.6541，SIM 硬搜索 0.6604，SIM 软搜索 0.6625，带时间信息的 SIM 硬搜索 0.6624；部署选了硬搜索，因为软搜索的收益很小，而且线上需要最近邻搜索。公开数据集 AUC，见表 2，Taobao / Amazon：DIN 0.9214 / 0.7276，MIMN 0.9278 / 0.7396，SIM 软搜索 0.9416 / 0.7510；带时间信息的 SIM 软搜索在 Taobao 上为 0.9501。
  fields:
  - results_reported
