- key: caveats
  q_en: What should I keep in mind when reading the results of SnapLGR?
  a_en: The A/B compares the whole launched system against a T5 TIGER-style baseline with CLIP-based SIDs, so it does not isolate the LLM, tokenizer or serving contributions. Lifts are small in relative terms and absolute metric values are not given.
  q_zh: 读 SnapLGR 的结果时要注意什么？
  a_zh: 这次 A/B 对比的是整个上线系统与基于 CLIP 的 SID 的 T5 TIGER 风格基线，因此没有分离出大模型、tokenizer 或在线服务各自的贡献。 提升的相对幅度较小，也没有给出指标的绝对值。
