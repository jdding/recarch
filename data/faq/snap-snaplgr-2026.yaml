- key: inputs
  q_en: What inputs does SnapLGR use?
  a_en: 'IDs and tokenization: RQ-VAE residual quantization of Qwen3-VL-Embedding-8B multimodal embeddings (first 1024 of 4096 dims) with PPR co-engagement contrastive loss. Input signals: Video multimodal embeddings (video plus text description); User interaction histories as chronological SID sequences; Bipartite user-video engagement graph for PPR co-engagement pairs; Engagement rates used by the value-weighted SID-to-video materialization.'
  q_zh: SnapLGR 用了哪些输入？
  a_zh: ID 与 token 化：对 Qwen3-VL-Embedding-8B 的多模态 embedding，取 4096 维中的前 1024 维，做 RQ-VAE 残差量化，并加 PPR 共同互动对比损失。 输入特征：视频多模态 embedding，由视频和文本描述组成；用户交互历史，按时间顺序的 SID 序列；用户与视频的二部互动图，用于构造 PPR 共同互动对；互动率，用于按价值加权的 SID 到视频物化。
  fields:
  - id_tokenization.approach
  - features_signals.0
  - features_signals.1
  - features_signals.2
  - features_signals.3
