- key: what
  q_en: What is SnapLGR, in one sentence?
  a_en: 'Snap''s LLM-based generative retriever, a Qwen3-0.6B LLM over multimodal semantic IDs, launched as a retrieval source; 7-day A/B vs a TIGER-style baseline: View Time +0.37%, Time Spent +0.09%.'
  q_zh: SnapLGR 一句话是什么？
  a_zh: Snap 基于大模型的生成式召回模型，即基于多模态 Semantic ID 的 Qwen3-0.6B 大模型，已作为召回源上线；对比 TIGER 风格基线做 7 天 A/B：View Time +0.37%，Time Spent +0.09%。
