- key: core
  q_en: What is the core idea of SnapLGR?
  a_en: Residual-quantized multimodal semantic IDs and a decoder-only LLM generate videos through daily batch beam search.
  q_zh: SnapLGR 的核心思路是什么？
  a_zh: 残差量化的多模态 Semantic ID 加 decoder-only 大模型，通过每天的批量 beam search 生成视频。
  fields:
  - core_idea
- key: results
  q_en: What results does SnapLGR report?
  a_en: 'Online 7-day A/B vs the legacy TIGER-style T5 generative retrieval, where the launched system changes tokenizer, backbone and serving stack together: View Time +0.37% (+/-0.27%, p=0.007), Time Spent +0.09% (p=0.048), Deep Sessions +0.18% (p=0.027), Deep Sessions Unique User +0.11% (p=0.017). Offline SID retrieval vs a 13M T5 on the same Qwen3-VL SIDs: Pass@10 21.78% vs 8.685% (2.51x), Pass@32 2.27x, Recall@32 11.11% vs 4.624% (2.40x). Decoder-only architecture is the largest offline gain; CPT adds +0.83% Pass@10 and +1.51% Recall@10 over pretrained+SFT. SID uniqueness 32.1% vs 16.8% without co-engagement; training +3.63x, inference +45.7x per-GPU throughput.'
  q_zh: SnapLGR 报告了哪些结果？
  a_zh: 7 天线上 A/B，对比旧的 TIGER 风格 T5 生成式召回；上线的系统同时更换了 tokenizer、骨干和在线服务栈：View Time +0.37%，置信区间 +/-0.27%，p=0.007；Time Spent +0.09%，p=0.048；Deep Sessions +0.18%，p=0.027；Deep Sessions Unique User +0.11%，p=0.017。离线 SID 召回，对比使用同一套 Qwen3-VL SID 的 13M T5：Pass@10 为 21.78%，对比 8.685%，即 2.51x；Pass@32 为 2.27x；Recall@32 为 11.11%，对比 4.624%，即 2.40x。decoder-only 架构是离线收益最大的一项；在预训练加 SFT 的基础上，CPT 使 Pass@10 再提高 +0.83%，Recall@10 提高 +1.51%。SID 唯一率为 32.1%，没有共同互动时为 16.8%；训练的单 GPU 吞吐 +3.63x，推理 +45.7x。
  fields:
  - results_reported
