- key: results
  q_en: What results does Spotify Conversational Recommendation Agent report?
  a_en: In the two-week A/B across several markets and device types, approximately 15 million users were exposed. The paper reports +14% listening, +5% weekly active users and −5% skip rate against the previous session-refinement-only experience.
  q_zh: Spotify Conversational Recommendation Agent 报告了哪些结果？
  a_zh: 多市场、多设备的两周 A/B 触达约 1500 万名用户。相比仅支持调整当前会话的旧版，论文报告收听量 +14%、周活跃用户 +5%、跳过率 −5%。
  fields:
  - results_reported
