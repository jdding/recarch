- key: caveats
  q_en: What should I keep in mind when reading the results of Spotify Conversational Recommendation Agent?
  a_en: The production experiment compares whole product experiences. The contribution of the coding agent or an individual recommendation tool was not isolated. The paper does not specify the underlying ranking model or how candidates are scored.
  q_zh: 读 Spotify Conversational Recommendation Agent 的结果时要注意什么？
  a_zh: 生产实验比较的是两个完整的产品体验。编码 Agent 和单个推荐工具的贡献未单独测量。 论文未披露底层排序模型及候选打分方式。
