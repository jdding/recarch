- key: core
  q_en: What is the core idea of Spotify Conversational Recommendation Agent?
  a_en: Let the agent use its current playlist and past constraints when choosing content tools for the next turn.
  q_zh: Spotify Conversational Recommendation Agent 的核心思路是什么？
  a_zh: 用当前歌单和先前的偏好约束，决定下一轮调用哪个内容工具。
