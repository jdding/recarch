  q_en: What is Spotify Conversational Recommendation Agent, in one sentence?
  a_en: Spotify's agent uses conversation state to plan calls that create or refine a listening session and answer follow-up questions about music.
  q_zh: Spotify Conversational Recommendation Agent 一句话是什么？
  a_zh: Spotify 的 Agent 根据对话状态创建或调整收听会话，并回答与音乐有关的后续问题。
