- key: core
  q_en: What is the core idea of GLIDE?
  a_en: Generate catalog episode IDs using both stable preferences and listeners' recent interests.
  q_zh: GLIDE 的核心思路是什么？
  a_zh: 结合听众的稳定偏好和近期兴趣，生成目录中的播客单集 ID。
  fields:
  - core_idea
- key: results
  q_en: What results does GLIDE report?
  a_en: In Section 5.3, Spotify ran a 21-day user-randomized Home A/B on podcast listeners in English-speaking markets who were active in the preceding 30 days. Each cell covered about 20M impressions. Adding GLIDE before the unchanged episode ranker raised non-habitual streams per user by 5.4% and new-show non-habitual streams by 14.3%. GLIDE accounted for about 34% of the treatment recommendations.
  q_zh: GLIDE 报告了哪些结果？
  a_zh: 第 5.3 节报告了 Spotify 首页 21 天的用户级随机 A/B，覆盖英语市场过去 30 天内活跃的播客听众。每个分组约 2000 万次曝光。在原有单集排序器前加入 GLIDE 后，人均非惯常播客播放量增长 5.4%，新节目中的非惯常播放量增长 14.3%。实验组约 34% 的推荐来自 GLIDE。
  fields:
  - results_reported
- key: online
  q_en: Does GLIDE have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: 21 days. A/B traffic: not reported.'
  q_zh: GLIDE 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：21 天。A/B 流量：未报告。
  fields:
  - deployment.online_evidence
  - deployment.ab_duration
  - deployment.ab_traffic
- key: caveats
  q_en: What should I keep in mind when reading the results of GLIDE?
  a_en: GLIDE supplied 34% of treatment recommendations. The randomized traffic split is undisclosed. Reported gains apply to the eligible podcast audience on Home. Long-term effects and wider audience results were not quantified.
  q_zh: 读 GLIDE 的结果时要注意什么？
  a_zh: 34% 是实验组中来自 GLIDE 的推荐比例，随机 A/B 的流量分配未公开。 收益针对符合实验条件的首页播客听众。原文未量化长期效果和更广听众群体的结果。
  fields:
  - caveats.0
  - caveats.1
- key: inputs
  q_en: What inputs does GLIDE use?
  a_en: 'IDs and tokenization: Residual k-means over podcast episode embeddings. Input signals: Recent podcast listening history; Long-term listening preferences represented by a collaborative-filtering embedding; Episode titles and descriptions, and discovery instructions.'
  q_zh: GLIDE 用了哪些输入？
  a_zh: ID 与 token 化：对播客单集嵌入做残差 k-means 量化。 输入特征：近期播客收听历史；用协同过滤嵌入表示的长期收听偏好；单集标题、描述与发现指令。
