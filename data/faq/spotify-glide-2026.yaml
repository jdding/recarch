- key: what
  q_en: What is GLIDE, in one sentence?
  a_en: Spotify adds a podcast retrieval source that generates episode IDs from long-term preferences and recent listens. Non-habitual streams per user rose 5.4% in a Home A/B test.
  q_zh: GLIDE 一句话是什么？
  a_zh: Spotify 加入了一个播客候选源，根据长期偏好和近期收听生成单集 ID。首页 A/B 中，人均非惯常播客播放量提升 5.4%。
  fields:
  - tldr
