  q_en: Who built GLIDE and where does it run?
  a_en: 'GLIDE comes from Spotify, 2026. Deployed in: Spotify Home podcast discovery candidate generation.'
  q_zh: GLIDE 是谁做的，用在哪里？
  a_zh: GLIDE 来自 Spotify，2026 年。上线位置：Spotify 首页播客发现的候选召回。
