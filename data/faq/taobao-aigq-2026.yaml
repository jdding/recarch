- key: what
  q_en: What is AIGQ, in one sentence?
  a_en: 'Taobao''s AIGQ fine-tunes a 30B MoE LLM with list-level SFT and GRPO to generate homepage HintQ queries, served nearline; 30-day A/B: attributed GMV +10.68%, orders +10.31%.'
  q_zh: AIGQ 一句话是什么？
  a_zh: 淘宝 AIGQ 用列表级 SFT 和 GRPO 微调 30B MoE 大模型，生成首页 HintQ 的 query，并以准实时方式提供服务；30 天 A/B：归因 GMV +10.68%，订单 +10.31%。
  fields:
  - tldr
- key: who
  q_en: Who built AIGQ and where does it run?
  a_en: 'AIGQ comes from Alibaba Taobao & Tmall Group, 2026. Deployed in: Taobao homepage HintQ pre-search query box, as a recall source.'
  q_zh: AIGQ 是谁做的，用在哪里？
  a_zh: AIGQ 来自 阿里巴巴淘天集团，2026 年。上线位置：淘宝首页 HintQ 搜索前 query 框，作为召回源。
  fields:
  - company
  - year
  - deployed_in
- key: core
  q_en: What is the core idea of AIGQ?
  a_en: A fine-tuned LLM generates personalized query lists, run nearline and distilled into a real-time trigger index.
  q_zh: AIGQ 的核心思路是什么？
  a_zh: 微调后的大模型生成个性化 query 列表，以准实时方式运行，并蒸馏成实时触发词索引。
  fields:
  - core_idea
- key: results
  q_en: What results does AIGQ report?
  a_en: 'Online 30-day A/B in the HintQ scenario: attributed GMV +10.68%, attributed orders +10.31%, HintQ UCTR +7.42%, 7-day retention +3.73%, search UV +0.20%; 79.3% of queries and 37.3% of leaf categories from AIGQ are not covered by other channels. Offline on a Taobao test set, Cate HR@30 is 0.4704 for the think variant after IL-GRPO against 0.1998 for the production two-tower EBR, and Query HR@30 is 0.0745 against 0.0100.'
  q_zh: AIGQ 报告了哪些结果？
  a_zh: HintQ 场景 30 天线上 A/B：归因 GMV +10.68%，归因订单 +10.31%，HintQ UCTR +7.42%，7 日留存 +3.73%，搜索 UV +0.20%；AIGQ 产出的 query 中，79.3% 以及叶子类目中的 37.3% 没有被其他渠道覆盖。淘宝测试集上的离线结果：think 变体经 IL-GRPO 后 Cate HR@30 为 0.4704，线上双塔 EBR 为 0.1998；Query HR@30 为 0.0745，对比 0.0100。
  fields:
  - results_reported
- key: online
  q_en: Does AIGQ have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: 30 days. A/B traffic: not reported.'
  q_zh: AIGQ 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：30 天。A/B 流量：未报告。
  fields:
  - deployment.online_evidence
  - deployment.ab_duration
  - deployment.ab_traffic
- key: caveats
  q_en: What should I keep in mind when reading the results of AIGQ?
  a_en: The paper does not name the A/B control group or traffic share; the gains are described as relative gains in the online HintQ system. Real-time generation is not used; personalization from the nearline cache lags behind the latest behavior until the next visit.
  q_zh: 读 AIGQ 的结果时要注意什么？
  a_zh: 论文没有说明 A/B 的对照组和流量占比；这些收益被描述为线上 HintQ 系统中的相对提升。 没有使用实时生成；准实时缓存带来的个性化会滞后于最新行为，要到用户下次访问才会更新。
  fields:
  - caveats.0
  - caveats.1
- key: inputs
  q_en: What inputs does AIGQ use?
  a_en: 'IDs and tokenization: No semantic IDs; the LLM generates query text directly. Input signals: User historical behavior sequence; User profile attributes such as age, gender and city; Context such as weather and season; Online CTR ranking model score as a reward signal.'
  q_zh: AIGQ 用了哪些输入？
  a_zh: ID 与 token 化：不使用 Semantic ID；大模型直接生成 query 文本。 输入特征：用户历史行为序列；用户画像属性，如年龄、性别和城市；上下文，如天气和季节；线上 CTR 排序模型的分数，作为奖励信号。
  fields:
  - id_tokenization.approach
  - features_signals.0
  - features_signals.1
  - features_signals.2
  - features_signals.3
