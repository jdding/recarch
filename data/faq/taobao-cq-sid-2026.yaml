- key: caveats
  q_en: What should I keep in mind when reading the results of CQ-SID?
  a_en: 'Sec 4.2.2 states the offline top-1K truncation differs from the actual online recall process, which employs coarse-ranking truncation. Sec 4.4 explains the small RL gains: SFT already leaves narrow headroom for refinement, hitrate is a binary metric, and EG-GRPO must navigate a trade-off between click and exposure.'
  q_zh: 读 CQ-SID 的结果时要注意什么？
  a_zh: 4.2.2 节说明离线 top-1K 截断与线上实际采用粗排截断的召回流程不同。 4.4 节解释 RL 增益较小：SFT 后已无多少提升空间，命中率是二元指标，EG-GRPO 还需在点击与曝光之间权衡。
  fields:
  - caveats.0
  - caveats.1
- key: stage
  q_en: Which stages of the pipeline does CQ-SID cover?
  a_en: 'Retrieval: Qwen2.5-0.5B autoregressive generative retriever decoding semantic cluster IDs with beam search.'
  q_zh: CQ-SID 覆盖链路的哪些阶段？
  a_zh: 召回：Qwen2.5-0.5B 自回归生成式检索器，beam search 解码语义聚类 ID。
