- key: core
  q_en: What is the core idea of CQ-SID?
  a_en: Treat semantic IDs as hierarchical cluster identifiers shaped by category constraints and query-item contrastive learning, then align recall with downstream ranking through expert-guided reinforcement learning.
  q_zh: CQ-SID 的核心思路是什么？
  a_zh: 把语义 ID 当作层级聚类标识，用类目约束与 query-item 对比学习塑形，再以专家引导强化学习把召回与下游排序对齐。
  fields:
  - core_idea
