- key: what
  q_en: What is CQ-SID, in one sentence?
  a_en: 'Taobao''s CQ-SID turns semantic IDs into category-constrained cluster identifiers and aligns recall with ranking via EG-GRPO; two-week TmallAPP A/B: GMV +1.15%, UCTCVR +0.40%.'
  q_zh: CQ-SID 一句话是什么？
  a_zh: 淘宝 CQ-SID 把语义 ID 做成带类目约束的聚类标识并用 EG-GRPO 对齐召回与排序；天猫 App 两周 A/B：GMV +1.15%，UCTCVR +0.40%。
