  q_en: Who built CQ-SID and where does it run?
  a_en: 'CQ-SID comes from Alibaba Taobao & Tmall Group, 2026. Deployed in: TmallAPP search recall stage, generative recall supplement channel among multi-channel retrieval.'
  q_zh: CQ-SID 是谁做的，用在哪里？
  a_zh: CQ-SID 来自 阿里巴巴淘天集团，2026 年。上线位置：天猫 App 搜索召回阶段，多路召回中的生成式补充通道。
