- key: serving
  q_en: What serving latency, QPS, cost or hardware does CQ-SID report?
  a_en: 'Serving latency: Approximately 40 ms average end-to-end latency. Serving QPS: Over 200 QPS. Inference cost: Beam search with dynamic beam sizes in [20, 50, 100]; offline, cluster SIDs cut beam search size by more than half at comparable recall. Hardware: 8 GPUs for online serving.'
  q_zh: CQ-SID 报告了怎样的服务延迟、QPS、成本和硬件？
  a_zh: 服务延迟：平均端到端延迟约 40 毫秒。 服务 QPS：超过 200 QPS。 推理成本：beam search 配 [20, 50, 100] 动态 beam；离线同等召回下聚类 SID 把 beam search 规模削减一半以上。 硬件：8 块 GPU 用于线上服务。
