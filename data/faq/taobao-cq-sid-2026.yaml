- key: scale
  q_en: What scale does CQ-SID report?
  a_en: 'Item pool: approximately 21 million items filtered from a corpus of hundreds of millions, updated daily. Training data: CQ-SID quantizer 37.5M samples; LLM stages 21.0M Item2SID, 90.3M Query2SID, 73.7M personalized UQ2SID. Serving: over 200 QPS across 8 GPUs, 99.9% availability, approximately 40 ms average end-to-end latency. Channel contribution: 50.25% of all exposures, 58.96% of all clicks, 72.63% of all purchases.'
  q_zh: CQ-SID 报告了哪些规模信息？
  a_zh: 物品池：从数亿语料过滤出约 2100 万物品，每日更新。 训练数据：CQ-SID 量化器 37.5M 样本；LLM 阶段 Item2SID 21.0M、Query2SID 90.3M、个性化 UQ2SID 73.7M。 线上服务：8 块 GPU 承载超过 200 QPS，可用性 99.9%，平均端到端延迟约 40 毫秒。 通道贡献：占全部曝光 50.25%、全部点击 58.96%、全部购买 72.63%。
