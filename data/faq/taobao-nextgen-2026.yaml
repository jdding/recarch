- key: caveats
  q_en: What should I keep in mind when reading the results of NextGen?
  a_en: The headline gains are against Sort-gen, an earlier method from the same team, as redeployed under a new diversity constraint; the paper notes Sort-gen numbers differ from its original paper for that reason. NextGen scores the top 100 candidates while Sort-gen scored the top 30, and the authors state that this pool effect is not separated in an online test.
  q_zh: 读 NextGen 的结果时要注意什么？
  a_zh: 主要提升是相对 Sort-gen 得到的，它是同一团队更早的方法，并在新的多样性约束下重新部署；论文指出，Sort-gen 的数字因此与其原始论文不同。 NextGen 对前 100 个候选打分，而 Sort-gen 只对前 30 个打分，作者说明，这种候选池的影响没有在线上测试中被单独分离出来。
