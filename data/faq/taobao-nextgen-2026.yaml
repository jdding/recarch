- key: what
  q_en: What is NextGen, in one sentence?
  a_en: 'Taobao''s NextGen is a full-candidate autoregressive re-ranker; 14-day 5% A/B on Miaosha vs the prior generative re-ranker Sort-gen: GMV +18.85%, orders +12.35%.'
  q_zh: NextGen 一句话是什么？
  a_zh: 淘宝 NextGen 是一个全候选自回归重排模型；秒杀上对比此前的生成式重排模型 Sort-gen，做 14 天 5% A/B：GMV +18.85%，订单 +12.35%。
