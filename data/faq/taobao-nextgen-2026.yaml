  q_en: Who built NextGen and where does it run?
  a_en: 'NextGen comes from Alibaba Taobao & Tmall Group, 2026. Deployed in: Taobao Miaosha re-ranking, tested on 5% of traffic.'
  q_zh: NextGen 是谁做的，用在哪里？
