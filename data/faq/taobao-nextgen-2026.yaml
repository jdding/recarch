- key: core
  q_en: What is the core idea of NextGen?
  a_en: An encoder-decoder builds the page by choosing items one at a time from the full candidate set under several business objectives.
  q_zh: NextGen 的核心思路是什么？
  a_zh: Encoder-decoder 模型在多个业务目标下，每次从全候选集中选一个 item，逐步构建页面。
  fields:
  - core_idea
- key: results
  q_en: What results does NextGen report?
  a_en: Online 14-day A/B on 5% of Miaosha traffic, all lifts significant at p < 0.01. Against the deployed generative re-ranker Sort-gen, NextGen gives GMV +18.85%, order volume +12.35%, CTR +18.77% and visit-to-purchase rate +11.78%. Against the RULE baseline, NextGen gives GMV +24.73%, order volume +15.61%, CTR +20.08% and visit-to-purchase rate +14.84%. A 14-day A/A test showed no significant difference. Offline, average CTR AUC is 0.8123 and CVR AUC 0.8433 for NextGen against 0.7705 and 0.7739 for Sort-gen.
  q_zh: NextGen 报告了哪些结果？
  a_zh: 在 5% 秒杀流量上做 14 天线上 A/B，所有提升在 p < 0.01 下显著。对比线上的生成式重排模型 Sort-gen，NextGen 的 GMV +18.85%，订单量 +12.35%，CTR +18.77%，访问购买率 +11.78%。对比 RULE 基线，NextGen 的 GMV +24.73%，订单量 +15.61%，CTR +20.08%，访问购买率 +14.84%。14 天的 A/A 测试没有显著差异。离线结果：NextGen 的平均 CTR AUC 为 0.8123，CVR AUC 为 0.8433；Sort-gen 分别为 0.7705 和 0.7739。
  fields:
  - results_reported
