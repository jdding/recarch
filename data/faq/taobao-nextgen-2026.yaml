- key: inputs
  q_en: What inputs does NextGen use?
  a_en: 'IDs and tokenization: No semantic IDs; item ID embeddings plus frozen TBStar multimodal LLM embeddings. Input signals: User ID, device type and temporal features; Candidate item IDs, categories, brands and historical CTR and CVR; Upstream ranking CTR and CVR scores and position; Frozen LLM semantic embeddings of title and image; Historical click sequence and logged exposure sequence.'
  q_zh: NextGen 用了哪些输入？
  a_zh: ID 与 token 化：不使用 Semantic ID；item ID embedding 加冻结的 TBStar 多模态大模型 embedding。 输入特征：用户 ID、设备类型和时间特征；候选 item 的 ID、类目、品牌以及历史 CTR 和 CVR；上游排序的 CTR 和 CVR 分数以及位置；标题和图片的冻结大模型语义 embedding；历史点击序列和曝光日志序列。
