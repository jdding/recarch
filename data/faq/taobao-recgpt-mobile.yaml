- key: training
  q_en: How is RecGPT-Mobile trained?
  a_en: 'Training mode: Domain adaptation, supervised alignment, quality-gated reinforcement learning and distillation. Objectives: Predict a grounded and valid product query from the available behavior.; Reduce reasoning cost only for outputs that satisfy the quality gate.'
  q_zh: RecGPT-Mobile 是怎么训练的？
  a_zh: 训练方式：领域适配、监督对齐、带质量门槛的强化学习与蒸馏。 训练目标：依据已有行为生成有根据且可用于检索的商品查询。；查询通过质量门槛后再压缩推理开销。
