- key: core
  q_en: What is the core idea of RecGPT-Mobile?
  a_en: Generate a search query from phone-side behavior and pass it to a cloud product retrieval service.
  q_zh: RecGPT-Mobile 的核心思路是什么？
  a_zh: 手机用端侧行为生成查询，再交给云侧服务召回商品。
  fields:
