- key: what
  q_en: What is RecGPT-Mobile, in one sentence?
  a_en: Taobao generates personalized queries on the phone and retrieves items in the cloud. Ambiguous or expensive requests can use a stronger service.
  q_zh: RecGPT-Mobile 一句话是什么？
  a_zh: 淘宝用手机上的轻量模型把用户行为转成个性化查询。意图含混或算力预算不足时交给更强的服务，云端根据生成的查询召回商品。
  fields:
  - tldr
