- key: caveats
  q_en: What should I keep in mind when reading the results of RecGPT-Mobile?
  a_en: The exposure shares and user coverage describe the query path in a serving snapshot. A randomized business lift for this version was not reported. The latency comparison combines the decoding policy, model compression and optimized runtime. The benchmark covers query serving.
  q_zh: 读 RecGPT-Mobile 的结果时要注意什么？
  a_zh: 曝光份额和用户覆盖来自所报服务快照。该版本的随机流量试验收益未报告。 延迟结果包含解码策略、模型压缩和运行时优化的共同作用。该测试衡量查询生成服务。
