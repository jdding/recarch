- key: results
  q_en: What results does RecGPT-Mobile report?
  a_en: In the V2 report, Table 8 lists the client query path at 0.12% of exposed page views and 0.70% user coverage on Android, and 0.18% of exposed page views and 1.20% user coverage on iOS. Figure 12 reports an accelerator serving benchmark with mean latency of 0.76 s versus 3.00 s for the reference, and P95 latency of 1.70 s versus 8.00 s. Table 9 reports offline teacher query quality of 78.6% versus 73.2% for quality-only reinforcement learning, with median reasoning length of 14 versus 62 tokens.
  q_zh: RecGPT-Mobile 报告了哪些结果？
  a_zh: V2 报告表 8 中，客户端查询路径在 Android 的曝光 PV 占比为 0.12%，覆盖 0.70% 的用户，在 iOS 分别为 0.18% 和 1.20%。图 12 的加速器服务测试中，平均延迟为 0.76 秒，对照为 3.00 秒，P95 为 1.70 秒，对照为 8.00 秒。表 9 的离线教师模型对比中，完整奖励的查询质量为 78.6%，仅用质量奖励时为 73.2%，推理长度中位数分别为 14 和 62 个 token。
  fields:
  - results_reported
