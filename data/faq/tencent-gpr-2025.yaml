- key: what
  q_en: What is GPR, in one sentence?
  a_en: One generative model replaces Weixin Channels ads' retrieval, pre-rank and rank cascade, using multi-level semantic IDs; five online launches each lifted GMV, with +2.11% for v0.1.
  q_zh: GPR 一句话是什么？
  a_zh: 一个生成式模型取代微信视频号广告的召回、预排序和排序级联，使用多级 Semantic ID；五次线上上线都提升了 GMV，其中 v0.1 为 +2.11%。
  fields:
  - tldr
- key: who
  q_en: Who built GPR and where does it run?
  a_en: 'GPR comes from Tencent, 2025. Deployed in: Tencent Weixin Channels advertising system, reported as fully deployed.'
  q_zh: GPR 是谁做的，用在哪里？
  a_zh: GPR 来自 腾讯，2025 年。上线位置：腾讯微信视频号广告系统，据称已全量部署。
