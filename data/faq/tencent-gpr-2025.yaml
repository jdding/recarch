- key: stage
  q_en: Which stages of the pipeline does GPR cover?
  a_en: 'Single-stage: GPR: unified generative model that outputs top-K ads with values directly; U-Token (user), O-Token (organic), E-Token (environment), I-Token (item) sequences; dual-decoder HHD.'
  q_zh: GPR 覆盖链路的哪些阶段？
  a_zh: 单阶段：GPR：统一的生成式模型，直接输出带价值的 top-K 广告；U-Token，用户，O-Token，自然内容，E-Token，环境，I-Token，item 序列；双 decoder 的 HHD。
