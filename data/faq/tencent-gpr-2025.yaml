- key: caveats
  q_en: What should I keep in mind when reading the results of GPR?
  a_en: Table 4 has additional columns (GMV-Normal, Costs); the mapping of numbers to columns was read from extracted text and should be confirmed in the PDF before quoting beyond GMV. Offline final_value comes from the authors' simulation environment, not live traffic.
  q_zh: 读 GPR 的结果时要注意什么？
  a_zh: 表 4 还有其他列，GMV-Normal 和 Costs；数字与列的对应关系是从提取的文本中读出的，在引用 GMV 之外的内容之前应在 PDF 中确认。 离线的 final_value 来自作者的模拟环境，不是线上真实流量。
