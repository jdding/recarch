- key: core
  q_en: What is the core idea of GPR?
  a_en: One generative model with a unified token schema and a hierarchical decoder replaces the retrieval, pre-rank and rank cascade.
  q_zh: GPR 的核心思路是什么？
  a_zh: 一个生成式模型，带统一的 token 模式和层次化 decoder，取代召回、预排序和排序的级联。
  fields:
  - core_idea
- key: results
  q_en: What results does GPR report?
  a_en: 'Five sequential online A/B launches against the mature cascade, GMV (primary KPI) lifts: v0.1 HSD+NTP+DPO +2.11%; v0.2 +HEPO w/o ARR +0.70%; v0.3 +MTP+Thinking +0.63%; v0.4 +PTD +0.71%; v0.5 +HEPO w/ ARR +0.58%, as incremental changes; the abstract only says significant GMV and CTCVR gains. Table 5 gives stratified GMV/CTR/CVR/CTCVR by user group and new vs non-new ads.'
  q_zh: GPR 报告了哪些结果？
  a_zh: 相对成熟级联的五次连续线上 A/B 上线，GMV，主要 KPI，提升：v0.1 HSD+NTP+DPO +2.11%；v0.2 加 HEPO，不带 ARR，+0.70%；v0.3 加 MTP+Thinking +0.63%；v0.4 加 PTD +0.71%；v0.5 加 HEPO，带 ARR，+0.58%，均为增量改动；摘要只说 GMV 和 CTCVR 有显著提升。表 5 给出按用户群以及新广告与非新广告分层的 GMV/CTR/CVR/CTCVR。
  fields:
  - results_reported
- key: online
  q_en: Does GPR have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: not reported. A/B traffic: not reported.'
  q_zh: GPR 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：未报告。A/B 流量：未报告。
