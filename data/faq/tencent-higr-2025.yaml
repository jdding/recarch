- key: core
  q_en: What is the core idea of HiGR?
  a_en: Plan a whole slate coarsely, one embedding per position, then decode each item's semantic IDs with a shared small decoder, and align the result with a listwise ORPO objective.
  q_zh: HiGR 的核心思路是什么？
  a_zh: 先为每个位置用一个 embedding 粗粒度地规划整个 slate，再用共享的小解码器解码每个物品的 Semantic ID，并用 listwise 的 ORPO 目标对齐结果。
  fields:
  - core_idea
- key: results
  q_en: What results does HiGR report?
  a_en: On the industrial dataset, HiGR-100M reaches Impressions hit@5 0.3163 and recall@5 0.0760 and Effective View hit@5 0.2145, recall@5 0.0495 and NDCG@5 0.0831. HiGR-25M scores 0.2825 and 0.0692, with Effective View hit@5 0.1945, against 0.2438 and 0.0577 for OneRec-25M, 0.2281 and 0.0506 for HSTU and 0.1812 and 0.0383 for TIGER. In SID quality, prefix-contrastive variants lower collision to 0.0264, 0.0237 and 0.0873 and raise consistency to 0.6205, 0.6647 and 0.6932, against 0.2126 and 0.4533 for RQ-Kmeans and 0.0298 and 0.5577 for RQ-VAE. Intra-list diversity is 0.38 for TIGER, 0.42 for HSTU, 0.48 for OneRec, 0.52 for HiGR without alignment, 0.57 with DPO and 0.62 with ORPO. In the layer-allocation ablation, a 14 to 2 layer split gives NDCG@5 0.0631 at the reference latency, a 15 to 1 split gives 0.0623 at 0.932 times, and 8 to 8 gives 0.0605 at 2.065 times. Without KV caching, HiGR has over 5% higher Recall@5 than OneRec-Beam at more than 5 times the speed. In a 5% live-traffic A/B against the incumbent multi-stage system, Average Stay Time is +1.03%, Watch Time +1.22%, Video Views +1.73% and Request Count +1.57%.
  q_zh: HiGR 报告了哪些结果？
  a_zh: 在工业数据集上，HiGR-100M 的 Impressions hit@5 为 0.3163，recall@5 为 0.0760，Effective View hit@5 为 0.2145，recall@5 为 0.0495，NDCG@5 为 0.0831。HiGR-25M 为 0.2825 和 0.0692，Effective View hit@5 为 0.1945，对比 OneRec-25M 的 0.2438 和 0.0577，HSTU 的 0.2281 和 0.0506，TIGER 的 0.1812 和 0.0383。在 SID 质量上，前缀对比的各变体把碰撞率降到 0.0264、0.0237 和 0.0873，把一致性提高到 0.6205、0.6647 和 0.6932，对比 RQ-Kmeans 的 0.2126 和 0.4533，RQ-VAE 的 0.0298 和 0.5577。列表内多样性，TIGER 为 0.38，HSTU 为 0.42，OneRec 为 0.48，未对齐的 HiGR 为 0.52，用 DPO 为 0.57，用 ORPO 为 0.62。在层数分配的消融中，14 比 2 层的划分在参考延迟下 NDCG@5 为 0.0631，15 比 1 的划分为 0.0623，延迟是 0.932 倍，8 比 8 为 0.0605，延迟是 2.065 倍。不用 KV caching 时，HiGR 的 Recall@5 比 OneRec-Beam 高出 5% 以上，速度超过其 5 倍。在对比线上多阶段系统的 5% 线上流量 A/B 中，Average Stay Time 为 +1.03%，Watch Time 为 +1.22%，Video Views 为 +1.73%，Request Count 为 +1.57%。
  fields:
  - results_reported
