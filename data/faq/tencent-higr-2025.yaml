- key: caveats
  q_en: What should I keep in mind when reading the results of HiGR?
  a_en: The arXiv v5 read is a CIKM-template preprint with placeholder DOI and copyright text, and its title differs from the first version; the final CIKM 2026 text was not read. The online comparison is against an incumbent multi-stage system that the paper does not describe, so the lift cannot be attributed to the slate decoder alone.
  q_zh: 读 HiGR 的结果时要注意什么？
  a_zh: 读的 arXiv v5 是 CIKM 模板的预印本，DOI 和版权文字仍是占位，标题也与第一个版本不同；最终的 CIKM 2026 正文没有读。 线上对比的是论文没有描述的线上多阶段系统，所以提升不能只归因于 slate 解码器。
  fields:
