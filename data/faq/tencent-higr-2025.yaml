- key: what
  q_en: What is HiGR, in one sentence?
  a_en: Tencent's HiGR generates a slate with a coarse planner and a shared item decoder, aligned by ORPO; a 5% live-traffic A/B gives Watch Time +1.22% and Video Views +1.73%.
  q_zh: HiGR 一句话是什么？
  a_zh: 腾讯的 HiGR 用粗粒度 planner 和共享的物品解码器生成整个 slate，再用 ORPO 对齐；5% 线上流量的 A/B 中 Watch Time +1.22%，Video Views +1.73%。
  fields:
  - tldr
