- key: what
  q_en: What is HIT, in one sentence?
  a_en: Tencent uses learned cross-feature approximations and multi-head similarity in a cacheable two-tower ad pre-ranker. A five-day test against MVKE lifted GMV by 1.66% and ROI by 1.55%.
  q_zh: HIT 一句话是什么？
  a_zh: 腾讯在可缓存的广告预排序双塔上，用学习到的交叉特征近似和多头相似度来打分。对照 MVKE 的五天实验里，GMV 提升 1.66%，ROI 提升 1.55%。
  fields:
  - tldr
