- key: core
  q_en: What is the core idea of HIT?
  a_en: Learn to approximate user-ad feature crosses before serving, then compare independently computed tower embeddings in multiple subspaces.
  q_zh: HIT 的核心思路是什么？
  a_zh: 训练时学习近似用户与广告的交叉特征，服务时独立算双塔表示，再在多个子空间中匹配。
  fields:
  - core_idea
- key: results
  q_en: What results does HIT report?
  a_en: Table 4 reports GMV +1.66% and ROI +1.55% in a five-day online A/B against MVKE. The downstream pipeline was identical across arms. Figure 6 compares average model response time and success rate at the 35,000 QPS service threshold and reports overall efficiency close to a vanilla two-tower model.
  q_zh: HIT 报告了哪些结果？
  a_zh: 表 4 报告为期五天的线上 A/B。相比 MVKE，GMV +1.66%，ROI +1.55%。两组使用相同的下游链路。图 6 在 35,000 QPS 的服务门槛下比较模型平均响应时间和成功率，HIT 的整体效率接近普通双塔。
  fields:
  - results_reported
