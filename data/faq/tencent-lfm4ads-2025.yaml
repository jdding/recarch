- key: results
  q_en: What results does LFM4Ads report?
  a_en: The revised author version reports a platform-wide 2.45% GMV lift across more than 10 launches since Q4 2024 (abstract and Sec. 5.4). Scenario GMV lifts were 2.16% in Moments and 1.18% in Channels. Table 2 reports feature-level GMV lifts of +0.42% for Moments pCTR, +2.53% for Moments pCVR, +0.70% for Channels matching, +1.75% for Search Ads matching, +0.76% for DSP pCTR and +0.93% for Internet Service pLTV. Module-level launches lifted GMV by 1.88%. For standalone retrieval in Weixin Channels, v2 reports GMV +1.17%, CTR +1.83%, CTCVR +3.34%, dwell time +1.66% and quick-slip −0.36%. The earlier author version reported neutral GMV for its 5% test. Table 3 reports Weixin Moments online ablations. AUC was 0.8515 without LFM features, 0.8520 with dual-branch SUM and 0.8525 with full LFM4Ads. Full LFM4Ads improved AUC by 0.0005 over dual-branch SUM. Relative to the baseline without LFM representations, GMV rose 0.79% with dual-branch SUM and 1.35% with the full model. On public KuaiRand-1K (Table 1), weighted AUC gains were 0.0025 for feature gating over SUM, 0.0016 for module fine-tuning over Vanilla and 0.0189 for retrieval over TwoTower. Table 4 reports online ablations of upstream sequences, with AUC gains of 0.031 for content, 0.042 for ads and 0.052 for both.
  q_zh: LFM4Ads 报告了哪些结果？
  a_zh: 摘要和第 5.4 节报告，2024 年第四季度以来的 10 多次上线合计使平台 GMV 提升 2.45%。朋友圈与视频号的场景 GMV 分别提升 2.16% 和 1.18%。表 2 列出特征级上线的 GMV 增量。朋友圈 pCTR 和 pCVR 分别 +0.42% 和 +2.53%，视频号召回、搜索广告召回、DSP pCTR 和互联网服务 pLTV 分别 +0.70%、+1.75%、+0.76% 和 +0.93%。模块级上线的 GMV 增量为 1.88%。视频号独立召回在 v2 中报告 GMV +1.17%、CTR +1.83%、CTCVR +3.34%、平均停留时长 +1.66%、快速划走率 −0.36%。早期作者稿中的 5% 流量实验报告 GMV 持平。表 3 是朋友圈线上消融，无 LFM 特征、双分支 SUM 和完整 LFM4Ads 的 AUC 分别为 0.8515、0.8520 和 0.8525。完整模型的 AUC 比双分支 SUM 高 0.0005。相对无 LFM 表示的基线，双分支 SUM 和完整模型的 GMV 分别高 0.79% 和 1.35%。公开数据集 KuaiRand-1K 的表 1 报告加权 AUC 增量。特征门控比 SUM 高 0.0025，模块微调比 Vanilla 高 0.0016，召回比 TwoTower 高 0.0189。表 4 的上游行为序列线上消融中，内容序列、广告序列以及双域序列带来的 AUC 增量分别为 0.031、0.042 和 0.052。
