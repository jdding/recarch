- key: serving
  q_en: What serving latency, QPS, cost or hardware does LFM4Ads report?
  a_en: 'Serving latency: not reported. Serving QPS: 500K QPS for representation serving. Inference cost: FLOPS stated at 1.45B; module-level usage uses DCN-V2 experts chosen for low online inference complexity. Hardware: not reported.'
  q_zh: LFM4Ads 报告了怎样的服务延迟、QPS、成本和硬件？
  a_zh: 服务延迟：未报告。 服务 QPS：表示服务吞吐 500K QPS。 推理成本：FLOPS 论文表述为 1.45B；模块级用法选用 DCN-V2 专家以降低在线推理复杂度。 硬件：未报告。
