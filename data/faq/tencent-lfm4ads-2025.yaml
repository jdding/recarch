- key: what
  q_en: What is LFM4Ads, in one sentence?
  a_en: Tencent's 4TB ads foundation model transfers user, item and cross representations to downstream ranking and retrieval; 10+ launches since Q4 2024 with a 2.45% overall GMV lift.
  q_zh: LFM4Ads 一句话是什么？
  a_zh: 腾讯 4TB 广告基础模型把用户、物品和交叉表示迁移到下游排序与检索；2024 年四季度以来上线 10+ 次，整体 GMV 提升 2.45%。
  fields:
  - tldr
- key: who
  q_en: Who built LFM4Ads and where does it run?
  a_en: 'LFM4Ads comes from Tencent, 2025. Deployed in: Tencent advertising platform, 10+ launches since Q4 2024 including Weixin Moments and Channels.'
  q_zh: LFM4Ads 是谁做的，用在哪里？
  a_zh: LFM4Ads 来自 腾讯，2025 年。上线位置：腾讯广告平台，2024 年第 4 季度以来上线 10+ 次，含朋友圈与视频号。
  fields:
