- key: core
  q_en: What is the core idea of LFM4Ads?
  a_en: Transfer all three representations from a large ads foundation model into downstream tasks at feature, module and model level.
  q_zh: LFM4Ads 的核心思路是什么？
  a_zh: 把大型广告基础模型的三类表示按特征、模块和模型三个层级迁移进下游任务。
  fields:
  - core_idea
- key: online
  q_en: Does LFM4Ads have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: No duration is given for the reported online tests; the paper notes full-scale downstream evaluation takes over 1 week and the LEE framework reduces validation to mere hours. A/B traffic: 5% of traffic stated only for the model-level usage A/B test in Weixin Channels; traffic shares for the other online evaluations are unstated.'
  q_zh: LFM4Ads 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：所报线上测试未给出时长；论文说明全量下游评估需超过 1 周，LEE 框架把验证缩短到数小时。A/B 流量：仅视频号模型级用法 A/B 写明占 5% 流量；其余线上评估的流量占比未说明。
  fields:
  - deployment.online_evidence
  - deployment.ab_duration
  - deployment.ab_traffic
- key: caveats
  q_en: What should I keep in mind when reading the results of LFM4Ads?
  a_en: The paper states that during the 5% online A/B test of model-level standalone retrieval the GMV was neutral, with improvements only in user experience metrics. Table 1 marks the same-branch SUM, the linear-fusion variant and the no-aggregation variant as No Launch; only dual-branch SUM and full LFM4Ads were launched.
  q_zh: 读 LFM4Ads 的结果时要注意什么？
  a_zh: 论文说明模型级独立检索的 5% 线上 A/B 中 GMV 持平，提升只体现在用户体验指标上。 表 1 将同分支 SUM、线性融合变体与去聚合变体标注为 No Launch；只有双分支 SUM 与完整 LFM4Ads 完成上线。
  fields:
  - caveats.0
  - caveats.1
- key: stage
  q_en: Which stages of the pipeline does LFM4Ads cover?
  a_en: 'Ranking: Triple-tower embedding and DNN foundation model, with a user tower, an item tower and a dual-branch mix tower holding content and ad branches. Retrieval: Standalone dual-adapter retrieval model built on LFM4Ads URs and IRs.'
  q_zh: LFM4Ads 覆盖链路的哪些阶段？
  a_zh: 精排：三塔嵌入与 DNN 基础模型，含用户塔、物品塔与带内容、广告双分支的混合塔。 召回：基于 LFM4Ads UR 与 IR 的独立双适配器检索模型。
  fields:
  - stages.0
  - stages.1
- key: scale
  q_en: What scale does LFM4Ads report?
  a_en: 'Daily training samples: Tens of billions per day, 80% content domain and 20% ad domain. Parameters: 4TB. Sparse features: 6.3B. Features per sample: approximately 1,800.'
  q_zh: LFM4Ads 报告了哪些规模信息？
  a_zh: 每日训练样本：每日数百亿条，内容域与广告域占 80% 与 20%。 参数规模：4TB。 稀疏特征：6.3B。 单样本特征数：约 1800。
