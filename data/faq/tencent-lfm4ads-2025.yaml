- key: caveats
  q_en: What should I keep in mind when reading the results of LFM4Ads?
  a_en: The earlier author version reported neutral GMV for standalone retrieval in its 5% test. Version 2 reports +1.17% and gives no traffic share for that result. The platform-wide GMV number summarizes launches across multiple downstream tasks. No common experiment window or platform-level control is specified.
  q_zh: 读 LFM4Ads 的结果时要注意什么？
  a_zh: 早期作者稿在 5% 流量的独立召回实验中报告 GMV 持平。v2 报告 +1.17%，未说明流量占比。 平台 GMV 汇总多项下游上线结果。没有披露统一的实验窗口和平台级对照。
