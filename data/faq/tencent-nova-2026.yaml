items:
- key: what
  q_en: What is NOVA, in one sentence?
  a_en: NOVA checks that an architecture implements the intended design before training. It uses recorded failures to guide the next candidate and promotes an offline winner for online testing.
  q_zh: NOVA 一句话是什么？
  a_zh: NOVA 在花费一次训练前，先检查生成的架构是否实现了预期设计。失败原因用于引导下一轮，并选取离线候选上线验证。
  fields:
  - tldr
- key: who
  q_en: Who built NOVA and where does it run?
  a_en: 'NOVA comes from Tencent, 2026. Deployed in: Tencent production advertising ranking for conversion prediction.'
  q_zh: NOVA 是谁做的，用在哪里？
  a_zh: NOVA 来自 腾讯，2026 年。上线位置：腾讯生产广告转化率排序。
  fields:
  - company
  - year
  - deployed_in
- key: core
  q_en: What is the core idea of NOVA?
  a_en: Verify the meaning of an architectural change before training it and turn rejected candidates into constraints for the next round.
  q_zh: NOVA 的核心思路是什么？
  a_zh: 先验证架构改动的语义，再花资源训练，并把拒绝候选的原因变成下一轮约束。
  fields:
  - core_idea
- key: results
  q_en: What results does NOVA report?
  a_en: Section 5.7 and Table 4 of the July revision report a 6-day user-randomized A/B on 5% of production traffic. The selected candidate showed GMV gains of +1.25%, +1.70% and +2.02% on pCVR objectives 1, 2 and 3, with absolute pCVR bias changing −58.8%, −66.7% and −37.3% respectively.
  q_zh: NOVA 报告了哪些结果？
  a_zh: 最新修订稿第 5.7 节和表 4 报告按用户随机分组的 6 天 A/B，覆盖 5% 的生产流量。入选候选在 pCVR 目标 1、2、3 上的 GMV 分别 +1.25%、+1.70% 和 +2.02%，对应的绝对 pCVR 偏差相对变化分别为 −58.8%、−66.7% 和 −37.3%。
  fields:
  - results_reported
- key: online
  q_en: Does NOVA have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: 6 days. A/B traffic: 5% of production traffic, randomized by user.'
  q_zh: NOVA 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：6 天。A/B 流量：5% 的生产流量，按用户随机分组。
  fields:
  - deployment.online_evidence
  - deployment.ab_duration
  - deployment.ab_traffic
- key: caveats
  q_en: What should I keep in mind when reading the results of NOVA?
  a_en: The three pairs of metrics are reported separately for different objectives. No pooled GMV effect is given. The A/B tests the selected ranker change. The agent comparisons and verification analysis use separate experiments.
  q_zh: 读 NOVA 的结果时要注意什么？
  a_zh: 三组指标对应不同目标，论文未报告合并后的 GMV 效果。 A/B 对照的是入选的排序改动。Agent 对比和验证流程分析来自其他实验。
  fields:
  - caveats.0
  - caveats.1
