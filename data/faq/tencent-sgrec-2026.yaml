  - deployment.ab_traffic
- key: caveats
  q_en: What should I keep in mind when reading the results of S-GRec?
  a_en: The offline comparison uses the public Amazon Industrial and Office sets, not production data; the production A/B has no offline counterpart. The paper does not say the model was fully launched after the A/B.
  q_zh: 读 S-GRec 的结果时要注意什么？
  a_zh: 离线对比使用公开的 Amazon Industrial 和 Office 数据集，不是线上数据；线上 A/B 没有对应的离线结果。 论文没有说明模型在 A/B 之后是否已全量上线。
  fields:
  - caveats.0
  - caveats.1
- key: inputs
  q_en: What inputs does S-GRec use?
  a_en: 'IDs and tokenization: Fixed-length semantic ID token sequence per ad, RQ-VAE tokenization. Input signals: User profile and long-term interests; Recent behavior sequence; Request-time context such as time and location; Ad exposure, click and conversion logs, used to build judge training data; eCPM as the business reward in the online deployment.'
  q_zh: S-GRec 用了哪些输入？
  a_zh: ID 与 token 化：每个广告对应一条定长 Semantic ID token 序列，使用 RQ-VAE tokenization。 输入特征：用户画像和长期兴趣；近期行为序列；请求时的上下文，如时间和位置；广告的曝光、点击和转化日志，用于构建评审模型的训练数据；线上部署中以 eCPM 作为业务奖励。
