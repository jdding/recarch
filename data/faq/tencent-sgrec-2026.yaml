- key: core
  q_en: What is the core idea of S-GRec?
  a_en: An offline LLM judge supplies semantic rewards while business rewards steer a lightweight semantic-ID generator.
  q_zh: S-GRec 的核心思路是什么？
  a_zh: 离线大模型评审提供语义奖励，业务奖励则引导轻量的 Semantic ID 生成器。
  fields:
  - core_idea
- key: results
  q_en: What results does S-GRec report?
  a_en: 'Online A/B on 5% of WeChat Channels advertising traffic against the production baseline: GMV +1.19%, GMV-Normal +1.55%, CTR +1.16%, dislike rate -2.02%; a simulation environment first showed eCPM +5.5%. Offline on Amazon Industrial and Office against the MiniOneRec base model: Industrial HR@10 +2.9% and NDCG@10 +3.0%, Office HR@10 +3.4% and NDCG@10 +5.3%. Judge aspect scoring after GRPO reaches PairAUC 0.8116 and PointAcc 0.8687 on 1,000 held-out samples.'
  q_zh: S-GRec 报告了哪些结果？
  a_zh: 在微信视频号 5% 广告流量上做线上 A/B，对比线上基线：GMV +1.19%，GMV-Normal +1.55%，CTR +1.16%，不喜欢率 -2.02%；此前在仿真环境中 eCPM +5.5%。在 Amazon Industrial 和 Office 上对比 MiniOneRec 基础模型的离线结果：Industrial 的 HR@10 +2.9%，NDCG@10 +3.0%；Office 的 HR@10 +3.4%，NDCG@10 +5.3%。在 1,000 个留出样本上，GRPO 之后评审模型的维度打分达到 PairAUC 0.8116 和 PointAcc 0.8687。
  fields:
  - results_reported
- key: online
  q_en: Does S-GRec have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: not reported. A/B traffic: 5% of ad traffic.'
  q_zh: S-GRec 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：未报告。A/B 流量：5% 广告流量。
  fields:
  - deployment.online_evidence
