- key: what
  q_en: What is S-GRec, in one sentence?
  a_en: 'Tencent''s S-GRec trains a lightweight semantic-ID generator with an offline LLM judge and business-anchored RL; 5% WeChat Channels ad A/B: GMV +1.19%, CTR +1.16%.'
  q_zh: S-GRec 一句话是什么？
  a_zh: 腾讯 S-GRec 用离线大模型评审和以业务为锚点的 RL，训练轻量的 Semantic ID 生成器；微信视频号广告 5% A/B：GMV +1.19%，CTR +1.16%。
  fields:
  - tldr
- key: who
  q_en: Who built S-GRec and where does it run?
  a_en: 'S-GRec comes from Tencent, 2026. Deployed in: WeChat Channels advertising, tested online on 5% of ad traffic.'
  q_zh: S-GRec 是谁做的，用在哪里？
  a_zh: S-GRec 来自 腾讯，2026 年。上线位置：微信视频号广告，在 5% 广告流量上做过线上测试。
