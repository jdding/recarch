  q_en: What is TGR, in one sentence?
  a_en: 'Tencent''s TGR report covers generative ranking, SID retrieval and slate generation in production: CCFormer video CTR +3.57%, BARGE retrieval CTR +0.60%, HiGR watch time +1.22%. Preprint only.'
