- key: stage
  q_en: Which stages of the pipeline does TGR cover?
  a_en: 'Ranking: CCFormer, a scalable Transformer ranker with feature-field separated cross attention and subspace token mixing. Retrieval: BARGE, hierarchical semantic-ID generation with dual-path decoding. Re-ranking: HiGR, whole-slate generation with a slate planner and item generator.'
  q_zh: TGR 覆盖链路的哪些阶段？
  a_zh: 精排：CCFormer，可扩展的 Transformer 排序模型，带有按特征域分离的 cross attention 和子空间 token 混合。 召回：BARGE，层级 Semantic ID 生成，采用双路径解码。 重排：HiGR，整个 slate 的生成，包含 slate 规划器和 item 生成器。
  fields:
  - stages.0
  - stages.1
  - stages.2
