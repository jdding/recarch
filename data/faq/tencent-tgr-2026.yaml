- key: caveats
  q_en: What should I keep in mind when reading the results of TGR?
  a_en: 'This is an arXiv technical report with no peer-reviewed venue; HiGR and the Think model are also reported as separate papers, with HiGR first posted in December 2025. The online control differs by component: a DLRM, a deployed HSTU, a multi-stage cascade or the incumbent production generator.'
  q_zh: 读 TGR 的结果时要注意什么？
  a_zh: 这是一份 arXiv 技术报告，没有经同行评审的发表渠道；HiGR 和 Think 模型也有各自单独的论文，其中 HiGR 首次发布于 December 2025。 线上对照组因组件而异：DLRM、已部署的 HSTU、多阶段级联，或线上原有的生成器。
