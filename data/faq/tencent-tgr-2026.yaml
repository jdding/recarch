- key: core
  q_en: What is the core idea of TGR?
  a_en: A generative stack replaces the cascade piece by piece, with a generative ranker, semantic-ID retrieval and slate generation, and offline LLM reasoning tokens.
  q_zh: TGR 的核心思路是什么？
  a_zh: 生成式技术栈逐段取代级联，包括生成式排序模型、Semantic ID 召回和 slate 生成，以及离线大模型推理 token。
  fields:
  - core_idea
- key: results
  q_en: What results does TGR report?
  a_en: 'CCFormer was A/B-tested in five scenarios over two weeks, all lifts significant at p < 0.05. In the video scenario it replaced a long-standing DLRM and gained CTR +3.57%, page view +3.86%, watch time +1.29% and unique viewers +2.61%; in the advertising-ranking scenario it replaced HSTU and gained advertising revenue +1.71%. Both were then fully launched. It also trains 2.21x faster than HSTU at about half the GFLOPs. BARGE ran on 6% of traffic for two weeks against the multi-stage incumbent: CTR +0.60%, unique clicking users +1.34% and total reading time +1.70%, then was fully rolled out as a retrieval channel. Offline it beats OneRec by 10.2-16.9% in Hit@5. HiGR lifted average watch time +1.22% and average video views +1.73% in one scenario on 5% of traffic, and CTR +0.68% with advertising revenue +0.56% in another. TGR-Reason raised cold-start new-user Hit@1 from 0.0451 to 0.2606, +477.8%, and online gained Effective Consumption Rate +1.75% and new-user Exposure-to-Conversion Rate +13.09%.'
  q_zh: TGR 报告了哪些结果？
  a_zh: CCFormer 在五个场景中做了两周 A/B，所有提升在 p < 0.05 下显著。在视频场景中，它取代了长期使用的 DLRM，CTR +3.57%，page view +3.86%，观看时长 +1.29%，独立观看用户 +2.61%；在广告排序场景中，它取代了 HSTU，广告收入 +1.71%。两者随后都已全量上线。它的训练速度比 HSTU 快 2.21x，GFLOPs 约为一半。BARGE 在 6% 流量上跑了两周，对比多阶段的原有系统：CTR +0.60%，点击用户数 +1.34%，总阅读时长 +1.70%，随后作为召回通道全量上线。离线 Hit@5 比 OneRec 高 10.2-16.9%。HiGR 在一个场景的 5% 流量上，平均观看时长 +1.22%，平均视频观看数 +1.73%；在另一个场景中 CTR +0.68%，广告收入 +0.56%。TGR-Reason 使冷启动新用户的 Hit@1 从 0.0451 提高到 0.2606，即 +477.8%，线上有效消费率 +1.75%，新用户曝光到转化率 +13.09%。
  fields:
  - results_reported
- key: online
  q_en: Does TGR have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: Two weeks for CCFormer and BARGE. A/B traffic: CCFormer over one million exposed users per day per group; BARGE 6% of live traffic; HiGR 5% in one scenario.'
  q_zh: TGR 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：CCFormer 和 BARGE 为两周。A/B 流量：CCFormer 每组每天超过一百万曝光用户；BARGE 6% 线上流量；HiGR 在一个场景中 5%。
