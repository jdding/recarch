- key: what
  q_en: What is Tlow, in one sentence?
  a_en: Tlow normalizes item embeddings with a flow so tokenization is independent and parallel; WeChat A/B lifted new-picture CTR +1.94% and pathway UCTR +10.32%.
  q_zh: Tlow 一句话是什么？
  a_zh: Tlow 用流把物品嵌入归一化，tokenization 独立且可并行；微信 A/B 新图 CTR +1.94%，通路 UCTR +10.32%。
