- key: caveats
  q_en: What should I keep in mind when reading the results of Tlow?
  a_en: The paper reports only relative differences for online metric comparisons due to privacy considerations.
  q_zh: 读 Tlow 的结果时要注意什么？
  a_zh: 论文因隐私考虑，在线指标对比只报告相对差异。
  fields:
