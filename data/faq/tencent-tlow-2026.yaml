- key: serving
  q_en: What serving latency, QPS, cost or hardware does Tlow report?
  a_en: 'Serving latency: not reported. Serving QPS: not reported. Inference cost: Sequential model learns 4,096 token embeddings instead of tens of millions of item embeddings; tokenization of new items runs off the request path. Hardware: A single GPU for daily tokenization of new items.'
  q_zh: Tlow 报告了怎样的服务延迟、QPS、成本和硬件？
  a_zh: 服务延迟：未报告。 服务 QPS：未报告。 推理成本：序列模型学 4096 个 token 嵌入而非数千万物品嵌入；新物品 tokenization 在请求路径之外。 硬件：单张 GPU 用于每日新物品 tokenization。
