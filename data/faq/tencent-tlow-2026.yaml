- key: scale
  q_en: What scale does Tlow report?
  a_en: 'Online platform: WeChat picture recommendation, China''s largest social media platform. Training data: two weeks, over 70 and 200 million interaction records per day in single-domain and cross-domain scenarios. Token vocabulary: 4,096 token embeddings from 16 codebooks of 256, replacing tens of millions of item embeddings.'
  q_zh: Tlow 报告了哪些规模信息？
  a_zh: 在线平台：微信图片推荐，中国最大社交媒体平台。 训练数据：两周，单域与跨域日交互分别超 70M 与 200M 条。 token 词表：16 个 256 码本共 4096 个 token 嵌入，取代数千万物品嵌入。
  fields:
