  q_en: Who built Tlow and where does it run?
  a_en: 'Tlow comes from Tencent, 2026. Deployed in: WeChat picture recommendation as a supplemental retrieval pathway.'
  q_zh: Tlow 是谁做的，用在哪里？
  a_zh: Tlow 来自 腾讯，2026 年。上线位置：微信图片推荐，作为补充检索通路。
