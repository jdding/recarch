- key: core
  q_en: What is the core idea of TIGER?
  a_en: Quantize content embeddings into semantic IDs with RQ-VAE, then decode the next item's semantic ID with a Transformer.
  q_zh: TIGER 的核心思路是什么？
  a_zh: 用 RQ-VAE 把内容 embedding 量化为 Semantic ID，再用 Transformer 解码下一个 item 的 Semantic ID。
  fields:
  - core_idea
