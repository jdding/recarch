- key: what
  q_en: What is TIGER, in one sentence?
  a_en: Items get Semantic IDs via RQ-VAE and a Transformer decodes the next item's ID, replacing embedding-table ANN retrieval; helps cold-start items on public datasets.
  q_zh: TIGER 一句话是什么？
  a_zh: Item 通过 RQ-VAE 得到 Semantic ID，由 Transformer 解码下一个 item 的 ID，取代基于 embedding 表的 ANN 检索；在公开数据集上对冷启动 item 有帮助。
  fields:
  - tldr
