- key: what
  q_en: What is Wide & Deep Learning, in one sentence?
  a_en: 'Jointly trains a wide linear model for memorization and a deep network for generalization on Google Play; online A/B: acquisitions +3.9% vs +2.9% for deep only.'
  q_zh: Wide & Deep Learning 一句话是什么？
  a_zh: 在 Google Play 上联合训练用于记忆的 wide 线性模型和用于泛化的 deep 网络；线上 A/B：应用获取 +3.9%，只用 deep 为 +2.9%。
  fields:
  - tldr
- key: who
  q_en: Who built Wide & Deep Learning and where does it run?
  a_en: 'Wide & Deep Learning comes from Google, 2016. Deployed in: Google Play app recommendations, main landing page of the app store.'
  q_zh: Wide & Deep Learning 是谁做的，用在哪里？
  a_zh: Wide & Deep Learning 来自 Google，2016 年。上线位置：Google Play 的应用推荐，应用商店的主着陆页。
  fields:
  - company
  - year
  - deployed_in
- key: core
  q_en: What is the core idea of Wide & Deep Learning?
  a_en: A wide linear model on cross-product features memorizes, while a deep network on embeddings generalizes.
  q_zh: Wide & Deep Learning 的核心思路是什么？
  a_zh: 基于交叉乘积特征的 wide 线性模型负责记忆，基于 embedding 的 deep 网络负责泛化。
  fields:
  - core_idea
- key: results
  q_en: What results does Wide & Deep Learning report?
  a_en: '3-week A/B test with 1% of users per group on the main landing page of the app store. Table 1: Wide (control) offline AUC 0.726, online acquisition gain 0%; Deep 0.722, +2.9%; Wide & Deep 0.728, +3.9% (statistically significant vs control). Wide & Deep had +1% on top of deep-only. Paper notes the offline AUC gain is small while the online impact is larger.'
  q_zh: Wide & Deep Learning 报告了哪些结果？
  a_zh: 3 周 A/B 测试，每组 1% 的用户，在应用商店的主着陆页。表 1：Wide，对照，离线 AUC 0.726，线上获取增益 0%；Deep 0.722，+2.9%；Wide & Deep 0.728，+3.9%，相对对照在统计上显著。Wide & Deep 比只用 deep 多 +1%。论文指出离线 AUC 的增益很小，而线上影响更大。
  fields:
  - results_reported
- key: online
  q_en: Does Wide & Deep Learning have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: 3 weeks. A/B traffic: 1% of users per group.'
  q_zh: Wide & Deep Learning 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：3 周。A/B 流量：每组 1% 的用户。
  fields:
  - deployment.online_evidence
  - deployment.ab_duration
  - deployment.ab_traffic
- key: caveats
  q_en: What should I keep in mind when reading the results of Wide & Deep Learning?
  a_en: Control was a highly optimized wide-only logistic regression model with rich cross-product features. The paper offers a hypothesis (exploratory recommendations online) for why online gains exceed offline AUC gains; it is not tested in the paper.
  q_zh: 读 Wide & Deep Learning 的结果时要注意什么？
  a_zh: 对照是一个高度优化的、只用 wide 的 logistic 回归模型，带丰富的交叉乘积特征。 论文对线上收益超过离线 AUC 收益给出一个假设，即线上的探索式推荐；论文中没有检验它。
  fields:
  - caveats.0
  - caveats.1
- key: training
  q_en: How is Wide & Deep Learning trained?
  a_en: 'Training mode: Offline training on over 500 billion examples, with a warm-start system that initializes a new model''s embeddings and linear weights from the previous model. Objectives: App acquisition (logistic).'
  q_zh: Wide & Deep Learning 是怎么训练的？
  a_zh: 训练方式：在超过五千亿个样本上离线训练，带热启动系统，用上一个模型初始化新模型的 embedding 和线性权重。 训练目标：应用获取，logistic。
  fields:
  - training.mode
  - training.objectives
