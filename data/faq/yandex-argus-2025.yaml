- key: core
  q_en: What is the core idea of ARGUS?
  a_en: Pre-train a transformer on both next-item and feedback prediction over long user histories, then fine-tune it into a daily two-tower score that the production ranker takes as a feature.
  q_zh: ARGUS 的核心思路是什么？
  a_zh: 在长用户历史上同时预训练下一个 item 预测和反馈预测，再微调成每日更新的双塔分数，供生产排序模型作为特征使用。
  fields:
  - core_idea
- key: results
  q_en: What results does ARGUS report?
  a_en: 'Online A/B on the music platform, ARGUS (Offline V4, context 8192, 126.0M encoder) against the existing production stack: total listening time +2.26% and like likelihood +6.37%; the paper calls these the strongest transformer-driven online gains to date. Earlier deployments gave +0.52% and +1.11% for V1, +1.00% and +0.73% for V2, +0.73% and +5.00% for V3, and +0.32% and +1.38% for the Real-time V1, each measured against the previous deployments. Offline scaling, as pair accuracy uplift over the production ranker when used as a feature: 3.2M parameters +1.35%, 18.9M +1.82%, 126.0M +2.32%, 1.007B +2.66%, and a 176.0M HSTU encoder +2.34%. Standalone, the 1.007B model is -4.78% against the production ranker. Next-item entropy falls by 10.36% from the smallest to the largest model. Fine-tuning context length 512, 2048 and 8192 gives +1.01%, +2.32% and +2.77%. Without pre-training, one year of fine-tuning gives +1.17%, and with pre-training one week of fine-tuning gives +0.63% against +2.32% for one year.'
  q_zh: ARGUS 报告了哪些结果？
  a_zh: 线上，在音乐平台上做 A/B，即 Offline V4，上下文长度 8192、126.0M 编码器的 ARGUS，相对现有生产栈：总收听时长 +2.26%，点赞概率 +6.37%；论文称这是迄今 transformer 带来的最强线上收益。更早的部署中，V1 为 +0.52% 和 +1.11%，V2 为 +1.00% 和 +0.73%，V3 为 +0.73% 和 +5.00%，Real-time V1 为 +0.32% 和 +1.38%，每一行都是相对前一代部署。离线扩展实验中，作为特征使用时相对生产排序模型的 pair accuracy uplift：3.2M 参数 +1.35%，18.9M +1.82%，126.0M +2.32%，1.007B +2.66%，176.0M 的 HSTU 编码器 +2.34%。单独使用时，1.007B 模型相对生产排序模型为 -4.78%。从最小模型到最大模型，下一个 item 的 entropy 下降 10.36%。微调上下文长度 512、2048 和 8192 分别为 +1.01%、+2.32% 和 +2.77%。不做预训练时，微调一整年为 +1.17%；做预训练后，微调一周为 +0.63%，微调一年为 +2.32%。
  fields:
  - results_reported
