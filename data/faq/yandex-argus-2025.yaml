- key: who
  q_en: Who built ARGUS and where does it run?
  a_en: 'ARGUS comes from Yandex, 2025. Deployed in: Yandex Music, as a feature of the production ranker.'
  q_zh: ARGUS 是谁做的，用在哪里？
  a_zh: ARGUS 来自 Yandex，2025 年。上线位置：Yandex Music，作为生产排序模型的特征。
