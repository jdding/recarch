- key: what
  q_en: What is ARGUS, in one sentence?
  a_en: Yandex's ARGUS pre-trains a transformer on user histories, then fine-tunes it into a daily ranker feature; online it adds +2.26% total listening time and +6.37% like likelihood.
  q_zh: ARGUS 一句话是什么？
  a_zh: Yandex 的 ARGUS 先在用户历史上预训练 transformer，再微调成每日更新的排序特征；线上总收听时长 +2.26%，点赞概率 +6.37%。
  fields:
