- key: caveats
  q_en: What should I keep in mind when reading the results of ARGUS?
  a_en: The online A/B has no stated duration, traffic share or user count, and the paper does not report absolute values of total listening time or like likelihood. Gains in Table 6 are measured against the existing production stack at each step and the paper says they are cumulative, so the ARGUS row is not an isolated comparison against a no-transformer baseline.
  q_zh: 读 ARGUS 的结果时要注意什么？
  a_zh: 线上 A/B 没有说明持续时间、流量占比和用户数，论文也没有给出总收听时长和点赞概率的绝对值。 表 6 中的收益每一步都是相对当时的现有生产栈，论文说这些收益是累积的，所以 ARGUS 这一行不是相对没有 transformer 的基线的独立对比。
  fields:
  - caveats.0
  - caveats.1
- key: stage
  q_en: Which stages of the pipeline does ARGUS cover?
  a_en: 'Ranking: Transformer encoder (L10 H1024, 126.0M parameters in production) pre-trained on next-item and feedback prediction, fine-tuned into a two-tower scorer whose output is a feature of the production ranker.'
  q_zh: ARGUS 覆盖链路的哪些阶段？
  a_zh: 精排：Transformer 编码器，规模为 L10 H1024，生产中为 126.0M 参数，用下一个 item 预测和反馈预测预训练，微调成双塔打分器，其输出作为生产排序模型的特征。
  fields:
  - stages.0
- key: scale
  q_en: What scale does ARGUS report?
  a_en: 'Encoder size, deployed: 126.0M parameters (L10 H1024). Encoder size, largest tested: 1.007B parameters (L20 H2048), not tested online. Context length, deployed: 8192 events. Training interactions: over 300B.'
  q_zh: ARGUS 报告了哪些规模信息？
  a_zh: 编码器大小，已部署：126.0M 参数，L10 H1024。 编码器大小，测试过的最大规模：1.007B 参数，L20 H2048，未做线上测试。 上下文长度，已部署：8192 个事件。 训练交互量：超过 300B。
