  q_en: What inputs does Deep Neural Networks for YouTube Recommendations use?
  a_en: 'IDs and tokenization: Learned embeddings for video IDs and search-query tokens (bag-of-IDs averaged); no semantic-ID tokenization. Input signals: Watch history as a bag of recent video IDs; experiments use 50 recent watches; Search history as tokenized queries; experiments use 50 recent searches; Demographic features including geography, device, gender, age and logged-in state; "Example age" feature to model freshness bias; Ranking uses hundreds of categorical and continuous features about the video, the user and their relationship.'
  q_zh: Deep Neural Networks for YouTube Recommendations 用了哪些输入？
  a_zh: ID 与 token 化：视频 ID 和搜索 query token 的学习式 embedding，bag-of-IDs 取平均；没有 Semantic ID 的 tokenization。 输入特征：观看历史，表示为近期视频 ID 的 bag；实验使用最近 50 次观看；搜索历史，表示为分词后的 query；实验使用最近 50 次搜索；人口属性特征，包括地理位置、设备、性别、年龄和登录状态；用于刻画新鲜度偏置的「Example age」特征；排序使用数百个关于视频、用户及二者关系的类别特征和连续特征。
