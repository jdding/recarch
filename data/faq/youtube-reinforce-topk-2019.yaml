- key: core
  q_en: What is the core idea of YouTube REINFORCE Top-K recommender?
  a_en: A REINFORCE candidate generator with off-policy and top-K corrections and weight capping.
  q_zh: YouTube REINFORCE Top-K recommender 的核心思路是什么？
  a_zh: 带 off-policy 和 top-K 校正以及权重截断的 REINFORCE 候选生成器。
  fields:
  - core_idea
- key: results
  q_en: What results does YouTube REINFORCE Top-K recommender report?
  a_en: 'Live A/B experiments on the production candidate generator (multi-day runs): stochastic policy with exploration data (buckets 90/5/5 of users, 5% on the stochastic policy) ViewTime +0.07% (statistically significant); standard off-policy correction showed no significant ViewTime change but +0.53% videos viewed; top-K off-policy correction (K = 16, cap e^3) ViewTime +0.85% with videos viewed -0.16%; K sweep over a 5-day run: K = 1 -0.66% ViewTime, K = 2 -0.35%, K = 32 similar to K = 16, K = 8 +0.15% in a follow-up; lifting the weight cap from e^3 to e^5 dropped ViewTime by 0.52%.'
  q_zh: YouTube REINFORCE Top-K recommender 报告了哪些结果？
  a_zh: 对线上生产的候选生成器做的 A/B 实验，持续多天：带探索数据的随机策略，用户分桶 90/5/5，随机策略占 5%，ViewTime +0.07%，统计上显著；标准 off-policy 校正的 ViewTime 没有显著变化，但观看视频数 +0.53%；top-K off-policy 校正，K = 16，截断 e^3，ViewTime +0.85%，观看视频数 -0.16%；为期 5 天的 K 扫描：K = 1 时 ViewTime -0.66%，K = 2 时 -0.35%，K = 32 与 K = 16 相近，后续实验中 K = 8 为 +0.15%；把权重截断从 e^3 放宽到 e^5，使 ViewTime 下降 0.52%。
  fields:
  - results_reported
- key: online
  q_en: Does YouTube REINFORCE Top-K recommender have online evidence, and how long was the A/B?
  a_en: 'Online evidence: Online numbers. A/B duration: Multi-day runs; 5 days for the K sweep. A/B traffic: Users split 90%, 5% and 5%; the stochastic policy served 5%.'
  q_zh: YouTube REINFORCE Top-K recommender 有线上证据吗，A/B 做了多久？
  a_zh: 线上证据：有线上数据。A/B 时长：持续多天；K 扫描为 5 天。A/B 流量：用户按 90%、5% 和 5% 划分；随机策略服务 5%。
  fields:
  - deployment.online_evidence
  - deployment.ab_duration
  - deployment.ab_traffic
- key: caveats
  q_en: What should I keep in mind when reading the results of YouTube REINFORCE Top-K recommender?
  a_en: Experiments were run sequentially, each building on the previously launched production model, so effects are per-component and not additive (the paper says this). Absolute reward definitions and scale (users, items, QPS) are not given.
  q_zh: 读 YouTube REINFORCE Top-K recommender 的结果时要注意什么？
  a_zh: 实验是依次进行的，每次都建立在之前上线的生产模型之上，所以效果是按组件算的，不能相加，论文也这么说。 没有给出奖励的绝对定义和规模，即用户、item、QPS。
  fields:
  - caveats.0
  - caveats.1
