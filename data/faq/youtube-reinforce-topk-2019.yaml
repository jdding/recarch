- key: what
  q_en: What is YouTube REINFORCE Top-K recommender, in one sentence?
  a_en: REINFORCE policy-gradient candidate generator with off-policy and top-K correction; live A/B shows ViewTime gains, +0.07% for the stochastic-policy bucket.
  q_zh: YouTube REINFORCE Top-K recommender 一句话是什么？
  a_zh: 带 off-policy 和 top-K 校正的 REINFORCE 策略梯度候选生成器；线上 A/B 显示 ViewTime 有提升，随机策略桶为 +0.07%。
  fields:
  - tldr
- key: who
  q_en: Who built YouTube REINFORCE Top-K recommender and where does it run?
  a_en: 'YouTube REINFORCE Top-K recommender comes from Google / YouTube, 2018. Deployed in: YouTube production candidate generation.'
  q_zh: YouTube REINFORCE Top-K recommender 是谁做的，用在哪里？
  a_zh: YouTube REINFORCE Top-K recommender 来自 Google / YouTube，2018 年。上线位置：YouTube 线上的候选生成。
