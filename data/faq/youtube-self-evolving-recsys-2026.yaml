- key: caveats
  q_en: What should I keep in mind when reading the results of Self-Evolving Recommendation System?
  a_en: Table 1 uses anonymized metric names. The numbers refer to their specific launch and surface. The reported training speedup covers two changes to training configuration. Serving latency was not reported for those changes.
  q_zh: 读 Self-Evolving Recommendation System 的结果时要注意什么？
  a_zh: 表 1 的指标名称经过匿名化，数值对应特定上线改动和入口。 训练提速来自两次对训练配置的调整，论文未给出这些改动的请求延迟。
