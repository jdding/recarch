- key: core
  q_en: What is the core idea of Self-Evolving Recommendation System?
  a_en: Use an offline proxy to screen executable model changes and live business metrics to decide which of them advance.
  q_zh: Self-Evolving Recommendation System 的核心思路是什么？
  a_zh: 用离线代理指标筛选可执行的模型改动，再由真实流量的业务指标决定哪些改动继续推进。
  fields:
  - core_idea
- key: results
  q_en: What results does Self-Evolving Recommendation System report?
  a_en: On the primary YouTube surface, the Gated Path architecture improved the reported YouTube-level metric by 0.06% and the surface-level metric by 0.14%. Table 1 reports these as relative changes in one launch. Table 2 reports results for a separate surface. Section 5.2 describes an eightfold training speedup through two successive changes.
  q_zh: Self-Evolving Recommendation System 报告了哪些结果？
  a_zh: 在 YouTube 主要入口的 Gated Path 上线试验中，YouTube 全站指标相对提升 0.06%，入口指标相对提升 0.14%，见表 1。表 2 报告另一入口。第 5.2 节描述连续两次调整带来的八倍训练提速。
  fields:
  - results_reported
