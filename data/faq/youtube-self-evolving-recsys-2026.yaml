- key: what
  q_en: What is Self-Evolving Recommendation System, in one sentence?
  a_en: YouTube uses a fast offline agent to propose and screen ranker changes, and a slower online agent to test promising candidates and feed results back into the next round.
  q_zh: Self-Evolving Recommendation System 一句话是什么？
  a_zh: YouTube 用离线快环提出并筛选排序模型改动，用线上慢环测试优先候选，并把线上读数写回下一轮。
  fields:
  - tldr
