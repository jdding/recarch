- key: caveats
  q_en: What should I keep in mind when reading the results of SiDec?
  a_en: The online metric is a proprietary composite, Online Satisfied Engagement, and Table 1 notes that reported metrics may represent proprietary variants of the listed descriptors. The paper states that because the baseline systems already employ Semantic-ID token-based embeddings, the reported metrics isolate the pure performance lift generated solely by adding the SiDec component.
  q_zh: 读 SiDec 的结果时要注意什么？
  a_zh: 线上指标是专有综合指标 Online Satisfied Engagement，表 1 注明报告的指标可能是所列名称的专有变体。 论文说明因基线系统已使用 Semantic ID token 嵌入，报告的指标隔离的是仅新增 SiDec 组件带来的纯性能提升。
  fields:
  - caveats.0
  - caveats.1
