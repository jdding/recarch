- key: core
  q_en: What is the core idea of SiDec?
  a_en: Compress dense content embeddings into Semantic-ID tokens and reconstruct them on demand inside the model, so one token sequence serves both collaborative identity and content.
  q_zh: SiDec 的核心思路是什么？
  a_zh: 把稠密内容嵌入压成 Semantic ID token 并在模型内按需重建，让同一串 token 同时承担协同身份与内容两种角色。
  fields:
  - core_idea
- key: results
  q_en: What results does SiDec report?
  a_en: 'Online Satisfied Engagement, a proprietary composite of prolonged watch time and positive interactions, Table 1: Watchpage Ranking +0.09% sitewide and +0.80% watchpage; Homepage Ranking +0.08% sitewide and +0.22% homepage; the Retrieval Model +0.06% sitewide, +0.13% homepage and +0.09% watchpage. The table notes that reported metrics may represent proprietary variants of the listed descriptors, and the paper calls these absolute improvements highly statistically significant at YouTube''s scale, with outsized benefit for nascent accounts and long-tail content. Offline I/O study on the retrieval model, Table 2: the Control reaches 16.80 steps/s at loss 2.766 and Hit Rate at 100 of 0.2811; ingesting raw 64-dim content embeddings lifts Hit Rate to 0.2844 but cuts throughput 28.2% to 12.07 steps/s; SID v0 codebook decoding recovers 15.41 steps/s, +27.7% over raw embeddings, at 0.2816; SID v1 with a 256-dim latent space reaches 0.2870 at 15.26 steps/s; SID v1 plus scaling reaches the best loss 2.681 and Hit Rate 0.2910 at 14.53 steps/s, a 20.4% throughput advantage over raw embeddings. Ranking ablations, Tables 3 and 4, in absolute CTR AUC points: keeping only candidate and watch SIDs -0.04%, only watch-history SIDs -0.03%, removing the lightweight decoder -0.01%, ablating the contrastive SSL loss -0.05%, cross-attention -0.08% and multi-modal content -0.06%.'
  q_zh: SiDec 报告了哪些结果？
  a_zh: Online Satisfied Engagement 是反映长时观看与点赞、收藏等正向互动的专有综合指标，表 1：观看页排序全站 +0.09%、观看页 +0.80%；首页排序全站 +0.08%、首页 +0.22%；检索模型全站 +0.06%、首页 +0.13%、观看页 +0.09%。表注说明报告的指标可能是所列名称的专有变体；论文称这些绝对提升在 YouTube 的规模下高度统计显著，并对新账户和长尾内容收益更大。检索模型的离线 I/O 研究，表 2：Control 为 16.80 steps/s、loss 2.766、Hit Rate@100 0.2811；直接摄入 64 维原始内容嵌入把 Hit Rate 提到 0.2844，但吞吐下降 28.2% 到 12.07 steps/s；SID v0 码本解码恢复到 15.41 steps/s，比原始嵌入快 27.7%，Hit Rate 0.2816；SID v1 用 256 维隐空间达到 0.2870、15.26 steps/s；SID v1 加扩展达到最优 loss 2.681 与 Hit Rate 0.2910，吞吐 14.53 steps/s，比原始嵌入快 20.4%。排序消融，表 3 与表 4，CTR AUC 绝对百分点：只留候选与观看 SID -0.04%，只留观看历史 SID -0.03%，去掉轻量解码器 -0.01%，去掉对比 SSL 损失 -0.05%，去掉交叉注意力 -0.08%，去掉多模态内容 -0.06%。
  fields:
  - results_reported
