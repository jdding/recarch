items:
- key: what
  q_en: What is SiDec, in one sentence?
  a_en: Dual-purpose Semantic IDs compress dense content embeddings into tokens reconstructed on the fly; at YouTube they lifted satisfied engagement +0.80% on Watchpage and broke the I/O bottleneck.
  q_zh: SiDec 一句话是什么？
  a_zh: 双用途 Semantic ID 把稠密内容嵌入压成 token 按需重建；在 YouTube 使观看页满足感互动 +0.80%，并打破 I/O 瓶颈。
  fields:
  - tldr
- key: who
  q_en: Who built SiDec and where does it run?
  a_en: 'SiDec comes from Google / YouTube, 2026. Deployed in: YouTube watchpage and homepage ranking and a foundational retrieval model.'
  q_zh: SiDec 是谁做的，用在哪里？
  a_zh: SiDec 来自 Google / YouTube，2026 年。上线位置：YouTube 观看页与首页排序及一个基础检索模型。
  fields:
