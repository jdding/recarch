- key: serving
  q_en: What serving latency, QPS, cost or hardware does SiDec report?
  a_en: 'Serving latency: not reported. Serving QPS: not reported. Inference cost: Item storage falls from d x 32 bits to K x log2 V bits, typically 50-100x; reconstruction is described as costing no more than a normal sparse embedding feature, with tokens already cached in the baseline serving path. Hardware: not reported.'
  q_zh: SiDec 报告了怎样的服务延迟、QPS、成本和硬件？
  a_zh: 服务延迟：未报告。 服务 QPS：未报告。 推理成本：每物品存储从 d x 32 比特降到 K x log2 V 比特，典型 50-100 倍；重建成本被描述为不超过一个普通稀疏嵌入特征，token 在基线服务路径中已缓存。 硬件：未报告。
