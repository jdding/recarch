title: Agent 如何使用推荐能力
summary: Agent 在哪里调用推荐、向推荐组件传递哪些约束和偏好，以及怎样处理返回的物品。
problem: Agent 在帮用户完成任务时，需要找到符合意图、满足约束的物品，再用候选推进下一步。
question: 哪些推荐决策由 Agent 做，哪些交给召回和排序工具？
framing:
  - 从用户任务出发，例如找合适的商品或创建一次收听会话。Agent 将请求转成约束和偏好，选择推荐操作，再用返回的物品推进任务。
  - RecBot、Spotify 和 Meta 使用用户的显式输入。快手 EvoRec 在近线推断需求、为下游排序准备候选。延伸阅读补充生产论文披露较少的规划、目录操作和任务评估。
decisions:
  - when: 一条用户指令同时包含硬约束和软偏好。
    then: 让 Agent 输出有类型的偏好。先用确定性的过滤工具执行硬约束，再对剩余候选做匹配、降权和分数融合。
    cards: [alibaba-recbot-2025]
  - when: 用户要调整上次的推荐，或引用已经返回的某个物品。
    then: 保留当前列表和仍需满足的约束。评估下一次调用时，同时检查它是否完成新要求、是否保留用户仍在意的条件。
    cards: [spotify-conversational-agent-2026]
  - when: 想让用户的显式反馈影响既有推荐流。
    then: 保留语义画像，结合既有互动分筛除或重排候选。实验条件允许时，单独测量反馈入口和下游改动的影响。
    cards: [meta-shape-your-feed-2026]
  - when: 请求链路承受不起每次调用语言模型。
    then: 把需求推断和召回规划放到近线。现有排序链路接收额外候选，物品索引独立更新。
    cards: [kuaishou-evorec-2026]
members:
  - id: alibaba-recbot-2025
    approach: 把用户指令解析为结构化正负偏好，再编排推荐工具调整下一轮信息流。
  - id: spotify-conversational-agent-2026
    approach: 用对话状态创建或调整收听会话，支持在后续对话里引用已经推荐的内容。
  - id: kuaishou-evorec-2026
    approach: 在近线推断需求和选择召回工具，为现有线上排序提供补充候选。
  - id: meta-shape-your-feed-2026
    approach: 将用户反馈写入语义画像，结合现有互动分筛除或重排候选。
differences:
  - heading: Agent 给推荐组件传什么
    text: RecBot 传有类型的约束和偏好。Spotify 用请求和当前收听会话决定下一步操作。Meta 保留语义兴趣画像。EvoRec 输出召回计划和候选查询。
    cards: [alibaba-recbot-2025, spotify-conversational-agent-2026, kuaishou-evorec-2026, meta-shape-your-feed-2026]
  - heading: Agent 在链路哪里运行
    text: RecBot 和 Spotify 响应用户请求。Meta 在线给信息流打分时使用画像。EvoRec 在近线规划，线上链路读取预先生成的候选。
    cards: [alibaba-recbot-2025, spotify-conversational-agent-2026, kuaishou-evorec-2026, meta-shape-your-feed-2026]
  - heading: 线上对照改变了哪部分体验
    text: RecBot 测量首页方案，Spotify 对照扩展前后的 DJ 体验。Meta 测量反馈入口及后续信息流，EvoRec 新增召回通道并沿用下游排序。要对单个组件归因，需要各组对齐目录、工具、排序和能获取的反馈。
    cards: [alibaba-recbot-2025, spotify-conversational-agent-2026, kuaishou-evorec-2026, meta-shape-your-feed-2026]
readings:
  - InteRecAgent 把对话规划器接到独立的查询、召回和排序工具。
  - TAIRA 研究如何用学到的规划模式协调推荐子任务。
  - PRTA 把多个推荐模型作为工具，由规划器按需求选择，适合比较工具选择方法。
  - 研究用户还在逐步透露要求时，Agent 怎样决定下一步。
  - 用目录工具和程序化验收检查跨轮发现约束、遵守策略与完成推荐。
  - 在同一需求下改变用户披露约束的时机，评估 Agent 是否会追问或从拒绝中推断要求。
  - 用推荐模拟器评估兴趣变化和冷启动等场景。
  - 让 Agent 用召回和互补性等工具查找目录，并检验整组推荐的效用。
  - 把购买条件分别放在初始请求、可调用的用户画像与后续回答中，检验 Agent 怎样确认并选中商品。
  - CoShop 评估 Agent 能否先帮助用户形成可用的偏好，再从目录选出物品。
  - 范围更广的推荐工作流综述。可用来定位这里比较的用户状态、候选与反馈接口。
scope: 资料覆盖 2023 年 1 月至 2026 年 11 月的论文与官方产品资料，关注 Agent 怎样澄清用户目标、调用目录候选，再用推荐结果完成任务。
