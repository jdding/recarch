title: 长用户序列建模
summary: 对比十一张 RecArch 卡片，看看生产推荐系统如何在延迟预算内利用长用户历史。
framing:
- 用户的历史可以多达数万个事件，而排序器每个请求只有数十毫秒。本页的每个系统都在回答同样的两个问题。历史读多少，以及什么时候为读取付出代价？
- 答案差别很大。有的系统实时只读最近的数百个行为。有的对完整历史做搜索或压缩。有的把重模型移出请求路径，只提供缓存的结果。表格列出了每张卡片的报告。之后的各节解释了在选择方案时重要的那些差别。
problem: 用户历史可能长达数万个事件，而排序模型每次请求只有几十毫秒。你读多少历史，又在什么时候付出这个代价？
question: 你是在请求时读取历史，还是在请求到达之前就把代价付掉？
decisions:
- when: 你的请求预算很紧。
  then: 把重模型移出请求路径。PinnerFormer 每天批量运行，LLaTTE 异步运行大模型，线上排序模型只需做一次特征查询，SequenceO1 则构建可以缓存的摘要。
  cards: [pinnerformer-2022, meta-llatte-2026, bytedance-sequenceo1-2026]
- when: 你需要覆盖很长的历史。
  then: 先检索或压缩。SIM 搜索与候选相关的历史行为。SequenceO1 对较早的事件生成摘要，并直接读取最近事件。
  cards: [sim-alibaba-2020, bytedance-sequenceo1-2026]
- when: 你付得起请求时做注意力计算的代价。
  then: 在排序模型内部读取序列，并依靠 GPU 服务或 KV cache，TransAct、LONGER 和 LinkedIn Feed SR 就是这样做的。
  cards: [pinterest-transact, bytedance-longer-2025, linkedin-feed-sr-2026]
- when: 你想要最小的迁移成本。
  then: 产出能接入现有排序模型的输出。LUM 和 PinFM 就是这样做的，LLaTTE 则把工作拆给上游模型和一个紧凑的线上模块。
  cards: [alibaba-lum-2025, pinterest-pinfm-2025, meta-llatte-2026]
- when: 你有能力重写排序模型。
  then: HSTU 把召回和排序都视为对用户行为的序列预测，并替换了排序模型自身的特征交互层。
  cards: [hstu-meta-2024]
members:
- id: pinterest-transact
  approach: 在首页排序器内按候选挖掘实时与终身序列。
- id: pinnerformer-2022
  approach: 在每日批处理任务中最多读取 256 个行为，并提供一个用户 embedding。
- id: sim-alibaba-2020
  approach: 在完整历史中搜索与候选接近的行为，然后只对这些行为做 attention。最多可处理 54,000 个行为。
- id: bytedance-longer-2025
  approach: 端到端读取最多 10,000 个行为，合并 token 以降低成本，并用 KV cache 提供服务。
- id: pinterest-pinfm-2025
  approach: 在最多 16,000 个行为的序列上预训练，再耦合进现有的排序器。它只读取一次序列，并在各候选之间复用。
- id: bytedance-sequenceo1-2026
  approach: 把最多 100K 个事件压缩成可缓存的固定大小的 sketch，并直接读取最近的 10K 个事件。
- id: meta-llatte-2026
  approach: 大模型异步运行，并把用户 embedding 写入特征存储。线上排序器中的一个小模块读取它们。
- id: alibaba-lum-2025
  approach: 经过生成式预训练的用户模型，其输出成为现有排序器的额外特征。查询结果会被缓存。
- id: hstu-meta-2024
  approach: 把召回和排序都视为对用户行为的序列预测，并用 HSTU encoder 取代通常的特征交叉层。
- id: yandex-argus-2025
  approach: 在最长 8192 个事件的历史上预训练 Transformer，再提供每日更新的用户 embedding，供线上排序器作为特征使用。
- id: linkedin-feed-sr-2026
  approach: Feed 排序器内部的仅解码器 Transformer 读取最多 1000 条曝光帖子并与会员的行为交错，共 2000 个 token，在共享历史的一次前向中为约 512 个候选打分。
differences:
- heading: 输入多少历史
  text: PinnerFormer 最多读取 256 个行为。TransAct V2 围绕每个候选在约 10,000 个终身行为中检索，给模型保留 192 个 token。SequenceO1 把 100K 个事件变成摘要，同时直接读取最近 10K 个事件。LinkedIn Feed SR 最多读取 1000 条曝光帖子及其行为，LONGER 最多读取 10,000 个行为，PinFM 最多读取 16,000 个。SIM 先检索相关行为，处理范围可达 54,000 个行为。各个上限对应不同的服务和建模设计。
- heading: 成本在什么时候付出
  text: TransAct、LONGER 和 LinkedIn Feed SR 在请求时运行 attention，依赖 GPU 服务或 KV cache，Feed SR 在一次前向中让约 512 个候选共享同一段历史。PinnerFormer 在每日批处理中运行。LLaTTE 异步运行大模型，所以线上排序器只做一次特征查找。SequenceO1 构建的 sketch 不依赖候选，所以这个 sketch 可以缓存。LUM 缓存其实时查询的结果。如果你的请求预算很紧，应该先看这条轴。
- heading: 给排序器供数，还是取代它
  text: LUM 和 PinFM 的输出可以接入现有排序器。LLaTTE 把工作分给上游模型和紧凑的线上模块。HSTU 取代排序器的特征交互层，LinkedIn Feed SR 则用处理历史的 Transformer 取代 DCNv2 排序器。PinnerFormer 为召回提供用户嵌入。
- heading: 线上数字能说明什么，不能说明什么
  text: 表中的每个提升都是相对该公司自己的基线。TransAct V2 的对照组是带实时序列的线上 TransAct，所以它的收益是相对较早的序列模型，而不是相对没有序列。SequenceO1 的基线已经是带 TWIN V2 的 10K 排序器。不要按百分比给这些系统排名。请改为比较每张卡片上的基线、流量占比和服务数字。
