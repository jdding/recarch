# Site-level settings and events. No secrets here: this file is published into the build.
newsletter:
  provider: beehiiv
  publication_id: "pub_26d33a6b-014f-4e0d-9645-896dcc81a08d"
  form_id: "f5e9d3b3-b164-4cdb-b452-4995d34b4f4b"
  public_url: "https://recarch.beehiiv.com"
  embed_url: "https://subscribe-forms.beehiiv.com/v3/loader.js"   # loader script; the form is chosen by data-beehiiv-form=form_id
launch_batch_until: "2026-10-30"   # cards and events dated on or before this are the launch baseline: never counted as "this week" additions
feedback:
  repo: "https://github.com/jdding/recarch"   # corrections and system requests go to this repo's issues; no email address is published
carousel_size: 6          # home carousel slides
carousel_window_days: 7   # 'recent' = added/updated within this many days of the build date; fewer than size -> backfill by latest activity
events:
  - date: "2026-10-29"
    title: "RecArch started"
    title_zh: "RecArch 上线"
    note: "First batch of system cards, each written from the full text of its public sources."
    note_zh: "首批系统卡片发布，每张都依据其公开来源的全文撰写。"
  - date: "2026-10-30"
    title: "Code availability checked for every card"
    title_zh: "每张卡片都核查了代码可用性"
    note: "Every card now says whether official or third-party code exists; each repo link was checked."
    note_zh: "每张卡片现在都会说明是否有官方或第三方代码，并逐一检查了仓库链接。"
  - date: "2026-10-30"
    title: "Year and era audit"
    title_zh: "年份与时代审核"
    note: "Each card has an explicit era and first-public month; two wrong years were fixed namely Pixie and Meta Lattice."
    note_zh: "每张卡片都有明确的时代和首次公开月份，Pixie 与 Meta Lattice 两处错误年份已修正。"
  - date: "2026-10-30"
    title: "Papers now link to the published version"
    title_zh: "论文链接改为正式发表版本"
    note: "Where a venue version exists the card's primary source is its DOI link; arXiv stays as a secondary source. Cards say whether the published PDF was read."
    note_zh: "若存在会议或期刊版本，卡片的主要来源改为其 DOI 链接，arXiv 作为次要来源保留。卡片会注明是否阅读了正式发表的 PDF。"
  - date: "2026-10-31"
    title: "Deployment and cost on every card, plus two topic pages"
    title_zh: "每张卡片新增部署与成本，并上线两个专题页"
    note: "Each card now has a Deployment and cost table: A/B setup, latency, hardware and cost, with not reported where the sources say nothing. Topic pages compare long user-sequence modeling and generative retrieval. Five cards were corrected where the full text gave latency or metric details the card had marked unknown or not named."
    note_zh: "每张卡片现在都有“部署与成本”表：A/B 设置、延迟、硬件和成本，来源没有说明的写作未报告。专题页对比了长用户序列建模和生成式召回。另有五张卡片已更正，原因是全文给出了延迟或指标细节，而卡片此前标为未知或未写明。"
  - date: "2026-10-31"
    title: "RecArch is now bilingual"
    title_zh: "RecArch 现已提供中英双语"
    note: "The site opens in Chinese by default, and every page has an English version one click away through the language switch."
    note_zh: "网站默认显示中文，每个页面都可通过语言切换一键进入英文版。"
