id: airbnb-listing-embeddings-2018
name: Airbnb Listing & User-Type Embeddings for Search Ranking
company: Airbnb
surface: Search ranking and Similar Listings
year: 2018
era: deep
era_reason: "Skip-gram style neural embeddings feeding a ranker in 2018; neural but shallow"
first_public: "2018-07"
venue: "KDD 2018"
venue_year: 2018
