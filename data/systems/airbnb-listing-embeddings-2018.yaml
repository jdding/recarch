updates:
- date: '2026-11-25'
  note: Rechecked the KDD paper and corrected the Similar Listings lift, the subgroup scope, and the search experiment control.
system_type: search
evidence_level: production_described
tldr: Airbnb uses click-trained listing embeddings for related listings and as search-ranking features. The Similar Listings carousel CTR rose 21% overall in its A/B test.
summary: Skip-gram-style listing embeddings trained on click sessions with booking-as-global-context and market-aware negatives, plus
  user-type/listing-type embeddings for long-term interest; used as similarity features in the ranking model.
paradigms:
- embedding-based-retrieval
- learning-to-rank
stages:
- stage: rank
  model_family: Embedding-similarity features (to recently clicked/skipped/booked listings) fed into the search ranker
  details: The GBDT uses cosine similarities to listings from the user's recent interactions and long-term user-to-listing-type similarity as ranking features.
- stage: retrieval
  model_family: Similar Listings via embedding nearest neighbours
  details: Online cosine nearest neighbors are drawn from available listings in the same market and for the same dates, if entered.
id_tokenization:
  approach: Listing IDs / listing types / user types
  details: null
features_signals:
- Click sessions
- Bookings
- Skips (negative signal)
- Listing attributes bucketed into types
training:
  mode: Offline, retrained daily
  objectives:
  - Skip-gram with booked listing as global context
  notes: 32-d embeddings.
serving_infra: Search machines hold shards of listing embeddings and calculate Similar Listings similarities in parallel. Click sessions and listing models are refreshed daily through Airflow and MapReduce.
scale:
- metric: Training sessions
  value: more than 800 million search click sessions
  note: PDF
- metric: Embedding dimension
  value: '32'
  note: PDF
- metric: Share of bookings from the two channels
  value: 99% (Search Ranking and Similar Listings)
  note: PDF
results_reported: The Similar Listings A/B test raised carousel CTR by 21% overall, by 23% on pages with dates, and by 20% on dateless pages. The number of guests who found the listing they went on to book in the carousel rose 4.9%. A separate search-ranking test found a statistically significant booking gain and did not give its size.
caveats:
- The carousel booking-discovery metric counts guests who found an eventual booking in the carousel. The separate search-ranking booking lift has no published magnitude.
unknown_fields:
- serving latency
- Magnitude of booking lift for search ranking and traffic allocation in the two experiments
