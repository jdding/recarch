results_reported: 'Randomization of top map results on mobile showed no booking difference, while the same randomization on search-box
  queries costs about 8% bookings and up to 5% NDCG. Bookability Filter, offline vs 18-pin baseline per Table 1: alpha 1.0/2.0/4.0/8.0
  gives -39%/-25%/-9%/-1% pins. Online per Table 2: alpha 1.0 gives +1.7% uncanceled bookings, +1.6% 5-star trips, -14% avg impressions
  to discovery, -5.7% avg clicks to discovery. Final larger run at alpha 1.0: +1.9% uncanceled bookings, +2% 5-star trips, -16% results
  seen before the booked listing, -6.8% results clicked. Robust anchor (second-highest listing): pins +6%, searcher-to-listing-viewer
  conversion +0.15%; anchor as function of listing count adds another +2.6% pins. Focus vs urgency: randomly choosing 14 of 18 pins
  gave -1.5% bookings, so urgency is not the cause. Desktop two-tier pins (Table 3, alpha 1.0): +0.7% uncanceled bookings, +0.5% 5-star
  trips, -21% impressions to discovery, -1.7% clicks to discovery. Map-center feature: +0.27% bookings, +2% pin CTR. Algorithm 2 vs
  Algorithm 1: +0.39% bookings for new guests (p = 0.006).'
caveats:
- Paper describes launched changes but gives no deployment date or traffic share beyond the experiment sizes.
- The paper's Table 1 lists average booking probability changes as large relative increases, 47% at alpha 1.0 relative to the baseline; these are offline simulation figures.
- Model architecture and features are in earlier Airbnb papers, not this one.
- The paper says the 1.9% bookings gain is measured as a percentage of overall global bookings.
