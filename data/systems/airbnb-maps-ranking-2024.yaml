tldr: "Airbnb finds the order of top map pins doesn't matter, so it drops rank-based attention and a Bookability Filter shows fewer pins; alpha 1.0 gave +1.7% uncanceled bookings."
summary: KDD 2024 paper by Airbnb on re-designing ranking for map results. A randomization A/B on map-originated searches shows the
  order of the top map pins does not matter, so the list-based attention model, where attention decays with rank, is replaced by uniform attention
  over pins. This gives a 'Less Is More' principle and a Bookability Filter that shows only listings whose logit is within alpha of
  the best listing, a dynamic number of pins instead of a fixed 18. Later steps add a robust anchor, two-tier pins, regular and mini-pins, on desktop, and a greedy map-center search using a 2-D attention decay map.
paradigms:
- learning-to-rank
stages:
- stage: re-rank
  model_family: 'Booking-probability ranking model (neural network, described in earlier Airbnb papers) followed by a Bookability Filter
    on its logits: keep listing k if logit(l_max) - logit(l_k) < alpha, equivalent to P(l_k) > P(l_max)/e^alpha'
  details: 'Anchor probability made robust: median of top 3 listings (the second-highest), later made a function of the total number
    of ranked listings. Desktop variant: listings passing the filter get regular price pins, others get mini-pins without price, with
    attention weight 1/8 for a mini-pin (measured CTR 8 times lower). For search-box queries, Algorithm 2 greedily picks the map center
    on a grid to maximize sum of P_attention * P_booking, with complexity O(k^2 n). Map-movement queries instead use a ranking-model
    feature for pin distance from the map center.'
