tldr: "How Airbnb search ranking moved from a GBDT to neural nets, ending at a 2-hidden-layer DNN after about 10x more training data, with offline NDCG and online booking gains."
summary: >-
  Narrative of moving search ranking from a GBDT to neural networks: simple NN, pairwise LambdaRank-style NN,
  GBDT/FM outputs as features, and finally a 2-hidden-layer DNN after scaling training data about 10x.
paradigms: [learning-to-rank, gbdt]
stages:
  - stage: rank
    model_family: Evolution GBDT -> single-hidden-layer NN (32 ReLU) -> pairwise LambdaRank NN -> DNN with 2 hidden layers
    details: >-
      LambdaRank-style NN uses pairwise cross-entropy between booked and not-booked listings, weighted by difference in NDCG.
      Final DNN: 195 input features after expanding categorical features to embeddings, then 127 and 83 ReLU units.
id_tokenization: {approach: "Listing-ID embeddings were tried and mostly overfit, since listings can be booked at most 365 times a year; multi-task booking + long-view learning also tried.", details: null}
