id: alibaba-edgerec-2020
name: EdgeRec
company: Alibaba
surface: Mobile Taobao homepage feed
year: 2020
era: deep
era_reason: Neural behavior encoders and an attention reranker jointly score the server-provided candidate set.
first_public: '2020-05'
venue: CIKM 2020
venue_year: 2020
published_version_checked: false
primary_source: https://doi.org/10.1145/3340531.3412700
added_on: '2026-11-26'
last_verified: '2026-11-26'
system_type: recommendation
evidence_level: production_described
tldr: Taobao keeps its candidate service and embedding tables in the cloud. The phone uses fresh activity to reorder unexposed candidates that it has already received.
summary: The server sends item candidates with their features and looked-up embeddings. Mobile Taobao updates its exposure and item-interaction state from local events, then triggers a small attention-based reranker for the unseen part of the feed. The client sends interaction logs back for cloud training.
paradigms: [learning-to-rank]
stages:
  - stage: retrieval
    model_family: Existing Taobao recommendation service with key-value embedding lookup
    details: The existing service provides initially ranked candidates and embedding features. The large embedding tables stay in the cloud.
  - stage: re-rank
    model_family: Recurrent behavior encoders and candidate-conditioned attention
    details: The phone incrementally updates separate exposure and interaction histories, then reranks unexposed items after relevant local activity.
id_tokenization: {approach: Learned item feature embeddings, details: Category and brand embeddings are looked up in the cloud and returned as candidate features.}
features_signals:
  - Item features and embeddings in the candidate response
  - Locally observed exposures and item interactions
training:
  mode: Cloud training from interaction logs and versioned model delivery
  objectives:
    - Reorder upcoming items using the latest user behavior.
  notes: The offline model is split into on-device behavior and reranking components and server-side embedding tables.
serving_infra: The production client uses Alibaba MNN for neural inference. It reranks the cached candidates upon local triggers and continues paging from the server.
scale:
  - {metric: Cloud response and page size, value: '100 candidates returned for a page size of 50'}
  - {metric: On-device model, value: About 3 MB excluding embedding tables}
  - {metric: Cloud brand embedding table, value: About 230 MB}
results_reported: The full system improved GMV by 10.92%, CTR by 7.18% and clicks by 8.87% against the previous Mobile Taobao recommender in a nearly two-week test. At peak traffic, the reported system response was at most 100 ms versus 1 s, and behavior capture took at most 300 ms versus 1 min.
caveats:
  - The production test covers the combined EdgeRec system with its candidate payload and mobile reranker.
  - The latency figures describe system behavior and response in the reported deployment. The paper does not identify the handset hardware or CPU and energy impact.
unknown_fields:
  - Allocation percentages, device specification and per-request payload size
  - Battery use and request-tail latency
sources:
