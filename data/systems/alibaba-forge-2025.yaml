id: alibaba-forge-2025
name: "FORGE"
company: Alibaba Taobao & Tmall Group
surface: Taobao homepage Guess You Like, generative retrieval channel
year: 2025
era: generative
era_reason: "Studies how to build the semantic IDs that a generative retrieval model writes; the retriever is an LLM-style decoder that generates 3-level semantic IDs, which is the generative paradigm."
first_public: "2025-09"
venue: "KDD 2026"
venue_year: 2026
