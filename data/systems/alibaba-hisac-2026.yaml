tldr: "HiSAC compresses histories of up to 10,000 interactions into personalized semantic-ID interest agents; on Taobao's homepage feed it lifted CTR 1.65% and cut serving latency by over 40%."
summary: "HiSAC, built by an Alibaba Group team listed as Taobao and Tmall Group of Alibaba on the conference program, is a sequence compression framework that turns ultra-long user behavior histories, exceeding 10,000 interactions for highly active users, into compact personalized interest representations for the ranking stage. Items are tokenized into multi-level semantic IDs by a frozen multimodal encoder and RQ-VAE over a global hierarchical codebook; a hierarchical voting mechanism sparsely activates per-user interest-agents on a global semantic tree, and a Soft-Routing Attention aggregates all historical signals weighted by similarity to limit quantization error and preserve long-tail preferences. Deployed on Taobao's \"Guess What You Like\" homepage serving hundreds of millions of daily active users, it delivered a 1.65% CTR uplift, a 2.24% CTCVR improvement and 2.56% more orders in a two-week A/B test against the strongest prior compression method in production, while reducing end-to-end inference latency by over 40% to about 21 ms per request."
paradigms:
- semantic-id
- attention-ctr
stages:
- stage: rank
  model_family: "Sequence compression module inside an attention-CTR ranker: frozen multimodal encoder and RQ-VAE semantic IDs, hierarchical voting interest-agents, soft-routing attention feeding MHA cross modeling over candidates"
  details: "User histories of up to 10,000 interactions map onto a global semantic tree over the codebook; bottom-up vote propagation and top-down pruning keeping the top-k children per level leave K sparsely activated interest-agents, about 200 in the experiments; each agent aggregates the entire history by similarity weighting, then candidates cross-attend the compressed sequence through MHA."
id_tokenization:
  approach: "Multi-level hierarchical semantic IDs from Residual Quantized VAE over frozen multimodal embeddings"
  details: "Item title, category labels, domain-specific text and the product image are encoded by a frozen CLIP ViT-B/32 with a Q-Former of 8 learnable query tokens, trained with symmetric InfoNCE. RQ-VAE quantizes the fused embedding level by level with commitment loss 0.25 and EMA codebook updates with decay 0.99; the industrial configuration is L=2 levels of 512 entries each and the public benchmarks use 200 x 2. A user history becomes a sequence of SIDs, the discrete path through the levels."
features_signals:
- "Item metadata text and product image through a frozen multimodal encoder"
- "User behavior sequence of up to 10,000 interactions"
- "Category and brand item-side features concatenated to the trainable ranking embedding"
- "Time-decay feature"
- "Vote counts over the semantic tree as agent weights"
training:
  mode: "Offline training; SIDs and agents are constructed offline daily with only newly added items processed"
  objectives:
  - "Symmetric InfoNCE contrastive training of the multimodal encoder"
  - "RQ-VAE reconstruction with commitment loss and EMA codebook updates"
  - "CTR prediction for the trainable ranking embeddings used as aggregation content"
  notes: "Adam for dense and Adagrad for sparse parameters, initial learning rate 1e-3; all compression methods produce 200 groups; industrial data uses 13 training days and one validation day; NVIDIA H20 GPUs; offline metrics averaged over 3 seeds with standard deviation below 0.0003."
serving_infra: "Deployed with MHA for cross modeling between the compressed sequence and candidates, with three production optimizations: offline agent construction daily at no additional online cost, request-level compression of N to K once per request, and cache-enhanced MHA with candidate queries precomputed offline and refreshed every 2 hours. With 2,000 candidates and 10k-length histories, per-request latency drops from over 100 ms for vanilla MHA to about 35 ms with compression alone and about 21 ms with all three optimizations, a 40% reduction over the compressed baseline."
