results_reported: "Online A/B, Sec 4.7 Table 3: a controlled two-week test on Taobao's \"Guess What You Like\" homepage against the strongest prior compression method in production gives IPV +1.93%, CTR +1.65%, CTCVR +2.24% and orders +2.56%, all reported statistically significant, serving hundreds of millions of daily active users. Soft-routing long-tail effect, Sec 4.7: in production the top 10% most frequent items capture over 90% of exposure; under HiSAC the CTR of items outside this top 10% improves by 12.6% and the average number of distinct item categories surfaced per user increases by 5.7%. Offline, Sec 4.2 Table 1, industrial dataset of 14 days of Taobao logs with 200M users, 1B items and 30B interaction records: at sequence length 10k HiSAC reaches AUC 0.6444 and GAUC 0.5525 versus uncompressed MHA 0.6419/0.5503 and the best generic baseline Aggregator 0.6438/0.5518; on Taobao-MM, a public multimodal benchmark with 8.79M users, 35.4M items and maximum sequence length 1,000, HiSAC reaches AUC 0.6704 and GAUC 0.6114 versus MHA 0.6692/0.6096 and Aggregator 0.6699/0.6101. Integrated into state-of-the-art architectures by replacing their native compression: HiSAC + Longer reaches AUC 0.6455 and GAUC 0.5537 at 10k versus Longer 0.6448/0.5529, and on Taobao-MM 0.6733/0.6135 versus Longer 0.6714/0.6122. Ablations, Sec 4.4 Table 2 at 10k: removing the multimodal encoder drops AUC by 0.20 p.p. to 0.6424, replacing soft with hard routing drops AUC by 0.15 p.p. to 0.6429, collapsing the two embedding spaces into one drops AUC to 0.6253; on long-tail items soft routing improves AUC by 18.4% over hard routing. Serving, Sec 3.5: with 2,000 candidates and 10k-length histories vanilla MHA exceeds 100 ms per request, HiSAC compression alone reduces this to about 35 ms, and the three production optimizations together reach about 21 ms, a 40% reduction over the compressed baseline, with no measurable loss in recommendation quality; cache-enhanced MHA cuts projection FLOPs by about 72% and per-request latency by 38% at a cache hit rate above 99%. Offline metrics are averaged over 3 seeds with standard deviation below 0.0003."
caveats:
- "The online baseline is described only as the strongest prior compression method in production; the paper does not name it."
- "The paper reports no traffic share, bucket counts or user counts for the two-week A/B test."
- "Latency figures are stated for a configuration of 2,000 candidates and 10k-length histories; serving hardware and QPS are not reported."
