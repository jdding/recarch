tldr: "Large User Model: a generatively pre-trained transformer of up to 7B params whose outputs feed classic DLRMs; Taobao sponsored search ranking saw CTR +2.9%, RPM +1.2%."
summary: 'WSDM ''26 paper: LUM, the Large User Model, a transformer pre-trained generatively on user behavior and used in three steps: knowledge construction, knowledge querying with condition tokens, and knowledge utilization as extra features for traditional DLRMs. Scales to
  7B parameters offline and is deployed in the ranking stage of Taobao sponsored search.'
paradigms:
- foundation-model
- sequential-transformer
stages:
- stage: rank
  model_family: LUM pre-trained with next-condition-item prediction; outputs from queried condition tokens are fed as features to the
    existing DLRM ranker in Taobao sponsored search
  details: Step 2 (knowledge querying) runs in real time early in request handling, in parallel with retrieval and pre-ranking, so LUM
    latency is decoupled from the final ranking stage. A centralized cache stores real-time results and preloaded offline-inferred user
    interests as fallback for tight response-time budgets.
