id: alibaba-mine-then-train-2026
name: Mine-Then-Train
company: Alibaba Taobao & Tmall Group
surface: Item multimodal representations feeding the CTR prediction model of Taobao display advertising
year: 2026
era: deep
era_reason: "A CLIP-family multimodal encoder is fine-tuned as a feature provider for an ID-based CTR ranker; no generative or LLM component is central."
first_public: "2026-08"
venue: "CIKM 2026"
venue_year: 2026
published_version_checked: false
primary_source: "https://doi.org/10.1145/3799682.3840096"
added_on: "2026-11-03"
last_verified: "2026-11-03"
updates: []
system_type: ads
evidence_level: production_described
tldr: "Mines multimodally interpretable triplets from CTR clicks and fine-tunes the SCL encoder for Taobao display advertising; long-term A/B gives CTR +1.5% and RPM +0.5%."
summary: "Mine-Then-Train is Taobao & Tmall Group's method for learning native multimodal representations for CTR prediction in Taobao display advertising. The paper first shows that end-to-end multimodal training on top of the production SCL encoder fails: every E2EM variant degrades GAUC because raw CTR clicks mix multimodal and non-multimodal factors, giving ambiguous supervision. Instead, the method trains an annotation model that scores click relevance from raw item images and titles, mines 30 million multimodally interpretable triplets, and fine-tunes the SCL encoder with a triplet margin loss; a long-term A/B test in Taobao display advertising starting early 2026 delivered CTR +1.5% and RPM +0.5%."
paradigms:
- attention-ctr
- semantic-id
stages:
- stage: rank
  model_family: "ID-based CTR prediction model of Taobao display advertising, MUSE in the E2EM study and the newer production model cited as EST in the NMRL experiments, consuming SCL multimodal representations through SimTier, SA-TA similarity features and linear-layer direct fusion"
  details: "The CTR prediction model itself is not modified; only the multimodal encoder that feeds it is fine-tuned on mined data."
id_tokenization:
  approach: "Sparse item ID embeddings alongside frozen SCL multimodal representations; the mining stage adds RK-Means semantic IDs with a learnable 3x8192 SID decode codebook"
  details: "In the annotation model, a TaskRes-style residual tuning module keeps the SCL encoder frozen and learns SID embeddings from a zero-initialized decode codebook as CTR-specific residuals, so preference information stays tied to multimodally interpretable item SIDs."
features_signals:
- "Raw multimodal content of target and history items, main images and titles, encoded by the frozen Chinese CLIP ViT-B/16 SCL encoder"
- "Target-versus-history multimodal similarity passed to the CTR model as SimTier and SA-TA features"
- "Multimodal representations fused with item ID embeddings through a linear layer"
- "Annotation model click-relevance scores integrated as features during mining and diagnosis"
- "User age, gender and click-history sequence features; category, brand and item ID of the target item"
training:
  mode: "Offline mining and encoder fine-tuning; the online pipeline is unchanged"
  objectives:
  - "Triplet margin loss with margin 0.1 on mined triplets to learn click-preference-aligned similarity ranking"
  - "SCL MoCo-style contrastive loss as a regularizer to prevent forgetting e-commerce semantics"
  notes: "Mining thresholds: pairwise multimodal similarity 0.3, SCL similarity gap 0.05, annotation-score margin 0.15. The annotation model itself is trained end-to-end by the CTR loss while only its SID decode codebook is learnable. Human evaluation on 1000 high-confidence and 1000 low-confidence triplets shows win rates of 85% versus 42%."
serving_infra: "Since only the multimodal encoder is optimized and no other module changes, the system reuses the SCL encoder's online deployment pipeline in Taobao display advertising."
scale:
- metric: Deployment
  value: "Integrated into Taobao's display advertising system in early 2026, evaluated with a long-term A/B test"
  note: "paper, Sec 6.3"
- metric: E2EM study dataset
  value: "84 million users, 88 million products and 1.9 billion samples over one week from Taobao"
  note: "paper, Sec 3.1"
- metric: NMRL experiment dataset
  value: "one-month CTR dataset from the Taobao display advertising system"
  note: "paper, Sec 6.1"
- metric: Mined fine-tuning data
  value: "30 million high-quality triplets"
  note: "paper, Sec 5.2"
- metric: E2EM training cost at batch 32, sequence length 50
  value: "peak GPU memory 3.37 GB rising to 5.71 GB target-side and 84.56 GB target-and-sequence; average step time 1.02 s rising to 1.94 s and 7.32 s"
  note: "paper, Sec 4.3 Table 5, measured with CLIP ViT-B/16 and MUSE; diagnosis of the rejected alternative"
results_reported: "Deployment, Sec 6.3: Native Multimodal Representation entered Taobao's display advertising system in early 2026 and a long-term A/B test showed a 1.5% CTR improvement and a 0.5% RPM improvement, restated in the conclusion. Offline, Sec 6.2 Table 6, relative lifts over the baseline that already includes SCL representations: adding annotation-model scores gives GAUC +0.13% and AUC +0.08%, and the full NMRL method gives GAUC +0.22% and AUC +0.11%. Diagnosis of the rejected end-to-end alternative: Sec 3.2 Figure 2 shows the E2EM encoder drops GAUC below the production SCL encoder; Sec 3.3 Table 1 on the Taobao-MM benchmark gives GAUC 0.6154 for the frozen MUSE baseline, 0.6139 for target-side E2EM, 0.6128 with LEMUR's memory bank and 0.6124 for target-and-sequence E2EM; Sec 3.3 Table 2 shows no optimizer or learning rate choice among SGD, Adam and AdamW at 2e-3 to 2e-5 beats 0.6154. Sec 4.1 Table 3 measures that multimodal similarity alone predicts clicks only slightly above random, MultiModal-Mean GAUC 0.541 and MultiModal-Max GAUC 0.536; Sec 4.2 Table 4 finds E2EM gradient cosine similarities of 0.016 and 0.006 against 0.144 and 0.849 for SCL, and Sec 4.2 reports that adding SCL loss to co-training drops CTR GAUC by 0.17 percentage points and SCL Top-1 accuracy by 5 pt. Mining quality, Sec 5.2: the annotation score alone lifts GAUC by 0.13%, and human voting on triplets with annotation-score margin above 0.15 versus below 0.05 gives Item 1 win rates of 85% versus 42%."
caveats:
- "The paper describes the online evaluation only as a long-term A/B test; no traffic share, bucket design or duration is given."
- "The paper's stated limitations of the annotation model are that click-relevance scores can be inaccurate for some item pairs because it is trained directly on CTR data, and that preferences are learned solely through SID embeddings whose learning resembles ID-style memorization without direct access to raw multimodal content, limiting generalization."
- "The CTR prediction model differs between studies: the E2EM diagnosis uses MUSE while the NMRL experiments use a newer production model cited as Liu et al. 2026, so Table 1 and Table 6 numbers come from different model setups, and the Taobao-MM benchmark is a lighter-weight proxy."
- "The paper's GenAI usage disclosure states generative AI tools were used only to polish writing and readability, with no scientific content generated."
unknown_fields:
- "A/B traffic share, bucket count and test duration"
- "Training compute, GPU counts and fine-tuning duration of the proposed method"
- "Serving latency, QPS and hardware of the display advertising system"
- "Absolute AUC and GAUC values of the NMRL experiments, reported only as relative lifts"
- "Inference cost change of the updated encoder in production"
