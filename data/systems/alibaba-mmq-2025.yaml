- semantic-id
- multi-task
stages:
- stage: retrieval
  model_family: "Multimodal shared-specific expert tokenizer with residual quantization, feeding generative retrieval and discriminative ranking backbones"
  details: "The tokenizer produces semantic IDs consumed by a generative retrieval system and validated in discriminative ranking against the PPNet item-ID backbone; the shared expert is shown to be crucial for parameter-efficient, highly specialized experts."
id_tokenization:
  approach: "Multimodal mixture-of-quantization semantic IDs from shared and specific experts"
  details: "Each modality keeps its own expert with a shared expert across modalities; quantization metrics track reconstruction loss, codebook entropy and utilization, and behavior-aware fine-tuning aligns the codes with downstream recommendation behavior."
