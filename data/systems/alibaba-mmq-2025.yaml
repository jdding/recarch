tldr: "MMQ tokenizes multimodal item content into semantic IDs with shared and specific experts; a 30-day A/B lifted advertising revenue +0.90% and CVR +4.33%."
summary: "MMQ, from Alibaba Group with Peking University, BUAA and Wuhan University co-authors, is a multimodal mixture-of-quantization tokenizer that generates semantic IDs for recommendation. A multi-expert encoder keeps modality-shared and modality-specific experts so textual, visual and behavioral signals fuse without forcing a single shared space, and a two-stage recipe trains the tokenizer: multimodal shared-specific pretraining followed by behavior-aware fine-tuning that aligns the semantic space with the behavioral space of the downstream tasks. The generated semantic IDs were deployed in the generative retrieval system of a leading e-commerce advertising platform in Southeast Asia, replacing an Item ID-based system in an online A/B test."
