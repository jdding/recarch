primary_source: "https://doi.org/10.1145/3799682.3840125"
added_on: "2026-11-03"
last_verified: "2026-11-03"
updates: []
system_type: ads
evidence_level: production_described
tldr: "MUSE brings frozen multimodal embeddings into both stages of lifelong interest modeling; Taobao display advertising A/B: CTR +12.6%, RPM +5.1%, ROI +11.4%."
summary: "MUSE, built by Wuhan University together with Alibaba's Taobao display advertising team, is a two-stage lifelong user interest modeling framework for CTR prediction that injects high-quality multimodal item embeddings into both stages. A lightweight GSU retrieves the top-K relevant behaviors from histories of up to 100K interactions by cosine similarity over frozen SCL embeddings, while the ESU combines a SimTier histogram of the multimodal similarity sequence with SA-TA, a target attention whose ID scores are fused with multimodal similarity. Deployed in the Taobao display advertising ranking stage since mid-2025 for the majority of traffic, it also open-sources the first large-scale public dataset pairing ultra-long behavior sequences with high-quality multimodal embeddings."
paradigms:
- embedding-based-retrieval
- attention-ctr
stages:
- stage: rank
  model_family: "Two-stage lifelong interest model in the ranker: cosine-similarity GSU over frozen SCL embeddings plus a multimodal-enhanced ESU with the SimTier histogram and SA-TA fused target attention"
  details: "MUSE sits in the ranking stage; the GSU pre-fetch runs asynchronously during the matching stage so it is off the critical path, while Top-K selection and the ESU run inside ranking. SimTier bins the target-behavior similarity sequence over the range from -1 to 1 into an N-tier histogram; SA-TA fuses ID attention scores with the multimodal similarity vector through learnable scalars."
id_tokenization:
  approach: "Frozen multimodal item embeddings plus ID embeddings; no semantic IDs"
  details: "Items map to frozen pre-trained embeddings accessed by table lookup; SCL is chosen after comparison with OpenCLIP pre-trained on 200M image-text pairs and a co-occurrence I2I model. The ESU keeps ID embeddings for collaborative signals; the open dataset ships a 128-dimensional SCL embedding per item."
features_signals:
- "Frozen SCL multimodal embeddings for target and behavior items"
- "ID embeddings of target and behavior items"
- "Multimodal cosine similarity sequence between the target item and retrieved behaviors"
- "Hundreds of engineered features carried by each production sample"
training:
  mode: "Offline training, one epoch on the experiment datasets"
  objectives:
  - "CTR prediction on binary click labels"
  notes: "All compared methods share the same network architecture and one epoch of training; the production experiment trains on six days of impression logs and tests on the final day. The open-source training uses Adam with learning rate 2.0e-3 for embeddings and 2.0e-4 for DNN parameters at batch size 8,000; the GSU retrieves 50 behaviors and sequences are capped at 5,000 for production experiments and 1,000 for open-source ones. SCL embeddings stay frozen."
serving_infra: "Ranking-stage deployment in Taobao display advertising. GSU feature and embedding fetching is decoupled from the critical ranking path: the GSU server pre-fetches the user behavior sequence and multimodal embeddings from remote storage asynchronously in parallel with the matching stage and caches them in GPU memory, so pre-fetch latency is typically fully hidden. During ranking, similarity computation and Top-K selection run in parallel with other feature processing, and the ESU applies SimTier and SA-TA for the final CTR prediction."
scale:
- metric: Behavior sequence length
  value: "up to 100K interactions online; production offline experiments cap at 5,000"
  note: "paper, abstract, Sec 5 and Sec 7.1.2"
- metric: Production dataset
  value: "3.71B samples, 0.19B users, 23.6B distinct items"
  note: "paper, Table 4; one week of impression logs"
- metric: Open-source dataset
  value: "99.0M samples, 8.79M users, 35.4M distinct items, max sequence 1K"
  note: "paper, Table 4; the Sec 6.2 text instead states 107M samples, 8.86M users and 275M unique items"
- metric: Traffic share
  value: "majority of traffic since mid-2025"
  note: "paper, Sec 5"
results_reported: "Online, Sec 7.5 Table 6: a long-term A/B test in Taobao display advertising with MUSE at 100K sequence length against a production baseline based on SIM with 5K behavior length gave CTR +12.6%, RPM +5.1% and ROI +11.4%; deployment since mid-2025 handles the majority of traffic, Sec 5. Offline, Table 5, GAUC on production data truncated from 100K to 5K: MUSE 0.6377, +1.69% over the DIN base 0.6271, ahead of SIM-Hard 0.6351, SIM-Soft 0.6356, TWIN 0.6304 and MISS 0.6308; on the open-source dataset with 1K sequences, MUSE 0.6154, +1.18% over the base 0.6082. Ablations on production data: Table 1 GSU embeddings lift GAUC from 0.6356 with ID embeddings to 0.6377 with SCL, +0.33%, while Table 2 shows added retrieval complexity moves GAUC only between 0.6369 and 0.6379; Table 3 ESU designs go from 0.6301 with plain Target Attention to 0.6377 with SA-TA plus SimTier, +1.21%; Sec 7.3 Figure 5 reports +0.38% GAUC when the sequence extends from 5K to 100K."
caveats:
- "The offline comparison truncates production sequences from 100K to 5K interactions to accelerate experimentation; the online system runs 100K, per the Table 5 caption."
- "The online test is described only as a long-term A/B test; the paper gives no traffic share, bucket split or duration."
- "Open-source dataset statistics disagree inside the paper: Table 4 says 99.0M samples, 8.79M users and 35.4M distinct items while the Sec 6.2 text says 107M samples, 8.86M users and 275M unique items."
- "SCL embeddings are frozen through training and inference, so item representations do not adapt to the CTR task; this is the design the paper itself selects and recommends."
