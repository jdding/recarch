id: alibaba-muse-2025
name: MUSE
company: Alibaba
surface: CTR prediction in the Taobao display advertising ranking stage, modeling lifelong user behavior sequences of up to 100K interactions
year: 2025
era: deep
era_reason: "Two-stage GSU and ESU discriminative CTR model; multimodal embeddings feed cosine retrieval, similarity histograms and fused attention, with no generative component."
first_public: "2025-12"
venue: "CIKM 2026"
venue_year: 2026
