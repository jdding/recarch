id: alibaba-nezha-2025
name: NEZHA
company: Alibaba
surface: Candidate generation for Taobao Search Advertising first-page slots under a 30 ms latency budget
year: 2025
era: generative
era_reason: "An autoregressive generative-recommendation retriever over semantic IDs whose decoding is accelerated by self-drafting and hash-set verification; the generative stack is the subject."
first_public: "2025-11"
venue: "WWW 2026"
venue_year: 2026
published_version_checked: true
primary_source: "https://doi.org/10.1145/3774904.3792797"
added_on: "2026-11-02"
last_verified: "2026-11-02"
updates: []
system_type: ads
evidence_level: production_described
tldr: "NEZHA adds a self-drafting head and hash-set verification to generative retrieval, cutting Taobao ad latency from over 1000 ms to under 30 ms; A/B revenue +1.2%."
summary: "NEZHA, built by City University of Hong Kong with Alibaba Group, is a decoding architecture that makes LLM-based generative recommendation fast enough for Taobao Search Advertising's first-page slots, which enforce a 30 millisecond budget. Instead of a separate draft model, a nimble autoregressive draft head is trained inside the primary model so the model drafts its own semantic-ID continuations, and a model-free verifier checks drafted candidates against a pre-computed hash set of valid item identifiers, which the paper identifies as the fix for hallucinated invalid IDs. Deployed in the recall stage since October 2025, the system serves hundreds of millions of daily active users and moved the generative retriever from later pages into all advertising slots including the first page."
paradigms:
- generative-retrieval
- semantic-id
stages:
- stage: retrieval
  model_family: "LLM generative retriever, benchmarked with Llama-1B and Qwen3-0.8B backbones, extended with an autoregressive draft head and hash-set verification"
  details: "The draft head combines a logit head over the LLM's final-layer hidden states with an autoregressive component that consumes previously drafted tokens; drafted candidate sequences are filtered in place against the hash set of valid semantic IDs, retaining only items in the intersection."
id_tokenization:
  approach: "Multi-token semantic IDs encoded as integers in a pre-computed hash set"
  details: "Each item's semantic ID maps to an integer index; verification is a constant-time hash lookup. The paper reports the ratio of valid IDs among raw generations is around 0.1% in production data, and verification lifts the valid drafted-candidate ratio from 43% to over 93%."
features_signals:
- "Query and user interaction sequence serialized for the LLM"
- "Semantic-ID token stream generated autoregressively"
- "Beam search with KV cache as the baseline decoding path"
training:
  mode: "Offline training of the LLM with the attached draft head"
  objectives:
  - "Next-token prediction over semantic-ID sequences with the draft head trained jointly"
  notes: "Table 1 benchmarks 0.6B and 3B models with beam size 512; timings are normalized by the 0.6B prefill time for confidentiality."
serving_infra: "Deployed in the candidate-generation stage of Taobao Search Advertising. The 2.6x algorithm-level speedup plus system-level savings on queuing cut total latency from over 1000 ms to below the 30 ms first-page threshold."
scale:
- metric: Deployment
  value: "Taobao Search Advertising since October 2025, hundreds of millions of daily active users"
  note: "paper, abstract and Sec 5"
- metric: Business scale
  value: "a business unit accounting for over a quarter of advertising revenue, at billion level"
  note: "paper, Sec 1"
- metric: Speedup
  value: 2.6x algorithm-level
  note: "paper, Sec 5 Table 1"
results_reported: "Deployment, Sec 5: cutting total latency from over 1000 ms to below the 30 ms first-page threshold, offline hit rate on clicked items improves +0.58% at top 500 and +0.61% at top 1000; the 7-day online A/B test registered a 1.2% revenue increase for a billion-level business after the system took the prime first-page position in October 2025. Verification, Sec 3.3: the model-free hash-set verifier lifts the ratio of valid drafted candidates from 43% to over 93%, worth a 12 percentage point uplift in key offline metrics. Public benchmarks, Table 3, with Llama and Qwen backbones on Beauty, Games and Yelp: NEZHA matches or beats beam search and the MTP self-drafting baseline, for example Qwen Beauty Hit@5 0.0451 against 0.0446 for beam search, with Games Hit@5 0.0239 against 0.0226 marked statistically significant at p < 0.05, while latency sits close to the MTP baseline and far below beam search, whose normalized latency reaches 74.21 and 47.70 on Beauty against 7.00 and 4.41 for NEZHA."
caveats:
- "The paper states that the 7-day online test was a reverse A/B test on 10% of traffic; no further bucket detail is given, and the production training setup is not described beyond the semantic-ID configuration shared with the public experiments."
- "Serving latencies in Table 1 are normalized by the 0.6B prefill time for confidentiality, so absolute milliseconds are not published."
- "The paper states that previously the generative retriever could only serve advertising slots after the first page."
