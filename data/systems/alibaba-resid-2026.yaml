id: alibaba-resid-2026
name: ReSID
company: Alibaba International
surface: E-commerce advertising candidate retrieval
year: 2026
era: generative
era_reason: The retriever generates semantic ID sequences and resolves them to advertising candidates.
first_public: "2026-11"
venue: null
venue_year: null
published_version_checked: null
primary_source: https://arxiv.org/html/2611.16404v1
added_on: "2026-11-25"
last_verified: "2026-11-25"
system_type: ads
evidence_level: production_described
tldr: ReSID uses independent codebooks, guided decoding and partial ID matching to keep more long-tail products eligible. The online advertising test reported revenue up 1.3%.
summary: ReSID quantizes independent subspaces of product embeddings to construct parallel semantic IDs. During beam search it preserves plausible long-tail paths using popularity and user alignment signals. At lookup it allows a bounded number of mismatches and prefers closer ID matches.
paradigms: [generative-retrieval, semantic-id, sequential-transformer]
stages:
- stage: retrieval
  model_family: Autoregressive generation with reachability-aware decoding and partial ID matching
  details: Replace the deployed generative advertising channel. Other retrieval channels and the downstream ranker are kept unchanged in the A/B test.
id_tokenization:
  approach: Parallel semantic IDs with independent codebooks
  details: Quantize separate embedding subspaces so each position can encode item information without depending on the residual of earlier positions.
features_signals:
- Product representations and historical interactions
- Item popularity and alignment with the user's interests at decoding time
training:
  mode: Learn the tokenizer, then train a sequential generator on interaction histories
  objectives:
  - Reconstruct item representations from quantized subspaces
  - Predict the semantic ID sequence of the next interacted item
serving_infra: Guided beam search and partial matching expand catalog reach at lookup. The advertising trial reports a mean online response time of 10.3 ms.
scale:
- metric: Industrial evaluation catalog
  value: 4,171,776 items
  note: Appendix B reports this catalog for industrial evaluation. The size of the live advertising index is undisclosed.
results_reported: 'Section 5.7 describes a user-randomized A/B from July 1–12, 2026, with 15% of traffic per bucket. ReSID replaced the TIGER-style advertising retriever while the other retrieval channels and downstream ranker stayed the same. Relative gains were +1.3% ad revenue, +1.1% CTR, +0.8% GMV and +4.0% long-tail exposure share. The paper reports 10.3 ms mean online response time and full deployment since July 2026.'
caveats:
- The long-tail exposure result is a relative change in share, with no absolute percentage-point change reported.
- The online response time is separate from the offline accelerator benchmark. Online serving hardware and throughput were not reported.
unknown_fields:
- Platform name, absolute A/B metrics and live index size
- Online latency percentiles, QPS, hardware and monetary inference cost
- Total production training compute
