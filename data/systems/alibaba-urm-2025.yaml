  note: "paper, Appendix B.4 Table 7"
- metric: Sampling module
  value: "under 10 ms on the 10,000,000-item candidate space"
  note: "paper, Appendix B.4; the paper states a candidate space of approximately 10 to the 7"
results_reported: "Online, Sec 5.5 Table 6, April 28 to May 14, 2025: advertising revenue, the core metric that only the full text names, +3.01%; CTR +0.78%; CVR +1.24%; proportion of long-tail items +2.23%. The abstract states 3% and the introduction over 3% for the same key metric. Public datasets, Sec 5.1 Table 1, four datasets: URM beats the strongest baseline by an average of 46% HR@5 and 29% NDCG@5; per-dataset relative improvement: Sports +70.9% HR@5 and +49.7% NDCG@5, Beauty +50.3% and +38.1%, Toys +35.6% and +9.2%, Yelp +26.1% and +18.1%; on Beauty, URM reaches HR@5 0.0929 against 0.0618 for the strongest baseline IDGenRec. Industrial data, Sec 5.2 Table 2, R@1000 averaged over 9 objectives: URM 0.403 against 0.363 for the strongest baseline, the multi-task Attention-DNN with PLE, best on 66 out of 99 model-objective cells, an average relative improvement of 11.0%; on Retrieval with Query URM reaches 0.835 without task-specific design against 0.822 for a dedicated three-tower model. Universal retrieval, Sec 5.4 Table 5: scenario objectives raise performance by over 20%, with RSA +20.5%, RSB +31.0% and RSC +30.2%; the serendipity objective lifts the share of new-category items from 18.8% to 46.2% and SR R@1000 by 82.3% relative. Ablations: Table 4, the retrieval precision of probabilistic sampling converges at T=4 with 91.0%, 91.1% at T=5 and 0.2% at T=1; Table 3, CPR R@1000 with Vdis alone 0.256, Vtrans alone 0.152 and Vdis+Vtrans 0.263 on all items and 0.130 on unseen items. Efficiency: Sec 3.3, sampling cuts the mapping FLOPS from 5000G to 2G in the paper's setting; Appendix B.4 Table 7, p99 latency at input length 1024 is 50 ms for the 1.5B model, the paper's stated online limit, and 233 ms for the default 7B backbone. Backbones, Appendix C.2: LLaMA2-13B reaches Beauty HR@5 0.0905 and DeepSeek-V2-Lite an industrial average of 0.394, close to Qwen-7B."
caveats:
- "Retrieval results are precomputed asynchronously per 10-minute window, so the online path is not per-request LLM inference."
- "The abstract states the core metric improved by 3% and the introduction says over 3%; Sec 5.5 Table 6 gives the exact +3.01% for advertising revenue."
- "The 50 ms latency behind the tens-of-milliseconds claim is measured on the 1.5B model at input length 1024; the default 7B backbone shows 233 ms p99 at the same length in Table 7."
- "Appendix A.1 Limitations: LLMs increase training and inference cost, mitigated by hourly aggregation, 5% data sampling and the 10-minute async window; URM adapts to new objectives only when they are close to the training objectives, and entirely new objectives remain hard."
- "The exact candidate-set size is withheld for data security, and the platform is described only as our advertising platform."
- "The paper states the public-dataset code will be released upon acceptance."
