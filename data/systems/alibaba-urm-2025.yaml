tldr: "A Qwen-7B LLM generates retrieval results from user features plus a text description of the objective; Alibaba ads saw a core metric up over 3% online."
summary: 'Universal Retrieval Model: a fully fine-tuned LLM based on Qwen-7B by default that takes user features plus a text description of
  the retrieval objective and generates a set of items from a candidate pool of roughly 10^7, using multi-query representation, matrix
  decomposition of the item mapping into discriminative and transferable parts and probabilistic sampling. Served asynchronously and reported
  to lift a core advertising-platform metric by over 3% online.'
paradigms:
- llm-based
- generative-retrieval
stages:
- stage: retrieval
  model_family: 'URM: LLM with multi-query representation (M=128 query tokens in the reported setup), item mapping W = U (V_dis + V_trans)^T
    with |C| ~ 10^7, H=128, D=4096; objectives expressed as natural-language instructions (multi-scenario, multi-behavior, long-tail,
    serendipity)'
  details: 'Matrix decomposition plus sampling cuts the candidate-mapping cost from about 5000 GFLOPs to about 2 GFLOPs (paper''s setting:
    tau=0.07, M=128, T=4, K=1000, up to 32 neighbors). A single forward pass of a 1.5B model at sequence length 1024 reaches 50 ms,
    the paper''s stated limit for online retrieval.'
