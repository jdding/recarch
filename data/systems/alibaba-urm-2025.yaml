updates:
- date: "2026-11-03"
  note: "Full rewrite against arXiv v2 with the CIKM 2026 venue and DOI, complete offline and online numbers, serving and training details; the earlier card lacked the venue and had empty tokenizer fields."
system_type: ads
evidence_level: production_described
tldr: "URM turns a fine-tuned Qwen-7B LLM into a universal generative retriever driven by text objectives; an online A/B lifted advertising revenue +3.01%."
summary: "Universal Retrieval Model: a fully fine-tuned LLM, Qwen-7B by default, that takes serialized user features, a natural-language retrieval objective and a set of fixed learnable query tokens, and generates candidates from about 10^7 items through a mapping matrix decomposed into discriminative and transferable parts, with probabilistic sampling over ANN neighbors cutting generation cost. Served asynchronously in 10-minute windows through vLLM with a single prefill pass, it replaces task-specific retrieval channels; an online A/B on the advertising platform lifted advertising revenue by 3.01%."
paradigms:
- llm-based
- generative-retrieval
stages:
- stage: retrieval
  model_family: "LLM feature generator, Qwen-7B by default with Qwen-1.8B, LLaMA2-13B and DeepSeek-V2-Lite 16B also validated, M=128 fixed learnable query tokens, mapping W = U (Vdis + Vtrans)^T with H=128 and D=4096"
  details: "Multi-query representation scores an item by the max over M query-token inner products; matrix decomposition splits the item mapping into a fully learnable discriminative part Vdis and a text-derived transferable part Vtrans from a General Text Embedding; probabilistic sampling runs T=4 steps over ANN neighbors with tau=0.07, K=1000 and up to 32 neighbors, replacing semantic-ID autoregression with a single LLM forward pass."
id_tokenization:
  approach: "Full item IDs, not semantic IDs"
  details: "Items keep their raw IDs. A Distributed HashTable maps each ID to a unique embedding that a one-layer MLP lifts to the token dimension; Vdis is initialized from two-tower ID embeddings, and Vtrans is a learned projection of serialized item text such as title, category, price, shop, 7-day sales and click-through rate produced by a General Text Embedding model, so cold-start items are retrieved through U Vtrans^T."
features_signals:
- "Serialized user features: static attributes, statistical features and behavior sequences, with empty features omitted and sequences truncated without padding"
- "Retrieval objectives expressed as natural-language text, such as multi-scenario, multi-behavior, long-tail, serendipity, long-term interest and search"
- "Fixed learnable query tokens appended to the input sequence"
- "Item-side serialized text features through a General Text Embedding"
training:
  mode: "Offline supervised fine-tuning on a 5% sample of daily data, aggregated hourly to fit a 24-hour budget"
  objectives:
  - "Noise Contrastive Estimation loss over the max of M query-representation scores, with 10,000 negatives per batch sampled by the 3/4 power of item frequency"
  notes: "AdamW, learning rate 2e-5 with cosine decay, weight decay 0.05, batch size 8192, one epoch; pretrained-layer learning rate set to 1/10 of the rest; Vdis initialized from the two-tower ID embedding; Qwen-7B on 64 NVIDIA H20 GPUs processes 50 million training examples in 25 hours."
serving_infra: "Asynchronous workflow per Figure 2: user actions trigger URM inference; the engine service concatenates user features with the objective text; the inference service reads item embeddings from the distributed hashtable and calls vLLM for a single prefill; probabilistic sampling produces the final retrieval results, which are stored persistently for the online retrieval phase. Behavior is aggregated in a configurable 10-minute online window; hashtable lookup lands within a few milliseconds and sampling under 10 ms."
scale:
- metric: Deployment
  value: "Retrieval on the Alibaba advertising platform, online A/B April 28 to May 14, 2025"
  note: "paper, Sec 5.5"
- metric: Candidate set
  value: "about 10^7 items"
  note: "paper, Sec 3.3 and Appendix B.1; exact figure withheld for data security"
- metric: Industrial dataset
