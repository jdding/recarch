serving_infra: 'Asynchronous workflow: user behavior aggregated over a configurable window (ten minutes online) triggers one URM inference;
  the engine service concatenates user features with the objective text, calls the inference service, samples the final items and stores
  results persistently for use in the later online retrieval phase. Paper states retrieval output within tens of milliseconds.'
