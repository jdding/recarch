id: alibaba-urm-2025
name: URM
company: Alibaba
surface: Retrieval for the Alibaba advertising platform, generating candidate sets asynchronously in 10-minute windows
year: 2025
era: generative
era_reason: "An LLM generates retrieval results over the full candidate space driven by text-described objectives; the generative LLM stack is the central mechanism."
first_public: "2025-02"
venue: "CIKM 2026"
venue_year: 2026
