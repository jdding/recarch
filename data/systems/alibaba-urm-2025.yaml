  note: paper
results_reported: 'Online A/B on the Alibaba advertising platform: core metric +3% (exact metric not named in abstract). Public datasets
  (Sports, Beauty, Toys, Yelp): URM beats the strongest baseline by an average of 46% HR@5 and 29% NDCG@5 per Table 1. Offline industrial
  experiments outperform task-specific expert retrieval models.'
caveats:
- Retrieval results are precomputed asynchronously per ten-minute window, so this is not per-request LLM inference.
- The 'core metric' behind the +3% is not defined in the abstract/intro.
- Company attribution to Alibaba is from authorship/affiliation; the platform is described only as 'our advertising platform'.
