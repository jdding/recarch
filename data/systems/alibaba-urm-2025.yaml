updates:
- date: "2026-11-03"
  note: "Full rewrite against arXiv v2 with the CIKM 2026 venue and DOI, complete offline and online numbers, serving and training details; the earlier card lacked the venue and had empty tokenizer fields."
- date: "2026-11-26"
  note: Separated the asynchronous refresh, component benchmark and production A/B. Marked the experiment control and backbone as undisclosed.
system_type: ads
evidence_level: production_described
tldr: URM uses a fine-tuned language model to retrieve items for text-specified objectives. An online ad test reports revenue growth of 3.01%.
summary: URM takes serialized user features, a text retrieval objective and learnable query tokens. It samples candidates from about 10^7 items using a mapping with discriminative and transferable components. The main experiments use Qwen-7B. The implementation refreshes candidates asynchronously in 10-minute windows and stores them for online retrieval.
paradigms:
- llm-based
- generative-retrieval
stages:
- stage: retrieval
  model_family: "LLM feature generator with Qwen-7B as the default experiment backbone. Qwen-1.8B, LLaMA2-13B and DeepSeek-V2-Lite 16B are also tested. It uses M=128 fixed learnable queries and W = U (Vdis + Vtrans)^T with H=128 and D=4096."
  details: "Multi-query representation scores an item by the max over M query-token inner products; matrix decomposition splits the item mapping into a fully learnable discriminative part Vdis and a text-derived transferable part Vtrans from a General Text Embedding; probabilistic sampling runs T=4 steps over ANN neighbors with tau=0.07, K=1000 and up to 32 neighbors, replacing semantic-ID autoregression with a single LLM forward pass."
id_tokenization:
  approach: "Full item IDs, not semantic IDs"
  details: "Items keep their raw IDs. A Distributed HashTable maps each ID to a unique embedding that a one-layer MLP lifts to the token dimension; Vdis is initialized from two-tower ID embeddings, and Vtrans is a learned projection of serialized item text such as title, category, price, shop, 7-day sales and click-through rate produced by a General Text Embedding model, so cold-start items are retrieved through U Vtrans^T."
features_signals:
- "Serialized user features: static attributes, statistical features and behavior sequences, with empty features omitted and sequences truncated without padding"
- "Retrieval objectives expressed as natural-language text, such as multi-scenario, multi-behavior, long-tail, serendipity, long-term interest and search"
- "Fixed learnable query tokens appended to the input sequence"
- "Item-side serialized text features through a General Text Embedding"
training:
  mode: "Offline supervised fine-tuning on a 5% sample of daily data, aggregated hourly to fit a 24-hour budget"
  objectives:
  - "Noise Contrastive Estimation loss over the max of M query-representation scores, with 10,000 negatives per batch sampled by the 3/4 power of item frequency"
  notes: "AdamW, learning rate 2e-5 with cosine decay, weight decay 0.05, batch size 8192, one epoch; pretrained-layer learning rate set to 1/10 of the rest; Vdis initialized from the two-tower ID embedding; Qwen-7B on 64 NVIDIA H20 GPUs processes 50 million training examples in 25 hours."
serving_infra: "Asynchronous workflow per Figure 2: user actions trigger URM inference; the engine service concatenates user features with the objective text; the inference service reads item embeddings from the distributed hashtable and calls vLLM for a single prefill; probabilistic sampling produces the final retrieval results, which are stored persistently for the online retrieval phase. Behavior is aggregated in a configurable 10-minute online window; hashtable lookup lands within a few milliseconds and sampling under 10 ms."
scale:
- metric: Deployment
  value: "Retrieval on the Alibaba advertising platform, online A/B April 28 to May 14, 2025"
  note: "paper, Sec 5.5"
- metric: Candidate set
  value: "about 10^7 items"
  note: "paper, Sec 3.3 and Appendix B.1; exact figure withheld for data security"
- metric: Industrial dataset
  value: "hundreds of millions of samples, more than one billion distinct items in user behavior sequences"
  note: "paper, Sec 5.2 and Appendix B.1"
- metric: Training
  value: "Qwen-7B on 64 NVIDIA H20 GPUs, 25 hours for 50 million examples"
  note: "paper, Appendix B.3"
- metric: Model inference benchmark latency
  value: "p99 50 ms at input length 1024 for the 1.5B model, 233 ms for 7B"
  note: "paper, Appendix B.4 Table 7"
- metric: Sampling module
  value: "under 10 ms on the 10,000,000-item candidate space"
  note: "paper, Appendix B.4; the paper states a candidate space of approximately 10 to the 7"
results_reported: "Online, Sec 5.5 Table 6, April 28 to May 14, 2025: advertising revenue, the core metric that only the full text names, +3.01%; CTR +0.78%; CVR +1.24%; proportion of long-tail items +2.23%. The abstract states 3% and the introduction over 3% for the same key metric. Public datasets, Sec 5.1 Table 1, four datasets: URM beats the strongest baseline by an average of 46% HR@5 and 29% NDCG@5; per-dataset relative improvement: Sports +70.9% HR@5 and +49.7% NDCG@5, Beauty +50.3% and +38.1%, Toys +35.6% and +9.2%, Yelp +26.1% and +18.1%; on Beauty, URM reaches HR@5 0.0929 against 0.0618 for the strongest baseline IDGenRec. Industrial data, Sec 5.2 Table 2, R@1000 averaged over 9 objectives: URM 0.403 against 0.363 for the strongest baseline, the multi-task Attention-DNN with PLE, best on 66 out of 99 model-objective cells, an average relative improvement of 11.0%; on Retrieval with Query URM reaches 0.835 without task-specific design against 0.822 for a dedicated three-tower model. Universal retrieval, Sec 5.4 Table 5: scenario objectives raise performance by over 20%, with RSA +20.5%, RSB +31.0% and RSC +30.2%; the serendipity objective lifts the share of new-category items from 18.8% to 46.2% and SR R@1000 by 82.3% relative. Ablations: Table 4, the retrieval precision of probabilistic sampling converges at T=4 with 91.0%, 91.1% at T=5 and 0.2% at T=1; Table 3, CPR R@1000 with Vdis alone 0.256, Vtrans alone 0.152 and Vdis+Vtrans 0.263 on all items and 0.130 on unseen items. Efficiency: Sec 3.3, sampling cuts the mapping FLOPS from 5000G to 2G in the paper's setting; Appendix B.4 Table 7, p99 latency at input length 1024 is 50 ms for the 1.5B model, the paper's stated online limit, and 233 ms for the default 7B backbone. Backbones, Appendix C.2: LLaMA2-13B reaches Beauty HR@5 0.0905 and DeepSeek-V2-Lite an industrial average of 0.394, close to Qwen-7B."
caveats:
- URM precomputes candidates using an asynchronous 10-minute window. Online retrieval reads the stored results.
- "The abstract states the core metric improved by 3% and the introduction says over 3%; Sec 5.5 Table 6 gives the exact +3.01% for advertising revenue."
- Table 7 measures model inference on H20 GPUs. The paper leaves the A/B backbone and end-to-end production latency undisclosed.
- "Appendix A.1 Limitations: LLMs increase training and inference cost, mitigated by hourly aggregation, 5% data sampling and the 10-minute async window; URM adapts to new objectives only when they are close to the training objectives, and entirely new objectives remain hard."
- "The exact candidate-set size is withheld for data security, and the platform is described only as our advertising platform."
- "The paper states the public-dataset code will be released upon acceptance."
