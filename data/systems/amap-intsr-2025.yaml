tldr: "IntSR unifies search and recommendation in one autoregressive generative model with query placeholders and temporal candidate alignment; Amap A/B: GMV +9.34%, CTR +2.76%, ACC +7.04%."
summary: "IntSR, built by the AMAP team at Alibaba Group, is a generative framework that unifies search and recommendation together with their retrieval and ranking sub-tasks in a single autoregressive sequence model. The paper observes that the four tasks differ only in how the query is formed: search conditions on explicit natural-language requests embedded by a frozen Qwen3-0.6B LLM, recommendation retrieval uses a shared universal token, and ranking embeds target candidate items into query placeholders. A Query-Driven Block built on HSTU computes attention for the query placeholders separately with a customized mask combining causal, session-wise and invalid-Q terms, and a KV-cache two-stage computation reduces ranking complexity from O(c'N^2) to O(c'J(N+1)); DSFNet turns spatiotemporal context, page context, task tag and user profiles into multi-scenario weights. Because an industrial corpus changes over time, temporal candidate alignment restricts negative sampling to items that existed at the interaction timestamp, which improves all three mainstream sampling strategies it was applied to. IntSR is deployed in Amap production for POIs, digital assets and travel modes, serving hundreds of millions of daily active users, with core components fully operational at scale for over 6 months."
paradigms:
- generative-retrieval
- sequential-transformer
- llm-based
stages:
- stage: single-stage
  model_family: "HSTU-based Query-Driven Block stack with a DSFNet multi-scenario block; frozen Qwen3-0.6B embeds natural-language search queries"
  details: "Query placeholders mark positions to predict: user search requests, positive and negative target item sets, or one shared universal token. Attention is computed separately for the original sequence and the query sequence, with positional and ALiBi temporal relative bias and SiLU gating. The mask combines causal, session-wise and invalid-Q terms so offline training matches online serving. Public experiments stack 3 QDBs with embedding size 32; the industrial digital-assets model uses 3 QDBs, sequence length 500 and embedding dimension 128."
id_tokenization:
  approach: "Item ID embeddings with dense multimodal integration; no semantic IDs"
  details: "Items enter the sequence as tokens whose embeddings integrate multi-modal information. The paper instead concentrates on the time-varying vocabulary: negative sampling is constrained to the item set available at the interaction timestamp, so positives are only compared with co-existing negatives."
features_signals:
- "Spatiotemporal scenario tokens: geohash-encoded location and discretized time"
- "Feedback tokens for interaction types such as purchases and clicks"
- "Natural-language search queries plus a query pool of item descriptions, paraphrases, keywords and synthesized user-style expressions, embedded by frozen Qwen3-0.6B"
- "Page context, search-versus-recommendation task tag and user profiles, feeding DSFNet scenario weights"
training:
  mode: "Supervised autoregressive training; public-dataset experiments are offline while the production side is described with streaming training time slices"
  objectives:
  - "Conditional generation for the four tasks: recommendation retrieval and ranking, search retrieval and ranking"
  - "InfoNCE loss with temporal candidate alignment, restricting negatives to items available at the interaction timestamp"
  notes: "Public datasets: LR 1e-3, batch 32, 99 random negatives per user, and 30 historical behaviors visible per action; Amazon Kindle Store holds 68223 users and 61934 items and KuaiSAR 22700 users and 673415 items (Table 6). Industrial digital-assets model: Adam at LR 1e-4, batch 64, on 8 NVIDIA H20 GPUs with 96 GB memory, sequence length 500, embedding dimension 128, DSFNet with 2 scenarios and 3 layers (Appendix F). Table 3 uses 20 negatives."
serving_infra: "Deployed in Amap production across POI, digital assets and travel mode scenarios, serving hundreds of millions of daily active users, with core components fully operational at scale for over 6 months. Ranking inference uses a KV-cache two-stage candidate logit computation that the paper states reduces ranking attention complexity from O(c'N^2) to O(c'J(N+1)); no latency or throughput figures are published."
