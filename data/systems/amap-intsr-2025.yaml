results_reported: "Online A/B, Sec 4.5, control group of 10% of users routed to the production baseline model: digital assets GMV +9.34% relative in Amap's Explore Feed, POI recommendation CTR +2.76% relative on the Amap homepage, travel mode suggestion ACC +7.04%. Deployment context, Sec 1: deployed across POIs, digital assets and travel modes, serving hundreds of millions of daily active users, with core components fully operational at scale for over 6 months. Offline, Tables 1 and 2 on Amazon Kindle Store and KuaiSAR with 99 random negatives per user. Search task, Table 1, Amazon: IntSR HR@1 0.5678, HR@5 0.8266, N@5 0.7091, N@10 0.7305 against UniSAR HR@1 0.5343; KuaiSAR: IntSR HR@1 0.5685, HR@5 0.7950, HR@10 0.8516, N@5 0.6945, N@10 0.7128 against UniSAR 0.5282; on Amazon search HR@10, TEM and CoPPS reach 0.9051 and UniSAR 0.8977 ahead of 0.8920 for IntSR. Recommendation task, Table 2: IntSR HR@1 0.3740 on Amazon against HSTU 0.3446 and UniSAR 0.3010, and 0.2179 on KuaiSAR against UniSAR 0.1990 and HSTU 0.1881. Temporal candidate alignment, Table 3, Amap Digital Assets with 20 negatives: aligned sampling lifts HR@1 for every strategy, RNS 0.1426 to 0.1810, PNS best 0.1430 to 0.1760, HNS 0.1569 to 0.1842, with aligned HNS best overall at HR@1 0.1842, HR@5 0.4305, HR@10 0.5601, N@5 0.3112, N@10 0.3533. Ablation, Table 4, Amazon: removing the session-wise mask drops search HR@1 from 0.5678 to 0.2024, the largest drop; removing search queries drops search HR@1 to 0.4023 and recommendation HR@1 to 0.3325; removing DSFNet, relative bias and scenario tokens gives search HR@1 0.5560, 0.5050 and 0.5516."
caveats:
- "The paper claims state-of-the-art on most but not all metrics: on Amazon search HR@10, TEM and CoPPS reach 0.9051 and UniSAR 0.8977 against 0.8920 for IntSR in Table 1."
- "The online A/B section reports relative lifts only, with a 10% control group; no absolute values, duration or significance levels are given."
- "The paper notes that due to preprocessing and filtering, the dataset statistics in Table 6 should not be interpreted as a reflection of the actual user population or the entire item corpora."
- "Amazon Kindle Store search queries and behaviors are synthesized from the recommendation behaviors following Ai et al. 2017, and the paper applies a mask mechanism against label leakage during training and inference; on KuaiSAR, sparse search behaviors after 5-core filtering lead the paper to train with recommendation loss first and fine-tune with search loss."
