id: amazon-cosmo-2024
name: COSMO
company: Amazon
surface: Knowledge generation and serving for Amazon product search navigation
year: 2024
era: generative
era_reason: An instruction-tuned language model generates the commerce knowledge served by the search navigation feature.
first_public: "2024-06"
venue: SIGMOD 2024 Industrial
venue_year: 2024
published_version_checked: true
primary_source: https://doi.org/10.1145/3626246.3653398
added_on: "2026-11-25"
last_verified: "2026-11-25"
system_type: search
evidence_level: production_described
tldr: Amazon generates shopping-intent knowledge offline and serves it from a cache to refine product searches. Product sales rose 0.7% in the tested search navigation segment.
summary: COSMO derives likely shopping intents from search-to-purchase and co-purchase behavior. Amazon collects human judgments to instruction-tune COSMO-LM, structures its output as knowledge relations, and uses the cached knowledge to offer query refinements, product types and attribute filters.
paradigms: [llm-based]
stages:
- stage: other
  model_family: Instruction-tuned knowledge generation with cached search navigation
  details: Generate and filter commerce knowledge from behavior data. Search navigation uses the resulting concept hierarchy to suggest progressively narrower facets.
id_tokenization:
  approach: Intent and product relations in a commerce knowledge graph
  details: Knowledge is represented as typed relations. The paper does not describe a dedicated catalog ID tokenizer.
features_signals:
- Search-to-purchase query and product pairs
- Co-purchased product pairs
- Human judgments on generated intent explanations
training:
  mode: Instruction tuning on behavior-derived examples and human annotations
  objectives:
  - Generate plausible commerce intents for observed shopping actions
  - Learn to distinguish valid knowledge from implausible or irrelevant explanations
serving_infra: A SageMaker model processes behavior logs and frequent queries in batches. A feature store structures responses before they are written to an asynchronous cache for downstream requests.
scale:
- metric: Scope of the generated knowledge
  value: 18 major product categories
  note: The paper reports millions of knowledge facts from 30,000 annotated instructions.
results_reported: 'Section 4.3.2 reports Amazon search navigation A/B tests over several months in total, targeting approximately 10% of U.S. traffic. Adding the COSMO knowledge to navigation yielded a 0.7% relative increase in product sales and an 8% increase in navigation engagement rate in the tested segment. The paper gives no detailed control configuration.'
caveats:
- The reported gains apply to the tested search navigation feature and traffic segment. Search relevance and session recommendation have separate offline results.
- The authors describe daily updates and explain their limitations for short-lived changes such as flash sales.
unknown_fields:
- Per-arm traffic allocation, precise test dates and detailed control configuration
- Production latency in milliseconds, serving QPS, hardware configuration and monetary cost
