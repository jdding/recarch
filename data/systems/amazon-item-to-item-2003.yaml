tldr: "Item-to-item collaborative filtering precomputes a similar-items table offline, so online recommendation is a lookup that scales independently of the number of customers."
summary: IEEE Internet Computing industry report (Jan/Feb 2003) by Linden, Smith and York of Amazon. Item-to-item collaborative filtering
  builds a similar-items table offline from the item-by-customer purchase matrix, so that online work is a lookup of items similar to
  each of the user's purchased or rated items, independent of the number of customers and catalog size. Used across Amazon's site and
  email campaigns.
paradigms:
- item-cf
stages:
- stage: retrieval
  model_family: 'Item-to-item collaborative filtering: offline cosine similarity between item vectors (dimensions are customers who
    bought the item), stored as a similar-items table; online aggregation of items similar to the user''s purchases and ratings, then
    recommend the most popular or correlated'
  details: 'Offline loop: for each item I1, for each customer who bought I1, for each other item I2 that customer bought, record the
    pair; then compute similarity for each pair. Worst case O(N^2 M), close to O(NM) in practice; sampling customers of best-selling
    titles reduces runtime with little quality loss.'
id_tokenization:
  approach: Item IDs; no learned embeddings in this formulation
  details: null
features_signals:
- Co-purchase / co-rating patterns
- User's purchased and rated items
training:
  mode: Offline batch computation of the similar-items table
  objectives:
  - item-item cosine similarity over co-purchase
  notes: The online step depends only on how many items the user purchased or rated; the paper says it works with as few as two or three
    items.
serving_infra: Online component is a lookup into the precomputed table. The paper states that many applications need results in no more
  than half a second.
scale:
- metric: Customers
  value: more than 29 million
  note: paper, 2003
- metric: Catalog items
  value: several million
  note: paper, 2003
results_reported: 'No experimental metrics. The paper states qualitatively that click-through and conversion rates of recommendations
  vastly exceed untargeted content such as banner ads and top-seller lists, and that the algorithm scales independently of customer
  and item counts. Surfaces named: homepage ''Your Recommendations'', shopping-cart recommendations, and many email campaigns.'
caveats:
- Industry report with no quantitative evaluation; the claim about CTR and conversion is qualitative.
- Describes the 2003 system; the paper cites an Amazon patent (US 6,266,649) for the method.
- The paper does not describe ranking, features or deep models.
unknown_fields:
- similarity table size
- refresh cadence
- A/B results
