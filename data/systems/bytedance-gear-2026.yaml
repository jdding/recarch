updates: []
system_type: ads
evidence_level: production_described
tldr: "ByteDance generative ad retrieval with BasisRQ tokenizer and a joint reranking head on Douyin Ads; global A/B on 5% traffic per group for 7 days: ADSS +0.563%, ADVV +0.658%."
summary: 'GEAR trains an item tokenizer that quantizes two-tower item embeddings with prefix-aware BasisRQ, a residual quantizer whose codebook is re-parameterized by an orthogonal basis to avoid dead codes, a small encoder-decoder generator that decodes item token sequences by beam search, and a reranking head that spends one extra decoder step to order the items that share a token sequence. It runs as an additional retrieval channel next to the existing dense retrieval systems on Douyin Ads.'
paradigms:
- semantic-id
- generative-retrieval
- learning-to-rank
stages:
- stage: retrieval
  model_family: 'Encoder-decoder generator: encoder projects non-sequence user features (28 group tokens), a 200-step click sequence and a 100-step conversion sequence into shared keys/values; 2-layer decoder (6 heads, head dim 64, gated FFN 384) with cross-attention generates 3 tokens by beam search (widths 256, 256, 512).'
  details: 'Each generated token sequence is expanded to its items through a nearline CSR-like index (refreshed at minute level); the reranking head scores items with INT4 dot products and truncates per sequence.'
id_tokenization:
  approach: Three-layer prefix-aware BasisRQ over two-tower item embeddings, trained jointly with the generator
  details: 'Codebook sizes (2048, 512, 128), code dimension 128, item embedding dimension 96; orthogonal basis via 5 Newton-Schulz iterations; affine codebook transform conditioned on earlier codes; token sequences and item embeddings stored per item in the parameter server and updated by streaming training.'
features_signals:
- Non-sequence user features (categorical, statistical, context)
- Click sequence of length 200 and conversion sequence of length 100
- Item features including multimodal content and categorical ids
training:
  mode: Streaming training of tokenizer, generator and reranker together, with a progressive warm-up that starts with a two-tower model and LambdaLoss, then adds quantization, then generation and reranking
  objectives:
  - LambdaLoss for the two-tower tokenizer and for the reranker
  - RQ codebook and commitment loss
  - Weighted cross-entropy for token generation, weighted by log(1 + secpm) on impressed samples
  notes: 'Loss weights 1, 1, 10, 1 (LTR, RQ, Gen, Rerank).'
serving_infra: 'Streaming training with a parameter server holding each item token sequence and embedding; nearline index builder refreshes a CSR-like index at minute level and ships it with the model; KV-cached beam search, token generation, sequence-to-item expansion and item scoring in one computation graph; INT4 user and item embeddings for reranker scoring.'
scale:
- metric: Daily active users served
  value: hundreds of millions
  note: Stated for Douyin Ads
- metric: Tokenizer codebook
  value: 2048 x 512 x 128
  note: Three-layer prefix-aware BasisRQ
results_reported: 'Online A/B on Douyin Ads, 7 days, 5% of traffic per treatment group, GEAR as an extra retrieval path vs the production system without it: ADSS +0.563%, ADVV +0.658%; cold-start activation rate of new advertisers +1.46%. Subset ablation (ADSS/ADVV): GEAR +0.446/+0.498, w/o prefix-aware BasisRQ +0.288/+0.219, w/o rerank +0.358/+0.341, w/o secpm reweight +0.395/+0.354. Tokenizer analysis per Table 2: prefix-aware BasisRQ (2048, 512, 128) utilization 8.83%, collision rate 52.3%, MSE 1.82e-3; vanilla RQ with EMA 4.22%, 84.2%, 2.32e-3.'
caveats:
- 'arXiv preprint (v1); no peer-reviewed venue found, so there is no published version to check.'
- 'The paper reports revenue-style metrics (ADSS, ADVV) as relative gains only; no absolute values, confidence intervals or per-segment results.'
- 'Ablations are online on a subset of ad candidates, not on global traffic.'
- 'The generator is small (2 decoder layers); latency and QPS are not reported, and the conclusion lists decoding efficiency as future work.'
unknown_fields:
- serving latency and QPS
- model parameter count
- retrieval quota or share of final ad impressions
- offline recall metrics
