- Offline benchmark is the paper's own Douyin Ads CVR dataset; baselines include DIN, TWIN, HSTU and a vanilla Transformer.
- The 'dozens of scenarios' deployment count is a paper claim without per-scenario breakdown.
- ADSS/ADVV are advertiser-side internal metrics, not defined beyond the paper's text.
