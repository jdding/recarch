summary: Long-sequence transformer ranker from RecSys '25 that models user histories up to 10,000 items end-to-end using global tokens,
  an InnerTransformer token-merge module and hybrid attention, which cuts FLOPs by about 50%, with GPU-synchronous training, mixed precision,
  activation recomputation and KV-cache serving. Reported as fully deployed in dozens of ByteDance scenarios.
