  details: 'Offline task: CVR prediction in the Douyin Ads system; dataset of 5.2 billion samples over 130 days (16 Oct 2024 - 23 Feb
    2025). Table 1: LONGER AUC 0.85290 / LogLoss 0.47103, +1.57% AUC over the base model (0.83968 / 0.48758); the paper states a 0.1%
    gain is considered significant online.'
