evidence_level: production_described
tldr: OneTrans-GSR generates the final mixed-content slate in one decoder. Against the production cascade, GMV per user rose 2.63% and latency across reranking and mix-ranking fell 13%.
summary: OneTrans-GSR extends the OneTrans backbone to assemble the exposure slate from candidates scored by the upstream ranker. A decoder chooses the candidates, allocates positions across content types and orders the slate. An offline reward model scores complete slates for post-training, and the decoder enforces business constraints at serving time.
paradigms: [learning-to-rank, sequential-transformer, rl-alignment]
stages:
- stage: re-rank
  model_family: Autoregressive decoder with constrained candidate selection
  details: A single decoder generates the exposure list from request-specific candidates, replacing the separate reranking and mix-ranking stages.
id_tokenization:
  approach: Request-local candidate tokens
  details: Candidate features and the upstream fine-ranking score form tokens. The decoder selects from the request's candidates under masks for hard constraints.
features_signals:
- Request context and pre-scored candidates from the fine ranker
- Product, short-video, livestream and advertising candidates from upstream channels
- Logged exposure slates and outcomes for reward-model training
training:
  mode: Decoder warm-up on logged slates followed by reinforcement learning on generated slates
  objectives:
  - Slate-level rewards for clicks, orders and transaction value
  - Long-term reward based on repurchase behavior
  - Separate standardization of predicted rewards and soft business preferences
  notes: Reward models operate during offline post-training.
serving_infra: The serving decoder shares the candidate prefill cache across slate samples and applies business rules during decoding. It serves the selected slate directly.
scale:
- metric: Production logs used in the study
  value: Three months
  note: Section 6.1 describes the logged candidate pools, displayed slates and outcomes.
results_reported: 'Section 6.7 and Table 11 report a one-week account-randomized A/B test, with eligible traffic split equally across arms. Against the deployed Generator–Evaluator cascade, OneTrans-GSR raised GMV per user 2.63%, advertiser value 2.06% and repurchase rate 2.03%. Repurchase was read after a 14-day observation window. End-to-end latency across reranking and mix-ranking fell 13%.'
caveats:
- The A/B compares a complete replacement of reranking and mix-ranking. Retrieval, fine ranking and the business rule set were held fixed.
- The latency change covers reranking and mix-ranking. Table 10 measures the decoder path separately.
- The 14-day window is for measuring repurchases. The experiment ran for one week.
unknown_fields:
- Share of total production traffic eligible for the A/B
- Absolute production latency across the two replaced stages, throughput and accelerator budget
