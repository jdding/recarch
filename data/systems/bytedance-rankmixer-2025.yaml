stages:
- stage: rank
  model_family: 'RankMixer: stacked blocks of multi-head token mixing + per-token FFN (SMoE variant for ~1B parameters)'
  details: 'Each block: S = LN(TokenMixing(X) + X); X'' = LN(PFFN(S) + S). Feature tokens are built by splitting concatenated embeddings
    into T same-width tokens of feature groups.'
