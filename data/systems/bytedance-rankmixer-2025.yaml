tldr: "Ranking backbone with parameter-free token mixing and per-token FFNs instead of self-attention; Douyin Feed full launch gave active days +0.3%, in-app duration +1.08%."
summary: Hardware-aware ranking architecture that turns feature groups into tokens, replaces quadratic self-attention with a parameter-free
  multi-head token mixing, and gives each token its own FFN, optionally Sparse-MoE with dynamic routing. Deployed for full-traffic
  ranking in Douyin feed recommendation.
