system_type: research
evidence_level: research_only
tldr: Deep & Cross Network adds an explicit feature-crossing network next to a deep MLP; on Criteo it beats DNN at about 40% lower memory. Offline only.
summary: 'ADKDD 2017 paper from Stanford and Google: Deep & Cross Network, a model that runs a cross network with explicit feature crossing and one residual cross layer per degree in parallel with a deep MLP over a shared embedding-and-stacking layer. Evaluated offline on the Criteo display-ads dataset and two non-CTR UCI datasets; no online deployment is described.'
paradigms:
- dlrm
- learning-to-rank
stages:
- stage: rank
  model_family: 'DCN: embedding and stacking layer, cross network x_{l+1} = x0 x_l^T w_l + b_l + x_l in parallel with a ReLU deep network, concatenated into a logits layer'
  details: Highest polynomial degree of an l-layer cross network is l+1; cross network adds d x L_c x 2 parameters, linear in input dimension.
id_tokenization:
  approach: Embedded sparse features
  details: null
features_signals:
- Sparse and dense CTR features
training:
  mode: 'Offline on Criteo Display Ads: 11 GB of logs over 7 days (~41 million records), first 6 days for training, day 7 split into validation and test'
  objectives:
  - CTR logloss with L2 term
  notes: TensorFlow; Adam, batch size 512, batch norm on the deep part, gradient clip norm 100, early stopping at step 150,000; categorical embeddings of dimension 6 x cardinality^(1/4), concatenated vector of dimension 1026; grid search over 2-5 hidden layers, sizes 32-1024, 1-6 cross layers.
serving_infra: null
scale: []
results_reported: 'Criteo test logloss per Table 1: DCN 0.4419, DC 0.4425, DNN 0.4428, FM 0.4464, LR 0.4474; best DCN setting was 2 deep layers of 1024 and 6 cross layers. Over 10 runs DCN 0.4422 +/- 9e-5 vs DNN 0.4430 +/- 3.7e-4. DCN uses about 40% of the DNN''s memory at best performance and, per Table 2, needs 7.9e5 parameters to reach logloss 0.4430 where the DNN needs 3.2e6. Non-CTR: forest covertype accuracy 0.9740 (DNN 0.9737); Higgs logloss 0.4494 vs DNN 0.4506. The paper treats a 0.001 logloss gain as practically significant on Criteo.'
caveats:
- Public-dataset experiments only; no production or A/B result is reported in the paper.
- Wide & Deep was not compared because no method is known to choose its cross features; the FM baseline is described as 'proprietary details'.
- Authors use Google's Sibyl for the LR baseline; baselines were tuned by the authors.
