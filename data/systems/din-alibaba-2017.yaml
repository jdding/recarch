tldr: "DIN weights each past behavior by its relevance to the candidate ad through a local activation unit; deployed in Alibaba display ads with up to +10.0% CTR in an online A/B."
summary: 'KDD 2018 paper from Alibaba: Deep Interest Network replaces fixed-length pooling of user behavior embeddings with a local
  activation unit that weights each historical behavior by relevance to the candidate ad; adds mini-batch aware regularization and Dice,
  a data-adaptive activation. Deployed on the main traffic of Alibaba''s online display advertising system.'
core_idea: Weight each past behavior by its relevance to the candidate ad.
deployed_in: Alibaba online display advertising, main traffic
scale_short: More than 1 million users per second at serving
key_result: Up to +10.0% CTR over BaseModel, the previous online model, in an online A/B from 2017-05 to 2017-06
results_table:
  online:
  - setting: "Alibaba display advertising A/B, 2017-05 to 2017-06"
    method: "DIN with the proposed regularizer and activation"
    metric: "CTR"
    result: "up to +10.0%"
    versus: "BaseModel, the previous online model"
  - setting: "Alibaba display advertising A/B, 2017-05 to 2017-06"
