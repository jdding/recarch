paradigms:
- attention-ctr
- multi-task
stages:
- stage: rank
  model_family: 'DIN: Embedding & MLP with a local activation unit over the user behavior sequence (candidate-dependent attention weights),
    mini-batch aware regularization, Dice activation'
  details: Weights are not normalized with softmax in the paper's activation unit design; the paper stresses preserving intensity of
    interest. Goods_ids feature dimensionality reaches 0.6 billion on the Alibaba dataset.
id_tokenization:
  approach: Sparse ID features mapped to low-dimensional embeddings
  details: null
features_signals:
- User behavior history
- Candidate ad features
training:
  mode: 'Offline: two weeks of display-advertising traffic logs for training and the following day for testing'
  objectives:
  - CTR prediction
  notes: 'Alibaba dataset: about 2 billion training and 0.14 billion test samples; embedding dimension 12 across 16 feature groups.
    Metric is user-weighted AUC with RelaImpr. Mini-batch aware regularization only updates parameters of features appearing in the
    current mini-batch, which the paper says makes L2 regularization feasible at hundreds of millions of parameters.'
serving_infra: 'CPU-GPU serving architecture: request batching, GPU memory access optimization, and concurrent kernel computation; together
  they roughly double single-machine QPS. The system serves more than 1 million users per second and must predict hundreds of ads per
  visitor in under 10 ms.'
scale:
- metric: Training samples
  value: about 2.14 billion, Alibaba dataset per Table 2
  note: paper
- metric: Goods ids
  value: about 0.6 billion
  note: paper
- metric: Serving throughput
  value: more than 1 million users per second
  note: paper
results_reported: 'Online A/B in Alibaba display advertising from 2017-05 to 2017-06 (about a month): DIN with the proposed regularizer
  and activation contributes up to +10.0% CTR and +3.8% RPM over BaseModel, the previous online model; DIN now serves the main traffic.
  Offline on Alibaba dataset per Table 5: DIN 0.6029 AUC (+6.08% RelaImpr over BaseModel); with MBA regularization and Dice 0.6083 (+11.65%,
  +0.0113 absolute AUC); about 0.009 absolute AUC over DeepFM. Amazon Electro per Table 3: DIN 0.8818, with Dice 0.8871 vs BaseModel 0.8624.'
caveats:
- '''Up to 10.0% CTR'' is the paper''s phrasing; the paper''s footnote says ads are ranked by CTR^alpha x bid price with alpha > 1.0.'
- Absolute AUCs on the Alibaba dataset are low (about 0.60) because the metric is user-weighted over many near-identical impressions.
- Offline tables were read from extracted text; row alignment was checked against the text of the analysis.
unknown_fields:
- A/B traffic share
- number of GPUs
