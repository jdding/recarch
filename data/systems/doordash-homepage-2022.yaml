  with an upper-confidence-bound layer adding exploration.
paradigms: [learning-to-rank, multi-task]
stages:
  - stage: retrieval
    model_family: First-pass ranking from ElasticSearch with strategy mixing
    details: Selects no more than 1,200 candidates, with popularity and vertical diversity strategies.
  - stage: pre-rank
    model_family: Second-pass ranking filter / pre-rank
    details: Chooses up to 50 stores for the first page and ranks within carousels.
  - stage: rank
    model_family: Universal Ranker - deep LTR model inspired by DLRM and Wide & Deep, implemented in PyTorch
    details: Ranks carousels, stores and items on a common pConv (probability of conversion) scale; exploration adds a UCB-based uncertainty term.
