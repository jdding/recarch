id: dssm-microsoft-2013
name: "DSSM"
company: Microsoft Research
surface: Web document ranking for a commercial search engine, evaluated offline on its query log
year: 2013
era: classic
era_reason: "A neural semantic model with three layers, trained on clickthrough data and a template for later two-tower models; the schema bounds the deep era to 2016 onward, so a 2013 paper is filed as classic."
first_public: "2013-10"
venue: "CIKM 2013"
venue_year: 2013
