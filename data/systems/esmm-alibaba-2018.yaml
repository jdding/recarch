system_type: recommendation
evidence_level: research_only
tldr: "ESMM trains CTR and CTCVR over the entire impression space so conversion rate is estimated without sample-selection bias; public-data CVR AUC 68.56 vs 66.00 baseline."
summary: 'SIGIR 2018 paper from Alibaba: Entire Space Multi-Task Model estimates post-click conversion rate over all impressions by
  training CTR and CTCVR tasks over the entire space with a shared embedding table, and deriving pCVR = pCTCVR / pCTR implicitly, since pCTCVR = pCTR x pCVR, which addresses sample selection bias and data sparsity. Evaluated offline on Taobao recommender logs; the paper does
  not state a production launch of ESMM itself.'
paradigms:
- multi-task
- learning-to-rank
stages:
- stage: rank
  model_family: 'ESMM: shared embedding layer feeding a CVR tower and a CTR tower (both Embedding&MLP); loss = CTR loss + CTCVR loss
    over all impressions, no direct CVR loss'
  details: Parameter sharing of embeddings transfers feature representation from the richer CTR task to the sparse CVR task; multiplication
    form avoids the numerical instability of dividing pCTCVR by pCTR (the DIVISION baseline).
id_tokenization:
  approach: Shared embedding tables
  details: null
features_signals:
- Impression -> click -> conversion sequence labels
training:
  mode: Offline on Taobao recommender traffic logs; first half of the time-ordered data for training, second half for testing; AUC averaged
    over 10 repeats
  objectives:
  - CTR (click labels)
  - CTCVR (click-and-conversion labels)
  notes: 'Public Dataset (the paper releases a 1% sample): 84M impressions, 3.4M clicks, 18k conversions. Product Dataset: 8,950M impressions,
    324M clicks, 1,774k conversions. Embedding size 18 in the reported setup. Paper notes CVR training samples are about 4% of CTR samples.'
serving_infra: null
scale: []
results_reported: 'Public Dataset AUC (CVR / CTCVR): BASE 66.00 / 62.07; OVERSAMPLING 67.18 / 63.05; UNBIAS 66.65 / 63.56; DIVISION
  67.56 / 63.62; ESMM-NS 68.25 / 64.44; ESMM 68.56 / 65.32 (+2.56 and +3.25 absolute over BASE). Product Dataset trained on the whole
  data: ESMM +2.18% absolute AUC on CVR and +2.32% on CTCVR over BASE, which the paper says is the latest model serving the main traffic
  in its real system; the paper calls a 0.1% AUC gain remarkable.'
caveats:
- Offline AUC only; the paper does not report an online A/B test or state that ESMM was deployed, so evidence stays research_only here.
- The paper says the BASE model serves main traffic; it is the baseline, not ESMM.
- Attribution of the experiments to Taobao recommender traffic is from the paper's dataset description.
unknown_fields:
- online A/B results
- production deployment
- serving latency
