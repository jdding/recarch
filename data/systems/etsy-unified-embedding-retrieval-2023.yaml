features_signals:
- Query, user history, listings
training:
  mode: Offline. Positives mined from cart-adds and purchases in the past month of logs across platforms; up to 30 million users and
    more than 150 million interactions. TensorFlow 2.6, MirroredStrategy on 4 A100 GPUs, about 72 hours to converge.
  objectives:
  - multi-part hinge loss with a threshold per interaction type, and a threshold for negatives, so that threshold pruning can be used
    at retrieval
  notes: 'Negatives: hard in-batch (most similar in-batch products), uniform corpus negatives, and dynamic hard negatives selected from
    a large random batch with current parameters. Loss weights: warm up with uniform negatives, linearly decay uniform weight and raise
    hard-negative weight. Evaluation: Recall@100 and @1000 of purchases on the next 5 days, 11k unique queries with purchases per day.'
serving_infra: 'Retrieval service with ANN index built offline and online query encoding. Faiss: HNSW worked to K = 100 (recall loss
  5%) but degraded at K = 1000 (loss above 10%); moved to the 4-bit product-quantizer FastScan index with re-ranking after fetching
  5 times K, recall loss under 4% at P99 latency under 20 ms. ANN parameters tuned with black-box optimization on Google Vizier. Cache
  keys hash query context features to keep a high TTL with in-session features. P99 inference latency for UEPPR boost is 18 ms; the
  paper states tens of ms and thousands of queries per second.'
