results_reported: 'Offline per Table I, Recall@100 all / head / tail, Recall@1000: BM25 0.55/0.63/0.45, 0.62; Base 0.33/0.32/0.42, 0.61;
  Large vocab 0.45/0.45/0.49, 0.72; Random-walk 0.6/0.74/0.52, 0.72; UEPPR 0.674/0.71/0.69, 0.82; UEPPR boost 0.708/0.72/0.71, 0.85.
  Negative mining ablation per Table II: hard + uniform +3% R@100 and +1.2% R@1000; adding dynamic +9.3% and +5.1%; weighted +11% and
  +6%. Without hard negatives purchase recall@100 drops 7%. Feature importance relative to the Large vocab model per Table III: T5 title+tags
  1.0%, attributes 3.9%, description 6.3%, graph 15%. Location features: 8% relative gain in purchase recall for US users; 98th percentile
  candidate distance 2600 vs 4200 miles. 1-layer transformer on user history: +2% offline recall. Online A/B tests on live traffic,
  aggregated: +2.63% site-wide conversion rate, +5.58% organic search purchase rate, larger for signed-in and habitual buyers.'
caveats:
- The online numbers are aggregated across multiple A/B tests; the paper gives no per-test traffic, duration or confidence intervals.
- The paper does not date the launch.
- Table I reports Recall@100 and Recall@1000 only on purchases; no relevance metric is shown.
- Boosting weights are static and not query dependent; the paper names query-dependent weights as future work.
