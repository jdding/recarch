tldr: "Etsy's two-tower search retrieval unifies text, T5, graph and location encoders; Recall@1000 reaches 0.82 vs 0.61 for the base model offline."
summary: 'Etsy''s UEPPR, the Unified Embedding based Personalized Product Retrieval model: a two-tower retrieval model for Etsy search. The product
  tower unifies token encoders for n-grams, categories and attributes with pre-trained T5-small, bipartite query-product graph and location encoders; the
  query tower jointly encodes query, location and the user''s recent searches and clicked shops with a 1-layer transformer. Trained
  with a multi-part hinge loss and three negative sources, served via Faiss ANN with query-independent quality boosting by hydrated
  vectors. Aggregated A/B tests: +5.58% organic search purchase rate and +2.63% site-wide conversion rate.'
paradigms:
- two-tower
- embedding-based-retrieval
stages:
- stage: retrieval
  model_family: 'Two-tower. Score y = cos(P(p), Q(q,u)). Product encoder P: token/ID average embeddings in field groups, location encoder
    (K-means buckets with k = 50, 100, 500 and zip-code prefixes), transformer representation from a T5-small encoder pre-trained to
    generate the most-purchased query from product text, and a bipartite-graph encoder that averages sampled neighbor query embeddings from over a year of logs, with shared parameter updates frozen. Query-user encoder Q: query tokens, user location, recent searches,
    recent shop clicks, terms of recently clicked items and tags of purchased items, via a lightweight 1-layer transformer over [q,
    recent queries, recently clicked shops].'
  details: 'Fine-tuning distilBERT and the T5 encoder gave no offline gain; the T5 pre-training strategy (docT5query-inspired) did.
    ANN-based product boosting: vectors are hydrated as p'' = [p; f(p)] and q'' = [q; w] so dot(p'',q'') = dot(p,q) + dot(f(p),w); query
    weights w are static and tuned by black-box Bayesian optimization (skopt) to maximize purchase recall.'
id_tokenization:
  approach: null
