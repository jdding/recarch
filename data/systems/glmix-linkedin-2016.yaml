id: glmix-linkedin-2016
name: "GLMix"
company: LinkedIn
surface: Job recommendation as in 'Jobs you may be interested in', and others
year: 2016
era: classic
era_reason: "Generalized linear mixed models with per-member and per-item linear coefficients; no deep net"
first_public: "2016-08"
venue: "KDD 2016"
venue_year: 2016
