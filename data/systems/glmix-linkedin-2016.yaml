updates:
- date: "2026-11-26"
  note: Clarified the application-click metric, experimental control and serving architecture.
system_type: recommendation
evidence_level: production_described
tldr: "GLMix adds per-member and per-job coefficients to a global model. In LinkedIn's A/B test, clicks on the Apply button rose 20% to 40% against LR-Cosine."
summary: Generalized linear mixed model adding per-member and per-job random-effect coefficients to a global model, fit with parallel
  block coordinate descent on Spark; open-sourced in Photon ML.
paradigms:
- learning-to-rank
- online-training
stages:
- stage: rank
  model_family: Global + per-user + per-item logistic regression coefficients
  details: ~2K member features and ~2K job features in the reported job-recommendation experiments.
id_tokenization:
  approach: Member/job ID-level random effects
  details: null
features_signals:
- Member and job features
- Clicks on the Apply button
training:
  mode: Offline distributed
  objectives:
  - Logistic response prediction
  notes: Parallelized BCD under BSP on Apache Spark/YARN.
serving_infra: The production system uses Lucene and GLMix in an offline two-stage scorer. Hadoop MapReduce writes recommendations to Voldemort, and the jobs homepage fetches the list and applies freshness controls.
scale: []
results_reported: The online A/B sampled 2% of members per model and reported one week of results in November 2015. Against production LR-Cosine, daily job application clicks rose 20% to 40% and job detail views rose 10% to 20%. The paper defines application clicks as clicks on the Apply button.
caveats: []
