id: google-discover-sdf-2026
name: SDF
company: Google
surface: Google Discover feed, candidate filtering before ranking
year: 2026
era: deep
era_reason: Learned pairwise and item-level classifiers filter the candidate pool.
first_public: "2026-08"
venue: CIKM 2026 Applied Research
venue_year: 2026
