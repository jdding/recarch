last_verified: "2026-11-25"
system_type: recommendation
evidence_level: production_described
tldr: Google Discover filters outdated candidates before ranking. In a two-month holdback with both filters disabled for the control group, SDF lifted positive feed engagement by 0.26%.
summary: Supersession-Decay Filtering combines two content filters. A pairwise classifier detects when newer coverage makes an older item obsolete. A separate model predicts how much of an item's lifetime visit traffic should already have accrued. Google Discover caches both outputs and drops a candidate before ranking when either filter marks it stale.
paradigms: [multi-task]
stages:
- stage: pre-rank
  model_family: Pairwise supersession classifier and multimodal traffic-ratio predictor
  details: The pairwise model checks related items for supersession. The traffic-ratio model estimates decay across several time horizons from one item. The system removes the candidate when either check fires.
id_tokenization:
  approach: Content representations for filtering
  details: The traffic-ratio encoder fuses text, image and video tokens.
features_signals:
- Related-item pairs and publication times for detecting supersession
- Text, image and video content for modeling relevance decay
- Historical search-click traffic as the traffic-ratio training signal
training:
  mode: Separate training for the pairwise and traffic-ratio filters
  objectives:
  - Distill pairwise supersession judgments into a model suitable for serving at scale
  - Predict cumulative visit-traffic ratios at several horizons
  notes: Traffic-ratio labels use visits from search clicks and a fixed 30-day reference window.
serving_infra: Both filters score candidates off the request path. Serving looks up cached scores or labels. The pairwise filter uses a near-real-time path for time-sensitive items and a batch path for broader coverage.
scale:
- metric: New items evaluated for staleness
  value: Millions per day
  note: Google Discover, Section 3.4
results_reported: 'Section 4.2 reports stale-content prevalence deltas of -6.91 percentage points for SDF and -0.10 for the age-cutoff plus engagement-cliff baseline. Each delta compares the stale shares of promoted and demoted items sampled over four consecutive weeks. In the separate two-month joint holdback with both filters disabled for controls, dismissal rate fell 0.16%, feed diversity rose 0.13%, and positive engagement rose 0.26%. Section 4.3 reports 54.9% fewer user-filed staleness reports over two years versus the pre-deployment baseline. In the first quarter of 2026, serving CPU and TPU hours fell 4.76% for the relational filter and an additional 3.98% for the intrinsic filter.'
caveats:
- The prevalence delta compares two sampled sets of items. It measures a different outcome from the joint-holdback experiment.
- The two-year report count is deployment monitoring across model upgrades and locale expansion.
- The CPU and TPU savings are reported in serving hours. The article gives no absolute cost.
unknown_fields:
- A/B traffic shares
- Absolute serving latency, traffic throughput and accelerator models
- Training compute and absolute inference cost
