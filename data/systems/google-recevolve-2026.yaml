system_type: training_infrastructure
evidence_level: production_described
tldr: A proposal agent, critic and coding agent use a shared research record to improve a production two-tower retriever. Google tested the selected model against the incumbent on live traffic.
summary: The orchestrator passes candidate ideas through a critic, then runs approved code changes in isolated branches. Model evaluations and failures feed back into a shared knowledge base. An exploratory run exposed a proxy that improved when the batch contained fewer negatives.
paradigms: [llm-based, two-tower]
stages:
  - stage: other
    model_family: Orchestrator, ideator, critic and coding agent
    details: The orchestrator proposes, screens and isolates edits, then records completed runs and failures for subsequent trials.
  - stage: retrieval
    model_family: Two-tower retrieval model
    details: The production experiment compares the selected trained candidate with the incumbent retrieval model.
id_tokenization: {approach: null, details: null}
features_signals:
  - Previous hypotheses, code changes and failure logs
  - Offline ranking and auxiliary validation metrics
training:
  mode: Full training of approved model changes in isolated experiment branches
  objectives:
    - Advance changes that meet the main and auxiliary offline criteria.
    - Record failed hypotheses and constraint violations for future trials.
  notes: The paper reports that shrinking a training batch from 8k to 1k reduced the number of in-batch negatives and artificially boosted a proxy. The team rolled back this exploratory change.
serving_infra: The research workflow runs outside the request path. The selected model was deployed in a production A/B test.
scale:
  - metric: Completed autonomous training runs from scratch
    value: More than 40
    note: Describes the research runs rather than the production experiment population.
results_reported: Section 5.7 and Table 2 compare the selected model with the production baseline. The reported relative changes were +3.77% user satisfaction, +7.44% unique content and −16.50% cold-start discovery time.
caveats:
  - The online test covers a selected trained model. The paper does not attribute the result to any one edit in isolation.
  - The batch-size shortcut was a separate exploratory run and was rolled back.
