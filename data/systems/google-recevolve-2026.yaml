id: google-recevolve-2026
name: RecEvolve
company: Google
surface: Automated model research for an unnamed production two-tower retrieval service
year: 2026
era: generative
era_reason: Agents generate and review executable changes to a production retrieval model.
first_public: '2026-07'
venue: RecSys 2026 Industry
venue_year: 2026
published_version_checked: false
primary_source: https://doi.org/10.1145/3773078.3831898
added_on: '2026-11-26'
