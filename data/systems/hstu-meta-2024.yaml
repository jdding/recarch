id: hstu-meta-2024
name: Generative Recommenders / HSTU
company: Meta
surface: Ranking and retrieval on an unnamed "large internet platform"
year: 2024
era: generative
era_reason: "Generative recommender: actions as tokens, trillion-parameter transducer with scaling laws"
first_public: "2024-02"
venue: "ICML 2024"
venue_year: 2024
