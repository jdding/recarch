last_verified: "2026-10-30"
system_type: recommendation
evidence_level: production_described
tldr: "Recasts retrieval and ranking as sequence transduction with the HSTU attention encoder in place of DLRM interactions; reports +12.4% online on topline metrics."
summary: Reformulates retrieval and ranking as sequential transduction over one merged time series of a user's actions and content as Generative Recommenders and replaces DLRM feature interaction with HSTU, a pointwise-aggregated-attention encoder; reports deployment on multiple
  surfaces of an unnamed large internet platform.
paradigms:
- sequential-transformer
- foundation-model
- multi-task
stages:
- stage: retrieval
  model_family: HSTU generative retrieval (user-sequence encoder)
  details: 'Table 6 (industrial, vs DLRM): offline HR@100 36.9% and HR@500 62.4% for GR (new source) vs 29.0% and 55.5% for the DLRM;
    online E-Task +6.2%, C-Task +5.0% (new source) and +5.1% / +1.9% (replace source). Content-only GR is much worse (11.6% / 18.8%);
    interactions-only GR gets 35.6% / 61.7%.'
- stage: rank
  model_family: HSTU generative ranking, multi-task (engagement 'E-Task' and consumption 'C-Task'), evaluated with Normalized Entropy
  details: Numerical aggregate features (counters, ratios) are dropped in GR because the categorical features they aggregate over are
    already in the sequence; target-aware scoring of candidates uses M-FALCON.
id_tokenization:
  approach: Items and actions merged into a single time series; high-cardinality ids embedded directly (no Semantic-ID quantization)
  details: Paper highlights a billion-scale, continuously changing vocabulary as a core difficulty.
features_signals:
- Merged main time series of user actions and items (categorical features sequentialized)
- Content / categorical features as sequence tokens
- Numerical aggregate features removed in GR; DLRM baseline described with ~1000 dense and ~50 sparse features
training:
  mode: Streaming / continuous training; generative training that samples users at rate ~1/n_i so encoder cost is amortized across targets
    (O(N^2 d + N d^2))
  objectives:
  - 'Retrieval: sequential transduction (log-perplexity metric offline)'
  - 'Ranking: multi-task E-Task / C-Task (NE metric)'
  notes: 'Industrial ablations trained on 100B examples (DLRM-equivalent) with 64-256 H100s per job; 0.001 NE reduction is treated as
    significant at about 0.5% topline per the paper. Stochastic Length: at alpha=1.6 a length-4096 sequence becomes ~776 most of the time
    (>80% of tokens removed).'
serving_infra: HSTU is 5.3x-15.2x faster than FlashAttention2-based Transformers at sequence length 8192 per the abstract; M-FALCON processes
  b_m candidates in one forward pass with modified attention masks/biases and optional micro-batching with KV caching, so cross-attention
  cost is O(n^2 d) instead of O(b_m n^2 d); paper states 285x more complex models served at 1.5x-3x QPS.
scale:
- metric: Largest GR
  value: 1.5 trillion parameters per the abstract; DLRM quality saturates at about 200 billion parameters per the Fig 6 caption
  note: paper
- metric: Compute
  value: '''three orders of magnitude more computationally complex'' than prior SOTA (intro)'
  note: paper
- metric: Scaling law
  value: power-law in training compute across three orders of magnitude, up to GPT-3/LLaMa-2 scale (abstract)
  note: paper
results_reported: '+12.4% online A/B on topline metrics, deployed on multiple surfaces (abstract); per-task online deltas in Table 6
  (retrieval, above). Public datasets: HSTU-large beats SASRec by up to +65.8% NDCG@10 (Amazon Books).'
caveats:
- Platform and surfaces are not named as a 'large internet platform with billions of users'; this card labels the company Meta from author
  affiliation only.
- The +12.4% is a topline figure; its metric definition is not given in the abstract/intro.
- Table 7 (ranking online metrics) did not extract cleanly from the PDF, so per-task ranking deltas are not reproduced.
- Industrial datasets are internal and not released.
unknown_fields:
- named product surface
- absolute QPS / latency numbers
- exact metric behind +12.4%
