summary: >-
  Four-stage funnel of retrieval, first-stage ranking, second-stage ranking and final reranking that leans on caching and pre-computation,
  with Two Tower networks for retrieval sourcing and first-stage ranking.
paradigms: [two-tower, multi-task, embedding-based-retrieval]
stages:
  - stage: retrieval
    model_family: Mix of heuristic and ML sources (item CF, personalized PageRank, two-tower sparse network), real-time and pre-generated
    details: Sources mixed with tunable weights; Meta's transparency page says up to 1500 media are fetched at the end of retrieval.
  - stage: pre-rank
    model_family: Lightweight first-stage ranker (two-tower neural network using media and user features)
    details: Transparency page says the top 100 media are passed to the next stage.
  - stage: rank
    model_family: Heavier second-stage model (multi-task multi-label neural network per Meta's transparency page)
    details: Predicts engagement such as like and save; "see less" style negative signals also used.
  - stage: re-rank
    model_family: Final reranking (rules / diversity - see engineering post)
    details: Listed as a distinct stage in the engineering post.
