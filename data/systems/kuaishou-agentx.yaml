system_type: training_infrastructure
evidence_level: production_described
tldr: AgentX makes model research cumulative by recording experiments, their direct parents and the evidence behind each change. The authors report production A/B results for five recent launch reviews.
summary: AgentX-Model uses a business-specific sandbox that fixes data interfaces and prediction tasks. A Research Agent proposes model changes based on previous outcomes, while a Training Agent implements and runs them. Logs preserve how runs relate to their parents and business baselines. Launch review remains under human control.
paradigms: [llm-based]
stages:
- stage: other
  model_family: Research Agent with a Training Agent and a fixed business sandbox
  details: Reproduce implements a published idea, Follow-up revises an existing experiment, Composition tests a combination, and Diagnose collects evidence for a repair.
- stage: rank
  model_family: Existing business recommenders with model-level changes
  details: The reviewed examples change attention, training objectives or hierarchical aggregation behind the established prediction interfaces.
id_tokenization: {approach: null, details: null}
features_signals:
- Research papers, business feedback and completed experiments
- Run artifacts documenting outcomes, baselines and parent experiments
training:
  mode: Repeated controlled model experiments in a business-specific sandbox
  objectives:
  - Track validation performance against a fixed business baseline and comparable ancestors
  - Retain deployment constraints and evaluate promoted candidates on production traffic
  notes: The study separates completed offline experiments from the later launch-review samples.
serving_infra: Model research takes place before deployment. Candidate models reaching launch review are evaluated in existing production environments.
scale:
- metric: Completed model-changing experiments with valid results
  value: '636'
  note: Offline production evaluation across the reported settings.
results_reported: In the offline production evaluation, 560 of 636 completed model-changing experiments exceeded their setting's business baseline on AUC. A separate lineage analysis compares changes with their direct parents and strongest earlier results. Table 6 reports five recent launch reviews with coarse ranges. Review 3 reports multi-task objective pruning with watch time up 0.3% to 0.8% across two clients and FLOPs and parameter count approximately 10% lower. Review 1 reports acquisition efficiency up 10% to 15% with adaptive attention temperature.
caveats:
- The AUC count uses the business baseline as the reference. It does not count record-setting improvements over every ancestor.
- The reported online ranges cover selected launch reviews. The corresponding controls differ across business settings.
unknown_fields:
- A/B duration, traffic allocation and exact control configuration for the reported launch reviews
- Absolute serving latency, throughput, hardware and total research compute
