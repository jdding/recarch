training:
  mode: Online learning on a distributed training framework; the model continuously consumes new logs and updates parameters to the online service
    at minute-level frequency. Sparse embeddings sit on a dedicated embedding server and dense parameters are shipped periodically.
  objectives:
  - next-item prediction with smoothed logQ-corrected in-batch softmax
  notes: Real-time user feedback in the logging system includes dense signals such as watch time and sparse ones such as likes, follows and shares.
serving_infra: KuaiFormer is added as one pathway beside existing retrieval pathways such as Swing, GNN, ComiRec, DimeRec and GPRP; candidates
  from all pathways are merged and deduplicated, then pass pre-rank, cascading rank and full rank. User embeddings are computed online; for top-K
  the paper says it uses GPU brute-force search in practice, with Faiss or ScaNN named as alternatives. One retrieval per query token, then a
  uniform rank and truncation to a fixed number.
