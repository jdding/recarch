tldr: "Pure-Transformer real-time retrieval for short video: next-action prediction with multiple interest query tokens; offline HR@500 15.61% vs 11.31% for the best other method."
summary: Kuaishou paper from arXiv in Nov 2024 on a pure-Transformer real-time retrieval model for short-video recommendation. It frames retrieval as
  next-action prediction with a Llama-style causal Transformer over the user's watched videos plus k learnable query tokens for multiple interests,
  an adaptive item compression that shrinks a 256-item history to 55 tokens, and an in-batch softmax with logQ correction and label smoothing.
  The paper states it has been integrated into the Kuaishou App's short-video recommendation since May 2024, serving over 400 million daily active
  users, as one extra retrieval pathway.
paradigms:
- sequential-transformer
- embedding-based-retrieval
stages:
- stage: retrieval
  model_family: 'Causal Transformer in the Llama architecture, with RMSNorm, multi-head masked self-attention and point-wise FFN, over item tokens t_i = MLP([item-ID
    embedding, side-feature embeddings]) with about 10+ attributes, namely watch time, interaction labels such as like and comment, video duration bucketed to 1000 buckets up to 300 s, multi-modal category tag ID and so on, plus k learnable query tokens appended after the sequence with causal
    masking so later interest tokens attend to earlier ones. Score for an item is the max over the k interest vectors of the dot product.'
  details: 'Adaptive item compression: for a 256-item history, earlier items are merged in groups of 64 and middle items in groups of 16 by a
    single-layer bidirectional Transformer with mean pooling, the latest items stay uncompressed; the Transformer input is 55 tokens. Compression
    windows in the ablation: 64, 64, 16, 16, 16, 16, 16 from oldest to newest, with the latest 48 items uncompressed. Raising the length from
    64 to 256 by plain attention costs about 6 times the compute, with compression only about +10%. Loss: in-batch softmax with logQ correction
    and label smoothing (alpha) rather than 0/1 labels.'
