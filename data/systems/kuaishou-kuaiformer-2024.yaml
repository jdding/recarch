results_reported: 'Offline hit rate against real viewed items on replayed online requests per Table 1, KuaiFormer vs best other method: HR@50 4.21%
  vs GNN 3.97%; HR@100 6.58% vs GPRP 5.21%; HR@500 15.61% vs GPRP 11.31%; HR@1000 19.88% vs GPRP 15.70%. SASRec scores 1.17/2.51/5.37/7.22. Online
  A/B, one week with 10% of users in three scenarios per Table 2: video watch time +0.360% (Kuaishou single page), +0.126% (Kuaishou Lite single
  page), +0.411% (Kuaishou double page); also usage-time and engagement columns (likes, follows, comments, Novel Surprise views) positive in Table
  2; the column headers are garbled in the extracted text so individual non-watch-time values are not quoted here. The paper calls it one of the
  most significant retrieval experiments at Kuaishou in 2024. Ablations: accuracy rises from 0.325 (length 8) to 0.441 (256); layers 1 to 5 raise
  accuracy from 0.391 to 0.435 with diminishing returns after 4 (0.433); query tokens saturate near 6; compressed 256 gives 0.445 vs 0.441 uncompressed
  and 0.417 at length 64.'
caveats:
- The paper's abstract says the system serves over 400 million DAU; the online A/B was on 10% of users for one week.
- The paper's Table 3 appears in the text as 'Table 3 (a)-(c)' for hyperparameter plots that are drawn in Figure 3; the numbers cited here come
  from the text and the compression table.
- The paper says an about 0.1% video watch time change is statistically significant given 400M daily active users, but it reports no confidence
  intervals.
- The paper says it is 'to our knowledge the first real-time retrieval model by the pure Transformer architecture in industrial-scale RecSys';
  this is the authors' claim.
