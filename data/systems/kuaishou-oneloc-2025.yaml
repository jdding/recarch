id: kuaishou-oneloc-2025
name: OneLoc
company: Kuaishou
surface: Local life service recommendation in the Kuaishou App; recommends store-attached short videos to nearby users
year: 2025
era: generative
era_reason: "An end-to-end encoder-decoder generative recommender over geo-aware semantic IDs with DPO post-training; the generative paradigm replacing a cascade is the central claim."
first_public: "2025-08"
venue: "WSDM 2026"
venue_year: 2026
published_version_checked: false
primary_source: "https://doi.org/10.1145/3773966.3777963"
added_on: "2026-11-02"
last_verified: "2026-11-02"
updates: []
system_type: recommendation
evidence_level: production_described
tldr: "OneLoc generates geo-aware semantic IDs end to end for Kuaishou local life; a one-week A/B at 10% traffic lifted GMV +21.016% and now serves full traffic."
summary: "OneLoc, from Kuaishou, is an end-to-end generative recommender for the local life service of the Kuaishou App, replacing the production multi-stage cascade for store-attached short videos. Geographic information enters at three levels: semantic IDs built from video text fused with location features, a geo-aware self-attention whose scores add location-context similarity and gate outputs by the user's real-time location, and a neighbor-aware decoder prompt that aggregates the surrounding location context through cross-attention. A two-stage recipe follows OneRec: pre-training on multi-behavior watch, click and pay sequences, then reinforcement learning with DPO over preference pairs scored by a geographic reward for distance and a GMV reward. Deployed with an inference stack of beam search, a video-mapping server and a reward system, OneLoc now serves the full traffic of 400 million daily active users."
paradigms:
- generative-retrieval
- semantic-id
- rl-alignment
stages:
- stage: single-stage
  model_family: "Encoder-decoder over geo-aware semantic IDs: 4 blocks each side, 1024 hidden, 8 heads, FFN 4096, 3 codebooks of 8192, trained by pre-training plus DPO"
  details: "The encoder consumes multi-behavior sequences of watch length 256, click 32 and pay 10 with geo-aware self-attention; the decoder generates semantic tokens guided by the neighbor-aware prompt; the Video Mapping Server converts tokens to video IDs and the Reward System filters by GMV score and rules before TopK."
id_tokenization:
  approach: "Geo-aware semantic IDs from residual quantization with 3 codebooks of 8192 clusters"
  details: "Video textual descriptions fused with geographic features are encoded and residual-quantized; each video maps to a 3-token semantic ID whose clusters carry geographic semantics."
features_signals:
- "Watch, click and pay behavior sequences with location IDs and location context embeddings"
- "User real-time location as a gate and as the decoder query, with surrounding locations as keys and values"
- "Geographic reward by user-store distance and GMV reward for DPO preference pairs"
training:
  mode: "Two-stage: streaming pre-training on 7 days of logs, then DPO reinforcement learning"
  objectives:
  - "Next-token prediction over semantic-ID sequences"
  - "DPO on preference pairs from the highest- and lowest-scoring sampled videos under geographic and GMV rewards, loss weight 0.05"
  notes: "AdamW, initial learning rate 2e-4, weight decay 0.1, on NVIDIA A800 GPUs; scaling model size from 0.05B to 0.3B yields an average +6.96% recall and +7.29% NDCG."
serving_infra: "Deployment consists of a trainer with streaming updates, the OneLoc inference server with beam search, a video-mapping server and a reward system. Inference uses mixed precision, KV cache, dynamic batching and TensorRT on NVIDIA A10 GPUs, reaching 25% Model FLOPs Utilization."
scale:
- metric: Deployment
  value: full traffic of local life service, 400 million daily active users
  note: "paper, abstract and Sec 5"
- metric: KuaiLLSR dataset
  value: "8 days, 60 million users, 900K items, 440 million interactions, average sequence length about 200"
  note: "paper, Sec 4.1.1"
- metric: A/B traffic
  value: 10% of traffic in the treatment group
  note: "paper, Sec 5"
results_reported: "Online A/B, Table 4, one week, which Sec 5 describes as run on Kuaishou's primary short-video recommendation scenario, at 10% treatment traffic against the production-level multi-stage pipeline with identical candidate pools: GMV +21.016%, order volume +17.891%, number of paying users +18.585% and new paying users +23.027%, all significant at p < 0.01 under two-tailed t-tests. Offline, Sec 4.2: on KuaiLLSR, OneLoc improves Recall@5 +13.46%, Recall@20 +10.44%, NDCG@5 +14.47% and NDCG@20 +12.97% over the second-best baseline; on the Foursquare global dataset the average gains are +13.18% Recall@5 and +16.34% NDCG@5. Ablations, Table 3: removing location scores drops Recall@5 from 0.3565 to 0.3476, removing the location gate to 0.3501, and removing geo-aware self-attention entirely to 0.3315. Scaling from 0.05B to 0.3B brings an average +6.96% recall and +7.29% NDCG."
caveats:
- "The paper states that local life service is disabled when a user forbids the app from visiting her real-time location."
- "Offline baselines include traditional and generative recommenders, but the online comparison is against the production multi-stage pipeline only."
unknown_fields:
- A/B control-group share beyond the 10% treatment allocation
- Inference latency numbers
- Training compute beyond the A800 GPU mention
