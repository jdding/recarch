tldr: "OneMall unifies Kuaishou e-commerce retrieval with a business-aware Semantic ID tokenizer, a sparse MoE decoder and ranking-reward RL; A/B lifts GMV up to +14.71% and serves over 400 million DAU."
summary: "OneMall is Kuaishou's end-to-end generative recommendation framework for e-commerce, unifying the Product-Card, Short-Video and Live-Streaming item distribution scenarios in one training pipeline aligned to the LLM pre-training and post-training recipe. The tokenizer extends QARM's Res-Kmeans with an FSQ final layer, quantizing item embeddings from a fine-tuned LLM into three-level Semantic IDs; product-cards quantize the commercial embedding alone, short-videos concatenate commercial and watching embeddings, and live-streamings quantize the two-tower item-tower embedding with real-time selling-product Semantic IDs as an extra feature, because their sold products change over time. The backbone compresses Exposure, Click and Buy sequences with Query-Former blocks, fuses them through Cross-Attention, and generates Semantic IDs with a decoder-style Sparse MoE Transformer, deployed at 0.5B total with 0.1B activated parameters. An RL pipeline treats the online ranking model as the reward model, fuses its CTR, CTCVR and EGPM outputs into one score, and optimizes the retriever with DPO and GRPO. The system is deployed serving over 400 million daily active users."
paradigms:
- generative-retrieval
- semantic-id
- rl-alignment
stages:
- stage: retrieval
  model_family: "Decoder-style Sparse MoE Transformer with Query-Former sequence compression, Cross-Attention multi-behavior fusion and causal self-attention; deployed as OneMall-0.5B-A0.1B with 12 experts and top-2 routing, decoding three-level Semantic IDs by beam search"
  details: "Query-Former compresses one sequence per behavior, with query token number around 10, input sequence length around 500 and embedding dimension around 128; Cross-Attention fuses the compressed interests into the Semantic ID query states; the Sparse MoE decoder balances expert load with the loss-free mechanism, configured 12/2 experts at 0.5B-A0.1B and 24/2 at 1.3B-A0.1B."
id_tokenization:
  approach: "Three-level Semantic IDs: two Res-Kmeans layers plus a 16-bit FSQ layer with a 4096 code, over LLM-aligned item embeddings, extending QARM's Res-Kmeans into ResKmeansFSQ"
  details: "Item embeddings come from an LLM fine-tuned with InfoNCE on commercial Item2Item corpora and watching Item2Item corpora, using a Swin-Transformer vision encoder and a Qwen2.5 1.5B text encoder with the ViT frozen. The commercial corpus caps each item at no more than 40 occurrences and holds 70 million samples; the watching corpus holds 12 million samples. Product-cards quantize the product embedding alone; short-videos concatenate the product and video embeddings; live-streamings quantize the two-tower item-tower embedding with real-time selling-product Semantic IDs as an additional feature and a lower item-tower learning rate. Table 5 shows ResKmeansFSQ cuts code conflict from 36% to 11%."
features_signals:
- "Exposure, Click and Buy behavior sequences, each compressed by its own Query-Former"
- "Item-side attributes such as product category, price and shop information, fed to an item tower for the auxiliary contrastive task"
- "Multimodal tokenizer inputs: product main image 224*224 and title; short-video sample 6 frames 224*224 with title, OCR and ASR"
- "Real-time selling-product Semantic IDs as an additional feature for live-streaming items"
- "Ranking-model outputs CTR, CTCVR and EGPM fused into the RL reward"
training:
  mode: "Next-token-prediction pre-training followed by RL post-training, in streaming training aligned to the LLM pre-train and post-train recipe; the online ranking model serves as the reward model"
  objectives:
  - "Autoregressive next-item Semantic ID generation as the main objective"
  - "Two-tower style in-batch contrastive task as the auxiliary objective, on the final Semantic ID state against the item embedding, reaching over 98% accuracy@1"
  - "DPO and GRPO policy optimization against the fused ranking reward, with loss weight NTP plus 0.5 times RL"
  notes: "RL samples 2% of training traffic with beam size 768; reward fusion weights are 1.0, 30.0 and 1.0 for CTR, CTCVR and EGPM; expert load balancing uses the loss-free mechanism; the total loss is NTP plus contrastive plus 0.5 times the RL loss."
serving_infra: "Serves candidate generation across the Product-Card, Short-Video and Live-Streaming scenarios; online inference runs beam search only, since the contrastive task reaches over 98% accuracy@1. The paper caps activated parameters at 0.1B citing online serving compute constraints; latency, throughput and hardware figures are not given."
scale:
- metric: Deployment
  value: "Kuaishou e-commerce Product-Card, Short-Video and Live-Streaming scenarios, serving over 400 million daily active users"
  note: "paper, abstract and Sec 1"
- metric: Model capacity
  value: "deployed generation scales from 0.05B to 1.3B total parameters, activated parameters capped at 0.1B by online serving compute constraints, expanded through Sparse MoE"
  note: "paper, Sec 4.1 and Sec 4.2"
- metric: Tokenizer corpora
  value: "Product-Card commercial corpus of 70 million Item2Item samples; Short-Video watching corpus of 12 million samples"
  note: "paper, Sec 3.1.1"
results_reported: "Deployment: OneMall serves over 400 million daily active users across the Product-Card, Short-Video and Live-Streaming scenarios of Kuaishou e-commerce, abstract and Sec 1. Online A/B, Table 3 and Sec 4.3: Product-Card +2.851% Exposure, +13.01% Click, +8.35% Order and +14.71% GMV; Short-Video +15.32% Exposure, +5.76% Click, +11.65% Order and +10.33% GMV; Live-Streaming +2.78% Exposure, +2.53% Click, +4.47% Order and +4.90% GMV; the abstract rounds these GMV figures to +14.7%, +10.3% and +4.9%. Offline scaling on the E-commerce Short-Video scenario, Table 1 and Sec 4.1: from 0.05B to 1.3B-A0.1B, Acc-SID1/2/3 improve 14.5%/43.9%/61.0% to 16.2%/51.7%/71.7% and HR@50/100/500 improve 32.9%/41.3%/60.5% to 45.6%/57.3%/76.0%, with the dense 0.1B to sparse 0.5B-A0.1B transition the largest step at +10% HR@50, 34.7% to 44.7%. Simulation replay on 0.5B-A0.1B with identical input features, Table 2: OneMall reaches HR@50/100/500 of 34.3%/40.9%/59.3% on Product-Card against SASRec-0.5B-A0.1B 23.2%/30.4%/45.1% and TIGER-0.5B-A0.1B 29.5%/37.1%/53.7%, 44.7%/56.0%/74.2% on Short-Video against 30.2%/41.9%/66.3% and 35.1%/47.8%/72.5%, and 65.9%/69.1%/80.5% on Live-Streaming against 53.9%/58.8%/68.4% and 57.3%/63.5%/73.7%. RL ablation, Table 4: GRPO beats DPO and Base across Top10/100/500, for example Top10 CTR 7.874% for GRPO against 7.834% for DPO and 7.816% for Base, and GRPO over DPO gives +0.040% CTR, +0.012% CTCVR and +0.228% GPM at Top10. Tokenizer ablation on 0.3B-A0.1B, Table 5: ResKmeansFSQ cuts code conflict from 36% to 11% and lifts exclusive codes from 86% to 95%, and the auxiliary contrastive loss adds +1.5%/+1.7%/+1.7% on HR@50/100/500. Query-Former ablation, Table 6: compressing to SeqLen 160 at 9.2 GFLOPs lands within +0.5%/+0.3%/+0.4% of the SeqLen 1205 version at 34.4 GFLOPs. The in-batch contrastive task reaches over 98% accuracy@1, so online inference uses beam search only, Sec 3.2."
caveats:
- "The paper does not name the online control arm and gives no A/B traffic share or duration."
- "Table 4 states neither offline nor online measurement for its CTR, CTCVR, GPM and Reward figures."
- "The paper has no limitations section; the conclusion lists future work on unifying retrieval and ranking, text-based reasoning and a shared backbone for multi-service data scaling."
unknown_fields:
- "Online A/B traffic share, test duration and the control-arm configuration"
- "Serving latency, throughput and hardware"
- "Training compute"
