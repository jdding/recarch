system_type: recommendation
evidence_level: production_described
tldr: A Qwen3-8B LLM that unifies dialogue, reasoning and recommendation over item tokens; online A/B gave App Stay Time +0.159%.
summary: 'Unifies dialogue, text reasoning and recommendation in one LLM-based generative recommender: items are itemic tokens added to a Qwen3-8B vocabulary, trained in three stages, namely itemic alignment, reasoning activation and RL reasoning enhancement, and deployed through a two-stage ''Think-Ahead'' design that pre-generates reasoning-derived item-token prefixes for a real-time OneRec model.'
paradigms:
- llm-based
- generative-retrieval
- rl-alignment
stages:
- stage: single-stage
  model_family: LLM on a Qwen-8B backbone whose vocabulary is extended by 24,576 itemic tokens, 3 levels x 8,192, generating reasoning text then itemic tokens
  details: Stage 1 multi-task pretraining, which interleaves user-persona grounding, itemic dense captioning, general language modeling and more, aligns items with text; Stage 2 prompts the model to write preference rationales; Stage 3 refines reasoning with RL and a recommendation-specific reward.
- stage: other
  model_family: Think-Ahead deployment architecture
  details: Stage one produces item-token prefixes ahead of time from reasoning on intent/general preference; stage two is a real-time updated OneRec model that uses those prefixes as a constrained prefix to generate the final item tokens (Appendix A.3.4).
id_tokenization:
  approach: Itemic tokens aligned with text
  details: null
features_signals:
- Item text, user history
training:
  mode: 'Three-stage: multi-task alignment pretraining -> reasoning activation by prompting the model to generate preference rationales -> RL with recommendation-aware reward'
  objectives:
  - Next-token prediction over text and itemic tokens
  - RL reward tailored for recommendation accuracy
  notes: Offline benchmarks on Amazon Beauty, Toys, Sports against BERT4Rec, HGN, GRU4Rec, SASRec, TIGER, HSTU, ReaRec; ablation on Beauty shows Base+IA+R above Base+IA.
serving_infra: null
scale:
- metric: Backbone
  value: Qwen-8B initialised from public weights
  note: paper
- metric: Added vocabulary
  value: 24,576 itemic tokens (3 x 8,192)
  note: paper
- metric: Online experiment
  value: 1.29% traffic group for one week, platform with hundreds of millions of daily active users
  note: paper
results_reported: 'Online A/B vs the online model: APP Stay Time +0.159% (1.29% traffic, one week). Public benchmarks: state-of-the-art claimed on Amazon Beauty/Toys/Sports.'
caveats:
- +0.159% App Stay Time is small in absolute terms; the paper frames it as validating reasoning in production.
- Reasoning generation is moved off the real-time path by Think-Ahead, so the online model still depends on the OneRec real-time model.
- Full serving cost/latency of the reasoning stage is not stated in the sections read.
unknown_fields:
- reasoning-stage latency and GPU cost
- rollout beyond the 1.29% experiment
