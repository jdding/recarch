id: kuaishou-onerec-think-2025
name: OneRec-Think
company: Kuaishou
surface: Reasoning-enabled generative recommendation
year: 2025
era: generative
era_reason: LLM reasoning plus generative recommendation
first_public: 2025-10
venue: null
venue_year: null
