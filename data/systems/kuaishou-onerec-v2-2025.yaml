tldr: OneRec-V2 uses a lazy decoder-only generator over 3-level semantic IDs with real-feedback RL post-training; A/B on Kuaishou App Stay Time +0.467%.
summary: 'Technical report on OneRec-V2: replaces OneRec-V1''s encoder-decoder with a ''lazy'' decoder-only generator over 3-level semantic IDs, where context is processed once into shared KV and cross-attention skips KV projections and uses GQA, and post-trains with real user-feedback rewards, using duration-aware reward shaping and adaptive ratio clipping in GBPO. Evaluated by A/B tests on Kuaishou and Kuaishou Lite.'
paradigms:
- generative-retrieval
- semantic-id
- rl-alignment
stages:
- stage: single-stage
  model_family: Lazy decoder-only generative recommender (end-to-end generation of semantic IDs)
  details: 'Paper''s motivation: in V1''s encoder-decoder, 97.66% of compute went to context encoding rather than target generation. Item = 3 semantic IDs from the OneRec-V1 tokenizer; training input is [BOS, s1, s2]; loss averages over 3 tokens (V1 summed). Context = static user features + short- and long-term behavior sequences; online model uses 1B parameters and a context length (N_s + T_short + T_long) of about 3000 (about 512 in the architecture ablations).'
id_tokenization:
  approach: Semantic IDs (from OneRec-V1)
  details: null
features_signals:
- User behavior sequences
- Real-world user interactions as reward
training:
  mode: Pretraining of the generator, then post-training with preference alignment on real user interaction signals
  objectives:
  - Next semantic-ID token prediction
  - Duration-Aware Reward Shaping to reduce video-duration bias
  - Adaptive Ratio Clipping / GBPO (Gradient-Bounded Policy Optimization) for stable policy updates
  notes: Scaling curves from 0.1B to 8B parameters; lazy decoder-only reaches similar loss to classic architectures with about 10x fewer FLOPs per Fig 5 caption and the loss follows a scaling-law fit.
serving_infra: null
scale:
- metric: Online model size
  value: 1B parameters per Sec 2.3
  note: paper
- metric: Scaled-up experiment
  value: up to 8B parameters
  note: paper
- metric: Online context length
  value: about 3000 tokens (N_s+T_short+T_long)
  note: paper
results_reported: 'A/B on Kuaishou / Kuaishou Lite: App Stay Time +0.467% / +0.741% while balancing multiple objectives (abstract). Compared with OneRec-V1 at 1B parameters in Fig 1 right and Table 7.'
caveats:
- Gains are relative to the reported baselines (V1 / prior online system); traffic share and test duration for the V2 A/B are not restated in the sections read.
- Production serving architecture, latency and QPS are not given in the sections read.
- Scaling-law claims are on Kuaishou internal data.
