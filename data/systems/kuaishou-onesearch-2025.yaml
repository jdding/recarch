tldr: "One encoder-decoder generates item semantic IDs for Kuaishou mall search, replacing the recall/pre-rank/rank cascade; online orders +3.22% with reward-model selection."
summary: End-to-end generative framework for Kuaishou e-commerce mall search that replaces the recall -> pre-rank -> rank cascade
  with one encoder-decoder generating item semantic IDs, using keyword-enhanced hierarchical quantization, KHQE, multi-view user behavior
  sequence injection, and a preference-aware reward system, PARS. The paper calls it the first industrial-deployed end-to-end generative
  e-commerce search framework.
paradigms:
- generative-retrieval
- semantic-id
- rl-alignment
stages:
- stage: single-stage
  model_family: Encoder-decoder generative model over KHQE semantic IDs, conditioned on query + behavior-driven user ID + short and
    long behavior sequences
  details: Replaces the multi-stage cascade; candidate space shown in Fig 1 as ~10^9 -> ~10^4 -> ~10^2 for the cascade. Quantization
    is argued to beat plain VQ-VAE / RQ-VAE / RQ-Kmeans for preserving distinctive item attributes.
- stage: other
  model_family: Preference-Aware Reward System (PARS)
  details: Multi-stage SFT (semantic alignment, then personalization) plus an adaptive reward model with hybrid ranking that combines
    reward-model guidance and direct user interaction feedback (list-wise preference optimization over a 6-level user behavior hierarchy).
id_tokenization:
  approach: KHQE hierarchical quantization with keywords
  details: null
features_signals:
- Query
- User short- and long-term sequences
training:
  mode: SFT + reward-weighted ranking
  objectives: null
  notes: null
serving_infra: null
scale:
- metric: Deployment
  value: full traffic on detail-page search, 50% on mall search, 20% on homepage search (paper's closing statement)
  note: paper
- metric: Efficiency
  value: OPEX -75.40%; MFU 3.26% (cascade) -> 27.32%
  note: paper
results_reported: 'Online A/B on Kuaishou mall search (OneSearch with additional reward-model selection vs online cascade): search PVs
  +1.10%, item CTR +1.67%, PV CTR +3.14%, PV CVR +1.78%, buyers +2.40%, orders +3.22%. Pure OneSearch (no reward-model selection) is
  comparable to the online cascade. A cascade with only recall + pre-rank (no ranking) lost 9.97% item CTR and 39.14% orders.'
caveats:
- Title calls this a 'preliminary exploration'; deployment is partial (100% / 50% / 20% on three surfaces).
- Best online gains require the added reward-model selection; the pure generative model only matches the cascade.
- Cost savings (75.40% OPEX) and MFU numbers are the paper's own comparison with the cascade; hardware and baseline cost basis are not
  itemised in the sections read.
unknown_fields:
- serving latency / QPS
- model parameter count
- catalog size beyond the ~10^9 candidate pool in Fig 1
