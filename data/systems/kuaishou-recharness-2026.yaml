id: kuaishou-recharness-2026
name: RecHarness
company: Kuaishou
surface: Agent-driven model development for short-video advertising ranking
year: 2026
era: generative
era_reason: A language model generates executable recommender edits within a search directed by observed trial outcomes.
first_public: '2026-07'
venue: null
venue_year: null
published_version_checked: null
primary_source: https://arxiv.org/html/2607.29241v2
added_on: '2026-11-26'
last_verified: '2026-11-26'
system_type: training_infrastructure
evidence_level: production_described
tldr: RecHarness allocates a limited trial budget among expert-defined directions using a bandit. A language model implements the selected edit and validation feedback guides later trials.
summary: Engineers define the objective, evaluation metric and edit directions. A Thompson-sampling router allocates trials among directions, while an experiment skill supplies evidence from recent attempts to the coding agent. The selected production candidate adds self-attention within commerce behavior sequences.
paradigms: [llm-based, attention-ctr]
stages:
  - stage: other
    model_family: Thompson-sampling router, experiment skill and coding agent
    details: Validation feedback updates how the router allocates trials. A structural edit direction can open when local changes stall.
  - stage: rank
    model_family: Shared-bottom advertising ranker with sequence encoders
    details: The tested change adds self-attention within each commerce behavior sequence, then feeds the compressed sequence representations to the ranker.
id_tokenization: {approach: null, details: null}
features_signals:
  - User, item and cross features in the production model
  - Real-time commerce behavior sequences
  - Offline validation scores and prior trial records
training:
  mode: Budgeted trials with feedback-driven selection of model edits
  objectives:
    - Allocate trials among expert-defined editing directions.
    - Advance a candidate based on validation and then verify it on live traffic.
  notes: The budget cap in the BERT4Rec case study applies to that offline comparison rather than the production experiment.
serving_infra: The model-development agent works outside the request path. A sequence-encoder candidate was tested inside the short-video advertising ranker.
scale:
  - {metric: Production A/B coverage, value: '10% of production traffic over 7 days', note: Section 3.5 reports the experiment coverage, with no per-arm split.}
results_reported: Section 3.5 and Table 4 report a 7-day short-video advertising A/B test on 10% of production traffic. For the selected sequence-encoder candidate, Advertiser Value increased 2.084%, revenue increased 0.534% and exposure increased 0.559%.
caveats:
  - The production experiment measures one promoted candidate. The paper compares trial-allocation policies offline.
  - Experts define the available edit directions and the optimization objective.
unknown_fields:
  - Detailed control configuration and treatment split within the reported traffic
  - Production search budget, serving latency, throughput and hardware
