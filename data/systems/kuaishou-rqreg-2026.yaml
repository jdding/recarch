- metric: Platform
  value: "Kuaishou short-video platform, over 400 million DAU, billions of daily impressions"
  note: "paper, Sec 4.3"
- metric: A/B scale
  value: "10% of traffic per arm, about 40 million unique users per model, seven days"
  note: "paper, Sec 4.3.1"
- metric: Codebook
  value: "3 RQ levels of 32 codes in the deployed configuration"
  note: "paper, Sec 4.3.1"
results_reported: "Online A/B, Table 7, seven days at 10% per arm against the WLR production baseline: overall AUC +0.12% and advertiser value ADVV +4.19%; on long-tailed commodity prices AUC +0.23% and ADVV +4.76%. Figure 5 daily trajectory: ADVV gains stay consistent and statistically significant across days 1 to 7; on day 8 the experimental bucket switched back to WLR, and the A/A test on days 9 to 13 shows a clear drop in ADVV, which the paper offers as evidence the gains come from the model. Offline, Table 1 and Table 2: RQ-Reg compares favorably against regression, classification and ordinal baselines on watch-time and LTV benchmarks; Table 3 ablations show consistent degradation without the representation objective or scheduled sampling; Table 5: RQ K-means beats K-means and dynamic quantile; Table 6: reconstruction MAE 1.33e-3 against 3.28e-3 for dynamic quantile with shorter fixed code length; Figure 3: error and MAE decrease monotonically with RQ levels up to plateau at L 3 and above."
caveats:
- "The paper reports relative lifts over the production baseline; absolute AUC and ADVV values are not published."
- "The A/B allocates 10% of traffic to each arm, matching arms at about 40 million users; bucket construction beyond that is not described."
