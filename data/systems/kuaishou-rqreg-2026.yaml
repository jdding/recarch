tldr: "RQ-Reg turns GMV prediction into coarse-to-fine code generation; a 7-day 10% A/B on Kuaishou ads lifted advertiser value +4.19% and long-tail +4.76%."
summary: "RQ-Reg, from Kuaishou Technology, is a residual-quantization-based framework for predicting continuous values such as watch-time, lifetime value and gross merchandise value in industrial recommendation. A residual-quantization K-means decomposes the target value into a hierarchy of ordered codes, each refining the residual left by the previous level, and the model autoregressively predicts codes from coarse to fine with sequential regression. An ordinal-aware representation learning objective aligns the code embedding space with the ordinal structure of target values, giving quantization codes continuous representations; scheduled sampling stabilizes training. Deployed in the GMV prediction model of Kuaishou's two-stage advertising ranker, where GMV distributions cluster sharply at popular price points, RQ-Reg replaced a WLR production baseline in a large-scale online A/B test."
paradigms:
- generative-retrieval
- multi-task
stages:
- stage: rank
  model_family: "GMV prediction model inside the two-stage advertising ranker, a 3 by 32 RQ codebook with an LSTM backbone, predicting a coarse-to-fine code sequence whose reconstruction is the GMV estimate"
  details: "The final ranking score combines a purchase-probability model and this GMV model; RQ K-means achieves reconstruction error 1.33e-3 against 3.28e-3 for the dynamic-quantile heuristic of Generative Recommendation, with linear rather than quadratic inference scaling in code length."
id_tokenization:
  approach: "Residual-quantization K-means codes over continuous target values, not items"
  details: "The tokenization applies to the label space: each GMV value maps to L ordered codes from 3 codebook levels of 32; levels plateau at L of 3 and above in the offline study."
features_signals:
- "User and context features of the advertising ranker"
- "Product price and its sharp clustering in the GMV distribution"
- "Ordinal structure of the continuous target values"
training:
  mode: "Sequential regression with scheduled sampling, k 0.1 and t0 10, regression loss weight 1.0 and representation loss weight 0.1"
  objectives:
  - "Autoregressive code prediction over the RQ code sequence plus a regression reconstruction loss"
  - "Ordinal-aware representation learning objective aligning code embeddings with target ranking, temperature 2.0"
  notes: "Huber loss delta varies by dataset; ablations show removing the representation objective or scheduled sampling degrades performance consistently."
serving_infra: "Deployed as the GMV model of the second-stage ranker; inference complexity scales linearly with code length, in contrast to the quadratic scaling of the Generative Regression baseline. Further serving details are not reported."
