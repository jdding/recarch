- metric: Parameters
  value: 150B (reported research model)
  note: paper
results_reported: 'Qualitative and chart-only: offline metrics comparable to or exceeding production models on 30+ tasks without task-specific
  fine-tuning; improves with data size, model size and longer history (context length normalized to 8K); similar or better than production
  on 4 out-of-domain (T2) tasks across 4 surfaces; larger margin for cold-start members with few interactions; less degradation as test
  data moves further past the training period. No numeric deltas or online results are given in the text.'
caveats:
- The report calls 360Brew V1.0 a pre-production model; it describes no deployment or online experiments, so evidence stays research_only.
- All quantitative results are in figures; no AUC or lift numbers are stated in the text.
- The same-named later LinkedIn systems (for example LiGR or serving work) are separate sources; this card reflects only the January
  2025 report.
- No serving latency or cost is described for a 150B-parameter model.
