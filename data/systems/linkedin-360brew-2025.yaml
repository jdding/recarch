tldr: "A 150B-parameter decoder-only model built on Mixtral 8x22 MoE that ranks from a text description of member profile and history instead of ID and engineered features."
summary: 'LinkedIn technical report from its Foundation AI Technologies team: 360Brew V1.0, a 150B-parameter decoder-only model built on the open-source
  Mixtral 8x22 MoE architecture and trained on LinkedIn first-party data, which replaces ID-based and feature-engineered ranking with
  a text interface: member profile, past item interactions and a task instruction are verbalized into a prompt and the model answers
  a binary question whose token logits give the score. The report presents it as a pre-production model that covers 30+ ranking tasks across 8+ surfaces without task-specific fine-tuning.'
paradigms:
- llm-based
- foundation-model
stages:
- stage: rank
  model_family: Decoder-only LLM (Mixtral 8x22 MoE base, 150B parameters) prompted with task instruction, member profile text and interaction
    history, scored from the logits of answer tokens
  details: Focus is ranking; the report says retrieval (through embeddings) is planned for later 360Brew releases. In-context learning
    over the member's history replaces hand-crafted time-window features.
id_tokenization:
  approach: null
  details: null
features_signals:
- Verbalized member behavior and social connections
training:
  mode: Further training of a pre-trained open-source LLM on LinkedIn raw entity data such as member profiles, job descriptions and posts, and
    interaction data across 5+ surfaces; first-party data from users outside the European Union
  objectives:
  - next-token prediction over verbalized interactions, evaluated as binary predictions on logits
  notes: Trained and iterated by a small team over 9 months across five releases. Data volume went up more than 3x across those releases
    and performance on in-domain T1 tasks improved; T1 benchmarks have at least a one-month gap from training data. Many specifics, such as token counts, hardware and training recipe, are marked 'more details to come soon'.
serving_infra: null
