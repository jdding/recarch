results_reported: 'Online, Feed SR was compared in controlled A/B tests with the previous production ranker, and the paper reports Overall time spent +2.10% and likes, comments and shares +3.52%. By segment, DAU gains are +2.38% and +4.07%, WAU +1.84% and +3.40%, MAU +0.82% and +1.86%, and new members are not statistically significant. These online results exclude incremental training. Feed SR has served the majority of Feed traffic for over three months. Relative energy per item against the previous model is 0.2 times in training and 0.7 times in inference. Training efficiency work reduced GPU hours by 22% for the metrics kernel, 15% for optimizer fusing, 50% for data loading and 16% for parallel evaluation. Scaling shows Long Dwell AUC improving by about 0.0093 per 10 times training FLOPs over 10^17 to 10^19 FLOPs. In the ablations, replacing the layers with HSTU lowers Long Dwell AUC by 0.23% and Contributions AUC by 0.28%, a Linear head lowers Long Dwell AUC by 1.20%, and no position embedding lowers it by 0.91%.'
caveats:
- 'The paper gives no A/B traffic share, duration, user count or confidence intervals; the lifts are relative changes in time spent and in likes, comments and shares.'
- 'Serving cost is reported as relative speedups and relative energy per item; absolute latency, GPU type and fleet size for serving are not given.'
- 'The online results exclude incremental training, so they do not include the freshness gain of daily updates.'
- 'The previous ranker was served on CPUs, so the energy comparison in Table 3 compares a GPU Transformer with a CPU DCNv2 system.'
- 'No code release or public dataset is described.'
unknown_fields:
- A/B traffic share and duration
