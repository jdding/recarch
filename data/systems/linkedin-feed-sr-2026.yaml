tldr: "LinkedIn's Feed SR replaces the DCNv2 ranker with a Transformer over a year of post and action history for 1.2 billion members; time spent +2.10%, likes, comments and shares +3.52%."
summary: 'Feed SR is the ranking model of LinkedIn Feed, rewritten as a sequential recommender. Each member is represented by up to 1000 impressed posts from one year of data, interleaved with the actions the member took on each post, so the Transformer input has 2000 tokens. A decoder-only Pre-LN Transformer with rotary position embeddings, scalar rescaled residuals and softmax attention processes the sequence, and a parallel DCNv2 head produces the multi-task engagement scores. Select numeric context features, mainly item popularity and viewer-author affinity, are concatenated after the Transformer by late fusion, which cuts training step time by 12% against early fusion. Member profile embeddings from a fine-tuned Qwen3 0.6 billion parameter model are added as a late-fused dense feature and give more than 2% AUC for members with fewer than 10 historical actions. The model uses about 80% fewer features than the production model it replaces. Training is cold-start on 16 H200 GPUs and warm-start on 8 H200 GPUs with daily incremental updates, and impressions without a click are kept with probability 0.1. Serving is split into a CPU inference driver and a PyTorch GPU inference server linked by Arrow buffers over gRPC. About 512 candidates per request share one history in a single forward pass with a custom attention mask, and a custom Flash Attention kernel called SRMIS handles that pattern. The paper also describes why an LLM-based ranker and TransAct were not deployed.'
paradigms:
- sequential-transformer
- multi-task
- online-training
stages:
- stage: rank
  model_family: 'Decoder-only Pre-LN Transformer over interleaved post and action tokens with RoPE, scalar rescaled residuals and softmax attention, plus a parallel DCNv2 multi-task head and late-fused context features'
  details: 'The history holds the most recent 1000 impressions, so the sequence has 2000 tokens. About 512 candidates per request are scored in one pass that shares the member history. The model replaces a Tensorflow DCNv2 ranker that had served on CPUs.'
id_tokenization:
  approach: 'Per-post feature embeddings and an action embedding per post, no semantic IDs'
  details: 'Each post is represented by features encoded by embedding lookup, log transform or identity, and each action vector is projected by a learnable layer. Posts and actions are interleaved, so each post in the history costs two tokens.'
features_signals:
- 'Member history of up to 1000 impressed posts from one year of data, with the member action on each post'
- 'Post features and ID embeddings'
- 'Late-fused context features, mainly item popularity and viewer-author affinity'
- 'Member profile embeddings from a fine-tuned Qwen3 0.6 billion parameter model, refreshed daily'
training:
  mode: Cold-start training followed by daily incremental training with warm start
  objectives:
  - 'Multi-task engagement prediction with a parallel DCNv2 head, covering actions such as long dwell, like, comment and share'
  - 'Training loss on impressions with negative downsampling; impressions without a click are kept with probability 0.1'
  notes: 'Cold-start training uses 16 H200 GPUs and warm-start training 8 H200 GPUs, with global batch size 1024 and AdamW. Daily incremental training computes the loss only on newly arrived interactions. Within-session randomization is used to prevent leakage between impressions of the same session.'
serving_infra: 'Disaggregated serving: a CPU inference driver fetches and joins member and post features, and a Python PyTorch inference server runs the model on GPUs, linked by Apache Arrow buffers inside gRPC messages for zero-copy conversion to tensors. Member history is precomputed offline as Arrow columnar buffers in key-value stores. Shared-context batching scores about 512 candidates in one pass for an 80 times Transformer speedup, and the SRMIS kernel adds about 2 times over masked SDPA. History parsing fell from 450 ms to 2 ms and sparse-to-dense conversion from 254 ms to 5 ms per feature.'
