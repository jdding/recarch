era_reason: "A decoder-only Transformer over one year of interleaved post and action history replaces the DCNv2 ranker, with scaling curves over 10^17 to 10^19 training FLOPs. It is a sequential ranker that follows the scaling-driven generative-era pattern, although it predicts engagement scores, not item tokens."
