results_reported: 'Abstract-level approximate relative production gains: 1% job application hearing-back rate, 2% Ads CTR, 0.5% Feed
  engaged DAU, 0.2% sessions and 0.1% WAU from People Recommendation. Follow Feed (Table 4, incremental validation AUC): 200 vs 20 neighbors
  +3.2%, attention aggregator +0.9%, dual encoder +2.5%, ID embeddings +15.3%, graph densification +0.5%, 2-hop PPR sampling +0.6%,
  temporal graph +5.8%; offline recall +9.6% vs the rule-based candidate selection; online +0.5% Feed engaged DAU. Temporal ablation
  (Table 1, Feed): baseline AUC 0.71978; all combined 0.76176 (+5.83%). OON Feed: about +0.2% DAU engaging with professional content.
  Jobs per Table 5: offline AUC +1.1%, online renewal rate +0.3%, positive hearing-back rate +1.0%, company follows +1.8%; temporal model
  +6.8% AUC in Job Recommendation Ranking with +0.4% job viewers and +0.4% qualified applicants. People Recommendation per Table 7: offline
  recall +29.6%, sessions +0.2%, WAU +0.1%, new member connections +2.4%; PPR sampling beats weighted sampling by at least 2% (multi-hop
  PPR +2.3%, 2-hop PPR +2.1%). Ads per Table 8: member embeddings +0.17% AUC, all embeddings +0.39% AUC, about +2% online CTR.'
caveats:
- The headline gains are described by the paper as approximate relative improvements and are not all from a single A/B; each product
  has its own A/B with its own metrics.
- The paper's ablation numbers are validation AUC lifts on Follow Feed and are incremental (each row on top of the previous).
- 'The paper notes an online lesson: an impression-discount component sat after retrieval and discarded relevant updates, so offline
  gains faded online until it was moved before retrieval.'
- The ACM reference block in the arXiv text still has a placeholder DOI; the venue (KDD 2024, Barcelona) is taken from the page header.
