tldr: "LiGNN: a deployed GraphSAGE-style GNN over a graph with up to a hundred billion nodes; reports about +2% Ads CTR and +1% job-application hearing-back rate."
summary: LinkedIn's KDD 2024 paper on LiGNN, a deployed large-scale GNN framework. A GraphSAGE-style encoder with cosine / in-batch
  decoders is trained over a heterogeneous graph of up to a hundred billion nodes and several hundred billion edges, with ID embeddings,
  temporal-sequence modeling with a SAGE encoder plus Transformer using a prefix causal mask and long-term loss, graph densification for cold
  start, and 2-hop PPR sampling. Training is built on Microsoft DeepGNN's graph engine and sped up 7x; embeddings are produced near-line
  with Beam and used as features in Feed EBR, OON Feed, Jobs, People recommendation and Ads CTR.
paradigms:
- graph-neural-network
stages:
- stage: retrieval
  model_family: 'Encoder-decoder GNN: GraphSAGE-style encoder with mean or attention aggregation, node ID embeddings and dual encoders for source and destination, optional temporal Transformer over the last N (for example 100) activities plus H (for example 4) SAGE
    output heads with prefix causal mask and a long-term loss; decoders: MLP, cosine, or in-batch negative sampling. Only the trained
    encoder is kept to produce node embeddings used as features in downstream models.'
  details: Used in Follow Feed EBR and out-of-network Feed EBR (as an extra candidate generator), People Recommendation retrieval, Top
    Applicant Jobs ranking features and Job Recommendation ranking, and as features in Ads CTR models. The paper therefore spans retrieval
    and ranking uses; the table stage lists the embedding-based retrieval use as primary.
id_tokenization:
  approach: null
  details: null
features_signals:
- LinkedIn graphs
training:
  mode: Offline training on Kubernetes with a CPU Graph Engine (Microsoft DeepGNN) plus GPU trainers fetching sampled compute graphs
    over gRPC; Horovod with NCCL ring allreduce. Distributed training uses 6 to 24 workers.
  objectives:
  - link prediction with binary cross entropy and in-batch negative objectives
  - long-term loss predicting future events for the temporal model
  notes: 'Graph has engagement, affinity and attribute edges. Densification: nodes with out-degree below the 30th percentile are linked
    to their top k (about 50) similar nodes above the 90th percentile using external embeddings (profile LLM embeddings for members,
    content embeddings for items) and HNSW. Training speed: 24 hours to 3.3 hours on a large Follow Feed dataset; per Table 3 the gains are MLPinit 16.25%, adaptive neighbor sampling 24.2%, grouping and slicing 69.9%, mixed precision 8%, local gradient aggregation 35.2%, shared-memory queue 68.04% and GPU co-location 0%. Training success rate raised from 30% to over 90% (gRPC retry +15%, Horovod +35%, GeneratorEnqueuer
    +10%).'
serving_infra: 'Near-line inference pipeline on Apache Beam: an item-creation or member-interaction event arrives via Kafka, features
  are joined, the GNN encoder runs, and embeddings are written to Venice feature storage or a Kafka topic for other Beam pipelines.
  2-hop PPR sampling was chosen as the sampling strategy because the near-line serving supports only 2-hop. The paper says 500M member
  embeddings are generated for People Recommendation.'
