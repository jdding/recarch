training:
  mode: 'Cold-start model followed by incremental training; per Table 3, Feed uses a 21-day cold start with 1-day increments x6 and Ads CTR a 14-day cold start with 0.5-day increments x4'
  objectives:
  - Multi-task engagement prediction (Feed)
  - CTR (Ads)
  - Isotonic calibration layer trained jointly in the network
  notes: TensorFlow model parallelism for large embedding tables, similar to the DLRM paper; training-speed techniques in Sec 4.
serving_infra: Quantization and vocabulary compression for serving
