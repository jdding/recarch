tldr: "How LinkedIn productionized large ranking models with Residual DCN, calibration and transformer history; A/B: Feed sessions +0.5%, qualified job applications +1.76%, Ads CTR +4.3%."
summary: 'KDD ''24 paper describing how LinkedIn productionized large ranking models for Feed, Jobs recommendations and Ads CTR: Residual DCN, which combines DCNv2, attention and residual connections, a jointly trained isotonic calibration layer, dense gating, transformer-based history modeling,
  deep explore/exploit, multi-task learning, dwell-time modeling, incremental training, and quantization and vocabulary compression for
  serving.'
paradigms:
- dlrm
- learning-to-rank
- multi-task
stages:
- stage: rank
  model_family: 'Feed ranker: point-wise multi-task prediction of like, comment, share, vote, long-dwell and click per member-post pair;
    Ads CTR model; Jobs recommendation ranker'
  details: 'Two DCNv2 layers were enough (more gave diminishing gains and higher train/serve time); low-rank mixture and replacing sparse
    one-hot inputs with embedding lookups cut input dimension by nearly 30% so the model can be served on CPUs. Table 1: MTL parameter-sharing
    comparison baseline / MMoE +0.75% / PLE +1.19% / grouping +1.34% (as read from the table text).'
