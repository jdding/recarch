id: linkedin-semantic-search-2026
name: "Semantic Search"
company: LinkedIn
surface: Retrieval and ranking for LinkedIn AI Job Search and AI People Search
year: 2026
era: generative
era_reason: "The stack is LLM-based end to end: an LLM relevance judge supervises retrieval and ranking, and the ranker is a distilled Small Language Model served on prefill-optimized LLM inference infrastructure."
first_public: "2026-02"
venue: "CIKM 2026"
venue_year: 2026
published_version_checked: false
primary_source: "https://doi.org/10.1145/3799682.3840152"
added_on: "2026-11-03"
last_verified: "2026-11-03"
updates: []
system_type: search
evidence_level: production_described
tldr: "LinkedIn distills LLM relevance and engagement teachers into a compact SLM ranker for Semantic Search; Job Search NDCG@10 +7.73%, Poor Match Rate@10 -46.88%, DAU over +1.2% since launch."
summary: "Semantic Search is LinkedIn's LLM-based search stack for AI Job Search and AI People Search. A Query Understanding layer converts short queries into deterministic signals, and an 8B relevance oracle judge, governed by the SAGE evaluation framework, grades training data and supervises both retrieval and ranking. Retrieval runs a contrastive LLM bi-encoder on a GPU-accelerated exhaustive stack with attribute pre-filtering over up to 1.3B documents, selects the top 1000 candidates, and GPU retrieval-as-ranking scoring adds personalization and engagement features; in People Search it replaced several network-distance retrieval paths with one retrieval call. The production ranker is a 0.6B decoder-only SLM that reranks the top 250 results, warm-started from a relevance-specialized model and distilled jointly from relevance and engagement teachers via multi-teacher distillation, then pruned to 375M parameters and served with MixLM text-embedding hybrid inputs on a scoring-optimized prefill-only inference stack that has been open-sourced in the sglang project. After launch, Job Search NDCG@10 improved +7.73% and Poor Match Rate@10 saw a -46.88% reduction against the prior DLRM-style baseline, People Search NDCG@10 improved over 10%, and the system demonstrated over +1.2% DAU lift."
paradigms:
- llm-based
- embedding-based-retrieval
- learning-to-rank
- multi-task
stages:
- stage: retrieval
  model_family: "Contrastive LLM bi-encoder embeddings scored by GPU retrieval-as-ranking distance models on a GPU-accelerated exhaustive retrieval stack with attribute pre-filtering"
  details: "Retrieval selects the top 1000 candidates from a corpus of up to 1.3B documents. GPU RAR scores the full corpus with personalization and engagement features and jointly optimizes relevance and engagement; in People Search it replaced several production retrieval paths that were previously split across separate calls for different network distances with a single retrieval call."
- stage: rank
  model_family: "Decoder-only SLM reranker, student 0.6B pruned to 375M parameters, distilled from an 8B relevance oracle teacher and a 1.7B multi-task engagement teacher through multi-teacher distillation"
  details: "Pointwise scoring over structured prompts, system prefix plus shared searcher context plus candidate document plus suffix. The model outputs first-token Yes/No relevance probability and engagement scores, then a post-hoc calibration layer with a global probability and a position-conditional vector over 25 ranks calibrates scores. Production reranks the top 250 retrieval results."
id_tokenization:
  approach: "Structured raw-text prompts and embeddings; no item IDs or semantic IDs"
  details: "Candidates are represented by structured attributes plus selected text such as title, company, location, seniority and curated text inside a chat-template prompt; relevance is read from first-token Yes/No logits. Retrieval scores cosine similarity over bi-encoder embeddings. MixLM replaces most item text with learned embedding tokens produced by a dedicated encoder and cached nearline."
features_signals:
- "Query Understanding outputs: routing decisions, normalized attributes and query reformulations shared across stages"
- "Shared searcher context in the prompt prefix: searcher profile and interactions"
- "Member summary generated by an RL-trained summarizer over profiles, professional content, search activity and historical queries"
- "Member text features such as headlines, past positions and locations"
- "Activity history text, for example the last 10 job titles the member interacted with"
- "Numerical features such as common connections, network distance and historical CTR with explicit clicks and impressions, truncated to 2 decimal places"
- "Network proximity and profile popularity features for GPU RAR scoring"
- "Engagement action labels: click, apply, badfit, shortlist and dismiss in Job Search; long dwell, connect, follow and message in People Search"
training:
  mode: "Offline multi-stage training: task-specialized teachers first, then multi-teacher distillation into the student; the summarization model is trained with reinforcement learning"
  objectives:
  - "Relevance distillation: soft-label binary Yes/No targets mapped from oracle grades, plus a listwise pairwise ranking loss"
  - "Multi-task engagement classification over five Job Search actions or four People Search actions, with weighted KL divergence to teacher distributions"
  - "Retrieval: global InfoNCE plus a pairwise margin loss for the bi-encoder, and multi-task BCE over relevance and engagement labels for GPU RAR scoring"
  - "Summarizer trained with GRPO, with a reward combining action prediction, a length penalty and a factuality score"
  notes: "Labeled data scaled 10× for People Search and 40× for Job Search, the latter from 200k to 8M query-document pairs, with saturation beyond that point. Custom engagement loss weights are click 0.4, apply 0.4, badfit 0.05, shortlist 0.05 and dismiss 0.1. The summarizer uses an open-source 1.7B actor with the engagement teacher as reward model and a factuality score from a 32B model. Training infrastructure: LiGer enables 2× larger batches, multi-node training reaches a 3.5× speedup, FSDP2 adds 20%, and H200 clusters add up to 30% further reduction; FP8 showed no benefit for models below 8B. Online multi-teacher distillation on SGLang gives a 3× distillation speedup; the offline cached variant cuts training time by about 35% and total GPU-hours by about 25%; an agentic GPU optimizer cut MixLM training time by 13%, saving 256 GPU-hours on 64 H100s."
serving_infra: "Scoring-optimized prefill-only inference on SGLang, open-sourced in the sglang project: a single forward pass with no decode or sampling, returning only final-token logits; in-batch prefix caching and Multi-Item Scoring amortize the shared query prefix; piecewise CUDA graph execution; multi-process gRPC serving with gc.freeze for tail latency; native mixed-input inference for MixLM embedding tokens. A middle tier caches scored entity IDs in a distributed Couchbase-backed store, enforces latency budgets with retries, adjusts per-query scoring depth with a PID-based controller, and shapes traffic into idle windows. Retrieval serving runs query and document towers on a GPU-accelerated exhaustive stack with attribute pre-filtering, reduced embedding dimensionality and two-slot multi-model deployment for controlled A/B ramps."
