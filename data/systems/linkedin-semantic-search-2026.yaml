results_reported: "Online, Sec 3: against the prior DLRM-style ranking baseline, Job Search improves NDCG@10 by +7.73% and cuts Poor Match Rate@10, PMR@10, by -46.88%; People Search improves NDCG@10 by over 10%; since launch, Semantic Search demonstrated over +1.2% DAU lift. Serving operations, Sec 2.5.5: over 50% of scoring requests are served from a distributed cache, reducing median and mean latency by about 8-10%; a midtier retry policy adds about 10% throughput; a Dynamic Scoring Depth controller drops average scoring depth from 250 to 130 at peak, 48% less per-query GPU compute; traffic shaping lifts effective GPU throughput by about 25%. Offline ranking quality: the Job Search relevance-only student SLM progresses from 0.7583 NDCG@10 with ordinal-label SFT to 0.9432 after soft-label distillation, chat template, ranking loss, the 0.6B base upgrade, relevance-teacher distillation and 40× data volume, and lands at 0.9218 with job-description summarization plus model pruning, Table 1; the multi-teacher distilled student reaches 0.9150 NDCG@10 against 0.9484 for its relevance teacher, Table 5; position-conditioned calibration lifts Click AUROC from 0.6704 to 0.7095, Sec 2.1.4. Retrieval, Table 8: a 4B fine-tuned bi-encoder reaches 0.834 NDCG@50 versus 0.842 for the 8B full-parameter variant; in People Search, GPU RAR adds +1.7% Click AUC, from 0.595 to 0.603, and +1.28% relevance NDCG@10, from 0.78 to 0.79, Sec 2.2.5. Throughput at a fixed 500 ms latency budget on one H100: full-text SLM 290 items/s/GPU, summarized plus pruned 2200 for a 7.5× gain, MixLM 22000 items/s/GPU at 0.9239 NDCG@10, about 10× over the summarized model and about 76× over raw text per Sec 2.3.3 while the abstract states over 75×; the inference stack alone scales the 375M pruned ranker from 750 to 2200 items/s/GPU, a cumulative 2.93×, Tables 10, 12 and 13."
caveats:
- "The launch gains are reported in the Online Deployment section without experiment design details; the paper gives no A/B traffic share, duration or confidence intervals."
- "The abstract reports ranking throughput over 75× under a fixed latency constraint, while Sec 2.3.3 reports about 76× for MixLM over raw-text SLMs and about 10× over summarized-text SLMs; the two comparisons use different baselines."
- "Table 10 shows the pruned and summarized model at 0.9218 NDCG@10 against 0.9432 for full text, so the 7.5× throughput gain comes with a measured quality cost; MixLM recovers 0.9239."
- "Loss masking keeps ranking metrics neutral by design; the paper reports non-statistically significant ranking differences with and without masking while raising predicted scores for rare events."
- "The sglang open-source release covers the scoring-specialized inference stack; the trained ranker models and production data are not released."
