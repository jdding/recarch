id: meituan-dpgr-2026
name: "DPGR"
company: Meituan
surface: Dianping homepage feed and immersive video stream, local life service retrieval
year: 2026
era: generative
era_reason: "An HSTU-based generative retrieval model predicts discrete intent codes from user sequences and each code drives a parallel ANN query, replacing the two-tower retriever."
first_public: "2026-09"
venue: "RecSys 2026"
venue_year: 2026
published_version_checked: true
primary_source: "https://doi.org/10.1145/3773078.3831742"
added_on: "2026-10-30"
last_verified: "2026-10-30"
updates: []
system_type: recommendation
evidence_level: production_described
tldr: "Meituan's DPGR is an HSTU-based generative retriever over Dianping content and POI actions; 7-day 15% A/B vs the two-tower: POI collects +5.209%, content views +1.486%."
summary: 'DPGR models content and POI interactions of one Dianping session in a single HSTU sequence, each as an item, action and context triple with domain-specific projections. A spatiotemporal state-conditioned module injects scene, time slot, location and travel state into the encoder at three points: token reweighting, interaction and aggregation. Instead of generating items, an intent definition module quantizes dual-domain behaviors into discrete intent codes; the model predicts the top K intents and each one runs its own ANN query, so candidate coverage grows with no extra latency. The system is deployed as the retrieval stage in two Dianping homepage scenarios.'
paradigms:
- generative-retrieval
- sequential-transformer
- semantic-id
stages:
- stage: retrieval
  model_family: 'HSTU encoder, 4 layers and 4 heads, hidden size 256, sequence length 1,000'
  details: 'Predicts top K discrete intent codes, K=3 in the multi-intent variant; each code independently queries an ANN index and the K times N candidates are re-ranked by inner product to keep N. Downstream ranking and fusion are unchanged.'
id_tokenization:
  approach: 'Discrete intent codes learned by quantizing dual-domain behaviors, codebook size 256'
  details: 'Items are not the generation unit; the model generates intent codes and each code retrieves items by ANN. Content and POI tokens share the sequence through domain-specific projections.'
features_signals:
- Content interactions on notes, videos and reviews
- POI interactions such as collects and check-ins
- Domain type and action type per interaction
- Spatiotemporal context of scene, time slot, location and travel state
training:
  mode: 'Offline training on Dianping logs'
  objectives:
  - 'InfoNCE contrastive retrieval loss, temperature 0.07'
  - 'Vector quantization with commitment coefficient 0.25 for the intent codes'
  notes: 'Adam with learning rate 1e-4, batch of 256 sessions. Recall@100 grows approximately log-linearly with GFLOPs, and extending the context from 200 to 10k tokens gives a cumulative 24.9% gain in Recall@100.'
serving_infra: 'Parallel ANN retrieval, one query per predicted intent code; the paper states no added latency but gives no latency or hardware figures.'
scale:
- metric: Internal dataset
  value: 56.9M users, 69.6M items, 6.88B interactions
  note: Dianping logs
- metric: Daily active users
  value: Tens of millions
  note: Two homepage scenarios
- metric: Online A/B
  value: 7 days, 15% random traffic bucket
  note: Control is the production two-tower retriever
results_reported: 'Online A/B, 7 days on a 15% random bucket against the production discriminative two-tower retriever, cumulative over three rollout stages, all p < 0.05: content views +1.486%, content watch time +1.015%, POI clicks +0.527%, POI collects +5.209%. Stage 1 with the plain HSTU backbone gave +0.493% content views and +3.226% POI collects; stage 2 with state conditioning gave +1.103% and +3.314%. Offline on the internal Dianping set, Recall@200 is 0.6594 for DPGR with three intents, 0.4777 for one intent, 0.3517 for TBGRecall, 0.3206 for HSTU and 0.0415 for DSSM. On public KuaiRand-Pure, Recall@100 is 0.3265 for DPGR against 0.3184 for HSTU.'
caveats:
- 'The online gains are cumulative over three rollout stages against a two-tower control, so they mix the generative backbone, state conditioning and multi-intent generation.'
- 'The offline evidence is mainly an internal dataset; the public KuaiRand-Pure set lacks content, POI and spatiotemporal signals.'
- 'Latency is described as no additional, with no figures.'
unknown_fields:
- serving latency figures
- GPU count
- traffic share beyond the 15% bucket per experiment
- whether the A/B led to full launch
