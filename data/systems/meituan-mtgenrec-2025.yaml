tldr: "MTGenRec trains Meituan's generative recommenders 1.6x to 2.4x faster on over 100 GPUs with dynamic embedding tables and sequence balancing; Take-away A/B lifted orders +1.22%."
summary: "MTGenRec, built by Wuhan University with Meituan, is a distributed training system for generative recommendation models, the HSTU-plus-MMoE stack Meituan serves across its applications. Built on TorchRec, it fixes two production blockers: hash-based dynamic embedding tables replace static tables so new users, items and menu changes insert and delete embeddings in real time, and two-stage ID deduplication plus automatic table merging cut embedding lookup and communication. Dynamic sequence batching balances variable-length user sequences across GPUs without truncation, which generative models need to keep. The system is deployed for many Meituan applications and handles hundreds of millions of requests daily; on the Take-away platform a GRM trained with MTGenRec beat the long-running deep recommendation baseline on both offline GAUC and online business metrics."
paradigms:
- sequential-transformer
- foundation-model
stages:
- stage: rank
  model_family: "Training infrastructure for the Meituan GRM: embedding layer, N HSTU layers and an MMoE head with top-k expert aggregation, trained end to end with cross-entropy"
  details: "The focus is infrastructure rather than a specific funnel stage: hybrid parallelism with model parallelism for sparse tables and data parallelism for the dense model, All-to-all embedding exchange, heterogeneous backward updates, and a data pipeline over partitioned Hive tables on HDFS."
id_tokenization:
  approach: "Plain feature IDs mapped into dynamic hash-based embedding tables; no semantic IDs"
  details: "MurmurHash3 with open addressing and grouped parallel probing maps arbitrary feature IDs to embeddings; keys and values are stored in decoupled structures, chunks are allocated per block, and the table doubles when the load factor passes 0.75."
features_signals:
- "Contextual, historical and exposed item sequences of the GRM"
- "Sparse categorical features across users, items and context"
- "Variable-length user sequences, average length 600 and maximum 3,000"
training:
  mode: "Offline end-to-end synchronous training over Hive log chunks with a pipelined next-batch prefetch"
  objectives:
  - "Cross-entropy loss of the GRM, with weighted gradient averaging to correct for dynamic batch sizes across devices"
  notes: "Dynamic sequence batching sets a target token count from the average sequence length of 600 times batch size and binary-searches the buffer; models are trained from scratch on 10 days of logs with daily volumes above 200 million sequences, using Adam."
serving_infra: "Not a serving system. Training runs on nodes of 8 NVIDIA A100 SXM4 80GB GPUs, up to 16 nodes; NVLink at 600 GB/s inside a node and InfiniBand at 200 GB/s between nodes."
scale:
- metric: Training throughput gain over TorchRec
  value: 1.6x to 2.4x
  note: "paper, abstract and Sec 4.2"
