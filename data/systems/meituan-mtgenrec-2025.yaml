results_reported: "The GRM is trained from scratch on 10 days of logs. On the Meituan Take-away application, Table 1 compares the GRM against the most advanced online DRM baseline, a DLRM continuously learning for 2 years, with an A/B test on 2% of traffic: offline, GRM 4G improves CTR GAUC +0.0036 and CTCVR GAUC +0.0154 and GRM 110G improves them +0.0153 and +0.0288; online, GRM 4G improves PV_CTR +1.04% and UV_CTCVR +0.04% and GRM 110G improves them +1.90% and +1.02%. The abstract reports a 1.22% growth in user order volume and a 1.31% enhancement in online PV_CTR on the delivery platform, and the introduction summarizes the offline gain as a 2.88pp CTCVR GAUC increase. System results: training time against TorchRec falls 2.44x; Table 2 decomposes 100 steps for GRM 4G 1D into lookup 7.0 to 3.2 seconds, forward 14.8 to 14.0 and backward 50.7 to 32.6, and for GRM 110G 64D into lookup 95.2 to 14.4, forward 27.8 to 19.9 and backward 177.7 to 54.7. Sequence balancing improves throughput 1.75x on average in the introduction, 26.5% on average for GRM 110G peaking at 33.5% on 64 GPUs, raising batch sizes from 480 to 496 with GPU memory utilization 86.3% to 95.7% for GRM 4G 1D and from 80 to 116 with 75.3% to 90.3% for GRM 110G 1D, while pre-balancing synchronization delays reach 25.8 ms. Two-stage ID deduplication yields a 53% throughput improvement in the introduction and 1.1x to 3.7x over no deduplication. The dynamic embedding table reaches 1.47x to 2.22x over TorchRec Managed Collision Handling, 47.59% for GRM 4G 1D up to 97.4% for GRM 110G 8D, where MCH goes out of memory at 64D. At 128 GPUs MTGenRec retains 62.75% to 78.5% of ideal speedup, and GRM and TorchRec reach the same GAUC at equal data, Figure 9."
caveats:
- "The paper states that MTGenRec is developed based on TorchRec, and TorchRec is the only PyTorch-native GRM training framework, so no alternative baselines are compared."
- "The online A/B baseline is the production DLRM that has been continuously learning for 2 years, while the GRM is trained from scratch on 10 days of logs, which the paper itself notes as a significantly lower training data volume."
- "The paper reports that GRM requires preserving complete user sequences, so truncation and padding as done in LLM training are not applied."
