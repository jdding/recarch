tldr: "HSTU-based generative ranker that keeps DLRM cross features; vs a years-optimized DLRM, conversion volume +1.22% and CTR +1.31% with 12% cheaper inference."
summary: 'CIKM ''25 paper: HSTU-based generative ranking model for Meituan food-delivery recommendation that keeps DLRM features including cross features such as candidate-side counters like ctr/pv, compresses samples per user for efficiency, adds Group-Layer Normalization and
  a dynamic attention mask to prevent leakage, and runs on an optimized training framework. MTGR-large is deployed on Meituan take-away
  recommendation.'
paradigms:
- sequential-transformer
- foundation-model
stages:
- stage: rank
  model_family: 'MTGR: HSTU-style stack where tokens come from user features, real-time and historical behavior sequences, and candidate
    items (with their cross features); logits read from candidate tokens via an MLP'
  details: Group-Layer Normalization normalizes token groups from different semantic spaces separately; dynamic mask mixes full attention,
    auto-regressive and self-only visibility so candidates cannot leak. User-level aggregation merges multiple exposure samples of one
    user.
id_tokenization:
  approach: null
  details: null
features_signals:
- DLRM features including cross features
training:
  mode: Offline training on about six months of data for three model sizes (scaling-law study); custom framework
  objectives:
  - CTR / conversion ranking
  notes: 'Framework: dynamic hash tables for real-time insert/delete of sparse embeddings, dynamic sequence balancing across GPUs, embedding-ID
    de-duplication and automatic table merging; throughput 1.6x-2.4x vs TorchRec with good scaling beyond 100 GPUs.'
serving_infra: User-level compression for faster training/inference
scale:
- metric: Compute per sample
  value: 65x FLOPs for single-sample forward vs the DLRM baseline (MTGR-large)
  note: paper
- metric: Users
  value: deployed to hundreds of millions of users on the take-away recommendation system
  note: paper
- metric: Complexity range supported
  value: 10-100x the computational complexity of the DLRM without significant cost increases
  note: paper
results_reported: 'MTGR-large vs a years-optimized DLRM baseline: online conversion volume +1.22%, CTR +1.31%; training cost unchanged
  and inference cost -12%; described as the largest gain in nearly two years, handling the main traffic.'
caveats:
- Gains are against Meituan's own highly tuned DLRM baseline in specific scenarios; the scenarios are only described as 'our scenarios'.
- The paper claims plain generative recommendation that drops cross features degrades quality, which is its own finding on its own data.
- A/B duration is not stated in the sections read.
unknown_fields:
- A/B duration
- absolute QPS / latency
- parameter counts of the three model sizes
