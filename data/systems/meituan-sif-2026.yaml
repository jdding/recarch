primary_source: https://doi.org/10.1145/3773078.3831746
added_on: "2026-11-25"
last_verified: "2026-11-25"
system_type: recommendation
evidence_level: production_described
tldr: Meituan SIF keeps the context of each past interaction in compressed tokens. Against the production HyFormer ranker, CTR rose 2.03% in a seven-day A/B test.
summary: Sample Is Feature encodes the interaction record behind each history step, including context and feedback that a static item embedding omits. The Sample Tokenizer compresses groups of fields into discrete codes. SIF-Mixer combines fields within a sample and mixes information across past samples before scoring the current candidate.
paradigms: [learning-to-rank, sequential-transformer]
stages:
- stage: rank
  model_family: SIF-Mixer with token-level and sample-level attention
  details: Token-level attention mixes feature groups within an interaction. Sample-level attention connects corresponding tokens across interactions, so the current request can attend to the history.
id_tokenization:
  approach: Hierarchical group-adaptive quantization of interaction samples
  details: The tokenizer groups raw fields, divides large groups into sub-tokens, and applies residual quantization. A token describes an interaction with its context, including signals that can change between views of the same item.
features_signals:
- Historical user, item, context and feedback fields
- Current request features encoded for the target sample
training:
  mode: Label-supervised tokenization and discriminative ranking
  objectives:
  - Interaction prediction with binary cross-entropy
  - Quantization commitment loss and alignment of the current-request projection with the codebook
  notes: The ranking label supervises codebook learning through the quantization path.
serving_infra: Historical samples are stored as compact code indices. The current request uses a learned projection at serving time and skips the tokenizer forward pass.
scale:
- metric: Offline evaluation data
  value: Over 1 billion impressions across 90 days
  note: Section 4.1, industrial dataset
results_reported: 'In Section 4.5 and Table 5, a 5% traffic holdout over 7 days against the production HyFormer ranker reports CTR +2.03%, CVR +1.21% and GMV per session +1.35%. CTR rose 0.53% for users with fewer than 10 interactions and 3.12% for users with at least 500 interactions.'
caveats:
- The 5% figure is the reported holdout share. The paper gives no allocation for each experiment arm.
- The online results cover the reported food-delivery deployment. The paper does not give serving latency or hardware.
unknown_fields:
- Absolute serving latency and throughput
- Production training compute, serving hardware and inference cost
