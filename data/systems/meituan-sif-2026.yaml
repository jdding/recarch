id: meituan-sif-2026
name: SIF
company: Meituan
surface: Food-delivery recommendation ranking
year: 2026
era: deep
era_reason: The mixer uses compressed history to predict response to a candidate.
first_public: "2026-04"
venue: RecSys 2026 Industry
venue_year: 2026
