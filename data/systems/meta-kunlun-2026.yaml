id: meta-kunlun-2026
name: "Kunlun"
company: Meta
surface: Meta Ads ranking models for CTR and conversion prediction
year: 2026
era: deep
era_reason: "Scaling a discriminative CTR ranker built from sequence transformer blocks plus Wukong-style feature interaction; not autoregressive generation, semantic IDs or LLM-based."
first_public: "2026-02"
venue: "KDD 2026"
venue_year: 2026
