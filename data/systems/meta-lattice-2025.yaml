stages:
- stage: rank
  model_family: 'Lattice Networks: MDMO ranking models over consolidated datasets and features, with objectives spanning click, conversion
    and ads quality'
  details: Lattice Zipper links each ad impression to a randomly selected attribution window to balance freshness and correctness. Lattice
    Networks outperform Wukong on every task at comparable complexity per Table 3.
