summary: 'Meta paper on Meta Ads recommendation: Lattice redesigns the model space across thousands of domain-objective pairs, called portfolios, by consolidating data with Lattice Zipper, selecting Pareto-optimal features with Lattice Filter, unifying models with Multi-Domain Multi-Objective Lattice Networks that use interleaved learning and parameter untying, and transferring knowledge to serving models with Lattice KTAP and asynchronous precompute.'
