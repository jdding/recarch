serving_infra: Teachers precompute user-ad embeddings and cache them with an expiry time. The student reads valid embeddings as features. A missing or expired entry triggers a background refresh while the student uses a zero placeholder.
scale: []
results_reported: Section 5 compares Lattice with prior Meta Ads portfolios served by separate models trained on isolated data. The combined redesign reports +10% on revenue-driving top-line metrics, +11.5% on ads quality, up to +6% in ad conversions and 20% savings in power capacity. In the separate CTR experiment in Section 4.5, Table 5 reports a 0.24% loss improvement from KTAP at a 0.6 cache hit rate and a six-hour TTL, versus 0.12% with soft-label distillation.
caveats:
- The production measures cover the combined redesign. The paper leaves the mix of revenue-driving metrics unspecified.
- Ads quality is the paper's measure of user satisfaction. It reports the conversion gain as up to 6%.
- Power-capacity savings include consolidation and shared compute across portfolios.
unknown_fields:
- A/B design and traffic share
- Absolute metric values and the mix of revenue-driving metrics
- Actual count of consolidated portfolios
- Absolute production serving latency and monetary inference cost
