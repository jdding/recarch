updates: []
system_type: training_infrastructure
evidence_level: production_described
tldr: "MPZCH removes embedding-table collisions with linear probing and TTL eviction; at Meta it reached zero collisions for 150M users and +0.83% impressions for new videos."
summary: "MPZCH, from Meta with one OpenAI and one Periodic Labs co-author, is a Multi-Probe Zero Collision Hash indexing mechanism for embedding tables. A CUDA kernel keeps an identities tensor and a metadata tensor beside each table and resolves lookups by two-pass linear probing, discovery then action, so an ID either finds its own slot or allocates one by inserting into an empty row or evicting an expired entry. Eviction follows a configurable TTL or LRU policy, and both the embedding and the optimizer state are reset on eviction, so a new ID learns from scratch instead of inheriting a stale, unrelated embedding. The module is co-sharded with the embedding table inside TorchRec, freezes to read-only at publish time, and propagates minute-level sparse deltas for online training. Deployed in a production Video Late-Stage Ranking model serving about 3 billion monthly active users with a 4 billion-row user table, and in an HSTU-based video retrieval model for Post and Owner ID tables."
paradigms:
- online-training
- dlrm
stages:
- stage: rank
  model_family: "Embedding-table indexing layer for recommendation models, co-sharded with TorchRec embedding collections"
  details: "Not a ranking model itself: MPZCH serves the user embedding table of a video late-stage ranker and the Post ID and Owner ID tables of an HSTU-based video retrieval model, with per-feature TTL configurations."
id_tokenization:
  approach: "Plain categorical feature IDs mapped by hash into a fixed-size table with identity tracking; no semantic IDs"
  details: "IDs hash to an initial slot; probing up to a configurable max_probe depth finds the slot whose identity matches, an empty row, or an evictable expired entry; the identities tensor stores the occupying ID per slot and the metadata tensor stores TTL timestamps."
features_signals:
- "High-cardinality categorical IDs, user IDs, video IDs, post IDs and owner IDs"
- "Per-feature TTL configurations, 24 hours for Post IDs and 72 hours for Owner IDs in the retrieval deployment"
training:
  mode: "Online training with streaming updates and minute-level sparse delta publishing, complemented by full snapshots"
  objectives: []
  notes: "Eviction resets embedding and optimizer state together; input feature deduplication mitigates training QPS regression; the identities tensor updates in lockstep with embedding rows to keep lookups consistent."
serving_infra: "At publish the auxiliary tensors freeze and the metadata tensor is dropped from the snapshot, so inference is strictly read-only lookup. Batched HBM or CUDA kernels run at 0.8 to 0.9 ms across probe depths from 8 to 512; non-batched CPU or DRAM operation reaches 94.2 to 102.7 ms, which the paper uses to argue GPU acceleration is necessary. Probe depth has negligible latency impact."
scale:
- metric: User deployment
  value: "Video Late-Stage Ranking model serving about 3 billion monthly active users"
  note: "paper, Sec 4.1"
- metric: User embedding table
  value: 4 billion rows
  note: "paper, Sec 4.1"
- metric: Collision study
  value: 150 million unique user IDs
  note: "paper, Table 1"
results_reported: "Collision study, Table 1, on 150 million unique user IDs: the Sigrid hash baseline keeps a 13.61% collision rate even at 3.33x capacity, while MPZCH reaches a 0.0000% collision rate at 1.33x capacity with probe depth 256, where Sigrid retains 29.65%, and at 2.0x capacity with probe depth 64, where Sigrid retains 21.31%; at probe depth 8 and 1.00x capacity it sits at 12.09% versus Sigrid 36.79%. Kernel benchmark, Table 2: batched HBM or CUDA latency stays at 0.8 to 0.9 ms for probe depths 8 through 512, UVM batched 4.4 ms, CPU or DRAM batched 6.1 to 8.9 ms and non-batched 94.2 to 102.7 ms. User embeddings, Table 3: deploying MPZCH in the production Video Late-Stage Ranking model improved Normalized Entropy in 14 of 17 prediction tasks with 3 neutral, including Video View Duration +0.38%, Video View Percentage 100 +0.12% and Skip +0.12%, gains the paper calls statistically significant given years of prior optimization. Item embeddings, Sec 4.2: in the HSTU-based video retrieval model with 24-hour Post ID and 72-hour Owner ID TTLs, A/B testing yielded 0.83% more impressions for new videos posted within 48 hours; intra-creator embedding similarity rose from 0.66% to 0.91% same day and same-and-next day, +38%, and overall from 0.62% to 0.77%, +25%."
caveats:
- "The A/B traffic share, duration and significance levels are not reported."
- "The paper notes that MPZCH requires table capacity to exceed ID cardinality and a sufficient probe depth, for example 512, to guarantee zero collisions."
- "Most authors are Meta employees; one co-author is at OpenAI and one at Periodic Labs."
unknown_fields:
