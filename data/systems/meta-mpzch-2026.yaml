id: meta-mpzch-2026
name: MPZCH
company: Meta
surface: Embedding-table indexing for production recommendation models; deployed in a Video Late-Stage Ranking model and an HSTU-based video retrieval model
year: 2026
era: deep
era_reason: "A hash-based embedding-table component for deep recommendation models with online updates; the claim is collision mitigation and freshness, not generative modeling."
first_public: "2026-02"
venue: "RecSys 2026"
venue_year: 2026
published_version_checked: true
primary_source: "https://doi.org/10.1145/3773078.3831866"
