tldr: "Meta's Shape Your Feed turns user feedback into a Semantic Profile that an 8B LLM uses to prune and re-rank feed candidates; the online A/B shows post dislike -2.74% and post dismiss -1.70%."
summary: 'Shape Your Feed, SYF, adds a layer that lets users steer a feed with text, voice and one-tap controls. It has three flows. The Perception Flow has an Orchestrator that routes a query to a recommendation toolchain of intent detection, preference synthesis and candidate sourcing; the output is a Semantic Profile of positive and negative interests, stored with an Intent Trajectory and a Candidate Cache. The Serving Flow is a late-stage layer on top of the production ranker: it translates item features to text, adds cached candidates for new interests, scores every candidate for alignment with the profile in a single list-wise LLM call, prunes candidates below a threshold and blends the alignment score with the production engagement score. The Self-Evolution Flow trains the alignment scorer, a Llama 3 8B model, by SFT on labels from an ensemble of LLM judges and then DPO on real user actions, and distills agent signals back into the production ranker. The online test restricted users to the Context-Aware Feedback Pills interface.'
paradigms:
- llm-based
- rl-alignment
stages:
- stage: re-rank
  model_family: 'Llama 3 8B fine-tuned with SFT and then DPO as a list-wise alignment scorer over a Semantic Profile and a set of candidates'
  details: 'The alignment score is bidirectional, positive for matches with positive interests and negative for matches with disliked topics. Candidates below a threshold are pruned, and the final score is a weighted sum of the alignment score and the production engagement prediction. Candidate sourcing for new positive interests runs asynchronously with a lightweight ranking model.'
id_tokenization:
  approach: 'None; items are described in natural language and users by a text Semantic Profile'
  details: 'Context generation decodes hashed IDs and dense vectors of items into topic strings and creator metadata for the LLM prompt. The user state is a semi-structured text profile with interest scores, not an embedding.'
features_signals:
- 'Multi-modal user input: text prompts, voice commands and UI interactions such as feedback pills and settings'
- 'Semantic Profile and Intent Trajectory kept in a memory layer'
- 'Post context such as author and body text'
- 'Production engagement predictions for the blend'
training:
  mode: Offline SFT and recurring DPO of the alignment scorer
  objectives:
  - 'SFT on labels from an LLM-as-a-Judge ensemble, with rationales generated by Llama 4 Maverick'
  - 'DPO on chosen and rejected pairs from explicit user feedback and judge-annotated contexts'
  notes: 'SFT used a single machine with 8x80GB GPUs, about 2.5 GPU hours per epoch, learning rate 2e-5. DPO used 2 machines with 8xA100 80GB each, batch size 4, learning rate 2e-6 and 1 epoch. The judges, such as Llama 4 Maverick and Qwen3-VL-235B-A22B, agreed with human judgments 96% of the time.'
serving_infra: 'The alignment scorer sits on the critical path and scores all candidates in one list-wise inference. Perception runs at lower query volume with asynchronous candidate sourcing; self-evolution is offline.'
scale:
- metric: Alignment scorer
  value: Llama 3 8B, with 1B and 70B variants compared
  note: paper, Table 3
- metric: Independent golden test set
  value: 1029 human annotated samples
  note: paper, Sec 6.1.4
results_reported: 'Offline, the alignment scorer on a judge-annotated evaluation set: few-shot baseline accuracy 83.84% with latency 650 ms, SFT 98.21% with 325 ms and SFT plus DPO 98.85% with 323 ms; F1 53.00%, 76.97% and 79.51%. On the independent golden set of 1029 human samples, SFT plus DPO reaches accuracy 95.8%, precision 75.6%, recall 74.7% and F1 75.1%; zero-shot Llama 3 8B scores accuracy 87.0% and Llama 3 70B 94.6% on that set. Online, a large-scale A/B over several months on a randomized subset of production traffic, with users in the US and Canada aged 18 and above, restricted to the Context-Aware Feedback Pills interface: post dismiss -1.70%, post dislike -2.74% and interest consumption +0.16%, all against the production baseline. Context-Aware Pills took 76.02% of pill interactions against 23.98% for static pills. The full system adds +0.043% critical-path latency and +0.412% direct-tier latency.'
caveats:
- 'The paper does not name the host app or the feed surface; the card says Meta social feed.'
- 'The headline offline accuracy of 98.85% is measured on labels from the same LLM judge ensemble that produced the training labels; on the independent human-labeled set accuracy is 95.8% and F1 is 75.1%.'
- 'The text of Section 6.1.3 gives SFT plus DPO accuracies of 74.9% and 99.4%, while Table 2 lists 0.749 and 0.992 for SFT and 0.794 and 0.994 for SFT plus DPO; the card does not use these Table 2 figures.'
- 'The online test only exposes the feedback pills interface, so the lifts apply to users who use that control; the paper says users who rarely give feedback default to baseline ranking.'
- 'Absolute values of the online metrics and the number of users are not given; lifts are relative to the production baseline.'
unknown_fields:
- A/B traffic share and number of users
- Serving hardware and QPS
- p99 latency bound
- Size of the SFT and DPO datasets
