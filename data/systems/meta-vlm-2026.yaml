name: VLM
company: Meta
surface: Training data infrastructure for production recommendation models on multiple Meta surfaces; stores User Interaction History once and rebuilds sequences at training time
year: 2026
era: generative
era_reason: "The paper's central claim is scaling-law sequence length for HSTU-class generative recommenders, and it names itself the foundational data infrastructure for HSTU and ULTRA-HSTU."
first_public: "2026-04"
venue: "RecSys 2026"
venue_year: 2026
