name: "Wukong"
company: Meta
surface: Large-scale recommendation ranking, evaluated on an internal dataset
year: 2024
era: deep
era_reason: "Scaling law for discriminative ranking with stacked factorization machines, as in Wukong; dominant paradigm is scaling discriminative ranking models, not generative or semantic-ID modeling"
first_public: "2024-03"
venue: "ICML 2024"
venue_year: 2024
published_version_checked: true
