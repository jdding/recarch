system_type: recommendation
evidence_level: production_described
tldr: "MIND gives each user several interest vectors via capsule-style dynamic routing; on TmallData HR@10 is 0.0972 vs 0.0589 for YouTube DNN."
summary: 'CIKM 2019 paper from Alibaba and Tmall: Multi-Interest Network with Dynamic routing represents each user with several vectors
  rather than one. A multi-interest extractor layer using capsule-style Behavior-to-Interest dynamic routing soft-clusters the user''s
  behaviors into interest capsules; a label-aware attention layer is used in training; at serving each interest vector retrieves items
  through approximate nearest neighbor search. Deployed to the matching stage of the Mobile Tmall App homepage.'
paradigms:
- two-tower
- embedding-based-retrieval
- sequential-transformer
stages:
- stage: retrieval
  model_family: 'MIND: embedding and pooling layer, multi-interest extractor using B2I dynamic routing with a shared bilinear matrix, randomly initialized routing logits and a dynamic interest number K'' = max(1, min(K, log2|behaviors|)), ReLU layers over interests concatenated
    with profile, label-aware attention during training'
  details: Score for retrieval is the maximum over the user's interest vectors of the dot product with the item embedding; with K =
    1 MIND reduces to YouTube DNN. Trained with sampled softmax and Adam.
id_tokenization:
  approach: Item ID embeddings
  details: null
features_signals:
- User behavior sequence
training:
  mode: Offline training on a Model Training Platform using 100 GPUs, about 8 hours per run; the served network is updated every day
  objectives:
  - sampled-softmax next-item likelihood
  notes: 'Offline TmallData: 2,014,865 users, 934,751 goods, 6,377 categories, 50.9M samples from 10 days of randomly sampled Tmall
    users; Amazon Books: 351,356 users, 393,801 goods, 6.27M samples. Next-item prediction with HitRate@N.'
serving_infra: Requests go to the Tmall Personality Platform, which fetches recent user behavior and calls a User Interest Extractor
  (MIND); a Recall Engine does nearest-neighbor search per interest, merges candidates sorted by similarity; selecting thousands of
  candidates from the billion-scale item pool takes less than 15 ms. The top 1000 candidates go to a Ranking Service that predicts CTR.
  User behavior changes the interest vectors in real time.
scale:
- metric: Item pool
  value: billion-scale
  note: paper
- metric: Candidates passed to ranking
  value: 1000 per method in the A/B
  note: paper
- metric: Training GPUs
  value: '100'
  note: paper
results_reported: 'Offline HitRate per Table 2, TmallData with K = 5, d = 64: MIND-K-interest HR@10 0.0972 vs YouTube DNN 0.0589 (+65.03%),
  HR@50 0.2080 vs 0.1256, HR@100 0.2699 vs 0.1648; Amazon Books K = 3, d = 36: HR@10 0.0309 vs 0.0231 (+33.77%). Online: one-week A/B
  on the Tmall homepage against item-based CF (which served the majority of traffic) and YouTube DNN; MIND beats both on CTR, with 5-7
  interests best and 5 enough, while the dynamic interest number gives similar CTR to 7 interests and lowers serving cost. Exact CTR
  deltas appear only in Figure 4, not in the text.'
caveats:
- Online CTR gains are shown only in a figure per Figure 4; no numeric lift is in the text.
- The paper says the homepage of the Mobile Tmall App accounts for about half of Tmall traffic; this is context, not a statement about
  MIND's share.
- Matching and ranking were not trained jointly; ranking is a separate service.
unknown_fields:
- numeric online CTR lift
- index type and size for nearest-neighbor search
- share of traffic served by MIND
