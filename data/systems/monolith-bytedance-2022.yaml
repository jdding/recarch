tldr: "ByteDance's training/serving system with a collisionless Cuckoo-HashMap embedding table and minute-level online parameter sync; online training beats batch training."
summary: >-
  Training/serving system with a collisionless Cuckoo-HashMap embedding table, frequency filtering and expiry, plus an online
  training pipeline that syncs sparse parameters at minute granularity.
paradigms: [online-training, dlrm]
stages:
  - stage: rank
    model_family: Worker-PS TensorFlow training of embedding-heavy models (paper example uses DeepFM)
    details: Focus is on infrastructure for sparse embeddings and real-time training rather than a specific funnel.
id_tokenization:
  approach: Collisionless embedding table (Cuckoo HashMap) with feature filtering and expiry
  details: Avoids hash collisions of ID features.
features_signals: [Real-time user feedback joined with features via Kafka + Flink]
training:
  mode: Online training (streaming) plus batch training from HDFS
  objectives: [CTR-style prediction with log-odds correction for negative sampling]
  notes: Sparse parameters synced minute-level, dense parameters daily; PS snapshots daily.
serving_infra: TensorFlow Worker-PS architecture; training PS to serving PS parameter sync.
scale: []
results_reported: Paper reports that online training improves over batch training.
caveats:
  - The paper says the system landed in BytePlus Recommend; it does NOT say this is TikTok's production system. Do not claim TikTok from this source.
