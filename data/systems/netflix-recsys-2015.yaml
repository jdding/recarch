tldr: "Netflix's ensemble of algorithms such as the per-row Personalized Video Ranker, Top-N and Trending, judged by A/B tests on retention; the paper estimates over $1B a year saved."
summary: 'First-party overview of Netflix''s ensemble of algorithms: a per-row Personalized Video Ranker, PVR, Top-N, Trending, Continue Watching, video-video similarity known as "Because You Watched", page generation, evidence selection and search, all evaluated through A/B
  tests aimed at member retention.'
paradigms:
- learning-to-rank
- item-cf
