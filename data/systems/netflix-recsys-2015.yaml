- online-training
stages:
- stage: rank
  model_family: 'Row-level algorithms: PVR (genre/theme rows), Top-N (Top Picks), Trending, Continue Watching, video-video similarity
    (sims)'
  details: About 40 rows per homepage and up to 75 videos per row (varies by device). Rows are produced by different algorithms; a page-generation
    algorithm picks and orders rows.
- stage: single-stage
  model_family: Search treated as a separate IR-based problem that also uses recommendation ideas
  details: Recommendations influence about 80% of hours streamed; the other ~20% comes from search.
