  mode: Offline; MapReduce inference for embeddings
  objectives: [Max-margin ranking loss with hard negatives]
  notes: Trained with 16 K80 GPUs in TensorFlow (per paper).
serving_infra: MapReduce inference on 378 d2.8xlarge AWS nodes; nearest-neighbor lookup for candidates.
