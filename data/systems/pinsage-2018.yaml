summary: >-
  Random-walk based graph convolutional network that produces pin embeddings from the pin-board graph plus visual and text features;
  used for nearest-neighbor candidate generation.
paradigms: [graph-neural-network, embedding-based-retrieval]
stages:
  - stage: retrieval
    model_family: Graph convolutional network (random-walk neighborhoods with importance pooling) + nearest-neighbor lookup
    details: >-
      Embeddings are used for nearest-neighbor lookup (LSH + Weak AND per paper) for Related Pins and in Homefeed.
      Trained with max-margin loss and a hard-negative curriculum.
