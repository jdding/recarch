tldr: "Pinterest's successor to PinSage: pin and board embeddings from graph, content and user sequences via three contrastive tasks; about +2.5% sitewide repins."
summary: Pinterest's universal representation framework from KDD '25 that learns Pin and board embeddings from a heterogeneous graph, content including ViT image and hashed n-gram text, and user activity sequences through three contrastive tasks, namely entity-entity, entity-feature and user-entity.
  Successor to PinSage; code released at github.com/pinterest/atg-research/tree/main/omnisage.
paradigms:
- graph-neural-network
- embedding-based-retrieval
stages:
- stage: other
  model_family: 'Representation learning for retrieval/ranking features: per-entity-type transformer embedders over a node''s content
    plus importance-sampled, proximity-ordered neighbors; multi-task contrastive training with sampling-bias correction (count-min sketch)'
  details: 'Entity types in the paper: Pins and boards. Offline comparison is against PinSage (and PinnerFormer trained on PinSage embeddings)
    with matched encoder/sequence configurations; board-Pin recall measured on future engagement from the Board More Ideas surface.'
