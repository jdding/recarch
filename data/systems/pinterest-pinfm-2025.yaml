results_reported: "In Table 7, adding PinFM to the Home Feed ranker raised sitewide Saves 1.20%, Home Feed Saves 2.60% and Fresh Saves 5.70%. In Related Items ranking the corresponding changes were +0.72%, +2.09% and -0.82%. The reported confidence level is 95%. The Home Feed treatment used the cold-start changes; the Related Items treatment omitted them. In the separate offline Home Feed study (Table 2), Save HIT@3 for items younger than 28 days was -4.40% for PinFM without cold-start handling and +17.72% with the full cold-start recipe, both against the ranker without PinFM. The paper also reports DCAT throughput +600% on internal data."
caveats:
- The abstract summarizes a 20% new-item engagement improvement. Table 2 concerns offline Save HIT@3 and Table 7 gives the measured online Fresh Saves for each product surface.
- The online traffic split and measurement duration are not disclosed.
- Embedding table serving is on a single CPU host, which the authors note limits flexibility.
