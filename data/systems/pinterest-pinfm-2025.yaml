results_reported: Throughput +600% from DCAT (internal data); +20% engagement with new (fresh) items attributed to learning user-sequence/candidate
  interactions; deployed to Home Feed and Related Items Feed with neutral cost and marginal latency increase. Per-surface online lifts
  are in the paper's tables and are not reproduced here.
caveats:
- Per-surface online A/B percentages were not extracted, so only abstract-level claims are listed.
- The 20% fresh-item engagement figure is from the paper's abstract; its experimental setup was not re-derived here.
- Embedding table serving is on a single CPU host, which the authors note limits flexibility.
