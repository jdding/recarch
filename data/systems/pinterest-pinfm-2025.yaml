tldr: "A 20B+ parameter pretrained user-sequence foundation model coupled into Home Feed and Related Items rankers; DCAT gives +600% throughput, +20% new-item engagement."
summary: 'Pretrained user-activity-sequence foundation model with 20B+ parameters for Pinterest: trained on years of user actions with
  an InfoNCE next-positive-item objective, then fine-tuned and coupled into downstream rankers such as Home Feed and Related Items Feed via a Deduplicated Cross-Attention Transformer, DCAT, and int4 embedding quantization to keep cost neutral.'
paradigms:
- foundation-model
- sequential-transformer
stages:
- stage: rank
  model_family: PinFM pretrained transformer over user action sequences (item id, action type, surface, timestamp), fine-tuned inside
    existing ranking models
  details: 'Sequences capped at 16,000 actions, cut into non-overlapping segments of a few hundred tokens for training. Pretraining
    uses InfoNCE with in-batch negatives and a learnable temperature; positive actions chosen per Table 4 ablation. Fine-tuning losses
    ablated in Table 3 (L_ntl default; L_mtl not used by default due to memory/speed). Fresh-item handling: item features plus extra
    dropout for unseen items.'
id_tokenization:
  approach: null
  details: null
features_signals:
- User activity sequences
training:
  mode: Pretrain on large-scale activity logs, then fine-tune per application; large ID embedding tables trained distributed across
    GPUs with TorchRec
  objectives:
  - InfoNCE next-positive-item loss (pretraining)
  - Fine-tuning sequence losses L_ntl (and optionally L_mtl)
  notes: Downstream ablations evaluated on the Home Feed ranking model (HIT@3 changes for Save and Hide).
serving_infra: 'Large ID embedding table is separated from the dense model and served on a CPU host/cluster, with an inference router
  fetching embeddings for the user sequence, while the transformer runs on GPU inference hosts. DCAT processes the user sequence once
  and reuses it across candidates for +600% throughput on Pinterest internal data. int4 post-training quantization of embeddings: two-week
  online A/B was statistically neutral vs full precision.'
