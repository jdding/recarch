id: pinterest-pinrec-2025
name: "PinRec"
company: Pinterest
surface: Pinterest Home Feed, Related Pins and Search, one generative retriever fine-tuned per surface
year: 2025
era: generative
era_reason: "A causal transformer generates sequences of item embeddings autoregressively, conditioned on a desired outcome, and each generated embedding is used for nearest-neighbor retrieval, so generation sits at the center of retrieval."
first_public: "2025-04"
venue: "KDD 2026"
venue_year: 2026
