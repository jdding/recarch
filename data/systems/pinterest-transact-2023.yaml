tldr: "Transformer over a user's last 100 realtime actions inside Pinnability for Homefeed; A/B: repin volume +11.0%, hide volume -10.0%."
summary: 'Realtime-batch hybrid ranker for Pinterest Homefeed: a transformer encodes each user''s most recent 100 actions with candidate-pin early fusion and its output is combined with the batch PinnerFormer user embedding inside Pinnability, which uses DCN-V2 feature crossing and MLP multi-task heads. The paper reports production use in Homefeed, Related Pins, Notifications and Search.'
paradigms:
- sequential-transformer
- dlrm
- learning-to-rank
stages:
- stage: rank
  model_family: 'Pinnability ranker with TransAct: pointwise multi-task, realtime action sequence (last 100 actions, PinSage pin embeddings
    + action-type embeddings), early fusion by concatenating the candidate pin''s embedding to each sequence step, transformer output
    compressed with first K=10 columns + max pooling'
  details: 'Baselines: Wide&Deep + sequence pooling, BST (all / positive actions). Table 4 ablation of output compression: first-K +
    max-pool chosen for the performance/latency balance.'
id_tokenization:
  approach: null
  details: null
features_signals:
- Realtime user actions
- Batch user embeddings
training:
  mode: Offline training on a 2-week dataset; model retrained twice a week in production because TransAct is sensitive to behavior drift
  objectives:
  - Multi-task pointwise prediction (e.g. repin, hide heads)
  notes: Without retraining, the first-day engagement gain decayed over two weeks; retraining on fresh data restored it, as shown in Fig 6. The
    paper also discusses a recommendation diversity drop and mitigations where random time-window masking increased diversity at an engagement cost.
serving_infra: Sequence length capped at 100 recent actions for infrastructure cost and latency; the paper describes optimizations that
  enable GPU serving of the previously CPU-based ranking model.
scale: []
results_reported: 'Online A/B, with Pinnability without realtime sequence features as control and 1.5% of Homefeed users per group: Homefeed
  repin volume +11.0% (all users) / +17.0% (non-core users); Homefeed hide volume -10.0% / -10.5%; overall time spent +2.0% / +1.5%.
  Other surfaces: Related Pins repin +2.8%, Search repin +2.3%, Email CTR +1.4%, Notification push open rate +1.9%. Offline Table 1:
  HIT@3/repin and /hide improvements vs WDL+seq and BST baselines.'
caveats:
- Online control group lacks all realtime sequence features, so the +11.0% is versus no-sequence Pinnability, not versus a strong sequence
  baseline.
- Several offline deltas in Table 1 are marked statistically insignificant by the authors.
