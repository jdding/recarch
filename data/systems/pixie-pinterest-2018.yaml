tldr: "Pixie runs biased random walks on an in-memory pin-board graph with 2B pins and 17B edges for real-time candidates; offline top-1000 hit rate 52.2% vs 10.5% for content-based."
summary: 'WWW 2018 paper from Pinterest. Pixie is a real-time graph-based recommender that runs biased random walks with restarts on
  an in-memory bipartite pin-board graph, pruned to 1B boards, 2B pins and 17B edges at about 120 GB, to return candidates for a weighted
  set of query pins. Key tricks: user-feature-biased edge choice, degree-scaled step allocation across multiple query pins, a multi-hit
  booster, early stopping, and entropy and similarity graph pruning. One server handles about 1,200 requests per second at under 60 ms p99
  latency; the paper says Pixie-backed systems account for over half of daily pin saves.'
paradigms:
- random-walk
- item-cf
stages:
- stage: retrieval
  model_family: 'Graph random walk, no learned model: Pixie Random Walk on a pin-board bipartite graph. Per query pin q, steps N_q =
    w_q * N * s_q / sum(s_r) with s_q = |E(q)| (C - log|E(q)|), C the maximum pin degree. Per-pin visit counts V_q are combined as V[p]
    = (sum_q sqrt(V_q[p]))^2 to boost pins reached from multiple query pins. Walks stop early when at least n_p pins have reached n_v
    visits.'
  details: 'Edge selection is biased by user features (language and topic) via a discrete weight set and consecutive edge storage so
    PersonalizedNeighbor is a subrange operator. Query set is user-specific and updated after each user action; weights depend on action
    type and decay with a half life. Because the walk visits both boards and pins, both can be recommended; fresh pins are served by
    recommending boards first. Surfaces named: Homefeed, Related Pins (Pixie is the primary candidate source, with additional layers),
    board recommendations (''Picked For You''), Explore, email, personalized articles.'
id_tokenization:
  approach: Pin/board node IDs
  details: null
features_signals:
- Pin-board graph
- User features (for walk bias)
training:
  mode: 'No model training. The graph is rebuilt once per day: a Hadoop pipeline outputs board-pin edges, then a graph compiler on a
    single terabyte-scale RAM machine prunes it and writes a binary that servers load; servers restart once a day to load the latest
    graph.'
  objectives:
  - none; ranking by random-walk visit counts
  notes: 'Pruning: board entropy from LDA topic vectors of the latest pins; the most diverse 10% of boards are removed; high-degree
    pin edges are cut by keeping the boards with the highest cosine similarity of topic vectors, with pruning factor delta (degree becomes
    |E(p)|^delta).'
serving_infra: C++ on Stanford Network Analysis Platform, SNAP; AWS r3.8xlarge machines with 244 GB RAM hold the entire pruned graph of about 120 GB so walks never cross machines. Custom adjacency array (edgeVec with offsets) and open-addressing hash-table visit counter
  with linear probing and a multiplicative hash; Linux HugePages of 2 MB let virtual machines serve twice as many requests at half the
  runtime; graph load takes about 10 minutes. Each server has IO threads and worker threads with one counter per worker, and each query
  is served by a single worker. p99 latency under 60 ms; about 1,200 requests per second per server; cluster close to 100,000 requests
  per second.
