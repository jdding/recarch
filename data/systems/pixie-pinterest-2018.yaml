results_reported: 'Offline hit rate for predicting the re-pinned pin per Table 1, top 10 / 100 / 1000: content-based textual 1.0% / 2.2%
  / 4.8%, visual 1.1% / 2.4% / 4.5%, combined 2.1% / 4.6% / 10.5%, Pixie 6.3% / 23.1% / 52.2%. Online A/B vs old systems per Table 2,
  engagement per pin: Homefeed +48%, Related Pins +13%, board recommendations +26%, Explore tab +20%, localization +48% to 75% pins
  in the user''s language; text also gives +50% for switching one Homefeed source from Hadoop to Pixie and +3% Related Pins saves per
  day from shorter walks. Reacting in real time gives 30% to 50% higher engagement than waiting days or hours. Early stopping with n_p
  = 2000 and n_v = 4 gives 84% overlap with the gold-standard set at about 3 times faster. Graph pruning: the F1 score peaks at 58%
  above the unpruned graph at delta = 0.91 with only 20% of the edges (the graph is about a sixth of its size). Language bias (Table
  3): for English query pins, target-language share Basic vs Pixie walk is Japanese 16.35% vs 80.33%, Spanish 41.94% vs 94.51%, Slovak
  2.13% vs 42.55%.'
caveats:
- The paper reports both 'more than 80% of all user engagement' in the abstract and intro, and 'over half of all pins saved each day' in Sec 5 and the conclusion for Pixie-backed systems; these are different measures.
- The 2017 paper's A/B lifts compare against previous production systems which were largely offline, Hadoop-based and precomputed rather than a modern
  ranking stack.
- Offline hit-rate baselines are only content-based embedding methods (VGG-16 visual, Word2Vec text); the paper states it did not compare
  with CF or matrix factorization because no ready-to-use methods exist at that scale.
- Hardware and numbers are from 2017; the paper's year on arXiv is 2017 while the venue year is WWW 2018.
