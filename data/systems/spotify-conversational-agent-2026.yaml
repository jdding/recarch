id: spotify-conversational-agent-2026
name: Spotify Conversational Recommendation Agent
company: Spotify
surface: Multi-turn discovery and session refinement in Spotify DJ
year: 2026
era: generative
era_reason: An LLM plans and invokes content tools across conversational turns.
