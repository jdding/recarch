system_type: recommendation
evidence_level: production_described
tldr: Spotify's agent uses conversation state to plan calls that create or refine a listening session and answer follow-up questions about music.
summary: The agent takes a natural-language request and selects content actions, such as generating or refining a playlist. Later turns can narrow an earlier request or refer to returned items. Before launch, synthetic conversations exercised these behaviors and a coding agent helped revise planning instructions and tool definitions.
paradigms: [llm-based]
stages:
  - stage: other
    model_family: Conversational planner and music tools
    details: The planner uses current and earlier user requests to find content, refine the active session or answer a follow-up. The examples show the agent retaining constraints and resolving references to returned items.
id_tokenization: {approach: null, details: null}
features_signals:
  - Current request and previous dialogue turns
  - Listening session and catalog items returned by tools
training:
  mode: Pre-launch synthetic multi-turn evaluation and iterative refinement of agent planning
  objectives:
    - Detect failures in intent changes, constraint retention and tool calls.
    - Revise prompts and tool definitions based on consistent failure patterns.
  notes: Engineers review proposed changes before merging them.
serving_infra: The tested DJ experience supports multi-turn music sessions and informational intents. The paper reports rollout after its production A/B.
scale:
  - {metric: People exposed during the production test, value: Approximately 15 million users, note: Several markets and device types over two weeks.}
results_reported: In the two-week A/B across several markets and device types, approximately 15 million users were exposed. The paper reports +14% listening, +5% weekly active users and −5% skip rate against the previous session-refinement-only experience.
caveats:
  - The production experiment compares whole product experiences. The contribution of the coding agent or an individual recommendation tool was not isolated.
  - The paper does not specify the underlying ranking model or how candidates are scored.
unknown_fields:
  - Per-arm traffic share, per-market effects and metric denominators
  - Serving latency, throughput, infrastructure and hardware
