surface: Taobao homepage HintQ pre-search query recommendation
year: 2026
era: generative
era_reason: "A fine-tuned Qwen3-30B-A3B LLM generates personalized query lists, trained with list-level SFT and reinforcement learning, and replaces ID matching and co-click heuristics as a recall source."
first_public: "2026-03"
venue: "KDD 2026"
venue_year: 2026
