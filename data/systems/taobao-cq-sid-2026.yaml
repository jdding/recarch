  value: "approximately 21 million items filtered from a corpus of hundreds of millions, updated daily"
  note: "paper, Sec 3.4"
- metric: Training data
  value: "CQ-SID quantizer 37.5M samples; LLM stages 21.0M Item2SID, 90.3M Query2SID, 73.7M personalized UQ2SID"
  note: "paper, Sec 4.1"
- metric: Serving
  value: "over 200 QPS across 8 GPUs, 99.9% availability, approximately 40 ms average end-to-end latency"
  note: "paper, Sec 4.5"
- metric: Channel contribution
  value: "50.25% of all exposures, 58.96% of all clicks, 72.63% of all purchases"
  note: "paper, abstract and Sec 4.5"
results_reported: "Abstract and Sec 4, offline on TmallAPP search logs: CQ-SID reaches up to 26.76% relative improvement in semantic click hitrate and 11.11% in personalized click hitrate over the RQ-VAE baseline, while reducing beam search size by more than half without compromising recall quality. Table 1, same beam size, semantic click hitrate: CQ-SID 0.0758 at beam 1 against 0.0598 for RQ-VAE (+26.76%), 0.3161 at beam 10 against 0.2579 (+22.57%), 0.6181 at beam 100 against 0.5199 (+18.89%); the ablation without the category constraint reaches 0.0680 (+13.71%) at beam 1 and dropping the query-item contrastive loss scores 0.0596 (-0.33%) at beam 1. Table 2, top-1K truncation: CQ-SID peaks at 0.4422 with beam 30 against 0.4275 with beam 65 for RQ-VAE, a 3.44% relative improvement with 53.85% fewer beams. Table 3, personalized click hitrate: 0.1510 vs 0.1359 at beam 1 (+11.11%), 0.5206 vs 0.4787 at beam 10 (+8.75%), 0.7431 vs 0.6912 at beam 50 (+7.51%), 0.8062 vs 0.7513 at beam 100 (+7.31%); at top-1K truncation CQ-SID peaks at 0.7984 with beam 160 against 0.7607 with beam 195 for RQ-VAE, a 4.96% relative improvement with a 17.95% beam reduction. Table 4 at beam 10: EG-GRPO with K=2 lifts clk@10 from 0.5206 to 0.5221 and pvr@10 from 0.4371 to 0.4377, with K=4 exp@10 reaches 0.8711, while standard GRPO with K=0 degrades clk@10 to 0.5196 and pvr@10 to 0.4360. Sec 4.5 online: a two-week A/B test in the multi-channel recall stage reports statistically significant GMV +1.15% and UCTCVR +0.40%; after full deployment the generative recall channel accounts for 50.25% of all exposures, 58.96% of all clicks and 72.63% of all purchases, with the system serving over 200 QPS across 8 GPUs at 99.9% availability and approximately 40 ms average end-to-end latency."
caveats:
- "Sec 4.2.2 states the offline top-1K truncation differs from the actual online recall process, which employs coarse-ranking truncation."
- "Sec 4.4 explains the small RL gains: SFT already leaves narrow headroom for refinement, hitrate is a binary metric, and EG-GRPO must navigate a trade-off between click and exposure."
- "The paper does not report the A/B traffic share and does not name the control arm."
- "The exposure, click and purchase channel shares are post-deployment contribution figures, not A/B lifts."
