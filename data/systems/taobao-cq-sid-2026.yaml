tldr: "Taobao's CQ-SID turns semantic IDs into category-constrained cluster identifiers and aligns recall with ranking via EG-GRPO; two-week TmallAPP A/B: GMV +1.15%, UCTCVR +0.40%."
summary: "CQ-SID, from Taobao & Tmall Group of Alibaba, is a generative recall channel deployed as a supplement in the multi-channel recall stage of TmallAPP search rather than an end-to-end replacement. A three-level RQ-VAE with codebook sizes 2048x1024x1024 maps items to hierarchical semantic cluster identifiers instead of unique item IDs: the first-level codebook is constrained by 1,711 valid categories, query-item contrastive learning shapes the space, and SIDs holding more than 50 items are split into groups, so beam search stays small. A Qwen2.5-0.5B backbone is trained through four progressive stages from item-to-SID mapping to personalized user-and-query-to-SID mapping, and EG-GRPO reinforcement learning injects ground-truth SIDs into each policy group as pseudo-generated outputs to stabilize training under sparse click rewards and align recall with downstream ranking."
paradigms:
- generative-retrieval
- semantic-id
- rl-alignment
- llm-based
stages:
- stage: retrieval
  model_family: "Qwen2.5-0.5B autoregressive generative retriever decoding semantic cluster IDs with beam search"
  details: "Four progressive stages: item-to-SID SFT, query-to-SID with N=3 randomly sampled SIDs per query, personalized user-and-query-to-SID with user features and recent click SID histories, then ranking-aligned refinement with EG-GRPO; online decoding uses dynamic beam sizes in [20, 50, 100]."
id_tokenization:
  approach: "Multi-level semantic cluster IDs from RQ-VAE, deliberately allowing collisions instead of one-item-one-ID"
  details: "Three-level residual quantization with codebook sizes 2048x1024x1024; the first-level codebook is category-constrained over 1,711 valid categories, levels 2 and 3 use nearest-neighbor quantization with EMA updates and a codebook restart strategy; a SID holding more than 50 items is split into at most 100 groups and a group suffix is appended to the third-level code."
features_signals:
- "Item titles"
- "Queries and in-batch query-item contrastive pairs"
- "User features such as gender and age group plus recent click SID histories"
- "Downstream ranking feedback used as the RL reward: purchased or clicked, exposed, valid SID"
training:
  mode: "Offline training in four progressive stages followed by reinforcement-learning refinement; the serving pool is updated daily"
  objectives:
  - "RQ-VAE reconstruction loss with commit loss and bidirectional InfoNCE query-item contrastive loss, beta 1.0, gamma 0.001, temperature 0.1"
  - "Next-SID prediction SFT for item-to-SID, query-to-SID and personalized user-and-query-to-SID mapping"
  - "Group-relative policy optimization with rewards 1.0 for purchased or clicked, 0.5 for exposed, 0.1 for valid SID, 0 otherwise"
  notes: "CQ-SID quantizer: 10 epochs, batch size 4096, learning rate 1e-3, 4 GPUs; Item2SID learning rate 1e-4 for 2k steps, Query2SID 4e-5 for 2.5k steps, personalized stage 4e-5 for 5k steps; EG-GRPO rollout batch 512, group size 8, injected ground-truth samples K of 2 or 4, KL weight 1.0, learning rate 1e-6 for 1k steps."
serving_infra: "Deployed in the multi-channel recall stage of TmallAPP search with dynamic beam sizes in [20, 50, 100]; serves over 200 QPS across 8 GPUs with 99.9% availability and approximately 40 ms average end-to-end latency; the serving pool of approximately 21 million items is updated daily."
