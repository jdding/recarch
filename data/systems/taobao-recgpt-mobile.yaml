id: taobao-recgpt-mobile
name: RecGPT-Mobile
company: Alibaba Taobao & Tmall Group
surface: Personalized query recall for the Taobao feed
year: 2026
era: generative
era_reason: A compact language model turns recent activity into a query for a product retrieval service.
first_public: '2026-05'
venue: null
venue_year: null
published_version_checked: null
primary_source: https://arxiv.org/abs/2608.24295
added_on: '2026-11-26'
last_verified: '2026-11-26'
system_type: recommendation
evidence_level: production_described
tldr: Taobao generates personalized queries on the phone and retrieves items in the cloud. Ambiguous or expensive requests can use a stronger service.
summary: RecGPT-Mobile compresses recent and longer-term behavior into a compact mobile input. A small estimator uses intent complexity and confidence to choose direct generation, additional local computation or escalation to a stronger service. The generated query passes format and grounding checks before the retrieval service uses it to select products for the feed.
paradigms: [llm-based, rl-alignment]
stages:
  - stage: retrieval
    model_family: Compact hybrid language model with a request-level device-cloud router
    details: The phone builds an intent query from the compressed behavior history. The retrieval service returns items for that query as an additional candidate source for the feed.
id_tokenization:
  approach: Hierarchical semantic item tokens and readable product text
  details: Coarse codes represent collaborative neighborhoods and finer codes distinguish nearby products. The codes help represent behavior while the output is a readable query.
features_signals:
  - Recent searches, clicks, favorites, cart actions and purchases
  - Compressed longer-term sequences and current interaction context
  - Estimated request complexity and confidence for serving decisions
training:
  mode: Domain adaptation, supervised alignment, quality-gated reinforcement learning and distillation
  objectives:
    - Predict a grounded and valid product query from the available behavior.
    - Reduce reasoning cost only for outputs that satisfy the quality gate.
  notes: The teacher trains with explicit reasoning. The compressed student learns from its queries and selected intermediate representations.
serving_infra: The phone runs a mixed-precision, structurally compressed student and routes difficult or over-budget requests to a stronger service. Query recall is served by the product retrieval stack.
scale:
  - {metric: Client query path user coverage, value: '0.70% on Android and 1.20% on iOS in the reported serving snapshot'}
results_reported: In the V2 report, Table 8 lists the client query path at 0.12% of exposed page views and 0.70% user coverage on Android, and 0.18% of exposed page views and 1.20% user coverage on iOS. Figure 12 reports an accelerator serving benchmark with mean latency of 0.76 s versus 3.00 s for the reference, and P95 latency of 1.70 s versus 8.00 s. Table 9 reports offline teacher query quality of 78.6% versus 73.2% for quality-only reinforcement learning, with median reasoning length of 14 versus 62 tokens.
caveats:
  - The exposure shares and user coverage describe the query path in a serving snapshot. A randomized business lift for this version was not reported.
  - The latency comparison combines the decoding policy, model compression and optimized runtime. The benchmark covers query serving.
  - The offline teacher comparison uses a frozen evaluator and a common training horizon. It is a separate measurement from mobile serving.
unknown_fields:
  - Snapshot period and experimental traffic allocation
  - Mobile accelerator model and production throughput
  - Latency for the entire feed request and energy consumption
