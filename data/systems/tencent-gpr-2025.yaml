tldr: "One generative model replaces Weixin Channels ads' retrieval, pre-rank and rank cascade, using multi-level semantic IDs; five online launches each lifted GMV, with +2.11% for v0.1."
summary: 'Generative Pre-trained Recommender: a one-model generative framework for advertising recommendation that replaces the retrieval-pre-rank-rank
  cascade. It uses a unified U/O/E/I token schema with multi-level semantic IDs (RQ-Kmeans+), a Heterogeneous Hierarchical Decoder made of a user-intent decoder and an ad-generation decoder, and multi-stage training with Multi-Token Prediction, Value-Aware Fine-Tuning and HEPO. Reported as fully
  deployed in the Tencent Weixin Channels advertising system.'
