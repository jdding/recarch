- semantic-id
- rl-alignment
stages:
- stage: single-stage
  model_family: 'GPR: unified generative model that outputs top-K ads with values directly; U-Token (user), O-Token (organic), E-Token
    (environment), I-Token (item) sequences; dual-decoder HHD'
  details: 'Offline architecture study (Table 2, relative to HSTU decoder-only 18.98): OneRec-style encoder-decoder +4.6%; hybrid attention
    +8.3%; token-aware FFN +15.8%; full GPR 27.32 = +43.9%. Alignment study per Table 3: MTP base avg final_value 0.3868; +VAFT 0.3925;
    +DPO 0.4383; +HEPO 0.4413 (simulated environment).'
id_tokenization:
  approach: Multi-level Semantic IDs for ads and organic content
  details: null
features_signals:
- Unified input schema
training:
  mode: 'Multi-stage: pre-training with Multi-Token Prediction, Value-Aware Fine-Tuning, then post-training with DPO / HEPO (Hierarchy
    Enhanced Policy Optimization)'
  objectives:
  - Next/multi-token item prediction over semantic IDs
  - Value-aligned (eCPM-oriented) fine-tuning
  - Policy optimization against a simulation environment
  notes: Offline experiments use a large Tencent advertising dataset; one year of anonymized interactions for training and the next
    calendar day for validation.
