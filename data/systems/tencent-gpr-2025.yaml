results_reported: 'Five sequential online A/B launches against the mature cascade, GMV (primary KPI) lifts: v0.1 HSD+NTP+DPO +2.11%;
  v0.2 +HEPO w/o ARR +0.70%; v0.3 +MTP+Thinking +0.63%; v0.4 +PTD +0.71%; v0.5 +HEPO w/ ARR +0.58%, as incremental changes; the abstract only says significant GMV and CTCVR gains. Table 5 gives stratified GMV/CTR/CVR/CTCVR by user group and new vs non-new ads.'
caveats:
- Table 4 has additional columns (GMV-Normal, Costs); the mapping of numbers to columns was read from extracted text and should be confirmed
  in the PDF before quoting beyond GMV.
- Offline final_value comes from the authors' simulation environment, not live traffic.
- Per-version lifts are incremental launches and are not summed in this card.
- Online traffic share and duration not stated in the sections read.
