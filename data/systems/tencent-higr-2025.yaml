results_reported: 'On the industrial dataset, HiGR-100M reaches Impressions hit@5 0.3163 and recall@5 0.0760 and Effective View hit@5 0.2145, recall@5 0.0495 and NDCG@5 0.0831. HiGR-25M scores 0.2825 and 0.0692, with Effective View hit@5 0.1945, against 0.2438 and 0.0577 for OneRec-25M, 0.2281 and 0.0506 for HSTU and 0.1812 and 0.0383 for TIGER. In SID quality, prefix-contrastive variants lower collision to 0.0264, 0.0237 and 0.0873 and raise consistency to 0.6205, 0.6647 and 0.6932, against 0.2126 and 0.4533 for RQ-Kmeans and 0.0298 and 0.5577 for RQ-VAE. Intra-list diversity is 0.38 for TIGER, 0.42 for HSTU, 0.48 for OneRec, 0.52 for HiGR without alignment, 0.57 with DPO and 0.62 with ORPO. In the layer-allocation ablation, a 14 to 2 layer split gives NDCG@5 0.0631 at the reference latency, a 15 to 1 split gives 0.0623 at 0.932 times, and 8 to 8 gives 0.0605 at 2.065 times. Without KV caching, HiGR has over 5% higher Recall@5 than OneRec-Beam at more than 5 times the speed. In a 5% live-traffic A/B against the incumbent multi-stage system, Average Stay Time is +1.03%, Watch Time +1.22%, Video Views +1.73% and Request Count +1.57%.'
caveats:
- 'The arXiv v5 read is a CIKM-template preprint with placeholder DOI and copyright text, and its title differs from the first version; the final CIKM 2026 text was not read.'
- 'The online comparison is against an incumbent multi-stage system that the paper does not describe, so the lift cannot be attributed to the slate decoder alone.'
- 'Online results are relative percentage changes with no confidence intervals or significance tests, and the A/B duration is not given.'
- 'The offline comparison with OneRec uses models that the authors trained under identical settings, and the main table is on an internal industrial dataset.'
- 'No official code was found.'
