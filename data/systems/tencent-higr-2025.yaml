tldr: "Tencent's HiGR generates a slate with a coarse planner and a shared item decoder, aligned by ORPO; a 5% live-traffic A/B gives Watch Time +1.22% and Video Views +1.73%."
summary: 'HiGR is a generative slate recommender that produces a list of items as one structured output, in three stages. PCRQ-VAE tokenizes each item into a 3-layer semantic ID with a codebook size of 1024, using global quantization plus a prefix-level contrastive loss over the first D-1 layers, so that items sharing a SID prefix are semantically close. The Hierarchical Slate Decoder splits generation into a coarse planner and a fine item generator. The planner, with 14 layers, produces one preference embedding for each slate position and is regularized by an intra-list diversity term. A shared lightweight item generator, with 2 layers, then decodes the SID tokens of each item from its slate-position embedding. The model uses d_model 512 and d_ffn 2048. Post-training is a listwise ORPO alignment with a combined loss weighted by alpha 0.1, optimizing ranking fidelity, genuine interest and diversity without a reference model. Pretraining uses 1 billion samples and post-training 3% of them. In deployment, an online feature assembler fetches real-time user features, HiGR generates slate SIDs with KV caching, an SID-to-item index maps them back to items, and deduplication, availability, safety and business-rule filters run before results are returned. Exposure and feedback logs flow back for continuous updates.'
paradigms:
- generative-retrieval
- semantic-id
- rl-alignment
stages:
- stage: single-stage
  model_family: 'Hierarchical Slate Decoder with a 14-layer slate planner and a shared 2-layer item generator, d_model 512 and d_ffn 2048, over PCRQ-VAE semantic IDs'
  details: 'The slate planner outputs one embedding per slate position, and the item generator decodes the 3 SID tokens of each item. Generated SIDs are mapped to items and passed through deduplication, availability, safety and business-rule filters. The online test compares this against the incumbent multi-stage system.'
id_tokenization:
  approach: 'PCRQ-VAE, a residual quantized VAE with 3 layers and a codebook size of 1024, trained with prefix-level contrastive alignment'
  details: 'Global quantization is combined with an InfoNCE-style contrast over the first D-1 layers so that items sharing a prefix are close. The paper reports lower collision and higher consistency than RQ-Kmeans and RQ-VAE.'
features_signals:
- 'Real-time user features assembled online for each request'
- 'User behavior history for the slate decoder context'
- 'Exposure and Effective View logs from the Tencent commercial media platform'
training:
  mode: Three-stage training, PCRQ-VAE, Hierarchical Slate Decoder pretraining and ORPO alignment, with continuous updates from exposure and feedback logs
  objectives:
  - 'Autoregressive generation loss over SID tokens with an intra-list diversity regularizer on the slate planner'
  - 'Listwise ORPO post-training loss with alpha 0.1 over three objectives: ranking fidelity, genuine interest and diversity'
  notes: 'Pretraining uses 1 billion samples and post-training 3% of them, selected as higher-quality slates. Training runs on clusters with tens of NVIDIA H20 GPUs.'
serving_infra: 'Serving runs on clusters with tens of NVIDIA L20 GPUs. For each request an online feature assembler fetches real-time user features, the decoder generates slate SIDs by coarse-to-fine decoding with KV caching, and an SID-to-item index maps them back to items before deduplication, availability, safety and business-rule filters. Exposure and feedback logs return for continuous updates. At the same throughput as OneRec, P99 latency stays below 50 ms and GPU demand drops by about 60%.'
