id: tencent-hit-2025
name: HIT
company: Tencent
surface: Pre-ranking in Tencent display advertising
year: 2025
era: deep
era_reason: HIT scores user-ad pairs with a two-tower model. The training losses teach each tower to approximate cross features while preserving independent serving.
first_public: '2025-05'
venue: CIKM 2025 Applied Research
venue_year: 2025
published_version_checked: false
primary_source: https://doi.org/10.1145/3746252.3761501
added_on: '2026-11-25'
last_verified: '2026-11-26'
updates:
- date: '2026-11-26'
  note: Moved the GMV discrepancy next to the result table and clarified the scope of the service benchmark.
system_type: ads
evidence_level: production_described
tldr: Tencent uses learned cross-feature approximations and multi-head similarity in a cacheable two-tower ad pre-ranker. A five-day test against MVKE lifted GMV by 1.66% and ROI by 1.55%.
summary: HIT pre-ranks ads in Tencent's display advertising system. During training, the two towers learn to recover a representation of coarse user-ad interactions from the static features of either side. Each tower also projects its embedding into multiple subspaces for finer matching. At serving time, the towers can compute representations independently before matching them. The pre-ranker sends several hundred ads for each user to downstream modules.
paradigms: [two-tower]
stages:
- stage: pre-rank
  model_family: Interaction-enhanced two-tower scoring
  details: Train each tower to approximate cross interactions from static features, then match user and ad embeddings in multiple learned subspaces before downstream ranking.
id_tokenization:
  approach: Learned user and ad feature embeddings
  details: The towers map float and embedded categorical features into vectors for similarity scoring.
features_signals:
- Static user and ad features
- Representations learned from coarse user-ad cross interactions
training:
  mode: Supervised learning on user-ad relevance with auxiliary interaction-vector alignment
  objectives:
  - Relevance prediction
  - Cosine similarity between predicted vectors and the coarse interaction representation
  notes: The auxiliary training objective teaches both towers to retain information from cross interactions.
serving_infra: User and ad representation computation stays separable for caching. The pre-ranker forwards selected ads to the existing downstream pipeline.
scale:
- metric: Training data reported for the online model
  value: Over 3.6 billion samples, over 1 billion users and 10 million candidate ads
  note: Section 5.5 gives training counts, separately from the test population.
results_reported: Table 4 reports GMV +1.66% and ROI +1.55% in a five-day online A/B against MVKE. The downstream pipeline was identical across arms. Figure 6 compares average model response time and success rate at the 35,000 QPS service threshold and reports overall efficiency close to a vanilla two-tower model.
caveats:
- Figure 6 uses 35,000 QPS as the benchmark threshold. The paper gives no measured production traffic volume for HIT.
unknown_fields:
- Experiment traffic split and sample size
- Production latency, throughput, hardware and per-request cost
