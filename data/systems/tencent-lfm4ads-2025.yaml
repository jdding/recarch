results_reported: "Deployment, abstract and Sec 5.2: since Q4 2024, 10+ successful production launches across advertising scenarios including Weixin Moments and Channels; scenario GMV lifts of 2.16% and 1.18%, task-level pCTR, pCVR and pLTV lifts of 0.18%, 1.33% and 0.44%, an overall platform GMV lift of 2.45% and estimated annual revenue increases in the hundreds of millions of dollars. Online ablation, Table 1, online task AUC: baseline 0.8515; SUM with the same branch 0.8501; dual-branch SUM 0.8520 with a 0.79% GMV lift; LFM4Ads with linear fusion 0.8521, improving AUC by only 0.0001 over SUM; LFM4Ads without aggregation 0.8513; full LFM4Ads 0.8525, an additional 0.005 AUC gain over dual-branch SUM with a 1.35% GMV lift; the same-branch SUM, linear-fusion and no-aggregation variants were marked No Launch. The paper notes a 0.001 AUC lift is considered significant in industrial recommenders. Feature-level launches, Sec 5.2.1: Weixin Moments pCTR task GMV +0.42% and pCVR task GMV +2.53%; Weixin Channels matching GMV +0.70%; Search Ads matching +1.75%, DSP pCTR +0.76% and Internet Service pLTV +0.93%. Module-level launches, Sec 5.2.2: an overall GMV increase of 1.88%. Model-level usage, Sec 5.2.3: during a 5% online A/B test in Weixin Channels the GMV is neutral, while CTR and CTCTR are lifted by 1.83% and 3.34%, quick-slip is reduced by 0.36% and average dwell time is lifted by 1.66%. Scalability, Sec 5.1.2: 3 iterative versions, each upgrade growing model size by more than 3 times, main-task AUC improved by over 0.3% and downstream AUC by at least 0.05%. Cross-domain analysis, Sec 5.3.6: content-only LFM +0.031 AUC over baseline, ads-only +0.042, combined +0.052, outperforming single-domain approaches by 23%-68%. Feature importance, Sec 5.3.1: masking LFM embeddings cuts Weixin Moments pCTR by 2.54% and pCVR by 0.56%, while masking the second most important feature causes only a 0.61% AUC decline, 24% of the impact. Embedding stability, Sec 5.3.2: 76.0% of user embeddings have a 5-minute cosine similarity larger than 0.99 and 95.7% are larger than 0.95."
caveats:
- "The paper states that during the 5% online A/B test of model-level standalone retrieval the GMV was neutral, with improvements only in user experience metrics."
- "Table 1 marks the same-branch SUM, the linear-fusion variant and the no-aggregation variant as No Launch; only dual-branch SUM and full LFM4Ads were launched."
- "The paper notes a 0.001 AUC lift is considered significant in industrial recommenders, as context for the 0.005 gain over dual-branch SUM."
- "Figure 5 shows per-layer and per-dimension CR extraction results graphically; the text gives no numeric values per layer or per output dimension."
