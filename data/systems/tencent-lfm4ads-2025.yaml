results_reported: >-
  The revised author version reports a platform-wide 2.45% GMV lift across more than 10 launches since Q4 2024 (abstract and Sec. 5.4).
  Scenario GMV lifts were 2.16% in Moments and 1.18% in Channels. Table 2 reports feature-level GMV lifts of +0.42% for Moments pCTR,
  +2.53% for Moments pCVR, +0.70% for Channels matching, +1.75% for Search Ads matching, +0.76% for DSP pCTR and +0.93% for
  Internet Service pLTV. Module-level launches lifted GMV by 1.88%. For standalone retrieval in Weixin Channels, v2 reports GMV +1.17%,
  CTR +1.83%, CTCVR +3.34%, dwell time +1.66% and quick-slip −0.36%. The earlier author version reported neutral GMV for its 5% test.
  Table 3 reports Weixin Moments online ablations. AUC was 0.8515 without LFM features, 0.8520 with dual-branch SUM and 0.8525 with
  full LFM4Ads. Full LFM4Ads improved AUC by 0.0005 over dual-branch SUM. Relative to the baseline without LFM representations,
  GMV rose 0.79% with dual-branch SUM and 1.35% with the full model. On public KuaiRand-1K (Table 1), weighted AUC gains were 0.0025
  for feature gating over SUM, 0.0016 for module fine-tuning over Vanilla and 0.0189 for retrieval over TwoTower.
  Table 4 reports online ablations of upstream sequences, with AUC gains of 0.031 for content, 0.042 for ads and 0.052 for both.
caveats:
- The earlier author version reported neutral GMV for standalone retrieval in its 5% test. Version 2 reports +1.17% and gives no traffic share for that result.
- The platform-wide GMV number summarizes launches across multiple downstream tasks. No common experiment window or platform-level control is specified.
unknown_fields:
- Experiment duration and traffic allocation for the v2 standalone retrieval result
- Traffic share of the Table 3 online ablation
- Training hardware and training compute
- Serving latency
