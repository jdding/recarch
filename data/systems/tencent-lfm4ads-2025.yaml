id: tencent-lfm4ads-2025
name: LFM4Ads
company: Tencent
surface: Representation supply for Tencent advertising ranking and retrieval across Weixin Moments, Channels, Search Ads, DSP and Internet Service
year: 2025
era: deep
era_reason: "A scaled discriminative triple-tower ranking model whose foundation-model scale feeds representation transfer; no autoregressive recommendation and no semantic IDs."
first_public: "2025-08"
venue: "CIKM 2026"
venue_year: 2026
published_version_checked: false
primary_source: "https://doi.org/10.1145/3799682.3840163"
added_on: "2026-11-03"
last_verified: "2026-11-03"
updates: []
system_type: ads
evidence_level: production_described
tldr: "Tencent's 4TB ads foundation model transfers user, item and cross representations to downstream ranking and retrieval; 10+ launches since Q4 2024 with a 2.45% overall GMV lift."
summary: "LFM4Ads is Tencent's production foundation model for ads recommendation that transfers all three available representations, user representations, item representations and user-item cross representations, into downstream tasks at three granularities: as features through non-linear interaction, as modules through an Isomorphic Interaction Module, and as standalone retrieval models. The model trains on tens of billions of daily samples, 80% from the content domain and 20% from the ad domain, holds 4TB of parameters with 6.3B sparse features across approximately 1,800 features, and since Q4 2024 has powered 10+ launches across Weixin Moments, Channels, Search Ads, DSP and Internet Service with an overall GMV lift of 2.45%."
paradigms:
- foundation-model
- dlrm
- embedding-based-retrieval
stages:
- stage: rank
  model_family: "Triple-tower embedding and DNN foundation model, with a user tower, an item tower and a dual-branch mix tower holding content and ad branches"
  details: "URs from the user tower and IRs from the item tower are shared across both branches; CRs are extracted from the ad branch's mix tower at the penultimate MLP layer, the layer the paper finds optimal, and aggregated to user-level and item-level form with a time-decayed exponential moving average. Downstream rankers consume the representations through gated non-linear feature interaction or through the Isomorphic Interaction Module, a downstream-trained replica of the mix-tower structure concatenated with DCN-V2 experts."
- stage: retrieval
  model_family: "Standalone dual-adapter retrieval model built on LFM4Ads URs and IRs"
  details: "Two adapters project UR and IR into a shared space and score by cosine similarity with an InfoNCE objective; this model-level usage was deployed in Weixin Channels matching during a 5% online A/B test."
id_tokenization:
  approach: "Raw sparse ID embeddings, no semantic IDs"
  details: "The model carries 6.3B sparse features across approximately 1,800 features. 87% of user features are multi-value, including around 50 behavior sequences, which flatten to more than 60,000 values per sample on average. Content behavior sequences cover a 4-month window and ad sequences cover the last 2 years, each with a maximum length of 2,000."
features_signals:
- "User multi-value features, 87% multi-value with around 50 behavior sequences"
- "Content-domain behavior sequences over 4 months covering likes, comments, shares and plays, maximum length 2,000"
- "Ad-domain behavior sequences over the last 2 years covering clicks, likes and conversions, maximum length 2,000"
- "Item features enriched by a separately trained 7-billion-parameter multimodal LLM that generates abstracts and commercial tags"
- "Content and ad domain samples at 80% and 20% of the daily mix, with scenario and task labels for the dual-branch mix tower"
training:
  mode: "Offline pretraining on tens of billions of daily samples with periodic transfer of representations into downstream tasks; the online system updates LFM4Ads and downstream models on labels and refreshes content-stream representations on an irregular cadence"
  objectives:
  - "CTR-style prediction on the dual-branch mix tower with separate content and ad branches sharing the user and item towers"
  - "InfoNCE contrastive objective for the standalone retrieval adapters"
  notes: "The 7-billion-parameter multimodal LLM used for item feature enrichment was trained with dual-objective contrastive learning and listwise ranking. Training hardware and training compute are not reported."
serving_infra: "An online system, shown in Fig. 4, transfers UR, IR and CR representations to downstream tasks through an update loop, monitors representation health on mean, variance, L1 norm and extreme values, halts on threshold breach and rolls back from daily snapshots. The LEE evaluation framework shortens downstream validation from over 1 week to mere hours. Serving is stated at 500K QPS with 1.45B FLOPS."
