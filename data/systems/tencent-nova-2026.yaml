tldr: NOVA checks that an architecture implements the intended design before training. It uses recorded failures to guide the next candidate and promotes an offline winner for online testing.
summary: NOVA reuses candidate outcomes, semantics checks and diagnostic history to propose coordinated edits to a production ranker. Verification progresses from architectural semantics to execution, offline metrics and online impact. Risk levels determine when an engineer must participate.
paradigms: [llm-based, multi-task]
stages:
  - stage: other
    model_family: Architecture search with staged verification
    details: The agent inspects interface and architecture constraints before local execution and full training. A record of rejected edits informs the next search round.
  - stage: rank
    model_family: Multi-task advertising conversion ranker
    details: The production candidate adapts TokenMixer-Large to the existing conversion-prediction ranker.
id_tokenization: {approach: null, details: null}
features_signals:
  - Model code, structural requirements and candidate change records
  - Local verification diagnostics and offline AUC
training:
  mode: Multi-round model edits with fixed trial budgets and staged verification
  objectives:
    - Catch executable changes that violate model semantics before training.
    - Use production A/B to verify the best eligible offline candidate.
  notes: Higher-risk tasks remain under engineer review. The online result refers to a literature-to-production candidate.
serving_infra: The search and verification run outside the request path. The selected transfer candidate was compared with the live model on production advertising requests.
scale:
  - {metric: Online experiment coverage, value: '5% of production traffic for 6 days', note: Section 5.7 specifies user-level randomization.}
results_reported: Section 5.7 and Table 4 of the July revision report a 6-day user-randomized A/B on 5% of production traffic. The selected candidate showed GMV gains of +1.25%, +1.70% and +2.02% on pCVR objectives 1, 2 and 3, with absolute pCVR bias changing −58.8%, −66.7% and −37.3% respectively.
caveats:
  - The three pairs of metrics are reported separately for different objectives. No pooled GMV effect is given.
  - The A/B tests the selected ranker change. The agent comparisons and verification analysis use separate experiments.
  - The authors planned full rollout of this ranker variant after the test. The paper reports use of NOVA in production and completion of the A/B.
unknown_fields:
  - Per-arm split within the selected traffic and whether full rollout was completed
  - Names of the three objectives, absolute serving latency, throughput and request cost
