tldr: "Tencent's TGR report covers generative ranking, SID retrieval and slate generation in production: CCFormer video CTR +3.57%, BARGE retrieval CTR +0.60%, HiGR watch time +1.22%. Preprint only."
summary: 'TGR is the Tencent PCG generative recommendation stack, described in a technical report by the TGR Team. TGR-GenRank is CCFormer, a ranker with unified feature tokenization, feature-field separated cross attention, subspace token mixing and hierarchical sequence compression that still outputs per-item multi-task scores, so it drops into the existing cascade. TGR-GenRec has two generation paradigms. BARGE generates semantic-ID paths with beam search and uses them as an embedding query in a retrieval channel. HiGR generates a whole slate with a planner and an item generator over prefix-structured semantic IDs, aligned by listwise preference optimization. TGR-Reason runs an offline LLM Think model that writes reason tokens as semantic IDs, which prompt the online decoder without a request-time reasoning rollout.'
paradigms:
- semantic-id
- generative-retrieval
- sequential-transformer
- llm-based
- foundation-model
stages:
- stage: rank
  model_family: 'CCFormer, a scalable Transformer ranker with feature-field separated cross attention and subspace token mixing'
  details: 'Replaces a production DLRM ranker in one video scenario and a deployed HSTU ranker in four others, while keeping per-item multi-task scores.'
- stage: retrieval
  model_family: 'BARGE, hierarchical semantic-ID generation with dual-path decoding'
  details: 'Beam search generates 50 semantic-ID sequences per request; each retrieves 10 items through approximate nearest neighbor search, up to 500 candidates, for the downstream cascade.'
- stage: re-rank
  model_family: 'HiGR, whole-slate generation with a slate planner and item generator'
  details: 'Emits the result list as one structured object. P99 latency stays below 50 ms at about 60% lower GPU demand than full-sequence decoding.'
id_tokenization:
  approach: 'Hierarchical semantic IDs, with OSQ-VAE for BARGE and prefix-contrastive RQ-VAE for HiGR'
  details: 'Two tokenizer families are used by the two generation models; the reasoning model writes complete semantic IDs as reason tokens.'
features_signals:
- User, item, context and sequence features tokenized into one stream for CCFormer
- Long behavior sequences compressed hierarchically
- Multimodal item content for semantic-ID tokenizers
training:
  mode: 'Offline training on Tencent production logs with the Numerous-Torch infrastructure'
  objectives:
  - 'Multi-task CTR and engagement scores for the ranker'
  - 'Next-token prediction with symmetric InfoNCE for BARGE'
  - 'Next-token prediction plus ORPO listwise alignment for HiGR'
  - 'LatentRec latent multi-step supervision for the Think model'
  notes: 'BARGE was trained on two NVIDIA H20 GPUs. The CCFormer production dataset has 4 billion samples.'
serving_infra: 'Numerous-Torch training and serving stack. BARGE adds no parameters, beam width or latency to its channel. HiGR uses KV caching and keeps P99 latency below 50 ms.'
