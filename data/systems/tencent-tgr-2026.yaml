results_reported: 'CCFormer was A/B-tested in five scenarios over two weeks, all lifts significant at p < 0.05. In the video scenario it replaced a long-standing DLRM and gained CTR +3.57%, page view +3.86%, watch time +1.29% and unique viewers +2.61%; in the advertising-ranking scenario it replaced HSTU and gained advertising revenue +1.71%. Both were then fully launched. It also trains 2.21x faster than HSTU at about half the GFLOPs. BARGE ran on 6% of traffic for two weeks against the multi-stage incumbent: CTR +0.60%, unique clicking users +1.34% and total reading time +1.70%, then was fully rolled out as a retrieval channel. Offline it beats OneRec by 10.2-16.9% in Hit@5. HiGR lifted average watch time +1.22% and average video views +1.73% in one scenario on 5% of traffic, and CTR +0.68% with advertising revenue +0.56% in another. TGR-Reason raised cold-start new-user Hit@1 from 0.0451 to 0.2606, +477.8%, and online gained Effective Consumption Rate +1.75% and new-user Exposure-to-Conversion Rate +13.09%.'
caveats:
- 'This is an arXiv technical report with no peer-reviewed venue; HiGR and the Think model are also reported as separate papers, with HiGR first posted in December 2025.'
- 'The online control differs by component: a DLRM, a deployed HSTU, a multi-stage cascade or the incumbent production generator.'
- 'Only CCFormer in two scenarios and BARGE are stated as fully launched; the rollout status of HiGR and TGR-Reason is not given in the same terms.'
- 'The stack is a set of coupled models, not one model, and cold-start items remain limited by tokenizer quality.'
- 'The report gives A/B traffic shares for BARGE and one HiGR scenario only.'
