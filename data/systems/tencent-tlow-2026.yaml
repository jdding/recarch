results_reported: "Online pathway comparison, Table 6: in single-domain the Tlow pathway shows CTR +4.79% and UCTR +10.32%, and on new items CTR +8.46% with UCTR +11.64%; in the cross-domain scenario CTR +6.23% and UCTR +7.20%, and on new items CTR +9.09% with UCTR +9.45%. Core A/B metrics beyond pathway comparison: in single-domain, 24-hour overall CTR +0.78% and newly-published-picture CTR +1.94%; in cross-domain, per-capita picture CTR +1.05% with a 1.15% decrease in top-tier accounts' exposure share, which the paper reads as long-tail benefit. The abstract summarizes global CTR +10.32% and new-item +11.64% for the retrieval model based on token IDs. Offline, four public datasets show tokenization and codebook guidance significantly improving recommendation performance, with cross-domain and multimodal evaluations confirming the benefit in a simplified embedding space."
caveats:
- "The paper reports only relative differences for online metric comparisons due to privacy considerations."
