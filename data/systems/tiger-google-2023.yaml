evidence_level: research_only
tldr: "Items get Semantic IDs via RQ-VAE and a Transformer decodes the next item's ID, replacing embedding-table ANN retrieval; helps cold-start items on public datasets."
summary: >-
  TIGER, the Transformer Index for GEnerative Recommenders, gives items Semantic IDs by quantizing content embeddings with RQ-VAE; a Transformer sequence-to-sequence model autoregressively
  decodes the next item's Semantic ID, replacing embedding-table ANN retrieval.
paradigms: [generative-retrieval, semantic-id, sequential-transformer]
stages:
  - stage: retrieval
    model_family: T5X encoder-decoder (4+4 layers, ~13M parameters) generating Semantic ID tuples with beam search
    details: Item content -> Sentence-T5 768-d embedding -> RQ-VAE with 3 levels of 256 codewords plus a collision-handling token.
id_tokenization:
  approach: RQ-VAE Semantic IDs
  details: Encoder 512-256-128, latent 32; 3 levels x codebook 256 plus a 4th token to disambiguate collisions; 2000 hashed user-ID tokens.
features_signals: [Item content text embeddings, User interaction sequence]
training: {mode: Offline, objectives: [Next Semantic-ID prediction], notes: Evaluated on Amazon Beauty / Sports / Toys datasets.}
serving_infra: Paper notes inference is costlier than ANN lookup.
scale: []
results_reported: Paper claims improved recall/NDCG over baselines on public datasets and benefits for cold-start items and diversity.
caveats: [Not described as deployed in a Google product.]
unknown_fields: [production deployment]
