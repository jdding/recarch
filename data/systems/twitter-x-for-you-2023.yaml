tldr: "Open-sourced For You pipeline of candidate sources from the search index, graph, SimClusters and TwHIN, then a neural heavy ranker, filters and mixing with ads."
summary: >-
  Open-sourced pipeline: multiple candidate sources, namely the in-network search index, graph traversal, SimClusters and TwHIN embeddings, and follow recommendations, then feature hydration, neural heavy ranker, then filters and heuristics and mixing with ads and other modules.
paradigms: [embedding-based-retrieval, multi-task, dlrm]
stages:
  - stage: retrieval
    model_family: In-network Earlybird search index + UTEG graph traversal + tweet-mixer (SimClusters / TwHIN embeddings) + follow recommendations
    details: Home-mixer README lists candidate sources; the repo says ~50% of posts come from the in-network search index. Engineering blog (via press coverage) says ~1,500 candidates are extracted.
  - stage: pre-rank
    model_family: Light ranker used by Earlybird search index
    details: Ranks in-network posts inside the search index.
  - stage: rank
    model_family: Heavy ranker - parallel MaskNet producing probabilities for several engagement types
    details: Home-mixer README says ~6000 features are hydrated for ranking; blog (via TechCrunch) says ~48M-parameter network continuously trained on interactions.
  - stage: re-rank
    model_family: Heuristics and filters for author diversity, content balance, feedback fatigue, dedup and visibility filtering, and mixing with ads / who-to-follow
    details: See home-mixer README.
id_tokenization: {approach: "Sparse community embeddings from SimClusters and dense knowledge-graph embeddings from TwHIN", details: null}
features_signals: [Unified user actions stream, Explicit and implicit user signals, Real-graph interaction predictions, ~6000 ranking features]
training: {mode: "Heavy ranker described as continuously trained (per blog quote)", objectives: [Multiple engagement probabilities], notes: null}
serving_infra: Product Mixer (Scala) framework, Navi model serving in Rust, home-mixer service.
