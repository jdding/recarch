id: wide-and-deep-google-play-2016
name: "Wide & Deep Learning"
company: Google
surface: Google Play app recommendations
year: 2016
era: deep
era_reason: "Joint wide linear and deep network"
first_public: "2016-06"
venue: "DLRS @ RecSys 2016 (workshop)"
venue_year: 2016
published_version_checked: false
primary_source: "https://doi.org/10.1145/2988450.2988454"
added_on: "2026-10-29"
last_verified: "2026-10-30"
system_type: recommendation
evidence_level: production_described
tldr: "Jointly trains a wide linear model for memorization and a deep network for generalization on Google Play; online A/B: acquisitions +3.9% vs +2.9% for deep only."
summary: 'Wide & Deep, from DLRS 2016, jointly trains a wide linear model on cross-product features for memorization with a feed-forward network on embeddings for generalization to rank apps on the Google Play store. Productionized; open-sourced in TensorFlow.'
paradigms:
- learning-to-rank
- dlrm
stages:
- stage: rank
  model_family: 'Wide & Deep: wide part = linear model with cross-product transformations (FTRL + L1); deep part = embeddings concatenated
    to roughly 1200 dimensions, 3 ReLU layers, logistic output (AdaGrad); jointly trained, not ensembled'
  details: Candidates come from a separate app retrieval system that narrows over a million apps to a short list; the ranker scores
    each candidate and sorts by score.
id_tokenization:
  approach: Sparse categorical features embedded into dense vectors
  details: null
features_signals:
- User, contextual and impression features (categorical and continuous)
training:
  mode: Offline training on over 500 billion examples, with a warm-start system that initializes a new model's embeddings and linear
    weights from the previous model
  objectives:
  - App acquisition (logistic)
  notes: Before loading into model servers, a dry run checks the model does not break live serving and quality is validated against
    the previous model.
serving_infra: Model servers receive app candidates from the retrieval system plus user features and run a forward pass. To serve a
  request on the order of 10 ms, scoring is split into smaller batches run with multithreading. At peak traffic the servers score over
  10 million apps per second; single-threaded scoring of all candidates in one batch took 31 ms, multithreading cut client-side latency
  to 14 ms including overhead per Table 2.
scale:
- metric: Google Play users
  value: over one billion active users
  note: paper
- metric: Apps
  value: over one million apps
  note: paper
- metric: Training examples
  value: over 500 billion
  note: paper
- metric: Peak scoring
  value: over 10 million apps per second
  note: paper
results_reported: '3-week A/B test with 1% of users per group on the main landing page of the app store. Table 1: Wide (control) offline
  AUC 0.726, online acquisition gain 0%; Deep 0.722, +2.9%; Wide & Deep 0.728, +3.9% (statistically significant vs control). Wide &
  Deep had +1% on top of deep-only. Paper notes the offline AUC gain is small while the online impact is larger.'
caveats:
- Control was a highly optimized wide-only logistic regression model with rich cross-product features.
- The paper offers a hypothesis (exploratory recommendations online) for why online gains exceed offline AUC gains; it is not tested
  in the paper.
unknown_fields:
- absolute acquisition rates
- exact feature list
- hardware used for serving
