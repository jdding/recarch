core_idea: A wide linear model on cross-product features memorizes, while a deep network on embeddings generalizes.
deployed_in: Google Play app recommendations, main landing page of the app store
scale_short: Over 1 billion active users, over 1 million apps, over 10 million apps scored per second at peak
key_result: Online app acquisition +3.9% for Wide and Deep over the wide-only control in a 3-week A/B on Google Play
results_table:
