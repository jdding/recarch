system_type: recommendation
evidence_level: open_source_reference
tldr: X assembles the For You feed from follower and outside-network sources. Phoenix retrieves by embedding similarity, then scores each candidate by predicted user actions.
summary: For You pulls posts from followed accounts via Thunder. Phoenix retrieves posts by embedding similarity, and SimClusters and popular-post sources contribute additional candidates. Phoenix scores candidates with a Transformer that prevents candidates from attending to each other. Home Mixer weights predicted actions, adjusts scores for authors and network membership, then reranks for diversity.
paradigms: [two-tower, sequential-transformer, multi-task, embedding-based-retrieval, semantic-id]
stages:
- stage: retrieval
  model_family: Phoenix two-tower and other candidate sources
  details: The retrieval checkpoint includes a post embedding index built by the candidate tower. Phoenix retrieves via dot products. Thunder, SimClusters and popular posts provide additional candidates.
- stage: rank
  model_family: Phoenix Transformer with candidate isolation
  details: Each candidate attends to user history and itself. A weighted sum of predicted actions feeds the score adjustments in Home Mixer.
- stage: re-rank
  model_family: VMRanker diversity reranking
  details: A determinantal point process reranks posts using their embeddings after candidate scores are computed.
id_tokenization:
  approach: Residual quantization of multimodal post embeddings
  details: Six levels of 256 codes provide post identity to retrieval and features to ranking, alongside hashed features.
features_signals:
- User interaction history
- Post semantic IDs, hashed post and author features
training:
  mode: Offline JAX training with separate retrieval and ranking models
  objectives:
  - Contrastive retrieval with favorites as the positive signal
  - Supervised prediction for multiple actions per candidate post
  notes: Retrieval and ranking have separate training pipelines and checkpoints.
serving_infra: Rust Home Mixer coordinates candidate sources and gRPC inference. Phoenix serves the JAX models and loads its retrieval index from the checkpoint.
scale:
- metric: Post representation
  value: 6 residual levels with 256 codes each
  note: Phoenix README, retrieval and ranking configurations.
results_reported: The open repository documents the production design and ongoing experiments. It reports no measured lift for the feed.
caveats:
- Production checkpoints and data are outside the release. The repository documents a separate synthetic example for running the pipeline locally.
- Architecture details refer to the pinned November 2026 snapshot, which is newer than the first Phoenix release.
unknown_fields:
