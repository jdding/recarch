- metric: Encoder size, largest tested
  value: 1.007B parameters (L20 H2048), not tested online
  note: paper, Table 3
- metric: Context length, deployed
  value: 8192 events
  note: paper, Table 6
- metric: Training interactions
  value: over 300B
  note: paper, Sec 4.1.1
results_reported: 'Online A/B on the music platform, ARGUS (Offline V4, context 8192, 126.0M encoder) against the existing production stack: total listening time +2.26% and like likelihood +6.37%; the paper calls these the strongest transformer-driven online gains to date. Earlier deployments gave +0.52% and +1.11% for V1, +1.00% and +0.73% for V2, +0.73% and +5.00% for V3, and +0.32% and +1.38% for the Real-time V1, each measured against the previous deployments. Offline scaling, as pair accuracy uplift over the production ranker when used as a feature: 3.2M parameters +1.35%, 18.9M +1.82%, 126.0M +2.32%, 1.007B +2.66%, and a 176.0M HSTU encoder +2.34%. Standalone, the 1.007B model is -4.78% against the production ranker. Next-item entropy falls by 10.36% from the smallest to the largest model. Fine-tuning context length 512, 2048 and 8192 gives +1.01%, +2.32% and +2.77%. Without pre-training, one year of fine-tuning gives +1.17%, and with pre-training one week of fine-tuning gives +0.63% against +2.32% for one year.'
caveats:
- 'The online A/B has no stated duration, traffic share or user count, and the paper does not report absolute values of total listening time or like likelihood.'
- 'Gains in Table 6 are measured against the existing production stack at each step and the paper says they are cumulative, so the ARGUS row is not an isolated comparison against a no-transformer baseline.'
- 'The largest 1.007B encoder was not tested online because of the cost of large-scale online experiments; the deployed encoder has 126.0M parameters.'
- 'Offline, ARGUS alone is below the production ranker, for example -5.33% for the 126.0M encoder, and helps only as an extra feature; the paper explains that it runs offline with a 24-hour lag and sees only user history.'
- 'The platform is described only as a large-scale music streaming platform; the card names Yandex Music from the acknowledgments, which thank the Yandex Music Recommendations team.'
- 'The authors have left Yandex, per the footnote; the paper says the same architecture was also applied to an e-commerce marketplace, grocery delivery and advertising, without numbers.'
