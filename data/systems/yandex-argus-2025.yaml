tldr: "Yandex's ARGUS pre-trains a transformer on user histories, then fine-tunes it into a daily ranker feature; online it adds +2.26% total listening time and +6.37% like likelihood."
summary: 'ARGUS, AutoRegressive Generative User Sequential framework, trains a large transformer on user histories of context, item and feedback events. Pre-training has two objectives: next-item prediction with a logQ-corrected sampled softmax over 8192 in-batch and 8192 uniform negatives, which imitates the logging policy and organic navigation, and feedback prediction as multi-output classification, which models user preferences. A simplified version merges each context-item-feedback triplet into one interaction embedding. Fine-tuning then turns the encoder into an impression-aware, one-pass, two-tower ranker: one causal pass over the history produces user states, impressions are matched to states with a simulated 24-hour data delay, and a pairwise logistic loss is applied to dot-product scores. User embeddings are computed once per day offline and stored in a key-value system, and the score is used as an extra feature of the production gradient-boosted ranker. The paper scales the encoder from 3.2M to 1.007B parameters and deploys a 126.0M encoder with context length 8192 on a music streaming platform.'
paradigms:
- sequential-transformer
- foundation-model
- two-tower
- multi-task
stages:
- stage: rank
  model_family: 'Transformer encoder (L10 H1024, 126.0M parameters in production) pre-trained on next-item and feedback prediction, fine-tuned into a two-tower scorer whose output is a feature of the production ranker'
  details: 'The production ranker is a gradient-boosted decision tree ensemble trained with a pairwise logistic loss on one thousand features, including outputs of earlier transformer two-tower models. The ARGUS score is added to it as a feature. User embeddings are refreshed daily and scored with a dot product, which the paper says is much cheaper than real-time target-aware schemes.'
id_tokenization:
  approach: 'None; items use a unified ID embedding plus item features'
  details: 'A 3-way lookup for item ID into a shared matrix of 130M parameters (512k embeddings of size 256), not counted in encoder size. The paper says the ItemID feature can be omitted and item embeddings built from content and metadata features.'
features_signals:
- 'User history of context, item and feedback events, with the surface, device and recommendation settings as context'
- 'Item features including ItemID and ArtistID'
- 'Implicit feedback such as listening duration and skips, and explicit likes'
training:
  mode: Offline pre-training on user histories, then offline fine-tuning for ranking
  objectives:
  - 'Next-item prediction with logQ-corrected sampled softmax and mixed negative sampling over 8192 in-batch and 8192 uniform negatives'
  - 'Feedback prediction as multi-task cross-entropy over consumption and engagement signals'
  - 'Fine-tuning with a pairwise logistic loss over temporally adjacent impressions with different feedback'
  notes: 'The dataset samples one year of activity of tens of millions of users and holds over 300B user-item interactions. Training used PyTorch with DDP on 64–256 A100 80GB GPUs for 1 day to 1 week depending on model size, for a single epoch. Sequence length is 512 for pre-training and 2048 for fine-tuning in the scaling study, and 8192 for the deployed model.'
serving_infra: 'Offline: user embeddings are computed once per day in batch and stored in a key-value system, and impressions are scored with a dot product. The paper also integrated a smaller real-time variant directly into the production ranker after the initial submission.'
scale:
- metric: Encoder size, deployed
  value: 126.0M parameters (L10 H1024)
