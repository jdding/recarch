tldr: "REINFORCE policy-gradient candidate generator with off-policy and top-K correction; live A/B shows ViewTime gains, +0.07% for the stochastic-policy bucket."
summary: 'WSDM 2019 paper from YouTube at Google: a REINFORCE policy-gradient candidate generator for a recommendation action space of
  millions of items. It adds an off-policy correction using a learned model of the logging policy, also called the behavior policy, a top-K correction for
  recommending a set of K items, and variance reduction by weight capping. Reported as running in the live YouTube production system,
  with live A/B experiments.'
paradigms:
- rl-alignment
stages:
- stage: retrieval
  model_family: RNN (Chaos Free RNN cell) user-state model with a softmax policy head over millions of items, trained with REINFORCE
    and a separate behavior-policy head with blocked gradient; approximate nearest-neighbor lookup of the top M items to normalize the
    softmax
  details: The model is one of many candidate generators; its output is scored and ranked by a separate ranking model before showing
    on the YouTube Homepage or the watch-page side panel. Long-term reward aggregated over a 4-10 hour horizon.
id_tokenization:
  approach: null
  details: null
features_signals:
- Logged implicit feedback (clicks, dwell time)
training:
  mode: Continuous training on logged feedback collected with a periodicity of several hours, with many parameter updates before a new
    policy is deployed; new events used as training data with a lag under 24 hours
  objectives:
  - Policy-gradient reward from user activities, with zero reward for non-clicked recommendations
  - Behavior-policy estimation head that is separate, with gradient blocked into the user state
  notes: Off-policy-correction weight pi/beta, top-K multiplier lambda_K, weight capping c = e^3 in production (c = e^5 tested), K =
    16 in production. At serving time exploration is done by returning the top K' most probable items and sampling the remaining K -
    K' from the rest of the top M.
serving_infra: Candidate generation uses efficient approximate nearest-neighbor lookup of the top M items from the softmax rather than
  a full softmax over millions of items.
scale:
- metric: Action space
  value: order of millions of items
  note: abstract
results_reported: 'Live A/B experiments on the production candidate generator (multi-day runs): stochastic policy with exploration data
  (buckets 90/5/5 of users, 5% on the stochastic policy) ViewTime +0.07% (statistically significant); standard off-policy correction
  showed no significant ViewTime change but +0.53% videos viewed; top-K off-policy correction (K = 16, cap e^3) ViewTime +0.85% with
  videos viewed -0.16%; K sweep over a 5-day run: K = 1 -0.66% ViewTime, K = 2 -0.35%, K = 32 similar to K = 16, K = 8 +0.15% in a follow-up;
  lifting the weight cap from e^3 to e^5 dropped ViewTime by 0.52%.'
caveats:
- Experiments were run sequentially, each building on the previously launched production model, so effects are per-component and not
  additive (the paper says this).
- Absolute reward definitions and scale (users, items, QPS) are not given.
- The +0.85% top-K gain is relative to the previous off-policy-corrected production model.
