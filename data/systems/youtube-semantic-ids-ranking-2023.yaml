id: youtube-semantic-ids-ranking-2023
name: YouTube Semantic IDs for ranking
company: Google / YouTube
surface: Ranking model for YouTube recommendations
year: 2023
era: generative
era_reason: "Semantic IDs as item tokenization in a ranker; borderline because the ranker is discriminative"
first_public: "2023-06"
venue: "RecSys 2024"
venue_year: 2024
published_version_checked: false
primary_source: "https://doi.org/10.1145/3640457.3688190"
added_on: "2026-10-29"
last_verified: "2026-10-30"
system_type: recommendation
evidence_level: research_only
tldr: "Replaces random-hashed video-ID embeddings in a YouTube ranker with content-derived RQ-VAE Semantic IDs, improving generalization on new and long-tail items."
summary: Replaces random-hashed video-ID embeddings in a YouTube ranking model with embeddings of content-derived Semantic IDs made by RQ-VAE over frozen content embeddings, adapted for ranking via n-gram or SentencePiece sub-pieces. Claims better generalization on
  new and long-tail items without losing overall quality.
paradigms:
- semantic-id
- dlrm
stages:
- stage: rank
  model_family: Production-scale YouTube video ranking model (CTR) with Semantic-ID-derived item features in place of random-hash video
    IDs; user history also expressed with SIDs
  details: 'Findings: directly feeding dense content embeddings in place of video IDs is worse than random hashing (reduced memorization);
    deeper models (1.5x-2x layers) partly recover. SPM over SID sequences beat hand-crafted N-grams.'
id_tokenization:
  approach: RQ-VAE residual quantization of frozen content embeddings into hierarchical Semantic IDs (originally from TIGER); then n-gram
    or SentencePiece sub-pieces mapped to embedding tables
  details: 'Table 1: videos sharing a SID prefix of length 1/2/3/4 have typical sub-trie sizes of 150,000-450,000 / 20-150 / 1-5 / 1
    videos, with aggregate metrics 0.41 / 0.68 / 0.91 / 0.97 (see paper for the metric definition).'
features_signals:
- Content embeddings
training:
  mode: 'Daily-snapshot style evaluation: train through day N, evaluate CTR AUC on day N+1 and a cold-start slice (items introduced
    on day N+1, ''CTR/1D'')'
  objectives:
  - CTR prediction
  notes: Paper states a 0.1% change in CTR AUC is significant for this ranking model. Baseline is random hashing with an 8K-row embedding
    table; with and without user-history features.
serving_infra: null
scale: []
results_reported: 'Percent improvements in CTR AUC and CTR/1D AUC relative to the 8K random-hashing baseline are shown in Figures 2-3
  (charts; exact values not extracted here). Text conclusion: Semantic IDs improve generalization on new and long-tail items without
  sacrificing overall quality; dense content-embedding inputs underperform the video-ID baseline; video-encoder replacement (VideoRec,
  Ni et al. 2023) is cited as costing 10-50x the ID baseline.'
caveats:
- This is a research paper evaluated on a YouTube ranking dataset; it does not state a production launch, so evidence stays research-level
  in this card.
- Exact AUC deltas are only in figures and are not reproduced.
- Gains are offline AUC metrics, not online A/B results.
unknown_fields:
