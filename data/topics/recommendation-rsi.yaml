title: Recursive self-improvement for recommenders
summary: How research agents allocate trials, verify model changes and use what they learn in the next round.
problem: Recommendation models are expensive to retrain, and online metrics arrive after the experiment. Each new round needs to build on evidence from the last.
question: Which agent-proposed changes deserve full training or live traffic?
framing:
  - A research agent may edit a loss, a sequence encoder or several components together. Record what changed, what it was compared with and whether the results guided the next trial.
  - The cases compare changes to models and training. Further reading covers evaluation benchmarks, training data and feedback alignment.
decisions:
  - when: Full training and live traffic are expensive.
    then: Use an affordable proxy to screen changes. Validate promoted candidates with full training and independent online metrics, then write both outcomes to the experiment record.
    cards: [youtube-self-evolving-recsys-2026]
  - when: Many directions compete for a finite trial budget.
    then: Define which changes the agent may make, then allocate repeat trials based on observed validation results. Compare the allocation policies within the same offline budget.
    cards: [kuaishou-recharness-2026]
  - when: Executable code can violate the intended architecture.
    then: Check model semantics before training. Record the violated interface or modeling rule so the next round can avoid repeating the failure.
    cards: [tencent-nova-2026]
  - when: A new edit can change the difficulty of the proxy evaluation.
    then: Hold the evaluation population and candidate set fixed for promotion. Verify the actual task in an independent test before advancing the model.
    cards: [google-recevolve-2026]
  - when: Several changes beat the current business baseline.
    then: Track the direct parent and the strongest compatible historical model as well. Use the business baseline for the launch decision and the lineage for the research decision.
    cards: [kuaishou-agentx]
members:
  - id: youtube-self-evolving-recsys-2026
    approach: Screen optimizer, architecture and reward changes offline, then train selected versions in full and use delayed online metrics to decide which changes advance.
  - id: kuaishou-recharness-2026
    approach: Allocate trials among expert-defined edit directions using a bandit. Test the resulting commerce sequence-encoder change in the live ad ranker.
  - id: tencent-nova-2026
    approach: Use structural checks and previous failures to guide architecture edits. Move an offline-selected production conversion ranker to A/B.
  - id: google-recevolve-2026
    approach: Have proposal, review and coding agents share a research record. Compare a selected dual-tower retriever with the live production baseline.
  - id: kuaishou-agentx
    approach: Keep each model change in a business sandbox with its production baseline, direct parent and accumulated evidence.
differences:
  - heading: Which earlier results steer the next trial
    text: RecHarness assigns the next trial to an edit direction using observed validation scores. NOVA converts semantic failures into constraints. AgentX preserves the ancestry of each model alongside its evaluation record.
    cards: [kuaishou-recharness-2026, tencent-nova-2026, kuaishou-agentx]
  - heading: Whether the offline score measures the intended task
    text: YouTube uses a fast proxy and waits for delayed business metrics. RecEvolve found that fewer in-batch negatives made its proxy easier to improve, prompting a rollback. NOVA checks the semantics of the change before running it.
    cards: [youtube-self-evolving-recsys-2026, google-recevolve-2026, tencent-nova-2026]
  - heading: What production A/B validates
    text: Each online result refers to a promoted model and its own incumbent. AgentX reports selected launch reviews across settings. RecHarness and NOVA separately compare their research procedures offline.
    cards: [youtube-self-evolving-recsys-2026, kuaishou-recharness-2026, tencent-nova-2026, google-recevolve-2026, kuaishou-agentx]
readings:
  - title: 'Try Before You Evolve: Ranking-Scored Trials for Recursive Self-Improvement of Recommender Systems'
    url: https://arxiv.org/html/2610.39352v1
    note: Huang and colleagues use short ranking-scored trials to decide which changes merit full retraining. Their comparison matches the number of full retrainings.
  - title: 'RecRSI: Mechanism-Guided Discovery of Recommendation Algorithms'
    url: https://arxiv.org/html/2611.02487v1
    note: Gan and colleagues organize experiments around mechanism hypotheses so findings inform what they test next.
  - title: 'AutoRSE: Evaluating LLM Agents as Recommendation Engineers for Self-Evolving Recommender Systems'
    url: https://arxiv.org/html/2610.37228v2
    note: A benchmark for comparing coding agents under a fixed optimization budget and held-out evaluation.
  - title: 'Self-EvolveRec: Self-Evolving Recommender Systems with LLM-based Directional Feedback'
    url: https://openreview.net/forum?id=KCcpSuocz0
    note: Uses model diagnostics and simulated user feedback to guide the next change. It is a direct comparison in Try Before You Evolve.
  - title: 'AutoResearch at Production Scale: Failure Modes and a Multi-Agent Framework'
    url: https://arxiv.org/abs/2609.30541
    note: An offline investigation of Amazon book recommendation workflows. It compares the cost of evolving a retriever and an item tokenizer and documents proxy failures.
  - title: 'From Trajectories to Evidence: Auditable Experimental Records for Industrial Research Agents'
    url: https://arxiv.org/abs/2608.05235
    note: Audits experiment trajectories for production-model research. Replayable records help distinguish the best attempt from a valid improvement that survives later rounds.
  - title: 'CORAL: An LLM-Native Harness for Production Recommender Systems'
    url: https://arxiv.org/abs/2609.02730
    note: Connects operating constraints and live feedback to recommendations about pipeline configuration. The workshop paper is a useful comparison for a configuration loop.
  - title: 'Can Recommender Systems Teach Themselves? A Recursive Self-Improving Framework with Fidelity Control'
    url: https://proceedings.mlr.press/v306/zhang26gf.html
    note: A companion example that improves training data through iterative generation and filtering.
  - title: 'Shape Your Feed: An LLM-Based Agentic System for Conversational Recommendation'
    url: https://arxiv.org/abs/2608.06632
    note: A boundary case that aligns an existing serving policy using user feedback. The production experiment covers the feedback feature and downstream service together.
  - title: 'Self-Evolving Recommender Systems: A Survey and an Evaluation Audit'
    url: https://www.preprints.org/manuscript/202610.2336/v1
    note: This preprint is a starting point for reference tracing and for checking how papers measure research progress.
scope: Covers papers and official research reports from January 2023 through November 2026 on agents that use experiment results to revise recommendation models or training workflows.
